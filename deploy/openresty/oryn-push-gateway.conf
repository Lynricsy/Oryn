# Oryn 官方推送网关反代配置（1Panel OpenResty）。把 push.oryn.best 换成实际域名。
# 网关监听回环 127.0.0.1:7700；必须传 X-Real-IP：网关只信任回环来源的这个头，用它做「每 IP 每小时 30 次 challenge」限流。
# 不要改写路径或加查询串：请求签名覆盖 public_origin + 路径（docs/protocol.md「官方推送网关」）。

server {
    listen 443 ssl;
    http2 on;
    server_name push.oryn.best;

    ssl_certificate     /www/sites/push.oryn.best/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/push.oryn.best/ssl/privkey.pem;

    # 网关自己限 8 KiB，这里留一点余量
    client_max_body_size 16k;

    # 不记访问日志：路径里有授权 id，来源 IP 只用于内存限流、不落盘
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:7700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
    }
}

server {
    listen 80;
    server_name push.oryn.best;
    return 301 https://$host$request_uri;
}
