# Oryn 反代配置（1Panel OpenResty）。把 oryn.example.com / orb.example.com 换成实际域名。
# 证书：主域名证书 + *.orb.example.com 通配证书（DNS 验证）。

map $http_upgrade $oryn_connection_upgrade {
    default upgrade;
    ''      close;
}

# 主域名：Web 客户端、REST、WebSocket、provider 与 orb link
server {
    listen 443 ssl;
    http2 on;
    server_name oryn.example.com;

    ssl_certificate     /www/sites/oryn.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/oryn.example.com/ssl/privkey.pem;

    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:7600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oryn_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# 泛域名：每个 portal 一个子域名（M4 启用）
server {
    listen 443 ssl;
    http2 on;
    server_name *.orb.example.com;

    ssl_certificate     /www/sites/orb.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/orb.example.com/ssl/privkey.pem;

    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:7600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oryn_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

server {
    listen 80;
    server_name oryn.example.com *.orb.example.com;
    return 301 https://$host$request_uri;
}
