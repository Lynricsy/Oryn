# Oryn 反代配置（1Panel OpenResty）。把 oryn.example.com / orb.example.com 换成实际域名。
# 证书：主域名证书 + *.orb.example.com 通配证书（DNS 验证）。

map $http_upgrade $oryn_connection_upgrade {
    default upgrade;
    ''      close;
}

# 主域名：Web 客户端、REST、WebSocket、provider 与 orb link
server {
    listen 443 ssl;
    http2 on;
    server_name oryn.example.com;

    ssl_certificate     /www/sites/oryn.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/oryn.example.com/ssl/privkey.pem;

    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:7600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oryn_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}

# 泛域名：每个 portal 一个子域名 t-<线程短码>-p<端口>.orb.example.com（orynd.yaml 的 portal_domain）。
# orynd 按 Host 把这些请求分流到 portal 数据面：必须原样透传 Host，且不得在反代上缓存
# （portal 的响应可能是所有者私有内容，鉴权由 orynd 按 Cookie / 令牌逐请求判定）。
# portal 与主域名必须同协议、同端口；WebSocket 与 SSE 需要下面的 Upgrade 头与关闭缓冲。
server {
    listen 443 ssl;
    http2 on;
    server_name *.orb.example.com;

    ssl_certificate     /www/sites/orb.example.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/orb.example.com/ssl/privkey.pem;

    client_max_body_size 600m;

    location / {
        proxy_pass http://127.0.0.1:7600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $oryn_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }
}

server {
    listen 80;
    server_name oryn.example.com *.orb.example.com;
    return 301 https://$host$request_uri;
}
