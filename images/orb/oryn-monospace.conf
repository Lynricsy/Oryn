<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- orb 的默认等宽字体：JetBrains Maple Mono（拉丁、中日 2:1 对齐、Nerd Font 字形），emoji 仍回落到 Noto Color Emoji。
     装在 /etc/fonts/conf.d/55-oryn-monospace.conf：排在 50-user.conf 之后（用户自己的配置优先），60-latin.conf 之前。 -->
<fontconfig>
	<alias>
		<family>monospace</family>
		<prefer>
			<family>JetBrains Maple Mono</family>
		</prefer>
	</alias>
</fontconfig>
