url: "http://127.0.0.1:7600"
token_file: ".dev/provider.token"
orb_url: "https://172.18.0.1:7643"   # TLS（CA 由 orynd 经 spawn 下发）；旧 orb 仍走 172.18.0.1:7600 明文
driver: docker
docker:
  image: "oryn-orb:dev"
  # 显式写 types 会替换默认的三档，所以三档也照抄；dind（M11a）需要宿主装好 sysbox（见 docs/deploy.md）
  types:
    small: { cpus: 2, memory: "4g" }
    medium: { cpus: 4, memory: "8g" }
    large: { cpus: 8, memory: "16g" }
    dind: { cpus: 4, memory: "8g", runtime: sysbox-runc, nested_docker: true }
  # M30 agent 沙箱：先 sudo deploy/docker/oryn-sbx-net.sh up（建 oryn-sbx 网络与防火墙规则），并 make image 重建含新 orbd 的镜像
  sandbox: { enabled: true, network: "oryn-sbx", dns: ["1.1.1.1"] }
