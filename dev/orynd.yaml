listen: ["127.0.0.1:7600", "172.18.0.1:7600"]
public_url: "http://localhost:7600"
portal_domain: "localhost"   # portal 形如 http://t-<短码>-p<端口>.localhost:7600/（Chromium 把 *.localhost 解析到回环并视为安全上下文）
data_dir: "./.dev/data"
log_level: "debug"
idle: { agent_idle: "30s", user_idle: "30s", stop_after_frozen: "24h", wake_on_focus: true }
# 推送（M28）：iOS 与 Android gms 包经官方推送网关（push.gateway.url，缺省 https://push.oryn.best）；
# 本机验收网关时改成 push: { gateway: { url: "http://localhost:7700" } }，写空串 "" 关闭网关。
# 协调宿主（M9）：本机以 root 运行，沙箱降权到自动创建的专用账号 oryn-coord-<fnv32a(dir)>（不写 user 即自动）；
# 仓库在 /root 下（该账号进不去），所以目录放在 /var/tmp；omp 用 scripts/fetch-core.sh 取到的那份
coordinator: { omp_path: "build/core/x64/omp", dir: "/var/tmp/oryn-dev-coordinator" }
# M11a 验收用：全新 setup 只要跑过 1 秒就发布项目快照（默认 10 秒）；预热池全局最多 2 台（默认也是 2，写明便于 X19 核对）
snapshots: { min_setup: "1s" }
pool: { max_total: 2 }
# orb link 走 TLS（M11a 审查修复）：网桥网关上另开 7643，自签 CA 存在 data_dir/orb-tls，spawn 时下发给 orb。
# 172.31.255.1 是 Firecracker guest 侧（M11b）：需先 sudo deploy/firecracker/oryn-fc-net.sh up，否则 orynd 监听失败
orb_tls: { listen: ["172.18.0.1:7643", "172.31.255.1:7643"] }
# dev 同时跑 docker（local）与 Firecracker（fc）两个 provider：未指定 provider 的新 orb（首页、`oryn thread new`、
# 验收脚本）默认落到 local，否则会因「无法确定默认值」400；要用 fc 时显式指定
orb_defaults: { provider: local }
# M14 控制面渲染（缩略图 / PNG / PDF）：本机以 root 运行，Chromium 降权到 nobody 跑；仓库在 /root 下（nobody 进不去），
# 所以作业目录放在 /var/tmp
artifacts: { render: { user: "nobody", dir: "/var/tmp/oryn-dev-render" } }
