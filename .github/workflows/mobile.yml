name: mobile

# 移动 App（同一 Tauri 工程的 Android / iOS 目标）的构建（M7 计划步骤 6；主人决定：UnifiedPush + FCM、仅 GitHub Release）；
# 发版由 release.yml 统一调度，与桌面端同一个 tag、同一个 Release。
# - PR / 手动触发：`android` 构建 foss 与 gms 两个 debug APK（x86_64 + arm64）并跑插件单测，`android-smoke` 在模拟器里冒烟，
#   `ios-check` 在 macOS 上不签名编译模拟器包，并在 iOS 26+ 模拟器里截图断言原生底栏与原生页头（硬门禁）：web/src-tauri/ci/ios-header-check.sh
#   是原生页头演示，ios-e2e-check.sh 是端到端（mock Web UI + 远程能力 + XCUITest 真实触摸；原生底栏的裁切要和真实网页的卡片一起看，只在这里检查）。
#   不签名、拿不到签名 secret。
# - 被 release.yml 调用（workflow_call，tag `v*`）：`android-release` 额外以发布密钥构建签名的 release APK + AAB（foss 与 gms 各一套）
#   并上传到调用方建好的草稿 Release，`ios-release` 签名导出 IPA 并上传 TestFlight；`android-smoke` 与 `ios-check` 照跑。
#   发布 Release 在 release.yml 的 `publish` 里，等服务端与桌面端也成功后才做。
#   debug APK 只作为 workflow artifact（冒烟与下载调试用），从不上传到 Release：它可调试、允许明文流量，装错会泄露设备令牌。
# - 签名 secrets（ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS，IOS_CERTIFICATE / IOS_CERTIFICATE_PASSWORD /
#   IOS_MOBILE_PROVISION）只存在 environment `mobile-release` 里，该 environment 的部署规则只允许 `v*` tag；
#   只有声明了它的 `android-release` / `ios-release` 能取到这些值，PR / 手动 / 分支运行一律拿不到。
# flavor 由 gradle 属性 `orynDistribution=foss|gms` 选择（`ORG_GRADLE_PROJECT_orynDistribution`）；gms 需要
# `app/google-services.json`，由 secret ANDROID_GOOGLE_SERVICES_JSON 在构建前写入（没有该 secret 时跳过 gms）。
#
# 供应链约束（同 desktop.yml）：第三方 action 一律钉到完整提交 SHA（行尾注释为对应版本）；checkout 不保留凭据；
# secret 只出现在用到它的那一步的 env 里，签名密钥只在发版时取值，用完即删，不写进 $GITHUB_ENV 或持久位置。
on:
  workflow_call:
    inputs:
      tag:
        description: 发版 tag（v*）；由 release.yml 校验过与 Cargo.toml 版本一致，资产上传到它的草稿 Release
        type: string
        required: true
      label:
        description: 产物文件名里的版本标签（tag 去掉 v，预发布带 -rc.N 后缀）
        type: string
        required: true
  pull_request:
    paths:
      - "web/src-tauri/**"
      - "web/src/launcher/**"
      - "web/launcher.html"
      # 端到端检查（ios-e2e-check.sh）驱动的网页侧：原生底栏与原生页头的桥、控制器、下沉侧栏与线程页头
      - "web/src/lib/host.ts"
      - "web/src/lib/native-tab-bar.ts"
      - "web/src/lib/native-header.ts"
      - "web/src/lib/native-sink.ts"
      - "web/src/lib/viewport.ts"
      - "web/src/components/layout/SinkLayout.tsx"
      - "web/src/components/layout/SectionTabBar.tsx"
      # 首页的侧栏钮由原生页头接管（只有侧栏钮的 spec，key = home）
      - "web/src/pages/HomePage.tsx"
      # 下沉侧栏的宽度、根滚动模式与卡片的开合样式都在这里
      - "web/src/index.css"
      - "web/src/components/layout/SectionPanes.tsx"
      - "web/src/components/thread/CompactThreadHeader.tsx"
      - "web/src/components/thread/ThreadHeader.tsx"
      - "web/src/components/thread/RightPanel.tsx"
      - "web/src/pages/ThreadPage.tsx"
      - "web/public/webview-check.js"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      export_ios_project:
        description: 把 tauri ios init 生成的 web/src-tauri/gen/apple 作为产物上传（首次入库用）
        type: boolean
        default: false

permissions: {}

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NDK_VERSION: "28.2.13676358"
  ANDROID_TARGETS: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      label: ${{ steps.meta.outputs.label }}
      is_release: ${{ steps.meta.outputs.is_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 读取版本
        id: meta
        shell: bash
        env:
          # 只有被 release.yml 调用时才非空（tag 与版本的一致性由它校验）
          TAG: ${{ inputs.tag }}
          RELEASE_LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          version=$(awk '/^\[/{in_pkg = ($0 == "[package]")} in_pkg && /^version *=/{gsub(/^version *= *"|".*$/, ""); print; exit}' web/src-tauri/Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "::error file=web/src-tauri/Cargo.toml::读不到 [package].version"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            echo "::error file=web/src-tauri/Cargo.toml::版本 ${version} 含预发布后缀；Cargo.toml 只写 x.y.z，预发布请打 tag v${version%%-*}-rc.N"
            exit 1
          fi
          is_release=false
          label=$version
          if [[ -n "$TAG" ]]; then
            is_release=true
            label=$RELEASE_LABEL
          fi
          {
            echo "version=$version"
            echo "label=$label"
            echo "is_release=$is_release"
          } >> "$GITHUB_OUTPUT"
          echo "版本 ${version}（产物标签 ${label}）；发布：${is_release}${TAG:+（$TAG）}" >> "$GITHUB_STEP_SUMMARY"

  # PR / 手动触发的构建：只读令牌，只出 debug 包。与 android-release 共用 strategy 与 steps（YAML 锚点），
  # 两者只差权限与触发条件——job 级 permissions 不能按表达式切换，所以拆成两个 job。
  android:
    needs: prepare
    if: needs.prepare.outputs.is_release != 'true'
    permissions:
      contents: read
    strategy: &android-strategy
      fail-fast: false
      matrix:
        dist: [foss, gms]
    name: android (${{ matrix.dist }})
    runs-on: ubuntu-24.04
    env:
      ORG_GRADLE_PROJECT_orynDistribution: ${{ matrix.dist }}
      LABEL: ${{ needs.prepare.outputs.label }}
      DIST: ${{ matrix.dist }}
      # 版本只写在 Cargo.toml：tauri 的移动端构建只认配置里的 version（缺省时 Android 1.0 / versionCode 1、iOS 1.0.0），
      # 各 build 命令用 --config 把它合并进去
      ORYN_VERSION_CONFIG: '{"version":"${{ needs.prepare.outputs.version }}"}'
    steps: &android-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 只取「有没有」的布尔，不接触 secret 的值
      - name: 判定构建内容
        id: plan
        shell: bash
        env:
          HAS_GSJ: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON != '' }}
          HAS_KEYSTORE: ${{ needs.prepare.outputs.is_release == 'true' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
          IS_RELEASE: ${{ needs.prepare.outputs.is_release }}
        run: |
          set -euo pipefail
          build=true
          if [[ "$DIST" == "gms" && "$HAS_GSJ" != "true" ]]; then
            if [[ "$IS_RELEASE" == "true" ]]; then
              echo "::error::发布 gms 包需要 secret ANDROID_GOOGLE_SERVICES_JSON"
              exit 1
            fi
            build=false
            echo "::notice::没有 ANDROID_GOOGLE_SERVICES_JSON（如来自 fork 的 PR），跳过 gms 构建"
          fi
          if [[ "$IS_RELEASE" == "true" && "$HAS_KEYSTORE" != "true" ]]; then
            echo "::error::发布需要 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS"
            exit 1
          fi
          {
            echo "build=$build"
            echo "sign=$HAS_KEYSTORE"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.plan.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.plan.outputs.build == 'true'
        with:
          bun-version-file: web/package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支，2026-10-16
        if: steps.plan.outputs.build == 'true'
        with:
          toolchain: stable
          targets: ${{ env.ANDROID_TARGETS }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.plan.outputs.build == 'true'
        with:
          workspaces: "web/src-tauri -> target"
          key: android

      - name: 安装 NDK
        if: steps.plan.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -1)
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$bt" >> "$GITHUB_ENV"

      - name: 安装 web 依赖
        if: steps.plan.outputs.build == 'true'
        working-directory: web
        run: bun install --frozen-lockfile

      - name: 写入 google-services.json（gms）
        if: steps.plan.outputs.build == 'true' && matrix.dist == 'gms'
        shell: bash
        env:
          GSJ: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$GSJ" > web/src-tauri/gen/android/app/google-services.json
          jq -e '.client[] | select(.client_info.android_client_info.package_name == "com.lynricsy.oryn")' \
            web/src-tauri/gen/android/app/google-services.json > /dev/null \
            || { echo "::error::google-services.json 里没有 com.lynricsy.oryn 的客户端"; exit 1; }

      # 总是先出 debug 包：供冒烟与 PR 下载；debug 包可经 CDP 调试、写事件日志 cache/events.jsonl
      - name: 构建 debug APK
        if: steps.plan.outputs.build == 'true'
        working-directory: web
        run: bun run tauri android build --debug --apk --target aarch64 x86_64 --config "$ORYN_VERSION_CONFIG" --ci

      - name: 收集 debug APK
        if: steps.plan.outputs.build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp web/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            "dist/Oryn_${LABEL}_android-${DIST}-debug.apk"

      - name: 插件 JVM 单测
        if: steps.plan.outputs.build == 'true'
        working-directory: web/src-tauri/gen/android
        run: ./gradlew --no-daemon :tauri-plugin-oryn-mobile:testDebugUnitTest

      # 发布构建：密钥只在这一步解码到临时目录，keystore.properties 与 .jks 在步骤结束时删除
      - name: 构建签名的 release APK + AAB
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.sign == 'true'
        shell: bash
        working-directory: web
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          dir=$(mktemp -d "$RUNNER_TEMP/keystore.XXXXXX")
          props=src-tauri/gen/android/keystore.properties
          trap 'rm -rf "$dir" "$props"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$dir/release.jks"
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$KEYSTORE_PASSWORD"
            echo "storeFile=$dir/release.jks"
          } > "$props"
          bun run tauri android build --apk --aab --target aarch64 armv7 x86_64 --config "$ORYN_VERSION_CONFIG" --ci
          out=src-tauri/gen/android/app/build/outputs
          cp "$out/apk/universal/release/app-universal-release.apk" "../dist/Oryn_${LABEL}_android-${DIST}.apk"
          cp "$out/bundle/universalRelease/app-universal-release.aab" "../dist/Oryn_${LABEL}_android-${DIST}.aab"

      - name: 校验产物并写摘要
        if: steps.plan.outputs.build == 'true'
        shell: bash
        env:
          SIGNED: ${{ steps.plan.outputs.sign }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # 失败时指出是哪条命令（zipalign / aapt2 / grep 无匹配都会让 -e 静默退出）
          trap 'echo "::error::第 $LINENO 行失败：$BASH_COMMAND"' ERR
          {
            echo "### Android（${DIST}）"
            if [[ "$SIGNED" == "true" ]]; then echo "已签名（release）"; else echo "未签名（仅 debug）"; fi
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in dist/*.apk; do
            "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
            badging=$("$BUILD_TOOLS/aapt2" dump badging "$apk")
            pkg=$(grep -oP "^package: name='\K[^']+" <<<"$badging")
            vc=$(grep -oP "versionCode='\K[^']+" <<<"$badging")
            vn=$(grep -oP "versionName='\K[^']+" <<<"$badging")
            if [[ "$vn" != "$VERSION" ]]; then echo "::error::$apk 的 versionName 是 ${vn}，应为 Cargo.toml 的 ${VERSION}"; exit 1; fi
            # aapt2 badging 输出的是 `minSdkVersion:'33'`（本机 build-tools 36 对 Oryn 包实测），没有 `sdkVersion:` 行
            sdk=$(grep -oP "^minSdkVersion:'\K[^']+" <<<"$badging" || true)
            target=$(grep -oP "^targetSdkVersion:'\K[^']+" <<<"$badging" || true)
            if [[ -z "$sdk" || -z "$target" ]]; then
              echo "::error::$apk 读不到 minSdkVersion / targetSdkVersion，badging 里与 sdk 相关的行："
              grep -iE 'sdk' <<<"$badging" | head -20
              exit 1
            fi
            if [[ "$pkg" != "com.lynricsy.oryn" ]]; then echo "::error::$apk 包名是 $pkg"; exit 1; fi
            cert=$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
            echo "$(basename "$apk")  package=$pkg versionName=$vn versionCode=$vc sdk=$sdk target=$target cert-sha256=$cert" >> "$GITHUB_STEP_SUMMARY"
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 校验失败也上传，便于拿到实际产物排查（release 运行同样只是 workflow artifact，不进 Release）
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.plan.outputs.build == 'true' }}
        with:
          name: android-${{ matrix.dist }}
          path: dist/
          if-no-files-found: error

      # 只上传 release 签名的产物；按名字逐个列出，debug APK（*-debug.apk）留在 artifact 里，不进 Release
      - name: 上传 Release 资产
        if: steps.plan.outputs.build == 'true' && needs.prepare.outputs.is_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          assets=("dist/Oryn_${LABEL}_android-${DIST}.apk" "dist/Oryn_${LABEL}_android-${DIST}.aab")
          for f in "${assets[@]}"; do
            [[ -f "$f" ]] || { echo "::error::缺少 release 产物 $f"; exit 1; }
            [[ "$f" != *-debug.* ]] || { echo "::error::$f 是 debug 包，不得上传到 Release"; exit 1; }
          done
          gh release upload "$TAG" "${assets[@]}" --clobber

  # 发版构建：与 android 完全相同的步骤，额外拿到 contents: write（上传 Release 资产）与签名 secrets。
  # 签名 secrets 只在 environment mobile-release 里（部署规则只放行 v* tag），本 job 是唯一声明它的 job。
  android-release:
    needs: prepare
    if: needs.prepare.outputs.is_release == 'true'
    environment: mobile-release
    permissions:
      contents: write
    strategy: *android-strategy
    name: android-release (${{ matrix.dist }})
    runs-on: ubuntu-24.04
    env:
      ORG_GRADLE_PROJECT_orynDistribution: ${{ matrix.dist }}
      LABEL: ${{ needs.prepare.outputs.label }}
      DIST: ${{ matrix.dist }}
      ORYN_VERSION_CONFIG: '{"version":"${{ needs.prepare.outputs.version }}"}'
    steps: *android-steps

  # 冒烟：模拟器里装 foss debug 包并启动，90 秒内事件日志出现 launcher.ready 即过
  android-smoke:
    needs: [android, android-release]
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.android-release.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 启用 KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-foss
          path: dist

      - name: 写冒烟脚本
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'SH'
          set -euo pipefail
          apk=$(ls dist/*-debug.apk | head -1)
          adb install -r -g "$apk"
          adb shell am start -W -n com.lynricsy.oryn/.MainActivity
          for _ in $(seq 1 90); do
            if adb shell run-as com.lynricsy.oryn cat cache/events.jsonl 2>/dev/null | grep -q '"launcher.ready"'; then
              echo "smoke ok"
              adb shell run-as com.lynricsy.oryn cat cache/events.jsonl
              exit 0
            fi
            sleep 1
          done
          echo "::error::90 秒内没有 launcher.ready"
          adb shell run-as com.lynricsy.oryn cat cache/events.jsonl || true
          adb logcat -d | grep -iE 'oryn|FATAL EXCEPTION|panic' | tail -200 || true
          exit 1
          SH

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: bash "$RUNNER_TEMP/smoke.sh"

  # iOS：PR / 手动 / 发布都跑的不签名编译 + 模拟器截图断言（签名构建见下方 ios-release）
  ios-check:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      ORYN_VERSION_CONFIG: '{"version":"${{ needs.prepare.outputs.version }}"}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 确认 Xcode ≥ 26（iOS 26 SDK：Liquid Glass 与 App Store 上传都要求）
        shell: bash
        run: |
          set -euo pipefail
          v=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode $v" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ ${v%%.*} -lt 26 ]]; then echo "::error::需要 Xcode 26+，当前 $v"; exit 1; fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支，2026-10-16
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "web/src-tauri -> target"
          key: ios

      - name: 安装 web 依赖
        working-directory: web
        run: bun install --frozen-lockfile

      # 端到端检查用：mock 模式（浏览器内假 REST / WS）的 Web UI，由脚本在 runner 本机静态服务
      - name: 构建 mock Web UI
        working-directory: web
        run: VITE_MOCK=1 bunx vite build --outDir dist-e2e

      - name: 生成 iOS 工程（未入库时）并装入 App 图标
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d src-tauri/gen/apple ]]; then bun run tauri ios init --ci; fi
          bash src-tauri/ci/ios-appicon.sh

      - name: 不签名编译模拟器包
        working-directory: web
        run: bun run tauri ios build --debug --target aarch64-sim --no-sign --config "$ORYN_VERSION_CONFIG" --ci

      - name: 断言产物
        id: app
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          app=$(find web/src-tauri/gen/apple/build -type d -name 'Oryn.app' | head -1)
          if [[ -z "$app" ]]; then echo "::error::没有找到 Oryn.app"; exit 1; fi
          # 与发布包同一份 Info.plist 合并（Info.ios.plist）：这里先挡住缺用途说明（ITMS-90683）与版本号不对，不必等上传后被退回
          plist="$app/Info.plist"
          ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          if [[ "$ver" != "$VERSION" ]]; then echo "::error::CFBundleShortVersionString 是 ${ver}，应为 Cargo.toml 的 ${VERSION}"; exit 1; fi
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$plist" > /dev/null \
            || { echo "::error::Info.plist 缺 NSCameraUsageDescription（见 web/src-tauri/Info.ios.plist）"; exit 1; }
          bash web/src-tauri/ci/check-appicon.sh "$app/Assets.car" "iOS 模拟器包" "$plist"
          echo "产物：${app}（版本 ${ver}）" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "path=$app" >> "$GITHUB_OUTPUT"

      # 硬门禁：debug 包的 ORYN_HEADER_DEMO 钩子在连接页摆出原生页头（hidden / bar）并打开菜单（title / title:env / trail），
      # 逐区域比像素 + headerProbe 触摸归属探测（菜单没开时屏幕中心不被原生截住），结果写进 Step Summary。
      - name: 模拟器：原生页头与菜单
        timeout-minutes: 15
        shell: bash
        env:
          APP: ${{ steps.app.outputs.path }}
        # 同样只在跑完全部断言且通过时写 .complete
        run: |
          rm -f ios-shot/header/.complete
          bash web/src-tauri/ci/ios-header-check.sh "$APP" ios-shot/header
          [[ -f ios-shot/header/.complete ]] || { echo "::error::页头演示检查没有跑完全部断言"; exit 1; }

      # 硬门禁：真实网页 + 真实触摸。debug 包的 ORYN_E2E_URL 钩子跳过配对，经与生产相同的 open_remote（远程能力 + 宿主命令权限）
      # 打开本机的 mock Web UI；XCUITest 合成触摸。卡片开合是 WKWebView 的根滚动（bridge 8），原生按 contentOffset 跟随。
      # 底栏（系统 UITabBar 浮在 WebView 之上、右缘裁到卡片左缘）：点首页的原生侧栏钮打开、点卡片条关闭（原生 host_sink_show 逐帧开合）、
      # 左缘拖到一半按住（连拍截图等卡片停住，揭示边 ≈ 手指位移）、点原生「项目」、在原生底栏上横滑回第 1 项、再点收起；
      # 页头（线程页）：原生接管、点胶囊开面板、进子页再返回、选「改名」打开网页对话框（select 事件 + 原生让位）、关对话框、
      # 开关侧栏与按住拖动（原生页头与卡片同帧平移，开合期间不发 header.show）。
      # 可替换图标（设置 → 外观）：点「品牌色」、点掉系统提示、等 setAlternateIconName 完成回调后的 appicon.set，再换回「黑白」。
      # 无障碍树断言在测试里，事件日志与逐区域像素断言在脚本里，结果写进 Step Summary，截图与 xcresult 随 ios-screenshot 上传。
      - name: 模拟器：真实网页与触摸驱动的原生底栏、页头与可替换图标（端到端）
        # 演示失败也照跑（互相独立），一次 CI 拿到各项结果
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        timeout-minutes: 45
        shell: bash
        env:
          APP: ${{ steps.app.outputs.path }}
        run: |
          # 发布同一份 Step Summary 到产物，便于下载后核对各阶段结果。
          mkdir -p ios-shot/e2e
          step_summary="$GITHUB_STEP_SUMMARY"
          export GITHUB_STEP_SUMMARY="$PWD/ios-shot/e2e/summary.md"
          : > "$GITHUB_STEP_SUMMARY"
          trap 'cat "$GITHUB_STEP_SUMMARY" >> "$step_summary"' EXIT
          rm -f ios-shot/e2e/.complete
          bash web/src-tauri/ci/ios-e2e-check.sh "$APP" web/dist-e2e ios-shot/e2e
          [[ -f ios-shot/e2e/.complete ]] || { echo "::error::端到端检查没有跑完全部断言"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: ios-screenshot
          path: ios-shot/
          if-no-files-found: ignore
          # 保留 header/.complete 与 e2e/.complete：验收要能从产物里确认脚本跑完了全部断言（upload-artifact 默认跳过隐藏文件）
          include-hidden-files: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.export_ios_project
        with:
          name: ios-project
          path: |
            web/src-tauri/gen/apple
            !web/src-tauri/gen/apple/build
          if-no-files-found: error

  # 发版：以 Apple Distribution 证书 + App Store Connect 描述文件手动签名，导出 app-store-connect 的 IPA 并上传 TestFlight。
  # IPA 不上传到 Release：它只能经 TestFlight / App Store 安装。签名 secrets（IOS_CERTIFICATE / IOS_CERTIFICATE_PASSWORD /
  # IOS_MOBILE_PROVISION）只放在 environment mobile-release；上传用的 App Store Connect API 密钥与 desktop.yml 公证共用
  # 仓库级 APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_P8。Team ID 写在 tauri.conf.json 的 bundle.iOS.developmentTeam。
  ios-release:
    needs: prepare
    if: needs.prepare.outputs.is_release == 'true'
    environment: mobile-release
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      ORYN_VERSION_CONFIG: '{"version":"${{ needs.prepare.outputs.version }}"}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 确认 Xcode ≥ 26（iOS 26 SDK：Liquid Glass 与 App Store 上传都要求）
        shell: bash
        run: |
          set -euo pipefail
          v=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode $v" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ ${v%%.*} -lt 26 ]]; then echo "::error::需要 Xcode 26+，当前 $v"; exit 1; fi

      # 只取「有没有」的布尔，不接触 secret 的值
      - name: 检查签名与上传凭据
        shell: bash
        env:
          HAS_SIGN: ${{ secrets.IOS_CERTIFICATE != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_MOBILE_PROVISION != '' }}
          HAS_API: ${{ secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          set -euo pipefail
          if [[ "$HAS_SIGN" != "true" ]]; then
            echo "::error::发布 iOS 需要 environment mobile-release 里的 IOS_CERTIFICATE / IOS_CERTIFICATE_PASSWORD / IOS_MOBILE_PROVISION"
            exit 1
          fi
          if [[ "$HAS_API" != "true" ]]; then
            echo "::error::上传 TestFlight 需要 APPLE_API_ISSUER / APPLE_API_KEY / APPLE_API_KEY_P8"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 分支，2026-10-16
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "web/src-tauri -> target"
          key: ios-release

      - name: 安装 web 依赖
        working-directory: web
        run: bun install --frozen-lockfile

      - name: 生成 iOS 工程（未入库时）并装入 App 图标
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d src-tauri/gen/apple ]]; then bun run tauri ios init --ci; fi
          bash src-tauri/ci/ios-appicon.sh

      # tauri 从 IOS_* 建临时钥匙串并装描述文件。
      # build number = (run_number + 1000) × 100 + run_attempt：重跑同一次运行（如 Android 失败后 Re-run）时也换一个新号，
      # 不会因 TestFlight 已收到同号构建而上传失败；单次运行最多重跑 99 次。run_number 是调用方 release.yml 的计数（从 1 起），
      # 加 1000 是为了高过旧 mobile.yml 时期已上传的号（当时 run_number < 1000），TestFlight 要求同一版本的 build number 只增不减。
      - name: 签名构建 IPA（app-store-connect）
        working-directory: web
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          if (( RUN_ATTEMPT > 99 )); then echo "::error::同一次运行重跑超过 99 次，请重新打 tag"; exit 1; fi
          bun run tauri ios build --export-method app-store-connect --build-number $(( (RUN_NUMBER + 1000) * 100 + RUN_ATTEMPT )) --config "$ORYN_VERSION_CONFIG" --ci

      - name: 校验 IPA
        id: ipa
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ipa=$(find web/src-tauri/gen/apple/build -name '*.ipa' | head -1)
          if [[ -z "$ipa" ]]; then echo "::error::没有找到 IPA"; exit 1; fi
          work="$RUNNER_TEMP/ipa"
          rm -rf "$work" && mkdir -p "$work"
          unzip -q "$ipa" -d "$work"
          app=$(find "$work/Payload" -maxdepth 1 -name '*.app' | head -1)
          plist="$app/Info.plist"
          bid=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")
          ver=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")
          if [[ "$bid" != "com.lynricsy.oryn" ]]; then echo "::error::包名 $bid 不是 com.lynricsy.oryn"; exit 1; fi
          if [[ "$ver" != "$VERSION" ]]; then echo "::error::CFBundleShortVersionString 是 ${ver}，应为 Cargo.toml 的 ${VERSION}"; exit 1; fi
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$plist" > /dev/null \
            || { echo "::error::Info.plist 缺 NSCameraUsageDescription（App Store Connect 会以 ITMS-90683 退回）"; exit 1; }
          signer=$(codesign -dvv "$app" 2>&1 | sed -n 's/^Authority=//p' | head -1)
          if [[ "$signer" != Apple\ Distribution:* && "$signer" != iPhone\ Distribution:* ]]; then
            echo "::error::签名者「${signer}」不是分发证书"
            exit 1
          fi
          bash web/src-tauri/ci/check-appicon.sh "$app/Assets.car" "iOS IPA" "$plist"
          echo "path=$ipa" >> "$GITHUB_OUTPUT"
          echo "- iOS：\`${bid}\` ${ver}（build ${build}），签名者 ${signer}" | tee -a "$GITHUB_STEP_SUMMARY"

      # altool 只从固定目录找 AuthKey_<Key ID>.p8；写入后无论成败都删除
      - name: 上传 TestFlight
        shell: bash
        env:
          IPA: ${{ steps.ipa.outputs.path }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          keydir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keydir"
          trap 'rm -rf "$keydir"' EXIT
          (umask 077 && printf '%s' "$APPLE_API_KEY_P8" > "$keydir/AuthKey_${APPLE_API_KEY}.p8")
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
          echo "- 已上传 TestFlight，App Store Connect 处理完成后（通常 5–30 分钟）内部测试组可安装" >> "$GITHUB_STEP_SUMMARY"
