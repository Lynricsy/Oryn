name: release

# Oryn 的统一发版：一个 tag、一个 Release，服务端、桌面与移动 App 同一个版本号一起发布——
# 服务端二进制（orynd / orbd / oryn / gemini-rerank）、Windows / macOS / Linux 安装包、Android APK / AAB，以及 iOS TestFlight。
# - 推送 tag `v<版本>` 或预发布 `v<版本>-rc.N`（<版本> 须与 web/src-tauri/Cargo.toml 的 version 一致，后者只写 x.y.z，是全产品唯一的版本来源）：
#   `prepare` 校验 tag → `release` 建草稿 Release → 并行：`server` 交叉编译服务端并上传，调用 desktop.yml 与 mobile.yml
#   （workflow_call，各自构建并上传资产）→ 全部成功后 `publish` 生成 updater 清单 latest.json 并发布 Release；
#   非预发布版本同时刷新滚动发布 `desktop-updater`。
#   任一端失败，Release 停在草稿，不会出现只有一部分产物的已发布版本；修好后在 Actions 里「Re-run failed jobs」即可续跑。
# - PR / 手动触发的构建仍由 ci.yml、desktop.yml、mobile.yml 各自负责，本工作流只处理发版。
#
# 供应链约束（同 desktop.yml）：第三方 action 一律钉到完整提交 SHA（行尾注释为对应版本）；checkout 不保留凭据；
# 写权限令牌只给调用 gh 的步骤。被调用的工作流以 `secrets: inherit` 拿到仓库级 secrets；
# 移动端签名 secrets 仍只在 environment `mobile-release`（部署规则只放行 `v*` tag），只有声明它的 job 能取到。
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      label: ${{ steps.meta.outputs.label }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 读取版本并校验 tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^\[/{in_pkg = ($0 == "[package]")} in_pkg && /^version *=/{gsub(/^version *= *"|".*$/, ""); print; exit}' web/src-tauri/Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "::error file=web/src-tauri/Cargo.toml::读不到 [package].version"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            # rpm 不接受 '-'，msi 只接受纯数字预发布号：Cargo.toml 只写 x.y.z，预发布用 tag 后缀表达
            echo "::error file=web/src-tauri/Cargo.toml::版本 ${version} 含预发布后缀；Cargo.toml 只写 x.y.z，预发布请打 tag v${version%%-*}-rc.N"
            exit 1
          fi
          prerelease=false
          case "$GITHUB_REF_NAME" in
            "v${version}") ;;
            "v${version}-"*) prerelease=true ;;
            *)
              echo "::error::tag ${GITHUB_REF_NAME} 与 Cargo.toml 版本 ${version} 不一致（应为 v${version} 或 v${version}-<预发布标识>）"
              exit 1
              ;;
          esac
          label=${GITHUB_REF_NAME#v}
          {
            echo "version=$version"
            echo "label=$label"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "版本 ${version}（产物标签 ${label}）；预发布：$prerelease" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: 创建草稿 Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: ${{ needs.prepare.outputs.label }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          # 重跑时 Release 已存在，直接复用
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            flags=(--draft --verify-tag --title "Oryn $LABEL" --generate-notes)
            if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${flags[@]}"
          fi
          echo "release_id=$(gh release view "$GITHUB_REF_NAME" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  # 服务端：在一台 Linux runner 上交叉编译（CGO_ENABLED=0 静态链接），前端只构建一次、嵌进 orynd。
  # 版本号注入为 tag 本身（与本地 `git describe --tags --match 'v[0-9]*'` 的前缀一致）。
  # orb 镜像不随版本发布：它基于滚动更新的 Arch，要定期重建以跟进安全更新（docs/deploy.md「容器能力」），
  # 部署方 checkout 同一 tag 后用 `make image` 构建。
  server:
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      LABEL: ${{ needs.prepare.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      # 同 `make web`，但锁定依赖版本
      - name: 构建 Web UI 并嵌入 orynd
        shell: bash
        run: |
          set -euo pipefail
          (cd web && bun install --frozen-lockfile && bun run build)
          find internal/webui/dist -mindepth 1 ! -name .gitkeep -delete
          cp -R web/dist/. internal/webui/dist/
          # 没有 index.html 时 orynd 照样编译成功，却只会返回「Web 客户端未构建」占位页（internal/webui/webui.go）
          [[ -f internal/webui/dist/index.html ]] || { echo "::error::internal/webui/dist 里没有 index.html"; exit 1; }

      - name: 交叉编译并打包
        shell: bash
        run: |
          set -euo pipefail
          ldflags="-s -w -X github.com/Lynricsy/Oryn/internal/version.Version=${TAG}"
          mkdir -p dist
          # pkg <GOOS> <GOARCH> <平台名> <包名> <二进制…>：产出 dist/<包名>_<标签>_<平台名>.tar.gz，内含同名目录
          pkg() {
            local goos=$1 goarch=$2 plat=$3 name=$4
            shift 4
            local base="${name}_${LABEL}_${plat}"
            local dir="$RUNNER_TEMP/pkg/$base"
            mkdir -p "$dir"
            for b in "$@"; do
              CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags "$ldflags" -o "$dir/$b" "./cmd/$b"
            done
            tar -C "$RUNNER_TEMP/pkg" -czf "dist/$base.tar.gz" "$base"
          }
          pkg linux amd64 linux-x64 oryn-server orynd orbd oryn gemini-rerank oryn-push-gateway
          pkg linux arm64 linux-arm64 oryn-server orynd orbd oryn gemini-rerank oryn-push-gateway
          # Runner 还支持 Apple 芯片的 macOS（docs/deploy.md 第 11 节），那里只需要 orbd
          pkg darwin arm64 darwin-arm64 orbd orbd
          (cd dist && sha256sum -- *.tar.gz > "oryn-server_${LABEL}_SHA256SUMS")
          {
            echo "### 服务端"
            echo '```'
            cat "dist/oryn-server_${LABEL}_SHA256SUMS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 启动解包前的 linux-x64 orynd（临时数据目录、只监听回环），确认版本号与内嵌的是真实 Web UI 而不是占位页
      - name: 冒烟：版本号与内嵌 Web UI
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/pkg/oryn-server_${LABEL}_linux-x64"
          got=$("$d/orbd" --version)
          [[ "$got" == "orbd $TAG" ]] || { echo "::error::orbd --version 输出「${got}」，应为 orbd ${TAG}"; exit 1; }
          smoke="$RUNNER_TEMP/orynd-smoke"
          mkdir -p "$smoke"
          # public_url 须是域名（WebAuthn 的 RPID 不接受 IP）
          printf 'listen: ["127.0.0.1:17600"]\npublic_url: "http://localhost:17600"\ndata_dir: "%s/data"\n' "$smoke" > "$smoke/orynd.yaml"
          "$d/orynd" --config "$smoke/orynd.yaml" > "$smoke/orynd.log" 2>&1 &
          pid=$!
          # 等它真正退出再结束步骤（步骤级 timeout-minutes 兜底），避免留下仍占着端口的进程
          trap 'kill "$pid" 2>/dev/null && wait "$pid" 2>/dev/null; true' EXIT
          # 先等本次新建的日志里出现绑定成功的「orynd 监听」（internal/server/listen.go 在 Listen 成功之后才打印），
          # 再请求 /healthz：只看 PID 存活不够，旧实例占着端口、新进程还在跑迁移时也会应答
          for _ in $(seq 1 120); do
            grep -q 'msg="orynd 监听" addr=127.0.0.1:17600' "$smoke/orynd.log" && break
            kill -0 "$pid" 2>/dev/null || { echo "::error::orynd 启动失败"; tail -30 "$smoke/orynd.log"; exit 1; }
            sleep 0.5
          done
          grep -q 'msg="orynd 监听" addr=127.0.0.1:17600' "$smoke/orynd.log" || { echo "::error::orynd 60 秒内没有绑定 127.0.0.1:17600"; tail -30 "$smoke/orynd.log"; exit 1; }
          health=$(curl -fsS http://127.0.0.1:17600/healthz) || { echo "::error::/healthz 请求失败"; tail -30 "$smoke/orynd.log"; exit 1; }
          ver=$(jq -r .version <<<"$health")
          [[ "$ver" == "$TAG" ]] || { echo "::error::/healthz 的版本是「${ver}」，应为 ${TAG}"; exit 1; }
          index=$(curl -fsS http://127.0.0.1:17600/)
          if grep -q 'Web 客户端未构建' <<<"$index"; then echo "::error::orynd 返回的是占位页，Web UI 没有嵌入"; exit 1; fi
          entry=$(grep -oE 'src="/assets/[^"]+\.js"' <<<"$index" | head -1 | sed -E 's/^src="|"$//g' || true)
          [[ -n "$entry" ]] || { echo "::error::首页里没有 /assets/*.js 入口脚本"; exit 1; }
          curl -fsS -o /dev/null "http://127.0.0.1:17600$entry"
          echo "- orynd ${ver}：首页与入口脚本 ${entry} 均由内嵌 Web UI 提供" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Release 资产
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --clobber

  # 被调用工作流的令牌权限以这里为上限：两端都要往 Release 上传资产
  desktop:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ github.ref_name }}
      release_id: ${{ needs.release.outputs.release_id }}
    secrets: inherit

  mobile:
    needs: [prepare, release]
    permissions:
      contents: write
    uses: ./.github/workflows/mobile.yml
    with:
      tag: ${{ github.ref_name }}
      label: ${{ needs.prepare.outputs.label }}
    secrets: inherit

  publish:
    needs: [prepare, server, desktop, mobile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      # 写权限令牌只给调用 gh 的步骤，不放进 job 级 env（第三方 action 及其 post 步骤看不到）
      - name: 生成 updater 清单
        id: manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          bun web/scripts/updater-manifest.ts --repo "$GITHUB_REPOSITORY" --tag "$TAG" --version "$VERSION" > latest.json
          code=$?
          case "$code" in
            0) echo "has=true" >> "$GITHUB_OUTPUT"; cat latest.json ;;
            3) echo "has=false" >> "$GITHUB_OUTPUT"; echo "::warning::没有 .sig 资产（未配置更新私钥），跳过 latest.json" ;;
            *) exit "$code" ;;
          esac
      - name: 上传 latest.json
        if: steps.manifest.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" latest.json --clobber
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
      - name: 刷新更新通道 desktop-updater
        if: steps.manifest.outputs.has == 'true' && env.PRERELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view desktop-updater >/dev/null 2>&1; then
            gh release create desktop-updater --title "Oryn Desktop update channel" \
              --notes "桌面 App 自动更新读取的 latest.json（由 release 工作流在每次正式发布后覆盖）。安装包请到对应的 v* Release 下载。" \
              --latest=false
          fi
          gh release upload desktop-updater latest.json --clobber
