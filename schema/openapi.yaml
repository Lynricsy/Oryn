    MemoryEndpointKind:
      type: string
      enum: [embed, rerank]
      x-enum-varnames: [MemoryEndpointEmbed, MemoryEndpointRerank]
    MemoryDocumentId:
      type: string
      pattern: '^[A-Za-z0-9._:-]{1,200}$'
      description: Hindsight 的 document id（自动写入是会话 id，工具写入是 `omp-retain-<hex>`，管理页写入是 `oryn-<ulid>`）
    MemorySettings:
      type: object
      required: [enabled, keysGenerated, outputLanguage]
      properties:
        enabled: { type: boolean, description: 全局总开关 }
        hindsightUrl: { type: string, description: Hindsight API 根地址；省略 = 未配置 }
        keysGenerated: { type: boolean, description: 是否已生成过 .env（Hindsight API key 与中转令牌） }
        keysGeneratedAt: { type: integer, format: int64, description: 最近一次生成 .env 的时间（Unix 秒） }
        outputLanguage: { type: string, description: 记忆的输出语言（固定为简体中文，只读） }
    MemorySettingsUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        hindsightUrl: { type: string, description: 省略 = 清空 }
    MemoryStatus:
      type: object
      required: [state, testedMinor, versionMismatch, pendingDeletes, candidates, embedLocked, checkedAt]
      properties:
        state:
          type: string
          description: |
            `unconfigured`（未填地址）、`no_keys`（未生成 .env）、`disabled`（总开关关闭，其余字段照常探测）、`ok`、
            `unreachable`（连不上或超时）、`unauthorized`（API key 不对）、`not_ready`（`/health/ready` 非 200）、
            `suspect_empty`（上次有记忆、这次记忆数为 0：多半是 Hindsight 换成了空库，见 deploy.md）。
          enum: [unconfigured, no_keys, disabled, ok, unreachable, unauthorized, not_ready, suspect_empty]
          x-enum-varnames: [MemoryStateUnconfigured, MemoryStateNoKeys, MemoryStateDisabled, MemoryStateOk, MemoryStateUnreachable, MemoryStateUnauthorized, MemoryStateNotReady, MemoryStateSuspectEmpty]
        version: { type: string, description: Hindsight `/version` 报告的版本 }
        testedMinor: { type: string, description: Oryn 已验证的小版本线，如 `1.2` }
        versionMismatch: { type: boolean, description: 服务端小版本与 testedMinor 不同 }
        memoryCount: { type: integer, format: int64, description: bank `oryn` 的记忆数 }
        pendingDeletes: { type: integer, description: 删除失败等待重试的 document 数 }
        candidates: { type: integer, description: 待批准的全局候选数 }
        embedLocked: { type: boolean, description: bank 已有记忆，嵌入模型与维度只读 }
        checkedAt: { type: integer, format: int64 }
        error: { type: string, description: 失败时给人看的原因 }
