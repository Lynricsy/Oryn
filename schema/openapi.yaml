openapi: 3.0.3
info:
  title: Oryn 协议
  version: 0.1.0
  description: |
    Oryn 的唯一协议源。覆盖：

    - 客户端 REST（`/api/v1/...`）与客户端 WebSocket（`/api/v1/ws`，消息见 `WsClientMessage` / `WsServerMessage`）；
    - provider 协议（`/provider/v1/...`，Bearer `opv_…`）；
    - orb link（`/orb/v1/link`，WebSocket + yamux；流头见 `LinkStreamHeader`，`ctl` 流消息见 `LinkCtl*`）；
    - 健康检查 `/healthz`。

    约定：

    - 时间一律为 UTC 毫秒整数（`TimestampMs`）。
    - 错误体统一为 `Error`（`{code, message}`）。
    - 网页会话 Cookie `__Host-oryn_session`；凡变更类请求（POST/PUT/PATCH/DELETE）使用 Cookie 鉴权时必须带头 `X-Oryn-CSRF: 1`，
      使用设备令牌（`Authorization: Bearer odt_…`）时无需该头。
    - 路径参数中的 `/` 须编码为 `%2F`（`agent-config/files/{path}`、`secrets/{name}`）。
    - omp RPC 的命令与帧对控制面不透明（`OmpFrame`），其权威类型在 agent 仓库（`web/src/omp/rpc-types.d.ts`）。
  license:
    name: Proprietary
    url: https://github.com/Lynricsy/Oryn
servers:
  - url: http://127.0.0.1:7600
    description: 本机控制面（生产环境位于反代之后）
security:
  - cookieAuth: []
  - deviceBearer: []
tags:
  - name: meta
    description: 健康检查
  - name: auth
    description: Passkey 初始化、登录、恢复码
  - name: devices
    description: 设备配对与吊销
  - name: projects
    description: 项目
  - name: providers
    description: orb provider 管理（客户端侧）
  - name: threads
    description: 线程
  - name: orbs
    description: orb
  - name: blobs
    description: 内容寻址的二进制对象
  - name: attachments
    description: 消息附件（存控制面、随线程保存，投递到 orb 的仓库之外）
  - name: secrets
    description: 密钥库（只返回元数据）
  - name: agent-config
    description: omp 文本配置（omp-home）
  - name: settings
    description: 所有者级设置（如 orb 内的 git 提交身份）
  - name: stats
    description: 统计
  - name: realtime
    description: 客户端实时通道
  - name: provider-protocol
    description: provider → 控制面（C1）
  - name: websocket
    description: WebSocket 升级端点（不进入 strict server，由手写处理器服务）

paths:
  /healthz:
    get:
      tags: [meta]
      operationId: getHealthz
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- auth
  /api/v1/auth/setup/begin:
    post:
      tags: [auth]
      operationId: authSetupBegin
      summary: 开始注册 Passkey
      description: |
        首次初始化：请求体带 `ost_` 初始化令牌。
        恢复流程：`auth/recovery` 成功后持有的一次性会话 Cookie 也可调用本端点（此时 `token` 省略），用于重新注册 Passkey。
      security:
        - {}
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthSetupBeginRequest' }
      responses:
        '200':
          description: WebAuthn 注册选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnCeremony' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/setup/finish:
    post:
      tags: [auth]
      operationId: authSetupFinish
      summary: 完成注册 Passkey
      description: 成功后建立网页会话（Set-Cookie `__Host-oryn_session`）。首次初始化时返回 10 个恢复码（仅此一次）。
      security:
        - {}
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthSetupFinishRequest' }
      responses:
        '200':
          description: 注册成功
          headers:
            Set-Cookie:
              description: '`__Host-oryn_session=…; Path=/; HttpOnly; Secure; SameSite=Lax`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSetupFinishResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/login/begin:
    post:
      tags: [auth]
      operationId: authLoginBegin
      summary: 开始 Passkey 登录（可发现凭据）
      security: [{}]
      responses:
        '200':
          description: WebAuthn 断言选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnCeremony' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/login/finish:
    post:
      tags: [auth]
      operationId: authLoginFinish
      summary: 完成 Passkey 登录
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthLoginFinishRequest' }
      responses:
        '200':
          description: 登录成功（Set-Cookie `__Host-oryn_session`，有效期 30 天，滑动续期）
          headers:
            Set-Cookie:
              description: '`__Host-oryn_session=…; Path=/; HttpOnly; Secure; SameSite=Lax`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/recovery:
    post:
      tags: [auth]
      operationId: authRecovery
      summary: 用恢复码换取「重新注册 Passkey」的一次性会话
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRecoveryRequest' }
      responses:
        '200':
          description: 恢复码有效且已作废；Set-Cookie 为仅能调用 `auth/setup/*` 的一次性会话
          headers:
            Set-Cookie:
              description: 一次性恢复会话
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthRecoveryResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: 注销当前网页会话
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '204': { description: 已注销 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前身份
      responses:
        '200':
          description: 当前身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- devices
  /api/v1/devices/pair/start:
    post:
      tags: [devices]
      operationId: devicePairStart
      summary: 发起设备配对（免鉴权）
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePairStartRequest' }
      responses:
        '200':
          description: 配对码；`verifier` 只给发起方
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePairStartResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/pair/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: 配对码（大小写与分隔符不敏感）
        schema: { type: string }
    get:
      tags: [devices]
      operationId: getDevicePairing
      summary: 查看待批准的配对请求（需网页会话）
      description: 批准页展示发起方信息供所有者核对；已过期或不存在返回 404，已批准返回 409。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 待批准的配对请求
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePairing' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/pair/approve:
    post:
      tags: [devices]
      operationId: devicePairApprove
      summary: 在网页上批准配对（需网页会话）
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePairApproveRequest' }
      responses:
        '200':
          description: 已批准，返回新设备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/pair/poll:
    post:
      tags: [devices]
      operationId: devicePairPoll
      summary: 发起方轮询配对结果（免鉴权，靠 verifier）
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePairPollRequest' }
      responses:
        '200':
          description: 已批准；设备令牌只返回这一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePairPollResponse' }
        '202':
          description: 尚未批准，按 `interval` 秒后重试
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: 设备列表
      responses:
        '200':
          description: 设备列表（含已吊销）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/{id}:
    parameters:
      - { $ref: '#/components/parameters/DeviceIdPath' }
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: 吊销设备（之后该令牌请求返回 401）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已吊销 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- projects
  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 项目列表
      parameters:
        - name: archived
          in: query
          description: 为 true 时只返回已归档项目；缺省只返回未归档
          schema: { type: boolean }
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [projects]
      operationId: createProject
      summary: 新建项目
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: getProject
      summary: 项目详情
      responses:
        '200':
          description: 项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: 修改项目
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPatch' }
      responses:
        '200':
          description: 修改后的项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: 删除项目（其线程保留，`projectId` 置空）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- providers
  /api/v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: provider 列表
      responses:
        '200':
          description: provider 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [providers]
      operationId: createProvider
      summary: 新建 provider（令牌只显示一次）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCreateResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/providers/{id}:
    parameters:
      - { $ref: '#/components/parameters/ProviderIdPath' }
    delete:
      tags: [providers]
      operationId: deleteProvider
      summary: 删除（停用）provider，其令牌立即失效
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- threads
  /api/v1/threads:
    get:
      tags: [threads]
      operationId: listThreads
      summary: 线程列表
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ThreadState' }
        - name: project
          in: query
          description: 项目 id；传 `none` 只返回无项目线程
          schema: { type: string }
        - name: archived
          in: query
          description: 为 true 时只返回已归档线程；缺省只返回未归档
          schema: { type: boolean }
        - name: q
          in: query
          description: 标题 / 标签的模糊搜索
          schema: { type: string }
      responses:
        '200':
          description: 线程列表（按 `updatedAt` 降序）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [threads]
      operationId: createThread
      summary: 新建线程
      description: 省略 `executor.provider` / `executor.type` 时依次取项目默认、`orb_defaults`、provider 的 `defaultType`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateThreadRequest' }
      responses:
        '201':
          description: 已创建（通常处于 `provisioning`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [threads]
      operationId: getThread
      summary: 线程详情
      responses:
        '200':
          description: 线程
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [threads]
      operationId: updateThread
      summary: 修改线程（改名时控制面同时向 agent 发 `set_session_name`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThreadPatch' }
      responses:
        '200':
          description: 修改后的线程
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [threads]
      operationId: deleteThread
      summary: 删除线程（停止其 agent，删除条目）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/entries:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [threads]
      operationId: listThreadEntries
      summary: 分页读取已复制条目（按 `seq` 升序）
      parameters:
        - name: after
          in: query
          description: 只返回 `seq > after` 的条目
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: 条目页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/fork:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    post:
      tags: [threads]
      operationId: forkThread
      summary: fork 线程（共用 orb 或连环境分叉）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForkThreadRequest' }
      responses:
        '201':
          description: 新线程（`env:"copy"` 时处于 `provisioning`，就绪后自动接续）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/wake:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    post:
      tags: [threads]
      operationId: wakeThread
      summary: 唤醒线程所在 orb（异步）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202': { description: 已受理 }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/threads/{id}/attachments:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [attachments]
      operationId: listThreadAttachments
      summary: 线程的附件（按上传时间）
      responses:
        '200':
          description: 附件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentList' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orbs
  /api/v1/orbs:
    get:
      tags: [orbs]
      operationId: listOrbs
      summary: orb 列表
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/OrbState' }
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: orb 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrb
      summary: orb 详情
      responses:
        '200':
          description: orb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [orbs]
      operationId: deleteOrb
      summary: 删除 orb（先 shutdown 再 delete；其线程保留条目，`orbId` 置空）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202':
          description: 已进入 `deleting`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/pause:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: pauseOrb
      summary: 手动冻结或停机
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrbPauseRequest' }
      responses:
        '202':
          description: 已进入 `freezing` / `stopping`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/resume:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: resumeOrb
      summary: 唤醒 orb（`frozen` / `stopped` / `failed` → `waking`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202':
          description: 已进入 `waking`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/metrics:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbMetrics
      summary: orb 资源采样（按 `step` 降采样，取窗口内均值；网络字节取窗口末值）
      parameters:
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
        - name: step
          in: query
          description: 降采样步长（秒）；缺省 = 原始采样（15s）
          schema: { type: integer, minimum: 15 }
      responses:
        '200':
          description: 采样序列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbMetrics' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/orbs/{id}/setup-runs:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: listOrbSetupRuns
      summary: 最近 20 次 setup / resume 运行（新到旧，不含日志）
      responses:
        '200':
          description: 运行记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbSetupRunList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/setup-runs/{runId}/log:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - name: runId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/SetupRunId' }
    get:
      tags: [orbs]
      operationId: getOrbSetupRunLog
      summary: 一次 setup / resume 运行的输出（末尾至多 256KiB）
      responses:
        '200':
          description: 纯文本日志
          content:
            text/plain:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orb 文件（M3，经 fs 流代理到 orbd）
  /api/v1/orbs/{id}/fs/roots:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbFsRoots
      summary: orb 内的文件根（`$HOME` 与当前工作目录）
      description: '经 orb link 的 `fs` 流转发到 orbd 本机 API（`GET /fs/roots` 等，见 docs/protocol.md M3 节）。orb 冻结 / 停机时默认唤醒并至多等待 25s；`bg=true` 时不唤醒、不计用户交互。'
      parameters:
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsRoots' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/list:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: listOrbFs
      summary: 列出目录（目录在前、按名不分大小写排序；≤5000 条）
      parameters:
        - { $ref: '#/components/parameters/FsPathQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsListing' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/stat:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: statOrbFs
      summary: 文件或目录元数据（含 `mime` 与 `text`）
      parameters:
        - { $ref: '#/components/parameters/FsPathQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/file:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/FsPathQuery' }
    get:
      tags: [orbs]
      operationId: readOrbFile
      summary: 下载文件（支持 `Range`）
      description: "一律以附件形式返回（`Content-Disposition: attachment`、`X-Content-Type-Options: nosniff`、`Content-Security-Policy: sandbox`、`Cache-Control: no-store`）；目录 → 409 `is_a_directory`。"
      parameters:
        - name: Range
          in: header
          description: 标准 HTTP Range（单区间）
          schema: { type: string }
      responses:
        '200':
          description: 文件字节
          headers:
            ETag:
              description: '`"<mtimeUnixNano>-<size>"`'
              schema: { type: string }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Range 请求的部分字节
          headers:
            ETag:
              schema: { type: string }
            Content-Range:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [orbs]
      operationId: writeOrbFile
      summary: 写入文件（整文件覆盖，单文件 ≤512MiB）
      description: |
        父目录须存在。已存在且 `overwrite=false` → 409 `exists`；带 `If-Match` 且与当前 `etag` 不符（含文件不存在）→ 412 `modified`；
        超过 512MiB → 413 `too_large`；磁盘满 → 507 `no_space`。写临时文件后原子替换，沿用原文件权限（新文件 0644）；目标是符号链接时写入其指向的文件。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: overwrite
          in: query
          description: 目标已存在时是否覆盖
          schema: { type: boolean, default: true }
        - name: If-Match
          in: header
          description: 期望的当前 `etag`（`FsEntry.etag`）；不符 → 412 `modified`
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 写入后的文件元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/mkdir:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: mkdirOrbFs
      summary: 新建目录（含缺失的上级目录，0755）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsPathRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/rename:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: renameOrbFs
      summary: 移动 / 重命名
      description: 目标已存在且未 `overwrite` → 409 `exists`；不得移动当前工作目录本身。返回目标的元数据。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsRenameRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/delete:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: deleteOrbFs
      summary: 删除文件或目录（递归）
      description: 不得删除当前工作目录本身或 `$HOME/.oryn` 下的路径（403 `protected_path`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsPathRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orb 改动（M3，git，经 fs 流代理到 orbd）
  /api/v1/orbs/{id}/git/status:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbGitStatus
      summary: 相对基线 / HEAD / 单个 commit 的改动文件列表（≤2000 个）
      description: '`base` 缺省时控制面以 orb 所属项目的 `baseBranch` 补上；仍无则 orbd 依次取 `origin/HEAD`、`main`、`master`。`root` 不是 git 仓库时返回 `repo=false` 与 `candidates`。'
      parameters:
        - { $ref: '#/components/parameters/GitRootQuery' }
        - { $ref: '#/components/parameters/GitScopeQuery' }
        - { $ref: '#/components/parameters/GitCommitQuery' }
        - { $ref: '#/components/parameters/GitBaseQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/diff:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbGitDiff
      summary: 单个文件的 unified diff（≤1MiB，按行截断）
      parameters:
        - { $ref: '#/components/parameters/GitRootQuery' }
        - { $ref: '#/components/parameters/GitScopeQuery' }
        - { $ref: '#/components/parameters/GitCommitQuery' }
        - { $ref: '#/components/parameters/GitBaseQuery' }
        - { $ref: '#/components/parameters/GitDiffPathQuery' }
        - { $ref: '#/components/parameters/GitDiffOldPathQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitFileDiff' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/commits:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: listOrbGitCommits
      summary: 基线（merge-base）到 HEAD 的提交，新到旧
      parameters:
        - { $ref: '#/components/parameters/GitRootQuery' }
        - { $ref: '#/components/parameters/GitBaseQuery' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitCommitList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/stage:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: stageOrbGit
      summary: 暂存文件（`git add -A -- <paths>`）
      description: '`index.lock` 被占用 → 409 `git_busy`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitPathsRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/unstage:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: unstageOrbGit
      summary: 取消暂存（`git reset -q HEAD -- <paths>`；HEAD 未出生时 `git rm -r -q --cached`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitPathsRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- 受管服务与 portal（M4）
  /api/v1/orbs/{id}/services:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: listOrbServices
      summary: orb 的受管服务与 portal（读控制面镜像，不唤醒、不计用户交互）
      description: 镜像来自 orbd 的 `services.state` 通知；orb 已删除或旧版 orbd 时两个列表为空。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbServiceList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/start:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    post:
      tags: [orbs]
      operationId: startOrbService
      summary: 启动已声明的服务（等待至多 60s 离开 `starting`）
      description: '经 `fs` 流转发到 orbd 本机 API `POST /services/{name}/start`。orb 不可用时唤醒并至多等待 25s；旧版 orbd → 409 `orbd_outdated`；未知服务 → 404 `service_not_found`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 操作后的服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbService' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/stop:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    post:
      tags: [orbs]
      operationId: stopOrbService
      summary: 停止服务（之后不再自动拉起，直到再次 start / restart）
      description: '经 `fs` 流转发到 orbd 本机 API `POST /services/{name}/stop`；进程组先 SIGTERM，10s 后 SIGKILL。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 操作后的服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbService' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/restart:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    post:
      tags: [orbs]
      operationId: restartOrbService
      summary: 重读 services.yaml 后重启服务（等待至多 60s 离开 `starting`）
      description: '经 `fs` 流转发到 orbd 本机 API `POST /services/{name}/restart`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 操作后的服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbService' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/log:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    get:
      tags: [orbs]
      operationId: getOrbServiceLog
      summary: 服务日志末尾（从整行开始）
      description: '经 `fs` 流转发到 orbd 本机 API `GET /services/{name}/log`；没有日志时返回空体。'
      parameters:
        - name: tail
          in: query
          description: 返回末尾至多多少字节
          schema: { type: integer, minimum: 1, maximum: 1048576, default: 65536 }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 纯文本日志
          content:
            text/plain:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/portals/{port}/share:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/PortalPortPath' }
    put:
      tags: [orbs]
      operationId: setOrbPortalShare
      summary: 限时公开该端口的 portal（首次公开与续期同一接口：`expiresAt = now + duration`）
      description: '只影响该 `(orb, 端口)`。端口未声明 portal → 404 `portal_not_found`；控制面未配置 `portal_domain` → 409 `portal_disabled`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalShareRequest' }
      responses:
        '200':
          description: 公开后的 portal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbPortal' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [orbs]
      operationId: endOrbPortalShare
      summary: 终止公开（立即断开该端口的全部匿名连接）
      description: 未公开时同样返回 204；控制面未配置 `portal_domain` → 409 `portal_disabled`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- blobs
  /api/v1/blobs/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Sha256' }
    get:
      tags: [blobs]
      operationId: getBlob
      summary: 下载 blob（转录中 `blob:sha256:<hex>` 引用的图片等）
      description: '`Content-Type` 为入库时记录的 mime；内容寻址，可长期缓存。'
      responses:
        '200':
          description: 原始字节
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- attachments
  /api/v1/attachments:
    post:
      tags: [attachments]
      operationId: uploadAttachment
      summary: 上传附件（单文件 ≤100MiB；可先于线程创建上传，24h 内未绑定线程即被清理）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: name
          in: query
          required: true
          description: 原始文件名（服务端净化后 ≤200 字节）
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: threadId
          in: query
          description: 直接绑定到该线程；缺省 = 暂不绑定（随 `POST threads` 的 `attachments` 或 `prompt.orynAttachments` 绑定）
          schema: { $ref: '#/components/schemas/ThreadId' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/attachments/{id}:
    parameters:
      - { $ref: '#/components/parameters/AttachmentIdPath' }
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: 删除附件（控制面的副本；orb 可用时尽力删除 orb 内的投递副本）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/attachments/{id}/content:
    parameters:
      - { $ref: '#/components/parameters/AttachmentIdPath' }
    get:
      tags: [attachments]
      operationId: getAttachmentContent
      summary: 下载附件（支持 `Range`）
      description: "默认 `Content-Disposition: attachment`；仅当 `inline=true` 且 mime ∈ `image/png|jpeg|gif|webp` 时内联。始终带 `X-Content-Type-Options: nosniff` 与 `Content-Security-Policy: sandbox`。"
      parameters:
        - name: inline
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 附件字节
          content:
            '*/*':
              schema: { type: string, format: binary }
        '206':
          description: Range 请求的部分字节
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- secrets
  /api/v1/secrets:
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: 密钥列表（仅名称与元数据）
      responses:
        '200':
          description: 密钥元数据列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/secrets/{name}:
    parameters:
      - { $ref: '#/components/parameters/SecretNamePath' }
    put:
      tags: [secrets]
      operationId: putSecret
      summary: 写入密钥
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretPut' }
      responses:
        '200':
          description: 写入后的元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretMeta' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: 删除密钥
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- settings
  /api/v1/settings/git-identity:
    get:
      tags: [settings]
      operationId: getGitIdentity
      summary: orb 内 git 提交身份的全局默认值
      responses:
        '200':
          description: 当前默认值（未设置时不含 identity）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitIdentitySettings' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putGitIdentity
      summary: 设置 git 提交身份的全局默认值（下次 setup / 唤醒时写入 orb）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitIdentity' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitIdentitySettings' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [settings]
      operationId: deleteGitIdentity
      summary: 清除 git 提交身份的全局默认值（已有 orb 的 git 配置保持不变）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已清除 }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/agent-identity:
    get:
      tags: [settings]
      operationId: getAgentIdentity
      summary: agent 头像（助手回合左侧显示）
      responses:
        '200':
          description: 当前设置（都省略 = 默认品牌标）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarIdentity' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putAgentIdentity
      summary: 设置 agent 头像（整体替换：省略的字段即清除；两者都省略 = 恢复默认）
      description: |
        `avatarIcon` 与 `avatarImage` 至多给一个（都给 → 400 `invalid_request`）。`avatarImage` 必须是
        `data:image/(png|webp|jpeg);base64,` 开头的 data URL，整串超过 128KiB → 413 `too_large`。尚未初始化所有者 → 409。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarIdentity' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarIdentity' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/user-identity:
    get:
      tags: [settings]
      operationId: getUserIdentity
      summary: 用户头像（用户回合右侧与侧栏页脚显示）
      responses:
        '200':
          description: 当前设置（都省略 = 默认：git 身份名字首字或 User 图标）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarIdentity' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putUserIdentity
      summary: 设置用户头像（整体替换：省略的字段即清除；两者都省略 = 恢复默认）
      description: |
        规则同 agent 头像：`avatarIcon` 与 `avatarImage` 至多给一个（都给 → 400 `invalid_request`）。`avatarImage` 必须是
        `data:image/(png|webp|jpeg);base64,` 开头的 data URL，整串超过 128KiB → 413 `too_large`。尚未初始化所有者 → 409。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarIdentity' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarIdentity' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- agent-config
  /api/v1/agent-config/files:
    get:
      tags: [agent-config]
      operationId: listAgentConfigFiles
      summary: omp-home 文件列表
      responses:
        '200':
          description: 文件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigFileList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-config/files/{path}:
    parameters:
      - { $ref: '#/components/parameters/AgentConfigPath' }
    get:
      tags: [agent-config]
      operationId: getAgentConfigFile
      summary: 读取文件原文（`models.yml` 返回的是密钥已替换为 `${oryn:secret:…}` 的模板）
      responses:
        '200':
          description: 文件原文
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [agent-config]
      operationId: putAgentConfigFile
      summary: 写入文件（`models.yml` 会做 C5 的密钥抽取）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: mode
          in: query
          description: 文件权限（八进制整数，如 420 = 0644）；缺省 0644
          schema: { type: integer, minimum: 0, maximum: 511 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 写入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigWriteResult' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [agent-config]
      operationId: deleteAgentConfigFile
      summary: 删除文件
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-config/import:
    post:
      tags: [agent-config]
      operationId: importAgentConfig
      summary: 导入 tar 包（`oryn config push` 使用）
      description: 包内路径相对 omp-home 根；整体替换现有 omp-home（不在包内的文件被删除）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigImportResult' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- stats
  /api/v1/stats/usage:
    get:
      tags: [stats]
      operationId: getUsageStats
      summary: 模型用量分组聚合
      parameters:
        - name: groupBy
          in: query
          required: true
          schema:
            type: string
            enum: [day, model, thread, project]
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
      responses:
        '200':
          description: 分组结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageStats' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/stats/orbs:
    get:
      tags: [stats]
      operationId: getOrbStats
      summary: orb 生命周期统计（由 `orb_events` 计算）
      parameters:
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
      responses:
        '200':
          description: 按 orb 类型汇总
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbStats' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- realtime
  /api/v1/ws-ticket:
    post:
      tags: [realtime]
      operationId: createWsTicket
      summary: 签发 WebSocket 票据（一次性，30 秒有效）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 票据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WsTicket' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ws:
    get:
      tags: [websocket, realtime]
      operationId: connectWs
      summary: 客户端实时通道（WebSocket，JSON 文本消息）
      description: |
        C→S 消息见 `WsClientMessage`，S→C 消息见 `WsServerMessage`。
        `sub` 后服务端先发 `thread.snapshot`，再分批发 `entries`（每条 ≤200 个条目），之后转发实时 `frame`。
        待发数据超过 8MiB 的慢消费者会被断开，客户端应重连并以 `afterSeq` 补拉。
      security: [{}]
      parameters:
        - name: ticket
          in: query
          required: true
          description: '`POST /api/v1/ws-ticket` 签发的票据'
          schema: { type: string }
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- provider protocol (C1)
  /provider/v1/hello:
    post:
      tags: [provider-protocol]
      operationId: providerHello
      summary: provider 实例上线并取得租约
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderHelloRequest' }
      responses:
        '200':
          description: 已登记；须在 `leaseSeconds` 内以 `jobs/claim` 续租
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderHelloResponse' }
        '409':
          description: 另一实例租约未过期且未声明 `allowMultiple`（`code:"provider_already_connected"`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/jobs/claim:
    post:
      tags: [provider-protocol]
      operationId: providerClaimJob
      summary: 长轮询认领任务（同时续租）
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderClaimRequest' }
      responses:
        '200':
          description: 认领到任务（认领租约 6 分钟）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderClaimResponse' }
        '204':
          description: 等待超时，无任务
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/jobs/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/JobId' }
    post:
      tags: [provider-protocol]
      operationId: providerCompleteJob
      summary: 上报任务结果
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCompleteRequest' }
      responses:
        '204': { description: 已记录 }
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/bye:
    post:
      tags: [provider-protocol]
      operationId: providerBye
      summary: provider 实例下线，释放租约
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderByeRequest' }
      responses:
        '204': { description: 已下线 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orb link (C2)
  /orb/v1/link:
    get:
      tags: [websocket]
      operationId: orbLink
      summary: orb link（WebSocket 子协议 `oryn.orb.v1` + yamux）
      description: |
        升级后在 WS 二进制消息流上跑 yamux（orbd = client，orynd = server，keepalive 10s）。
        每条 yamux 流的第一行是 `LinkStreamHeader` JSON + `\n`。
        `ctl` 流（orbd 建连后第一条且唯一）为双向 JSON 行：`LinkCtlRequest` / `LinkCtlResponse` / `LinkCtlNotification`；
        各方法的 params / result 见 `LinkCtlMethod` 与 `LinkCtl<Method>Params` / `LinkCtl<Method>Result`。
        orb 令牌只对本 orb 有效：`threadId` 不属于该 orb 的 `entries.*`、`agent` 流、`egress` 流会导致 link 被关闭。
      security:
        - orbBearer: []
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema:
            type: string
            enum: [oryn.orb.v1]
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-oryn_session
      description: 网页会话（`__Host-` 前缀：Path=/、无 Domain；HttpOnly、Secure、SameSite=Lax，30 天滑动续期）
    csrfHeader:
      type: apiKey
      in: header
      name: X-Oryn-CSRF
      description: 'Cookie 鉴权的变更类请求必须带 `X-Oryn-CSRF: 1`'
    deviceBearer:
      type: http
      scheme: bearer
      description: 设备令牌 `odt_…`
    providerBearer:
      type: http
      scheme: bearer
      description: provider 令牌 `opv_…`
    orbBearer:
      type: http
      scheme: bearer
      description: orb 令牌 `oot_…`

  parameters:
    DeviceIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/DeviceId' }
    ProjectIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProjectId' }
    ProviderIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProviderId' }
    ThreadIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ThreadId' }
    OrbIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrbId' }
    AttachmentIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AttachmentId' }
    FsPathQuery:
      name: path
      in: query
      required: true
      description: orb 内路径：绝对路径或 `~/…`；跟随符号链接后必须位于 `$HOME` 之下（否则 403 `outside_home`）。响应中的路径一律为绝对路径
      schema: { type: string, minLength: 1, maxLength: 4096 }
    OrbBackgroundQuery:
      name: bg
      in: query
      description: 后台请求（轮询用）：orb 不可用时直接 409 `orb_not_ready`，不唤醒、不计用户交互。接受 `1` / `true`
      schema: { type: boolean, default: false }
    GitRootQuery:
      name: root
      in: query
      description: 仓库所在目录（同 `FsPathQuery` 的路径规则）；缺省 = orb 当前工作目录
      schema: { type: string, maxLength: 4096 }
    GitScopeQuery:
      name: scope
      in: query
      schema: { $ref: '#/components/schemas/GitScope' }
    GitCommitQuery:
      name: commit
      in: query
      description: '`scope=commit` 时必填'
      schema: { type: string, pattern: '^[0-9a-f]{7,40}$' }
    GitBaseQuery:
      name: base
      in: query
      description: 基线分支名（如 `main`）
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$' }
    GitDiffPathQuery:
      name: path
      in: query
      required: true
      description: 仓库内相对路径（`GitFileChange.path`）
      schema: { type: string, minLength: 1, maxLength: 4096 }
    GitDiffOldPathQuery:
      name: oldPath
      in: query
      description: 重命名 / 复制前的路径（`GitFileChange.oldPath`）
      schema: { type: string, maxLength: 4096 }
    SecretNamePath:
      name: name
      in: path
      required: true
      description: 密钥名（如 `omp/models/anthropic/apiKey`、`git/github.com/token`、`GITHUB_TOKEN`），`/` 编码为 `%2F`
      schema: { type: string, minLength: 1, maxLength: 256 }
    AgentConfigPath:
      name: path
      in: path
      required: true
      description: 相对 omp-home 根的路径（如 `skills/foo/SKILL.md`），`/` 编码为 `%2F`；不得含 `..`
      schema: { type: string, minLength: 1, maxLength: 1024 }
    FromQuery:
      name: from
      in: query
      description: 起始时间（含，UTC 毫秒）；缺省 = 7 天前
      schema: { $ref: '#/components/schemas/TimestampMs' }
    ToQuery:
      name: to
      in: query
      description: 结束时间（不含，UTC 毫秒）；缺省 = 现在
      schema: { $ref: '#/components/schemas/TimestampMs' }
    ServiceNamePath:
      name: name
      in: path
      required: true
      description: 受管服务名
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
    PortalPortPath:
      name: port
      in: path
      required: true
      description: portal 端口（服务的 `PORT`）
      schema: { type: integer, minimum: 1, maximum: 65535 }

  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ============================================================ 基础类型
    TimestampMs:
      type: integer
      format: int64
      description: UTC 毫秒时间戳
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 小写十六进制
    ThreadId:
      type: string
      pattern: '^T-[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: '`T-<uuidv7>`'
      example: T-01932f6e-8d1a-7c3b-9f2e-0123456789ab
    OrbId:
      type: string
      pattern: '^orb-[0-9a-z]{26}$'
      description: '`orb-<26 位小写 ULID>`（同时是容器名与 hostname）'
      example: orb-01jcz8m3w4x5y6z7a8b9c0d1e2
    ProjectId:
      type: string
      pattern: '^prj_[0-9A-Z]{26}$'
      description: '`prj_<ulid>`'
    ProviderId:
      type: string
      pattern: '^prov_[0-9A-Z]{26}$'
      description: '`prov_<ulid>`'
    DeviceId:
      type: string
      pattern: '^dev_[0-9A-Z]{26}$'
      description: '`dev_<ulid>`'
    JobId:
      type: string
      pattern: '^job_[0-9A-Z]{26}$'
      description: '`job_<ulid>`'
    SetupRunId:
      type: string
      description: setup / resume 运行记录 id
      pattern: '^osr_[0-9A-Z]{26}$'
      example: osr_01HZX3J9Q4W8E5R6T7Y8U9I0OP
    SnapshotId:
      type: string
      pattern: '^oryn-snap-[0-9a-z]{26}$'
      description: 快照 id，同时是 Docker 镜像名
    AttachmentId:
      type: string
      pattern: '^att_[0-9A-Z]{26}$'
      description: '`att_<ulid>`'
    OmpFrame:
      type: object
      additionalProperties: true
      description: omp RPC 的命令、应答或帧，控制面不解释其内容。权威类型见 agent 仓库 `rpc-types.ts`。
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            机器可读错误码。已定义：`unauthorized`、`forbidden`、`not_found`、`invalid_request`、`conflict`、
            `provider_already_connected`、`managed_by_oryn`、`use_oryn_fork`、`queue_full`、`orb_unavailable`、`rate_limited`（429，带 `Retry-After`）、`internal`。
            M3（orb 文件 / 改动 / 附件，HTTP 状态见 docs/protocol.md）：`invalid_path`、`outside_home`、`protected_path`、`exists`、`is_a_directory`、
            `not_a_directory`、`not_a_repo`、`git_busy`、`modified`（412）、`too_large`（413）、`checksum_mismatch`（422）、`git_failed`、`no_space`（507）、
            `orb_not_ready`、`orbd_outdated`、`orb_deleted`（410）、`no_orb`、`orb_unavailable`（503，带 `Retry-After: 3`）、`orbd_unreachable`（502）、`orbd_bad_response`（502，orbd 返回了非预期状态）、`orbd_timeout`（504）、`attachment_not_found`。
            M4（受管服务与 portal，HTTP 状态见 docs/protocol.md）：`portal_disabled`（409，未配置 `portal_domain`）、`portal_not_found`（404）、`portal_unauthorized`（401）、
            `cross_site_blocked`（403）、`forbidden_port`（403）、`service_unreachable`（502）、`portal_unreachable`（502）、`portal_timeout`（504）、`portal_busy`（503）、
            `service_not_found`（404）、`invalid_service`（400）、`name_conflict`（409）、`services_not_ready`（409）。
        message:
          type: string
    HealthResponse:
      type: object
      required: [ok, version]
      properties:
        ok: { type: boolean }
        version: { type: string }

    # ============================================================ 状态枚举
    ThreadState:
      type: string
      description: |
        线程状态（全端统一，自上而下取首个成立）：
        `provisioning` orb 未到 ready 且 agent 从未 ready；
        `awaiting_input` 有待答 UI 或计划提案；
        `working` 已见 agent_start 且尚无终结 agent_end，或 state.hasPendingAsyncWork；
        `error` 最近 prompt_result 为 error 或 agent 重启耗尽；
        `idle` 其它。
      enum: [provisioning, awaiting_input, working, error, idle]
    OrbState:
      type: string
      description: orb 状态机（计划 E 节）
      enum:
        - requested
        - spawning
        - connecting
        - setting_up
        - resuming
        - ready
        - freezing
        - frozen
        - stopping
        - stopped
        - waking
        - deleting
        - deleted
        - failed
    AgentStatus:
      type: string
      description: 线程 agent 进程状态；`none` = 尚未启动或 orb 不可用
      enum: [none, starting, ready, exited]
    PauseMode:
      type: string
      enum: [freeze, stop]
    DeviceKind:
      type: string
      enum: [cli, desktop, mobile]
    SecretMode:
      type: string
      description: '`proxy` 经 egress 注入（不进 orb）；`env` 以同名环境变量注入 agent 进程'
      enum: [proxy, env]
    JobOp:
      type: string
      enum: [spawn, pause, snapshot, delete, delete_snapshot]
    JobState:
      type: string
      enum: [queued, claimed, succeeded, failed]
    ProviderDriver:
      type: string
      enum: [docker, dispatch, process]

    # ============================================================ 认证
    AuthSetupBeginRequest:
      type: object
      properties:
        token:
          type: string
          description: '`ost_…` 初始化令牌；恢复流程中省略'
        name:
          type: string
          description: Passkey 显示名
    WebAuthnCeremony:
      type: object
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          description: 本次仪式的服务端会话句柄，finish 时回传
        options:
          type: object
          additionalProperties: true
          description: '`PublicKeyCredentialCreationOptionsJSON` 或 `PublicKeyCredentialRequestOptionsJSON`（WebAuthn L3 JSON 形态）'
    AuthSetupFinishRequest:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId: { type: string }
        credential:
          type: object
          additionalProperties: true
          description: '`RegistrationResponseJSON`'
    AuthSetupFinishResponse:
      type: object
      required: [me]
      properties:
        me: { $ref: '#/components/schemas/Me' }
        recoveryCodes:
          type: array
          description: 首次初始化时返回 10 个恢复码（仅此一次）；恢复流程重新注册时为空
          items: { type: string }
    AuthLoginFinishRequest:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId: { type: string }
        credential:
          type: object
          additionalProperties: true
          description: '`AuthenticationResponseJSON`'
    AuthRecoveryRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    AuthRecoveryResponse:
      type: object
      required: [expiresAt, remainingCodes]
      properties:
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
        remainingCodes:
          type: integer
          description: 剩余未使用的恢复码数量
    Me:
      type: object
      required: [displayName, createdAt, auth]
      properties:
        displayName: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        auth:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [web, device, recovery]
            deviceId: { $ref: '#/components/schemas/DeviceId' }
        passkeyCount: { type: integer }

    # ============================================================ 设备
    Device:
      type: object
      required: [id, name, kind, platform, createdAt]
      properties:
        id: { $ref: '#/components/schemas/DeviceId' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        platform: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        lastSeenAt: { $ref: '#/components/schemas/TimestampMs' }
        revokedAt: { $ref: '#/components/schemas/TimestampMs' }
        current:
          type: boolean
          description: 是否为发起本请求的设备
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: '#/components/schemas/Device' }
    DevicePairStartRequest:
      type: object
      required: [name, kind, platform]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        platform:
          type: string
          description: 如 `linux-x64`、`ios`、`windows`
    DevicePairStartResponse:
      type: object
      required: [code, verifier, verifyUrl, expiresAt, interval]
      properties:
        code:
          type: string
          pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$'
          description: 8 位配对码（去易混字符），10 分钟有效
        verifier:
          type: string
          description: 仅发起方持有，轮询时回传
        verifyUrl:
          type: string
          description: 网页批准地址（`<public_url>/pair`，不预填配对码，所有者须手动输入设备上显示的码）
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
        interval:
          type: integer
          description: 建议轮询间隔（秒）
          example: 2
    DevicePairing:
      type: object
      required: [code, name, kind, platform, ip, userAgent, createdAt, expiresAt]
      properties:
        code: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        platform: { type: string }
        ip:
          type: string
          description: 发起方 IP
        userAgent:
          type: string
          description: 发起方 User-Agent
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
    DevicePairApproveRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    DevicePairPollRequest:
      type: object
      required: [code, verifier]
      properties:
        code: { type: string }
        verifier: { type: string }
    DevicePairPollResponse:
      type: object
      required: [deviceToken, device]
      properties:
        deviceToken:
          type: string
          description: '`odt_…`，只返回这一次'
        device: { $ref: '#/components/schemas/Device' }

    # ============================================================ 项目
    Project:
      type: object
      required: [id, name, shallowClone, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ProjectId' }
        name: { type: string }
        repoUrl: { type: string }
        baseBranch: { type: string }
        defaultProvider:
          type: string
          description: provider 名称
        defaultOrbType: { type: string }
        setupScript: { type: string }
        resumeScript: { type: string }
        shallowClone: { type: boolean }
        color: { type: string }
        icon:
          type: string
          description: 项目图标：单个字形（Nerd Font 私有区字符或 emoji）。未设置时省略；线程自动标题带卡片图标且项目尚无图标时由控制面自动填入一次
        gitAuthorName:
          type: string
          description: 本项目 orb 的 git 提交身份覆盖（与 gitAuthorEmail 同时存在或同时缺省）
        gitAuthorEmail: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
        archivedAt: { $ref: '#/components/schemas/TimestampMs' }
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/Project' }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        repoUrl: { type: string }
        baseBranch: { type: string }
        defaultProvider: { type: string }
        defaultOrbType: { type: string }
        setupScript: { type: string }
        resumeScript: { type: string }
        shallowClone: { type: boolean, default: false }
        color: { type: string }
        icon:
          type: string
          maxLength: 16
          description: 单个字形（一个字素，≤16 字节）；空串等同省略
        gitAuthorName:
          type: string
          description: 须与 gitAuthorEmail 同时给出；规则同 GitIdentity.name
        gitAuthorEmail:
          type: string
          description: 须与 gitAuthorName 同时给出；规则同 GitIdentity.email
    ProjectPatch:
      type: object
      description: 只修改出现的字段；可选字符串字段传空串表示清除
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        repoUrl: { type: string }
        baseBranch: { type: string }
        defaultProvider: { type: string }
        defaultOrbType: { type: string }
        setupScript: { type: string }
        resumeScript: { type: string }
        shallowClone: { type: boolean }
        color: { type: string }
        icon:
          type: string
          maxLength: 16
          description: 单个字形（一个字素，≤16 字节）；空串表示清除（之后可再被自动标题的卡片图标填入）
        gitAuthorName:
          type: string
          description: 须与 gitAuthorEmail 同时给出；两者都传空串表示清除项目覆盖
        gitAuthorEmail: { type: string }
        archived: { type: boolean }

    # ============================================================ 设置
    GitIdentity:
      type: object
      required: [name, email]
      description: orb 内 `git config --global user.name / user.email`；不得含换行或控制字符
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: 须包含 `@`
    GitIdentitySettings:
      type: object
      properties:
        identity: { $ref: '#/components/schemas/GitIdentity' }
    AvatarIdentity:
      type: object
      description: 头像（agent 头像与用户头像共用）；两个字段至多出现一个，都省略表示默认
      properties:
        avatarIcon:
          type: string
          maxLength: 64
          description: 内置图标字形（Nerd Font 私有区字符或 emoji）；空串等同省略
        avatarImage:
          type: string
          maxLength: 131072
          description: '`data:image/(png|webp|jpeg);base64,...`，前端先缩到 128×128；整串 ≤ 128KiB；空串等同省略'

    # ============================================================ provider（客户端视图）
    OrbType:
      type: object
      required: [name, cpus, memoryMB]
      properties:
        name: { type: string }
        cpus: { type: number }
        memoryMB: { type: integer }
    ProviderCapabilities:
      type: object
      required: [freeze, snapshot]
      properties:
        freeze: { type: boolean }
        snapshot: { type: boolean }
    Provider:
      type: object
      required: [id, name, online, orbTypes, createdAt]
      properties:
        id: { $ref: '#/components/schemas/ProviderId' }
        name: { type: string }
        driver: { $ref: '#/components/schemas/ProviderDriver' }
        capabilities: { $ref: '#/components/schemas/ProviderCapabilities' }
        orbTypes:
          type: array
          items: { $ref: '#/components/schemas/OrbType' }
        defaultType: { type: string }
        online:
          type: boolean
          description: 是否有实例持有未过期租约
        instanceId: { type: string }
        leaseUntil: { $ref: '#/components/schemas/TimestampMs' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        disabledAt: { $ref: '#/components/schemas/TimestampMs' }
    ProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/Provider' }
    ProviderCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$' }
    ProviderCreateResponse:
      type: object
      required: [provider, token]
      properties:
        provider: { $ref: '#/components/schemas/Provider' }
        token:
          type: string
          description: '`opv_…`，只显示这一次'

    # ============================================================ 线程
    ModelRef:
      type: object
      required: [provider, id]
      properties:
        provider: { type: string }
        id: { type: string }
    ImageContent:
      type: object
      required: [type, data, mimeType]
      properties:
        type:
          type: string
          enum: [image]
        data:
          type: string
          description: base64
        mimeType: { type: string }
    ThreadExecutor:
      description: 线程执行位置
      oneOf:
        - $ref: '#/components/schemas/ThreadExecutorNewOrb'
        - $ref: '#/components/schemas/ThreadExecutorOrb'
      discriminator:
        propertyName: kind
        mapping:
          new_orb: '#/components/schemas/ThreadExecutorNewOrb'
          orb: '#/components/schemas/ThreadExecutorOrb'
    ThreadExecutorNewOrb:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [new_orb]
        provider:
          type: string
          description: provider 名称
        type:
          type: string
          description: orb 类型名
    ThreadExecutorOrb:
      type: object
      required: [kind, orbId]
      properties:
        kind:
          type: string
          enum: [orb]
        orbId: { $ref: '#/components/schemas/OrbId' }
    CreateThreadRequest:
      type: object
      required: [prompt, executor]
      properties:
        projectId: { $ref: '#/components/schemas/ProjectId' }
        prompt: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageContent' }
        executor: { $ref: '#/components/schemas/ThreadExecutor' }
        model: { $ref: '#/components/schemas/ModelRef' }
        thinkingLevel: { type: string }
        title: { type: string }
        labels:
          type: array
          items: { type: string }
        attachments:
          type: array
          maxItems: 20
          description: 已上传附件的 id（`POST attachments`）；建线程时绑定到新线程并投递到 orb（`$HOME/.oryn/attachments/<threadId>/<id>/<name>`）。`prompt`、`images`、`attachments` 至少其一非空
          items: { $ref: '#/components/schemas/AttachmentId' }
    Thread:
      type: object
      required: [id, title, titleSource, state, stateChangedAt, pinned, labels, unread, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ThreadId' }
        projectId: { $ref: '#/components/schemas/ProjectId' }
        orbId:
          allOf:
            - $ref: '#/components/schemas/OrbId'
          description: 所在 orb；orb 被删除后省略（只读浏览）
        title: { type: string }
        titleSource:
          type: string
          enum: [auto, user]
        state: { $ref: '#/components/schemas/ThreadState' }
        stateChangedAt: { $ref: '#/components/schemas/TimestampMs' }
        parentThreadId: { $ref: '#/components/schemas/ThreadId' }
        forkedFromEntryId: { type: string }
        leafEntryId: { type: string }
        model: { $ref: '#/components/schemas/ModelRef' }
        thinkingLevel: { type: string }
        color: { type: string }
        pinned: { type: boolean }
        labels:
          type: array
          items: { type: string }
        snoozedUntil: { $ref: '#/components/schemas/TimestampMs' }
        archivedAt: { $ref: '#/components/schemas/TimestampMs' }
        unread: { type: boolean }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
        lastMessageAt: { $ref: '#/components/schemas/TimestampMs' }
        childCount:
          type: integer
          description: 子线程（fork 产生）数量，侧边栏显示 `n/m` 用
        childDoneCount:
          type: integer
          description: 处于 `idle` 的子线程数量
        error:
          $ref: '#/components/schemas/ThreadError'
        activity:
          type: string
          maxLength: 120
          readOnly: true
          description: |
            线程 `working` 时 agent 最近一次工具调用的意图（工具调用的 `i` / `intent` 参数，缺省时取 path / pattern / command 摘要），
            单行、至多 120 字符；只在内存中维护（不落库，控制面重启后为空），离开 `working` 即省略。变化时随 index.patch 推送
        portalUrlTemplate:
          type: string
          description: |
            该线程的 portal 地址模板：线程短码已代入、保留 `{port}`（如 `https://t-3f9a1c0b7e2d-p{port}.orb.example.com/`）。
            控制面未配置 `portal_domain` 时省略。
          example: 'https://t-3f9a1c0b7e2d-p{port}.orb.example.com/'
    ThreadError:
      type: object
      description: '`state=error` 的原因（目前只有 orb 进入 `failed`；可 `POST threads/{id}/wake` 重试）'
      required: [kind, reason]
      properties:
        kind:
          type: string
          enum: [orb_failed]
        reason: { type: string }
    ThreadEnvelope:
      type: object
      required: [thread]
      properties:
        thread: { $ref: '#/components/schemas/Thread' }
    ThreadList:
      type: object
      required: [threads]
      properties:
        threads:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
    ThreadPatch:
      type: object
      description: 只修改出现的字段；`color` 传空串清除，`snoozedUntil` 传 0 清除
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        color: { type: string }
        pinned: { type: boolean }
        labels:
          type: array
          items: { type: string }
        archived: { type: boolean }
        snoozedUntil: { $ref: '#/components/schemas/TimestampMs' }
        unread: { type: boolean }
    ForkThreadRequest:
      type: object
      required: [env]
      properties:
        entryId:
          type: string
          description: 从该条目分叉；缺省取当前叶子
        env:
          type: string
          description: '`copy` 连环境分叉（快照出副本 orb）；`share` 共用当前 orb'
          enum: [copy, share]
    Entry:
      type: object
      description: 会话 JSONL 的一行（已复制入库）
      required: [seq, file, entryId, type, payload]
      properties:
        seq:
          type: integer
          format: int64
          description: 线程内单调递增序号
        file:
          type: string
          description: 相对会话目录的 JSONL 文件路径
        entryId:
          type: string
          description: 行内 `id`；无 id 的行为合成 id `__title__` / `__session__`
        parentId: { type: string }
        type: { type: string }
        ts:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 行内 `timestamp` 换算的毫秒；无则省略
        payload:
          $ref: '#/components/schemas/OmpFrame'
    EntryPage:
      type: object
      required: [entries, lastSeq, hasMore]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 该线程当前最大 seq
        hasMore: { type: boolean }

    # ============================================================ orb
    Orb:
      type: object
      required: [id, providerId, type, cpus, memoryMB, image, state, stateChangedAt, createdAt, threadIds]
      properties:
        id: { $ref: '#/components/schemas/OrbId' }
        providerId: { $ref: '#/components/schemas/ProviderId' }
        providerName: { type: string }
        type: { type: string }
        cpus: { type: number }
        memoryMB: { type: integer }
        image: { type: string }
        projectId: { $ref: '#/components/schemas/ProjectId' }
        state: { $ref: '#/components/schemas/OrbState' }
        stateChangedAt: { $ref: '#/components/schemas/TimestampMs' }
        snapshotOf:
          allOf:
            - $ref: '#/components/schemas/SnapshotId'
          description: 由哪个快照创建
        lastAgentActivityAt: { $ref: '#/components/schemas/TimestampMs' }
        lastUserInteractionAt: { $ref: '#/components/schemas/TimestampMs' }
        orbdVersion: { type: string }
        agentVersion: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        deletedAt: { $ref: '#/components/schemas/TimestampMs' }
        threadIds:
          type: array
          items: { $ref: '#/components/schemas/ThreadId' }
        failureReason:
          type: string
          description: '`state=failed` 时导致失败的原因'
        lastSetup:
          allOf:
            - $ref: '#/components/schemas/OrbSetupRun'
          description: 最近一次 `phase=setup` 的运行
        lastResume:
          allOf:
            - $ref: '#/components/schemas/OrbSetupRun'
          description: 最近一次 `phase=resume` 的运行
        services:
          type: array
          description: orbd 上报的受管服务（控制面镜像，M4）；orb 已删除时省略
          items: { $ref: '#/components/schemas/OrbService' }
        portals:
          type: array
          description: 有 portal 的服务端口（M4）；orb 已删除时省略
          items: { $ref: '#/components/schemas/OrbPortal' }
    OrbSetupRun:
      type: object
      required: [id, orbId, phase, trigger, startedAt, finishedAt, ok, setupRan, durationMs, hasRepoScript, hasProjectScript]
      properties:
        id: { $ref: '#/components/schemas/SetupRunId' }
        orbId: { $ref: '#/components/schemas/OrbId' }
        phase: { $ref: '#/components/schemas/SetupPhase' }
        trigger: { $ref: '#/components/schemas/SetupTrigger' }
        startedAt: { $ref: '#/components/schemas/TimestampMs' }
        finishedAt: { $ref: '#/components/schemas/TimestampMs' }
        ok: { type: boolean }
        setupRan:
          type: boolean
          description: '`phase=setup` 时是否实际执行了脚本（`setup.done` 标记存在则为 false）'
        error:
          type: string
          description: '`ok=false` 时的失败原因'
        durationMs: { type: integer, format: int64 }
        hasRepoScript:
          type: boolean
          description: 仓库内存在可执行的 `.oryn/<phase>` 或 `.agents/<phase>`
        hasProjectScript:
          type: boolean
          description: 项目设置里配置了该阶段脚本
    SetupPhase:
      type: string
      enum: [setup, resume]
      x-enum-varnames: [SetupPhaseSetup, SetupPhaseResume]
    SetupTrigger:
      type: string
      description: '`auto` = orb 就绪 / 唤醒时自动运行；`manual` = orb 内 `oryn orb setup run`'
      enum: [auto, manual]
    OrbSetupRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/OrbSetupRun' }
    OrbServiceStatus:
      type: string
      description: |
        `starting` 已拉起、尚未通过就绪探测；`running` 运行中（需要探测的服务已通过探测）；`unhealthy` 60s 内未就绪（仍在探测）；
        `backoff` 进程退出、等待退避后重启；`stopped` 已被停止；`failed` 定义无效或连续 5 次短命。
      enum: [starting, running, unhealthy, backoff, stopped, failed]
    OrbPortalLink:
      type: object
      description: '服务的 portal 链接（`services.yaml` 的 `portal` / `portals[]`）：同一端口上的一个路径'
      required: [title, path]
      properties:
        title: { type: string, maxLength: 80 }
        path:
          type: string
          pattern: '^/'
          maxLength: 512
          description: 以 `/` 开头的路径（可带查询）
        folder:
          type: string
          maxLength: 80
          description: 链接菜单中的分组
    OrbService:
      type: object
      required: [name, source, command, status, restarts, links]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
        source:
          type: string
          description: '`file` = `.oryn/services.yaml`（或 `.amp/services.yaml`）；`dynamic` = `oryn orb service start --command`'
          enum: [file, dynamic]
        command: { type: string, maxLength: 4096 }
        cwd:
          type: string
          description: 相对工作区根的目录
        port: { type: integer, minimum: 1, maximum: 65535 }
        health:
          type: string
          description: 就绪探测的 HTTP 路径
        links:
          type: array
          description: portal 链接；非空 = 该服务的端口有 portal
          maxItems: 20
          items: { $ref: '#/components/schemas/OrbPortalLink' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 所属线程（决定 `PUBLIC_URL` 用哪个线程短码）
        publicUrl:
          type: string
          description: 该服务进程拿到的 `PUBLIC_URL`（不带结尾 `/`）
        status: { $ref: '#/components/schemas/OrbServiceStatus' }
        pid: { type: integer }
        restarts:
          type: integer
          description: 自动重启次数
        exitCode:
          type: integer
          description: 最近一次退出码
        error:
          type: string
          description: '`failed` 的原因（如 `port_conflict`、`forbidden_port`、定义校验错误）'
        startedAt: { $ref: '#/components/schemas/TimestampMs' }
    OrbPortal:
      type: object
      required: [port, service, links]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
        service:
          type: string
          description: 提供该端口的服务名
        links:
          type: array
          items: { $ref: '#/components/schemas/OrbPortalLink' }
        public:
          $ref: '#/components/schemas/OrbPortalPublic'
    OrbPortalPublic:
      type: object
      description: 限时公开中（省略 = 仅所有者可访问）
      required: [expiresAt]
      properties:
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
    OrbServiceList:
      type: object
      required: [services, portals]
      properties:
        services:
          type: array
          items: { $ref: '#/components/schemas/OrbService' }
        portals:
          type: array
          items: { $ref: '#/components/schemas/OrbPortal' }
    PortalShareDuration:
      type: string
      description: 公开时长（3600 / 10800 / 86400 / 604800 秒）
      enum: ['1h', '3h', '1d', '7d']
      x-enum-varnames: [PortalShareDuration1h, PortalShareDuration3h, PortalShareDuration1d, PortalShareDuration7d]
    PortalShareRequest:
      type: object
      required: [duration]
      properties:
        duration: { $ref: '#/components/schemas/PortalShareDuration' }
    OrbList:
      type: object
      required: [orbs]
      properties:
        orbs:
          type: array
          items: { $ref: '#/components/schemas/Orb' }
    OrbPauseRequest:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/PauseMode' }
    OrbMetricSample:
      type: object
      required: [ts, cpuPct, memUsedMB, memLimitMB, diskUsedMB, netRxBytes, netTxBytes]
      properties:
        ts: { $ref: '#/components/schemas/TimestampMs' }
        cpuPct: { type: number }
        memUsedMB: { type: number }
        memLimitMB: { type: number }
        diskUsedMB: { type: number }
        netRxBytes: { type: integer, format: int64 }
        netTxBytes: { type: integer, format: int64 }
    OrbMetrics:
      type: object
      required: [orbId, step, samples]
      properties:
        orbId: { $ref: '#/components/schemas/OrbId' }
        step:
          type: integer
          description: 实际步长（秒）
        samples:
          type: array
          items: { $ref: '#/components/schemas/OrbMetricSample' }

    # ============================================================ 密钥与 agent 配置
    SecretMeta:
      type: object
      required: [name, mode, createdAt, updatedAt]
      properties:
        name: { type: string }
        mode: { $ref: '#/components/schemas/SecretMode' }
        hosts:
          type: array
          description: '`proxy` 模式下允许注入的主机（为空 = 按名称约定推导）'
          items: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
    SecretList:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items: { $ref: '#/components/schemas/SecretMeta' }
    SecretPut:
      type: object
      required: [value, mode]
      description: '`mode:"env"` 时名称必须匹配 `[A-Z_][A-Z0-9_]*`'
      properties:
        value: { type: string }
        mode: { $ref: '#/components/schemas/SecretMode' }
        hosts:
          type: array
          items: { type: string }
    AgentConfigFile:
      type: object
      required: [path, size, mode, sha256, updatedAt]
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
        mode:
          type: integer
          description: 文件权限（十进制表示的 Unix 权限位）
        sha256: { $ref: '#/components/schemas/Sha256' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
    AgentConfigFileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigFile' }
    AgentConfigWarning:
      type: object
      required: [path, kind, message]
      properties:
        path: { type: string }
        line: { type: integer }
        kind:
          type: string
          description: '`possible_secret`（非 models.yml 文件中形似密钥的串）、`env_fallback`（provider 走环境变量降级）等'
        message: { type: string }
    AgentConfigWriteResult:
      type: object
      required: [file, extractedSecrets, warnings]
      properties:
        file: { $ref: '#/components/schemas/AgentConfigFile' }
        extractedSecrets:
          type: array
          description: 本次从 models.yml 抽取进密钥库的密钥名
          items: { type: string }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigWarning' }
    AgentConfigImportResult:
      type: object
      required: [files, extractedSecrets, warnings]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigFile' }
        extractedSecrets:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigWarning' }

    # ============================================================ 统计
    UsageStat:
      type: object
      required: [key, requests, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd, toolCalls, toolErrors]
      properties:
        key:
          type: string
          description: 分组键：`YYYY-MM-DD`（UTC）/ `<provider>/<model>` / 线程 id / 项目 id（无项目为空串）
        label:
          type: string
          description: 显示名（线程标题、项目名）
        requests: { type: integer, format: int64 }
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64 }
        costUsd: { type: number }
        subagentCostUsd: { type: number }
        avgTtftMs: { type: number }
        tokensPerSecond: { type: number }
        toolCalls: { type: integer, format: int64 }
        toolErrors: { type: integer, format: int64 }
    UsageStats:
      type: object
      required: [groupBy, from, to, groups]
      properties:
        groupBy:
          type: string
          enum: [day, model, thread, project]
        from: { $ref: '#/components/schemas/TimestampMs' }
        to: { $ref: '#/components/schemas/TimestampMs' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/UsageStat' }
    OrbTypeStat:
      type: object
      required: [type, orbs, runningMs, frozenMs, stoppedMs, spawns, freezes, stops, wakes, failures]
      properties:
        type: { type: string }
        orbs:
          type: integer
          description: 窗口内存在过的 orb 数
        runningMs: { type: integer, format: int64 }
        frozenMs: { type: integer, format: int64 }
        stoppedMs: { type: integer, format: int64 }
        spawns: { type: integer }
        freezes: { type: integer }
        stops: { type: integer }
        wakes: { type: integer }
        failures: { type: integer }
    OrbStats:
      type: object
      required: [from, to, types]
      properties:
        from: { $ref: '#/components/schemas/TimestampMs' }
        to: { $ref: '#/components/schemas/TimestampMs' }
        types:
          type: array
          items: { $ref: '#/components/schemas/OrbTypeStat' }

    # ============================================================ 客户端 WebSocket
    # ============================================================ orb 文件 / 改动 / 附件（M3）
    FsRoots:
      type: object
      required: [home, workdir]
      properties:
        home:
          type: string
          description: orb 内 `$HOME` 的绝对路径
        workdir:
          type: string
          description: orb 当前工作目录的绝对路径（有仓库时为检出目录）
    FsEntry:
      type: object
      required: [path, name, type, size, mtime, mode]
      properties:
        path:
          type: string
          description: 绝对路径
        name: { type: string }
        type:
          type: string
          description: '`Lstat` 的类型；符号链接为 `symlink`，其指向见 `target` / `targetType`'
          enum: [file, dir, symlink, other]
        size:
          type: integer
          format: int64
        mtime: { $ref: '#/components/schemas/TimestampMs' }
        mode:
          type: integer
          description: Unix 权限位（十进制，如 420 = 0644）
        target:
          type: string
          description: 符号链接的目标（`readlink` 原文）
        targetType:
          type: string
          description: 符号链接最终指向的类型；悬空或指向 `$HOME` 之外时省略
          enum: [file, dir]
        etag:
          type: string
          description: '`"<mtimeUnixNano>-<size>"`（含引号，可直接用作 `If-Match`）；仅文件'
        mime:
          type: string
          description: 仅 `stat` 返回：按扩展名推断，缺省按内容嗅探
        text:
          type: boolean
          description: 仅 `stat` 返回：前 8KiB 无 NUL 且为合法 UTF-8（允许末尾截断的码点）
    FsListing:
      type: object
      required: [path, entries, truncated]
      properties:
        path:
          type: string
          description: 目录的绝对路径
        entries:
          type: array
          maxItems: 5000
          description: 目录在前、按名不分大小写排序
          items: { $ref: '#/components/schemas/FsEntry' }
        truncated:
          type: boolean
          description: 超过 5000 条被截断
    FsPathRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 同 `FsPathQuery` 的路径规则
    FsRenameRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
        overwrite:
          type: boolean
          default: false
          description: 目标已存在时是否替换
    GitScope:
      type: string
      description: |
        改动范围：`all` 基线 merge-base → 工作区（无基线时等同 `uncommitted`）；
        `uncommitted` HEAD → 工作区；`commit` 单个提交（`<sha>^1` → `<sha>`，须带 `commit`）。
      enum: [all, uncommitted, commit]
      default: all
    GitBase:
      type: object
      required: [name, ref, mergeBase, approximate]
      properties:
        name:
          type: string
          description: 基线分支名（如 `main`）
        ref:
          type: string
          description: 解析到的引用（`refs/remotes/origin/<name>` 或 `refs/heads/<name>`）
        mergeBase:
          type: string
          description: HEAD 与基线的 merge-base 提交 sha
        approximate:
          type: boolean
          description: merge-base 不可得（浅克隆 / 无共同祖先）时为真，`mergeBase` 取基线引用本身的 sha
    GitFileChange:
      type: object
      required: [path, status, binary, staged]
      properties:
        path:
          type: string
          description: 仓库内相对路径（重命名 / 复制后的路径）
        oldPath:
          type: string
          description: 重命名 / 复制前的路径
        status:
          type: string
          enum: [added, modified, deleted, renamed, copied, typechange, untracked, conflicted]
        additions:
          type: integer
          description: 新增行数；二进制或过大的未跟踪文件省略
        deletions:
          type: integer
          description: 删除行数；二进制或过大的未跟踪文件省略
        binary: { type: boolean }
        staged:
          type: string
          description: 暂存状态（仅 to 为工作区的范围有意义；`commit` 范围恒为 `none`）
          enum: [none, partial, full]
    GitStatus:
      type: object
      required: [repo, scope, files, truncated]
      properties:
        repo:
          type: boolean
          description: '`root` 是否位于 git 仓库内；为假时只有 `candidates`'
        root:
          type: string
          description: 仓库顶层目录的绝对路径
        candidates:
          type: array
          maxItems: 20
          description: '`repo=false` 时 `root` 下一层含 `.git` 的子目录（绝对路径）'
          items: { type: string }
        branch:
          type: string
          description: 当前分支名；分离 HEAD 时省略
        head:
          type: string
          description: HEAD 提交 sha；未出生时省略
        base: { $ref: '#/components/schemas/GitBase' }
        scope: { $ref: '#/components/schemas/GitScope' }
        files:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/GitFileChange' }
        truncated:
          type: boolean
          description: 超过 2000 个文件被截断
    GitFileDiff:
      type: object
      required: [path, kind, patch, truncated]
      properties:
        path: { type: string }
        oldPath: { type: string }
        kind:
          type: string
          description: '`text` 有 patch；`binary` 二进制（patch 为空）；`large` 未跟踪且 >4MiB（patch 为空）'
          enum: [text, binary, large]
        patch:
          type: string
          description: unified diff（`-U3`），≤1MiB
        truncated:
          type: boolean
          description: patch 超过 1MiB，在最后一个换行处截断
    GitCommit:
      type: object
      required: [sha, shortSha, subject, authorName, authorEmail, ts]
      properties:
        sha: { type: string }
        shortSha: { type: string }
        subject: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        ts:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 作者时间
    GitCommitList:
      type: object
      required: [commits, truncated]
      properties:
        commits:
          type: array
          maxItems: 200
          description: 新到旧
          items: { $ref: '#/components/schemas/GitCommit' }
        truncated:
          type: boolean
          description: 超出 `limit` 被截断
    GitPathsRequest:
      type: object
      required: [paths]
      properties:
        root:
          type: string
          description: 同 `GitRootQuery`
        paths:
          type: array
          minItems: 1
          description: 仓库内相对路径；拒绝空串、NUL、绝对路径与 `..` 段
          items: { type: string }
    Attachment:
      type: object
      required: [id, name, mime, size, sha256, createdAt]
      properties:
        id: { $ref: '#/components/schemas/AttachmentId' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 绑定的线程；尚未绑定时省略
        name:
          type: string
          description: 净化后的文件名（≤200 字节）
        mime: { type: string }
        size:
          type: integer
          format: int64
        sha256: { $ref: '#/components/schemas/Sha256' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
    AttachmentList:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
    OrbAttachmentEnsureRequest:
      type: object
      description: 仅 orbd 本机 API 使用（`POST /attachments/ensure`，经 `fs` 流），不经 REST 暴露
      required: [threadId, id, name, size, sha256]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id: { $ref: '#/components/schemas/AttachmentId' }
        name: { type: string }
        size:
          type: integer
          format: int64
        sha256: { $ref: '#/components/schemas/Sha256' }
    OrbAttachmentEnsureResult:
      type: object
      description: 仅 orbd 本机 API 使用（`POST /attachments/ensure` 与 `PUT /attachments/file` 的结果）
      required: [present, path]
      properties:
        present:
          type: boolean
          description: '`path` 处已是大小相同的普通文件'
        path:
          type: string
          description: '`$HOME/.oryn/attachments/<threadId>/<id>/<safeName>` 的绝对路径'

    WsTicket:
      type: object
      required: [ticket, expiresIn]
      properties:
        ticket: { type: string }
        expiresIn:
          type: integer
          description: 秒
          example: 30
    WsClientMessage:
      description: 客户端 → 服务端 WS 消息
      oneOf:
        - $ref: '#/components/schemas/WsClientFocus'
        - $ref: '#/components/schemas/WsClientSub'
        - $ref: '#/components/schemas/WsClientUnsub'
        - $ref: '#/components/schemas/WsClientCmd'
        - $ref: '#/components/schemas/WsClientUiResponse'
        - $ref: '#/components/schemas/WsClientPing'
        - $ref: '#/components/schemas/WsClientTermWatch'
      discriminator:
        propertyName: type
        mapping:
          focus: '#/components/schemas/WsClientFocus'
          sub: '#/components/schemas/WsClientSub'
          unsub: '#/components/schemas/WsClientUnsub'
          cmd: '#/components/schemas/WsClientCmd'
          ui.response: '#/components/schemas/WsClientUiResponse'
          ping: '#/components/schemas/WsClientPing'
          term.watch: '#/components/schemas/WsClientTermWatch'
    WsClientFocus:
      type: object
      description: 当前正在看的线程（用于未读、通知抑制、唤醒）；记为一次用户交互
      required: [type, threadId]
      properties:
        type: { type: string, enum: [focus] }
        threadId:
          type: string
          nullable: true
          description: 线程 id；null 表示不看任何线程
    WsClientSub:
      type: object
      required: [type, threadId]
      properties:
        type: { type: string, enum: [sub] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        afterSeq:
          type: integer
          format: int64
          description: 客户端已有条目的可续传游标（最近一条 `entries` 消息的 `lastSeq`）；缺省 0 = 全量
        transcriptRev:
          type: integer
          format: int64
          description: |
            客户端缓存条目所属的转录版本（来自 `thread.snapshot` / `transcript.reset`）。与服务端当前版本不同，
            或缺省但 `afterSeq > 0` 且服务端版本 > 0 时，服务端忽略 `afterSeq` 从头补发，并在快照中置 `fullReplay: true`。
    WsClientUnsub:
      type: object
      required: [type, threadId]
      properties:
        type: { type: string, enum: [unsub] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsClientCmd:
      type: object
      description: omp RPC 命令；控制面注入唯一 id 后下发，应答以 `res` 回到本连接
      required: [type, threadId, id, frame]
      properties:
        type: { type: string, enum: [cmd] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id:
          type: string
          description: 客户端侧请求 id（仅在本连接内唯一）
        frame:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 不带 `id` 的 omp RPC 命令对象
    WsClientUiResponse:
      type: object
      description: |
        侧通道应答；`frame.type` 只能是 `extension_ui_response`、`host_tool_result`、`host_tool_update`、`host_uri_result`
        之一且带字符串 `id`（与 omp `dispatchRpcControlFrame` 的判定一致），否则回 `error{code:"invalid_frame"}`。
        `extension_ui_response` 先到先得：只有对应请求仍待答且应答已成功交给 agent（或在 orb 暂停时入队）才广播 `ui.resolved`。
      required: [type, threadId, frame]
      properties:
        type: { type: string, enum: [ui.response] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        frame: { $ref: '#/components/schemas/OmpFrame' }
    WsClientPing:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [ping] }
    WsClientTermWatch:
      type: object
      description: |
        开关本连接对该线程 `terminal_output` 帧的接收（须先 `sub`，否则回 `error{code:"not_subscribed"}`）。
        `terminal_output` 默认不发给未开启的连接；其它终端帧（`terminal_opened|exit|closed`）照常随 `frame` 广播。
        待发超过阈值时服务端丢弃终端输出、关闭本开关并发 `term.lagged`：客户端应经 `terminal_snapshot` 重同步后重新开启。
      required: [type, threadId, 'on']
      properties:
        type: { type: string, enum: [term.watch] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        'on': { type: boolean }

    WsServerMessage:
      description: 服务端 → 客户端 WS 消息
      oneOf:
        - $ref: '#/components/schemas/WsServerIndex'
        - $ref: '#/components/schemas/WsServerIndexPatch'
        - $ref: '#/components/schemas/WsServerThreadSnapshot'
        - $ref: '#/components/schemas/WsServerEntries'
        - $ref: '#/components/schemas/WsServerFrame'
        - $ref: '#/components/schemas/WsServerRes'
        - $ref: '#/components/schemas/WsServerUiResolved'
        - $ref: '#/components/schemas/WsServerLiveReset'
        - $ref: '#/components/schemas/WsServerTranscriptReset'
        - $ref: '#/components/schemas/WsServerPlanResolved'
        - $ref: '#/components/schemas/WsServerOrb'
        - $ref: '#/components/schemas/WsServerError'
        - $ref: '#/components/schemas/WsServerPong'
        - $ref: '#/components/schemas/WsServerTermLagged'
        - $ref: '#/components/schemas/WsServerTermResized'
      discriminator:
        propertyName: type
        mapping:
          index: '#/components/schemas/WsServerIndex'
          index.patch: '#/components/schemas/WsServerIndexPatch'
          thread.snapshot: '#/components/schemas/WsServerThreadSnapshot'
          entries: '#/components/schemas/WsServerEntries'
          frame: '#/components/schemas/WsServerFrame'
          res: '#/components/schemas/WsServerRes'
          ui.resolved: '#/components/schemas/WsServerUiResolved'
          live.reset: '#/components/schemas/WsServerLiveReset'
          transcript.reset: '#/components/schemas/WsServerTranscriptReset'
          plan.resolved: '#/components/schemas/WsServerPlanResolved'
          orb: '#/components/schemas/WsServerOrb'
          error: '#/components/schemas/WsServerError'
          pong: '#/components/schemas/WsServerPong'
          term.lagged: '#/components/schemas/WsServerTermLagged'
          term.resized: '#/components/schemas/WsServerTermResized'
    WsServerIndex:
      type: object
      description: 线程摘要全量（连接建立后首条）
      required: [type, threads, rev]
      properties:
        type: { type: string, enum: [index] }
        threads:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
        rev: { type: integer, format: int64 }
    WsServerIndexPatch:
      type: object
      required: [type, upsert, remove, rev]
      properties:
        type: { type: string, enum: [index.patch] }
        upsert:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
        remove:
          type: array
          items: { $ref: '#/components/schemas/ThreadId' }
        rev: { type: integer, format: int64 }
    AgentLiveState:
      type: object
      description: 线程实时缓冲（只含未被条目覆盖的部分）
      required: [status, pendingUi, subagents, live]
      properties:
        status: { $ref: '#/components/schemas/AgentStatus' }
        state:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 最近一次 `get_state` 应答的 data
        queue:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 最新 `queue_update` 帧
        pendingUi:
          type: array
          description: 未应答的 `extension_ui_request` 帧
          items: { $ref: '#/components/schemas/OmpFrame' }
        planProposal:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 未决的 `plan_proposal` 帧
        subagents:
          type: array
          description: 各子 agent 最新的 `subagent_lifecycle` / `subagent_progress` 帧
          items: { $ref: '#/components/schemas/OmpFrame' }
        live:
          type: array
          description: 在途消息（`openMessage`）与运行中工具（`openTools`）的帧，按到达顺序
          items: { $ref: '#/components/schemas/OmpFrame' }
    WsServerThreadSnapshot:
      type: object
      description: '`sub` 后的首条消息'
      required: [type, threadId, thread, agent, lastSeq, transcriptRev, fullReplay]
      properties:
        type: { type: string, enum: [thread.snapshot] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        thread: { $ref: '#/components/schemas/Thread' }
        orb:
          allOf:
            - $ref: '#/components/schemas/Orb'
          description: 线程所在 orb；无 orb 时省略
        agent: { $ref: '#/components/schemas/AgentLiveState' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 快照时刻线程的最大 seq（补发的目标；不是可续传游标，游标以各条 `entries.lastSeq` 为准）
        transcriptRev:
          type: integer
          format: int64
          description: 当前转录版本；之后的 `sub` 应带上它
        fullReplay:
          type: boolean
          description: 为真时服务端从 seq 0 补发：客户端须先丢弃该线程已缓存的全部条目
    WsServerEntries:
      type: object
      required: [type, threadId, entries, lastSeq]
      properties:
        type: { type: string, enum: [entries] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        entries:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Entry' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 本条消息覆盖到的最大 seq（可续传游标：≤ 它的条目都已送达）；分批时每批各自填写
    WsServerFrame:
      type: object
      description: 实时 omp 帧（`response` 以外的帧广播给该线程全部订阅者）
      required: [type, threadId, frame]
      properties:
        type: { type: string, enum: [frame] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        frame: { $ref: '#/components/schemas/OmpFrame' }
    WsServerRes:
      type: object
      description: '`cmd` 的应答，只发给发起连接；`id` 为客户端原始 id'
      required: [type, threadId, id, response]
      properties:
        type: { type: string, enum: [res] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id: { type: string }
        response: { $ref: '#/components/schemas/OmpFrame' }
    WsServerUiResolved:
      type: object
      required: [type, threadId, requestId]
      properties:
        type: { type: string, enum: [ui.resolved] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        requestId: { type: string }
    WsServerLiveReset:
      type: object
      description: 丢弃叠加层，仅按条目渲染，直到下一个 `message_start`
      required: [type, threadId]
      properties:
        type: { type: string, enum: [live.reset] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsServerTranscriptReset:
      type: object
      description: |
        线程转录被重写（会话文件重写后删除了旧行，或 fork 回退移除了某文件）：客户端丢弃该线程的全部已缓存条目，
        并以 `sub{afterSeq: 0, transcriptRev}` 重新订阅
      required: [type, threadId, transcriptRev]
      properties:
        type: { type: string, enum: [transcript.reset] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        transcriptRev: { type: integer, format: int64 }
    WsServerPlanResolved:
      type: object
      description: 计划提案已被成功批准 / 处理（`plan_approval` 成功应答）：所有客户端清除该线程的 `planProposal`
      required: [type, threadId]
      properties:
        type: { type: string, enum: [plan.resolved] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsServerOrb:
      type: object
      required: [type, orb]
      properties:
        type: { type: string, enum: [orb] }
        orb: { $ref: '#/components/schemas/Orb' }
    WsServerError:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, enum: [error] }
        code: { type: string }
        message: { type: string }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id:
          type: string
          description: 若由某条 `cmd` 引起，为其客户端 id
    WsServerPong:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [pong] }
    WsServerTermLagged:
      type: object
      description: |
        该线程的 `terminal_output` 有丢失（本连接待发超过阈值，或 orbd 帧缓冲溢出后的 `terminal.gap`）：
        客户端应以 `terminal_list` + `terminal_snapshot` 重同步，并重新 `term.watch{on:true}`。
      required: [type, threadId]
      properties:
        type: { type: string, enum: [term.lagged] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsServerTermResized:
      type: object
      description: 某个连接发出的 `terminal_resize` 已入队（发给该线程全部订阅者，含发起方）；omp 自身不为 resize 发帧
      required: [type, threadId, terminalId, cols, rows]
      properties:
        type: { type: string, enum: [term.resized] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        terminalId: { type: string }
        cols: { type: integer }
        rows: { type: integer }

    # ============================================================ provider 协议（C1）
    ProviderHelloRequest:
      type: object
      required: [instanceId, driver, version, capabilities, types, defaultType, allowMultiple]
      properties:
        instanceId:
          type: string
          description: 本进程实例的随机 id
        driver: { $ref: '#/components/schemas/ProviderDriver' }
        version: { type: string }
        capabilities: { $ref: '#/components/schemas/ProviderCapabilities' }
        types:
          type: array
          items: { $ref: '#/components/schemas/OrbType' }
        defaultType: { type: string }
        allowMultiple: { type: boolean }
    ProviderHelloResponse:
      type: object
      required: [providerId, leaseSeconds]
      properties:
        providerId: { $ref: '#/components/schemas/ProviderId' }
        leaseSeconds:
          type: integer
          example: 45
    ProviderClaimRequest:
      type: object
      required: [instanceId, waitSeconds]
      properties:
        instanceId: { type: string }
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 60
          example: 30
    ProviderJob:
      type: object
      required: [id, op, orbId, params, attempt, claimGen]
      properties:
        id: { $ref: '#/components/schemas/JobId' }
        op: { $ref: '#/components/schemas/JobOp' }
        orbId: { $ref: '#/components/schemas/OrbId' }
        params:
          type: object
          additionalProperties: true
          description: |
            按 `op` 取：`spawn` → `JobSpawnParams`；`pause` → `JobPauseParams`；`snapshot` → `JobSnapshotParams`；
            `delete` → `JobDeleteParams`；`delete_snapshot` → `JobDeleteSnapshotParams`。
            每个操作必须幂等，5 分钟超时。
        attempt:
          type: integer
          minimum: 1
          maximum: 3
        claimGen:
          type: integer
          format: int64
          minimum: 1
          description: 本次认领的代数（每次认领 +1）；完成上报必须原样回传，控制面只接受与当前认领代数一致的结果。
    ProviderClaimResponse:
      type: object
      required: [job]
      properties:
        job: { $ref: '#/components/schemas/ProviderJob' }
    ProviderCompleteRequest:
      type: object
      required: [claimGen, ok, output, durationMs]
      properties:
        claimGen:
          type: integer
          format: int64
          description: 认领应答中的 `job.claimGen`；与任务当前认领代数不一致（该次认领已过期被重排或被巡检判失败）时回 409。
        ok: { type: boolean }
        output:
          type: string
          maxLength: 65536
          description: 输出尾部（≤64KB）
        error: { type: string }
        durationMs: { type: integer, format: int64 }
    ProviderByeRequest:
      type: object
      required: [instanceId]
      properties:
        instanceId: { type: string }
    JobSpawnEnv:
      type: object
      required: [ORYN_URL, ORYN_ORB_ID, ORYN_ORB_TOKEN]
      properties:
        ORYN_URL:
          type: string
          x-go-name: OrynURL
        ORYN_ORB_ID:
          type: string
          pattern: '^orb-[0-9a-z]{26}$'
          x-go-name: OrynOrbID
        ORYN_ORB_TOKEN:
          type: string
          description: '`oot_…`'
          x-go-name: OrynOrbToken
    JobSpawnParams:
      type: object
      required: [image, type, env]
      properties:
        image: { type: string }
        snapshotId: { $ref: '#/components/schemas/SnapshotId' }
        type:
          type: string
          description: orb 类型名
        env: { $ref: '#/components/schemas/JobSpawnEnv' }
    JobPauseParams:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/PauseMode' }
    JobSnapshotParams:
      type: object
      required: [snapshotId]
      properties:
        snapshotId: { $ref: '#/components/schemas/SnapshotId' }
    JobDeleteParams:
      type: object
      properties: {}
    JobDeleteSnapshotParams:
      type: object
      required: [snapshotId]
      properties:
        snapshotId: { $ref: '#/components/schemas/SnapshotId' }

    # ============================================================ orb link（C2）
    LinkStreamHeader:
      description: yamux 流的第一行（JSON + `\n`）。`desk` 由 M8 定义。
      oneOf:
        - $ref: '#/components/schemas/LinkStreamCtl'
        - $ref: '#/components/schemas/LinkStreamAgent'
        - $ref: '#/components/schemas/LinkStreamEgress'
        - $ref: '#/components/schemas/LinkStreamBlob'
        - $ref: '#/components/schemas/LinkStreamFs'
        - $ref: '#/components/schemas/LinkStreamPortal'
      discriminator:
        propertyName: t
        mapping:
          ctl: '#/components/schemas/LinkStreamCtl'
          agent: '#/components/schemas/LinkStreamAgent'
          egress: '#/components/schemas/LinkStreamEgress'
          blob: '#/components/schemas/LinkStreamBlob'
          fs: '#/components/schemas/LinkStreamFs'
          portal: '#/components/schemas/LinkStreamPortal'
    LinkStreamCtl:
      type: object
      description: orbd 建连后开的第一条且唯一的控制流
      required: [t]
      properties:
        t: { type: string, enum: [ctl] }
    LinkStreamAgent:
      type: object
      description: 'agent 启动时由 orbd 开；orbd→orynd 为重组后的 omp 逻辑帧，orynd→orbd 为写入 omp stdin 的命令帧（一行一个 JSON）'
      required: [t, threadId]
      properties:
        t: { type: string, enum: [agent] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkStreamEgress:
      type: object
      description: 每个出站代理连接一条；之后为裸 HTTP/1.1 字节流
      required: [t]
      properties:
        t: { type: string, enum: [egress] }
    LinkStreamBlob:
      type: object
      description: 应 `blob.fetch` 请求由 orbd 开；流头之后为 `size` 字节原始内容
      required: [t, sha256, size]
      properties:
        t: { type: string, enum: [blob] }
        sha256: { $ref: '#/components/schemas/Sha256' }
        size: { type: integer, format: int64 }
    LinkStreamFs:
      type: object
      description: |
        由 orynd 打开（M3）；流头之后是 HTTP/1.1，一条流一个请求（控制面 `Connection: close`），orbd 以本机 API 的
        `http.Server` 服务（路由见 docs/protocol.md「orbd 本机 API」）。只有 hello `features` 含相应特性的 orbd 才接受。
      required: [t]
      properties:
        t: { type: string, enum: [fs] }
    LinkStreamPortal:
      type: object
      description: |
        由 orynd 打开（M4），每个代理连接一条。orbd 先回一行 `LinkPortalReply` + `\n`；`ok=true` 之后流上是与
        `127.0.0.1:<port>`（被拒绝时回退 `[::1]:<port>`）之间的原始字节。只有 hello `features` 含 `portal` 的 orbd 才接受。
      required: [t, port]
      properties:
        t: { type: string, enum: [portal] }
        port: { type: integer, minimum: 1, maximum: 65535 }
    LinkPortalReply:
      type: object
      description: orbd 对 `portal` 流的应答行
      required: [ok]
      properties:
        ok: { type: boolean }
        code:
          type: string
          description: '`ok=false` 时：`not_exposed`（端口不属于有 portal 的服务）、`forbidden_port`（egress 端口）、`connection_refused`、`timeout`、`failed`'
        message: { type: string }

    LinkCtlMethod:
      type: string
      description: |
        `ctl` 方法（括号内为方向与形态）：
        `hello`（orbd→orynd 通知）、`entries.cursors`（orbd→orynd 请求）、`entries.append`（orbd→orynd 请求）、
        `entries.reset` / `entries.reset_done`（orbd→orynd 通知）、`agent.status`、`agent.gap`、`setup.log`、`metrics.sample`（orbd→orynd 通知）、
        `setup.run`、`resume.run`、`agent.start`、`agent.stop`、`blob.fetch`、`fs.copyTree`、`fs.move`、`shutdown`（orynd→orbd 请求）；
        `setup.result`（orbd→orynd 通知）、`project.scripts.get` / `project.scripts.set`（orbd→orynd 请求，只作用于本 orb 所属项目）；
        `terminal.gap`（orbd→orynd 通知，M3）；
        `services.state`（orbd→orynd 通知，M4，受管服务全量快照）、`portal.configure`（orynd→orbd 请求，M4）。
      enum:
        - hello
        - entries.cursors
        - entries.append
        - entries.reset
        - entries.reset_done
        - agent.status
        - agent.gap
        - setup.log
        - metrics.sample
        - setup.run
        - resume.run
        - agent.start
        - agent.stop
        - blob.fetch
        - fs.copyTree
        - fs.move
        - shutdown
        - setup.result
        - project.scripts.get
        - project.scripts.set
        - terminal.gap
        - services.state
        - portal.configure
      x-enum-varnames:
        - MethodHello
        - MethodEntriesCursors
        - MethodEntriesAppend
        - MethodEntriesReset
        - MethodEntriesResetDone
        - MethodAgentStatus
        - MethodAgentGap
        - MethodSetupLog
        - MethodMetricsSample
        - MethodSetupRun
        - MethodResumeRun
        - MethodAgentStart
        - MethodAgentStop
        - MethodBlobFetch
        - MethodFsCopyTree
        - MethodFsMove
        - MethodShutdown
        - MethodSetupResult
        - MethodProjectScriptsGet
        - MethodProjectScriptsSet
        - MethodTerminalGap
        - MethodServicesState
        - MethodPortalConfigure
    LinkCtlRequest:
      type: object
      required: [id, method, params]
      properties:
        id:
          type: integer
          format: int64
          description: 发起方内单调递增；双方各自独立编号
        method: { $ref: '#/components/schemas/LinkCtlMethod' }
        params:
          type: object
          additionalProperties: true
          description: 见 `LinkCtl<Method>Params`
    LinkCtlResponse:
      type: object
      description: '`result` 与 `error` 二者恰有其一'
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        result:
          type: object
          additionalProperties: true
          description: 见 `LinkCtl<Method>Result`
        error: { $ref: '#/components/schemas/LinkCtlError' }
    LinkCtlError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: '`unknown_method`、`invalid_params`、`not_found`、`failed`、`timeout`、`cursor_mismatch` 等；`busy` = 对端同时在途的请求已达上限（每个 ctl 端点 32 个），本请求未执行，可稍后重试'
        message: { type: string }
    LinkCtlNotification:
      type: object
      required: [method, params]
      properties:
        method: { $ref: '#/components/schemas/LinkCtlMethod' }
        params:
          type: object
          additionalProperties: true
          description: 见 `LinkCtl<Method>Params`

    LinkCtlHelloThread:
      type: object
      required: [threadId, agentRunning]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        agentRunning: { type: boolean }
    LinkCtlHelloParams:
      type: object
      required: [orbdVersion, agentVersion, os, arch, threads]
      properties:
        orbdVersion: { type: string }
        agentVersion: { type: string }
        os: { type: string }
        arch: { type: string }
        threads:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlHelloThread' }
        features:
          type: array
          description: |
            orbd 支持的可选能力（M3 起）：`fs`（`fs` 流上的文件接口）、`git`（`/git/*`）、`attachments`（`/attachments/*`）；
            M4 起：`services`（`services.state` 通知与 `/services/*`）、`portal`（`portal` 流与 `portal.configure`）。
            缺省 = 旧版 orbd，控制面对其文件 / 改动 / 附件 / 服务 / portal 请求回 409 `orbd_outdated`。
          items: { type: string }
    LinkCtlEntriesCursorsParams:
      type: object
      required: [threadId]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlEntryCursor:
      type: object
      required: [file, offset]
      properties:
        file:
          type: string
          description: 相对会话目录的路径
        offset:
          type: integer
          format: int64
          description: 已入库的字节偏移（下一次 append 的 baseOffset）
    LinkCtlEntriesCursorsResult:
      type: object
      required: [cursors]
      properties:
        cursors:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlEntryCursor' }
    LinkCtlEntriesAppendParams:
      type: object
      description: '`lines` 为 `[baseOffset, endOffset)` 内以 `\n` 结尾的完整行（不含 `\n`）'
      required: [threadId, file, baseOffset, endOffset, lines]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        file: { type: string }
        baseOffset: { type: integer, format: int64 }
        endOffset: { type: integer, format: int64 }
        lines:
          type: array
          items: { type: string }
    LinkCtlEntriesAppendResult:
      type: object
      description: '`accepted=false` 表示 `baseOffset` 与服务端游标不符，orbd 应从 `offset` 重发'
      required: [accepted, offset]
      properties:
        accepted: { type: boolean }
        offset:
          type: integer
          format: int64
          description: 服务端当前游标
    LinkCtlEntriesResetParams:
      type: object
      description: 文件被重写（变小或 inode 变化）：之后从 0 重发
      required: [threadId, file]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        file: { type: string }
    LinkCtlEntriesResetDoneParams:
      type: object
      description: 全量重发完毕；服务端删除仍为 stale 的行
      required: [threadId, file]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        file: { type: string }
    LinkCtlAgentStatusParams:
      type: object
      required: [threadId, status]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        status:
          type: string
          enum: [starting, ready, exited]
        exitCode: { type: integer }
        stderrTail:
          type: string
          description: '`exited` 时 stderr 尾部 20 行'
        restartsLeft:
          type: integer
          description: '`exited` 时剩余自动重启次数；0 表示不再重启'
    LinkCtlAgentGapParams:
      type: object
      description: 断连期间帧缓冲溢出，实时状态不连续
      required: [threadId]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlTerminalGapParams:
      type: object
      description: |
        orbd 帧缓冲 ≥8MiB 时丢弃了该线程的 `terminal_output` 帧，缓冲回落到 ≤1MiB 后发送一次（M3）。
        控制面向该线程开启 `term.watch` 的连接发 `term.lagged`。
      required: [threadId]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlSetupLogParams:
      type: object
      required: [phase, stream, data]
      properties:
        phase:
          type: string
          enum: [omp_home, git, clone, setup, resume]
        stream:
          type: string
          enum: [stdout, stderr, system]
        data: { type: string }
    LinkCtlSetupResultParams:
      type: object
      description: 每次 setup / resume 结束（含 orb 内手动重跑）时 orbd 发送；控制面写入 `orb_setup_runs`
      required: [phase, trigger, startedAt, ok, setupRan, durationMs, hasRepoScript, hasProjectScript]
      properties:
        phase: { $ref: '#/components/schemas/SetupPhase' }
        trigger: { $ref: '#/components/schemas/SetupTrigger' }
        startedAt: { $ref: '#/components/schemas/TimestampMs' }
        ok: { type: boolean }
        setupRan: { type: boolean }
        error: { type: string }
        durationMs: { type: integer, format: int64 }
        hasRepoScript: { type: boolean }
        hasProjectScript: { type: boolean }
    LinkCtlProjectScriptsGetParams:
      type: object
      description: 无参数
    LinkCtlProjectScripts:
      type: object
      description: 本 orb 所属项目的项目脚本；`project.scripts.get` 的结果与 `project.scripts.set` 的结果
      required: [projectId, projectName]
      properties:
        projectId: { $ref: '#/components/schemas/ProjectId' }
        projectName: { type: string }
        setup: { type: string }
        resume: { type: string }
    LinkCtlProjectScriptsSetParams:
      type: object
      description: 省略的字段保持不变；空串表示清除该脚本。orb 不属于任何项目时返回错误 `no_project`；单个脚本超过 256KiB 时返回错误 `too_large`。每次成功写入记一条 orb_events（`detail.event = project_scripts_set`，带两个脚本的 SHA-256）
      properties:
        setup: { type: string }
        resume: { type: string }
    LinkCtlMetricsSampleParams:
      $ref: '#/components/schemas/OrbMetricSample'
    LinkCtlSetupRepo:
      type: object
      required: [url, shallow]
      properties:
        url: { type: string }
        branch: { type: string }
        shallow: { type: boolean }
    LinkCtlSetupScripts:
      type: object
      properties:
        setup: { type: string }
        resume: { type: string }
    LinkCtlOmpHomeFile:
      type: object
      required: [path, mode, contentB64]
      properties:
        path:
          type: string
          description: 相对 `$HOME/.omp/agent/` 的路径
        mode:
          type: integer
          description: Unix 权限位（十进制）
        contentB64: { type: string }
    LinkCtlSetupRunParams:
      type: object
      required: [workdir, gitHosts, scripts, ompHome, env]
      properties:
        workdir: { type: string }
        repo: { $ref: '#/components/schemas/LinkCtlSetupRepo' }
        gitHosts:
          type: array
          description: 为每个主机写 git `url."http://127.0.0.1:7811/git/<host>/".insteadOf "https://<host>/"`
          items: { type: string }
        scripts: { $ref: '#/components/schemas/LinkCtlSetupScripts' }
        ompHome:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlOmpHomeFile' }
        env:
          type: object
          additionalProperties: { type: string }
        gitIdentity:
          $ref: '#/components/schemas/GitIdentity'
          description: 写入 `git config --global user.name / user.email`（项目覆盖 > 所有者默认）；缺省时不改动现有配置
    LinkCtlSetupRunResult:
      type: object
      required: [ok, setupRan, durationMs]
      properties:
        ok:
          type: boolean
          description: setup 脚本失败（含超时）时为 false；orb 仍可使用，agent 照常启动以便修复脚本
        setupRan:
          type: boolean
          description: 本次是否实际执行了 setup（标记已存在则为 false）
        setupError:
          type: string
          description: setup 脚本失败原因（ok=false 时给出；完整输出见 setup.log）
        durationMs: { type: integer, format: int64 }
    LinkCtlResumeRunParams:
      description: 同 `setup.run`，但不 clone、不跑 setup
      allOf:
        - $ref: '#/components/schemas/LinkCtlSetupRunParams'
    LinkCtlResumeRunResult:
      $ref: '#/components/schemas/LinkCtlSetupRunResult'
    LinkCtlAgentStartParams:
      type: object
      required: [threadId, sessionDir, cwd, env, initFrames]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        sessionDir: { type: string }
        cwd: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        initFrames:
          type: array
          description: '`ready` 并完成 `negotiate_protocol` 后依次发送的 omp 命令帧'
          items: { $ref: '#/components/schemas/OmpFrame' }
    LinkCtlAgentStartResult:
      type: object
      required: [pid]
      properties:
        pid: { type: integer }
    LinkCtlAgentStopParams:
      type: object
      required: [threadId, graceSeconds]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        graceSeconds: { type: integer }
    LinkCtlAgentStopResult:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer }
    LinkCtlBlobFetchParams:
      type: object
      required: [sha256]
      properties:
        sha256: { $ref: '#/components/schemas/Sha256' }
    LinkCtlBlobFetchResult:
      type: object
      description: '`found=true` 时 orbd 另开一条 `blob` 流'
      required: [found]
      properties:
        found: { type: boolean }
    LinkCtlFsCopyTreeParams:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    LinkCtlFsMoveParams:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    LinkCtlOkResult:
      type: object
      description: '`fs.copyTree` / `fs.move` / `shutdown` / `portal.configure` 的结果'
      required: [ok]
      properties:
        ok: { type: boolean }
    LinkCtlShutdownParams:
      type: object
      required: [graceSeconds]
      properties:
        graceSeconds: { type: integer }
    LinkCtlServicesStateParams:
      type: object
      description: orbd 的受管服务全量快照；每次定义或状态变化、link 建立后、收到 `portal.configure` 后发送
      required: [services]
      properties:
        services:
          type: array
          items: { $ref: '#/components/schemas/OrbService' }
    LinkCtlPortalConfigureParams:
      type: object
      description: hello 之后由 orynd 下发（仅对 `features` 含 `portal` 的 orbd）；结果为 `LinkCtlOkResult`
      required: [urlTemplate]
      properties:
        urlTemplate:
          type: string
          description: 'portal 地址模板，如 `https://t-{code}-p{port}.orb.example.com/`；空串 = 控制面未配置 `portal_domain`'
        primaryThreadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 文件服务与未指定线程的服务归属的线程（本 orb 最早创建的线程）
