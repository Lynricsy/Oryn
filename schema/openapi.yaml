    LinkCtlRequest:
      type: object
      required: [id, method, params]
      properties:
        id:
          type: integer
          format: int64
          description: 发起方内单调递增；双方各自独立编号
        method: { $ref: '#/components/schemas/LinkCtlMethod' }
        params:
          type: object
          additionalProperties: true
          description: 见 `LinkCtl<Method>Params`
    LinkCtlResponse:
      type: object
      description: '`result` 与 `error` 二者恰有其一'
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        result:
          type: object
          additionalProperties: true
          description: 见 `LinkCtl<Method>Result`
        error: { $ref: '#/components/schemas/LinkCtlError' }
    LinkCtlError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            `unknown_method`、`invalid_params`、`not_found`、`failed`、`timeout`、`cursor_mismatch` 等；`busy` = 对端同时在途的请求已达上限（每个 ctl 端点 32 个），本请求未执行，可稍后重试。
            M9 orb 内方法另有：`forbidden`（非亲属线程、不属于本 orb 的调用方）、`rate_limited`、`invalid_schedule`、`thread_archived`、`schedule_name_taken`。
            M11b runner 形态的 orbd 另有：`not_supported`（runner 不处理的方法：`setup.run`、`resume.run`、`project.scripts.*`、`snapshot.prepare`、`shutdown`；
            以及普通 orbd 收到 `worktree.*`）、`dir_not_served`（`agent.start` 的 `cwd` 或 `worktree.add` 的 `repo` 不在声明的目录内）、
            `worktree_dirty`（`worktree.remove` 时有未提交改动，`message` 为 git 的 stderr）。
        message: { type: string }
    LinkCtlNotification:
      type: object
      required: [method, params]
      properties:
        method: { $ref: '#/components/schemas/LinkCtlMethod' }
        params:
          type: object
          additionalProperties: true
          description: 见 `LinkCtl<Method>Params`

    LinkCtlHelloThread:
      type: object
      required: [threadId, agentRunning]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        agentRunning: { type: boolean }
    LinkCtlHelloParams:
      type: object
      required: [orbdVersion, agentVersion, os, arch, threads]
      properties:
        orbdVersion: { type: string }
        agentVersion: { type: string }
        os: { type: string }
        arch: { type: string }
        threads:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlHelloThread' }
        runner:
          allOf:
            - $ref: '#/components/schemas/LinkRunnerInfo'
          description: 只由 runner 形态的 orbd 上报（M11b）
        features:
          type: array
          description: |
            orbd 支持的可选能力（M3 起）：`fs`（`fs` 流上的文件接口）、`git`（`/git/*`）、`attachments`（`/attachments/*`）；
            M4 起：`services`（`services.state` 通知与 `/services/*`）、`portal`（`portal` 流与 `portal.configure`）；M5 起：`sync`（`/sync/*`）；
            M8 起：`desktop`（`desk` 流、`desktop.state` 通知、`profile.mode` 请求与 `/desktop/*`）。
            M9 起：`threads`（orb 内线程与定时方法 `thread.*` / `schedule.*`，普通 orbd 上报）；
            `coordinator`（认识 `agent.start` 的 `profile = coordinator`，**只由** `orynd coordinator-host` 上报，且此时特性表恰为 `["coordinator", "omphome-apply", "library"]`）。
            M11a 起：`repo-update`（认识 `setup.run` 的 `repo.update`）、`docker`（orb 内 dockerd 由 orbd 监督，认识 `snapshot.prepare` 的停容器语义）、
            `setup-defer-resume`（认识 `setup.run` 的 `deferResume`，结果带 `setupChanged`）。
            M11b 起：`terminal`（终端面板可用；runner 只在带 `--terminal` 时上报，未上报时控制面不发 `terminal_configure`）、
            `metrics`（上报 `metrics.sample`）。runner 形态上报 `fs`、`attachments`、`metrics`，`git` 在 PATH 里时加 `git`。
            M13 起：`omphome-apply`（认识 `omphome.apply`；普通 orbd 与协调宿主上报，runner 不上报）、
            `library`（认识 `library.sync`、`library.fetch` 与同步用的 `library` 流；只由协调宿主上报，此时特性表恰为 `["coordinator", "omphome-apply", "library"]`）。
            M16 起：`memory`（认识 `agent.start` 的 `memory`，并为记忆开出站通道 `/memory/`；普通 orbd 与 runner 上报，协调宿主不上报）。
            M18 起：`ssh`（orbd 监听本机 SSH 网关端口并认识 `setup.run` / `omphome.apply` 的 `ssh`；runner 与协调宿主不上报）。
            M19 起：`computer`（认识 `computer.*`：惰性拉起不调模型的 omp 当工具执行器；只由普通 orbd 上报）。
            M25 起：`desktop-apps`（`desktop.state` 带 `apps` / `windows`，本机路由 `/desktop/apps/*` 与 `/desktop/windows/*`；只在有 `desktop` 时上报）。
            缺省 = 旧版 orbd，控制面对其文件 / 改动 / 附件 / 服务 / portal / sync / 桌面请求回 409 `orbd_outdated`。
          items: { type: string }
    LinkRunnerInfo:
      type: object
      description: runner 形态 orbd 的 hello 附加信息（M11b）
      required: [hostname, dirs]
      properties:
        hostname: { type: string }
        dirs:
          type: array
          items: { $ref: '#/components/schemas/RunnerDir' }
    LinkCtlEntriesCursorsParams:
      type: object
      required: [threadId]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlEntryCursor:
      type: object
      required: [file, offset]
      properties:
        file:
          type: string
          description: 相对会话目录的路径
        offset:
          type: integer
          format: int64
          description: 已入库的字节偏移（下一次 append 的 baseOffset）
    LinkCtlEntriesCursorsResult:
      type: object
      required: [cursors]
      properties:
        cursors:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlEntryCursor' }
    LinkCtlEntriesAppendParams:
      type: object
      description: '`lines` 为 `[baseOffset, endOffset)` 内以 `\n` 结尾的完整行（不含 `\n`）'
      required: [threadId, file, baseOffset, endOffset, lines]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        file: { type: string }
        baseOffset: { type: integer, format: int64 }
        endOffset: { type: integer, format: int64 }
        lines:
          type: array
          items: { type: string }
    LinkCtlEntriesAppendResult:
      type: object
      description: '`accepted=false` 表示 `baseOffset` 与服务端游标不符，orbd 应从 `offset` 重发'
      required: [accepted, offset]
      properties:
        accepted: { type: boolean }
        offset:
          type: integer
          format: int64
          description: 服务端当前游标
    LinkCtlEntriesResetParams:
      type: object
      description: 文件被重写（变小或 inode 变化）：之后从 0 重发
      required: [threadId, file]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        file: { type: string }
    LinkCtlEntriesResetDoneParams:
      type: object
      description: 全量重发完毕；服务端删除仍为 stale 的行
      required: [threadId, file]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        file: { type: string }
    LinkCtlAgentStatusParams:
      type: object
      required: [threadId, status]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        status:
          type: string
          enum: [starting, ready, exited]
        exitCode: { type: integer }
        stderrTail:
          type: string
          description: '`exited` 时 stderr 尾部 20 行'
        restartsLeft:
          type: integer
          description: '`exited` 时剩余自动重启次数；0 表示不再重启'
    LinkCtlAgentGapParams:
      type: object
      description: 断连期间帧缓冲溢出，实时状态不连续
      required: [threadId]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlTerminalGapParams:
      type: object
      description: |
        orbd 帧缓冲 ≥8MiB 时丢弃了该线程的 `terminal_output` 帧，缓冲回落到 ≤1MiB 后发送一次（M3）。
        控制面向该线程开启 `term.watch` 的连接发 `term.lagged`。
      required: [threadId]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlSetupLogParams:
      type: object
      required: [phase, stream, data]
      properties:
        phase:
          type: string
          enum: [omp_home, git, clone, setup, resume]
        stream:
          type: string
          enum: [stdout, stderr, system]
        data: { type: string }
    LinkCtlSetupResultParams:
      type: object
      description: 每次 setup / resume 结束（含 orb 内手动重跑）时 orbd 发送；控制面写入 `orb_setup_runs`
      required: [phase, trigger, startedAt, ok, setupRan, durationMs, hasRepoScript, hasProjectScript]
      properties:
        phase: { $ref: '#/components/schemas/SetupPhase' }
        trigger: { $ref: '#/components/schemas/SetupTrigger' }
        startedAt: { $ref: '#/components/schemas/TimestampMs' }
        ok: { type: boolean }
        setupRan: { type: boolean }
        error: { type: string }
        durationMs: { type: integer, format: int64 }
        hasRepoScript: { type: boolean }
        hasProjectScript: { type: boolean }
        prepared:
          type: boolean
          description: 本次开始时完成标记已存在（M11a）
        baseCommit:
          type: string
          description: 结束时检出的提交（40 位十六进制，M11a）；无仓库省略
        repoUpdated:
          type: boolean
          description: '`repo.update` 让检出前进到了新提交（M11a）'
        setupChanged:
          type: boolean
          description: '本次 `repo.update` 前后 `.oryn/setup`、`.agents/setup`、`.oryn/services.yaml` 任一有变化，或基线不是快进（走了 reset），即为 true（M11a 审查修复）'
    LinkCtlProjectScriptsGetParams:
      type: object
      description: 无参数
    LinkCtlProjectScripts:
      type: object
      description: 本 orb 所属项目的项目脚本；`project.scripts.get` 的结果与 `project.scripts.set` 的结果
      required: [projectId, projectName]
      properties:
        projectId: { $ref: '#/components/schemas/ProjectId' }
        projectName: { type: string }
        setup: { type: string }
        resume: { type: string }
    LinkCtlProjectScriptsSetParams:
      type: object
      description: 省略的字段保持不变；空串表示清除该脚本。orb 不属于任何项目时返回错误 `no_project`；单个脚本超过 256KiB 时返回错误 `too_large`。每次成功写入记一条 orb_events（`detail.event = project_scripts_set`，带两个脚本的 SHA-256）
      properties:
        setup: { type: string }
        resume: { type: string }
    LinkCtlMetricsSampleParams:
      $ref: '#/components/schemas/OrbMetricSample'
    LinkCtlSetupRepo:
      type: object
      required: [url, shallow]
      properties:
        url: { type: string }
        branch: { type: string }
        shallow: { type: boolean }
        update:
          type: boolean
          description: |
            M11a：工作目录已有检出时 `git fetch` 基线并移动到最新；HEAD 变化则删掉完成标记、重跑 setup 脚本。fetch 失败只记日志、沿用现有检出。
            只用于 agent 从未运行过的 orb（来自项目快照的新 orb，或刚被认领的预热池 orb）；只在 hello 的 `features` 含 `repo-update` 时置位。
        previousUrls:
          type: array
          description: 仓库改名 / 转移前的地址（M14）；工作目录的 origin 等于其中之一时改到 `url`
          items: { type: string }
    LinkCtlSetupScripts:
      type: object
      properties:
        setup: { type: string }
        resume: { type: string }
    LinkCtlOmpHomeFile:
      type: object
      required: [path, mode, contentB64]
      properties:
        path:
          type: string
          description: 相对所在配置根：`ompHome` 为 `$HOME/.omp/agent/`，`projectConfig.files` 为 `$HOME/.oryn/project-config/.omp/`
        mode:
          type: integer
          description: Unix 权限位（十进制）
        contentB64: { type: string }
    LinkCtlOmpHomeApplyParams:
      type: object
      description: |
        M13：只写 omp 文本配置，与 `setup.run` 的第 1 步相同：`ompHome` 写进 `$HOME/.omp/agent/` 并清理上次下发、这次已不在清单里的文件；
        带 `projectConfig` 时把项目层镜像到 `$HOME/.oryn/project-config/.omp/`，缺省时不动项目层。不碰 git、不跑脚本。
        与 `setup.run` / `resume.run` 写配置的那一步按到达顺序、按层生效：先到达的 setup 若在本请求之后才走到写配置，
        就跳过本请求已写过的那一层，不会用旧内容覆盖新内容。
      required: [ompHome]
      properties:
        ompHome:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlOmpHomeFile' }
        projectConfig:
          $ref: '#/components/schemas/LinkCtlProjectConfig'
          description: 缺省 = 不动项目层（与 `setup.run` 不同：那里缺省表示删除项目层）
        ssh:
          allOf:
            - $ref: '#/components/schemas/LinkCtlSshConfig'
          description: M18：缺省 = 不动 orb 内的 SSH 配置
    LinkCtlProjectConfig:
      type: object
      description: 项目级 omp 配置（M12.2）。出现即表示 orb 属于某个项目：orbd 把 `$HOME/.oryn/project-config/.omp/` 镜像成 `files`，目录里不在其中的文件一律删除
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlOmpHomeFile' }
    LinkCtlSetupGh:
      type: object
      description: orb 内 `gh` 的登录信息（M14）；令牌由出站代理注入，orb 内只有占位值
      required: [login]
      properties:
        login: { type: string }
        uploads:
          type: boolean
          description: M15：orbd 的 gh 代理同时把 `uploads.github.com` 转到出站代理
    LinkCtlSetupRunParams:
      type: object
      required: [workdir, gitHosts, scripts, ompHome, env]
      properties:
        workdir: { type: string }
        repo: { $ref: '#/components/schemas/LinkCtlSetupRepo' }
        gitHosts:
          type: array
          description: 为每个主机写 git `url."http://127.0.0.1:7811/git/<host>/".insteadOf "https://<host>/"`
          items: { type: string }
        scripts: { $ref: '#/components/schemas/LinkCtlSetupScripts' }
        ompHome:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlOmpHomeFile' }
        env:
          type: object
          additionalProperties: { type: string }
        projectConfig:
          $ref: '#/components/schemas/LinkCtlProjectConfig'
          description: 缺省 = orb 不属于项目（或协调宿主）：orbd 删除 `$HOME/.oryn/project-config`
        gitIdentity:
          $ref: '#/components/schemas/GitIdentity'
          description: 写入 `git config --global user.name / user.email`（项目覆盖 > 所有者默认）；缺省时不改动现有配置
        gh:
          allOf:
            - $ref: '#/components/schemas/LinkCtlSetupGh'
          description: 缺省 = 这台 orb 不下发 GitHub 凭据（runner、协调宿主、GitHub 集成未启用，或线程身份槽位未连接 / 待重新授权；与有没有项目、项目是否绑定无关）：orbd 删除 `$HOME/.oryn/gh`
        deferResume:
          type: boolean
          description: |
            M11a 审查修复：true = 只跑 setup（clone / `repo.update` / setup 脚本），**不**跑 resume 脚本、**不**启动受管服务；
            控制面随后单独调 `resume.run`。只在 hello 的 `features` 含 `setup-defer-resume` 时置位；`resume.run` 忽略此字段。
        ssh:
          allOf:
            - $ref: '#/components/schemas/LinkCtlSshConfig'
          description: M18：缺省 = 不动 orb 内的 SSH 配置
    LinkCtlSshConfig:
      type: object
      description: |
        M18：orb 内的 SSH 主机。orbd 把每台主机写成 `~/.omp/agent/ssh.json` 里的 `<名>@127.0.0.1:<网关端口>`，
        并重写 `~/.oryn/ssh/config`、`~/.ssh/config` 的 `Include` 行与 `~/.ssh/known_hosts` 的网关条目。
      required: [hostKey, hosts]
      properties:
        hostKey:
          type: string
          description: 网关主机公钥（authorized_keys 一行，无注释）
        hosts:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlSshHost' }
    LinkCtlSshHost:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description:
          type: string
          description: '`<用户>@<地址>:<端口>`，再接描述与标签'
        compat: { type: boolean }
    LinkCtlBoxCallParams:
      type: object
      description: M23（orbd→orynd）：orb 内 `oryn boxes …` 的调用。控制面校验调用方线程属于本 orb、`kind = work`、未归档，且 orb 不是全自动入口建立的。
      required: [threadId, op, params]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        op:
          type: string
          description: 操作名（`list`、`deploy.prepare`、`deploy.commit`、`exec` 等）
        params:
          type: object
          additionalProperties: true
    LinkCtlBoxCallResult:
      type: object
      required: [result]
      properties:
        result:
          type: object
          description: 每个 op 的结果都是对象；列表包一层，无返回值为 `{}`
          additionalProperties: true
    LinkCtlSshCallParams:
      type: object
      description: M18（orbd→orynd）：orb 内 agent 的 SSH 工具调用。控制面校验调用方线程属于本 orb、`kind = work`、未归档。
      required: [threadId, tool, params]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        tool:
          type: string
          description: 工具名（`ssh_exec_many`）
        params:
          type: object
          additionalProperties: true
    LinkCtlSshCallResult:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: 给 agent 的文本结果
        details:
          type: object
          additionalProperties: true
    LinkCtlGithubCallParams:
      type: object
      description: M15（orbd→orynd）：orb 内 agent 的 GitHub 工具调用。控制面校验调用方线程属于本 orb、`kind = work`、未归档。
      required: [threadId, tool, params]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        tool:
          type: string
          description: 工具名（`github_classify_issue`、`github_task_state`、`github_autoclose`、`github_release_status`、`github_abort_task`）
        params:
          type: object
          additionalProperties: true
    LinkCtlGithubCallResult:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: 给 agent 的文本结果
        details:
          type: object
          additionalProperties: true
    LinkCtlGithubPrepareReportParams:
      type: object
      description: M15（orbd→orynd）：`github_prepare` 通过后上报，控制面据此在出站代理放行该 SHA
      required: [threadId, sha, level, skipped, gatesHash]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        sha:
          type: string
          pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
        level:
          type: string
          enum: [push, pr]
          x-enum-varnames: [GitHubPrepareLevelPush, GitHubPrepareLevelPr]
        skipped: { type: boolean }
        reason: { type: string, maxLength: 2000 }
        gatesHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 本次 prepare 所用项目门禁配置的规范化哈希（控制面 `github_gates` 答复的 `gatesHash`，原样带回）；出站门禁只认与项目当前门禁哈希相同的通过记录
    LinkCtlSetupRunResult:
      type: object
      required: [ok, setupRan, durationMs]
      properties:
        ok:
          type: boolean
          description: setup 脚本失败（含超时）时为 false；orb 仍可使用，agent 照常启动以便修复脚本
        setupRan:
          type: boolean
          description: 本次是否实际执行了 setup（标记已存在则为 false）
        setupError:
          type: string
          description: 'setup 失败原因：setup 脚本失败，或 Git LFS 对象没能取下（`git lfs pull: …`）；ok=false 时给出；完整输出见 setup.log'
        durationMs: { type: integer, format: int64 }
        prepared:
          type: boolean
          description: 本次开始时完成标记已存在（M11a）
        baseCommit:
          type: string
          description: 结束时检出的提交（40 位十六进制，M11a）；无仓库省略
        repoUpdated:
          type: boolean
          description: '`repo.update` 让检出前进到了新提交（M11a）'
        setupChanged:
          type: boolean
          description: '本次 `repo.update` 前后 `.oryn/setup`、`.agents/setup`、`.oryn/services.yaml` 任一有变化，或基线不是快进（走了 reset），即为 true（M11a 审查修复）；为 true 时控制面不以来源快照为父发布新快照'
    LinkCtlResumeRunParams:
      description: 同 `setup.run`，但不 clone、不跑 setup
      allOf:
        - $ref: '#/components/schemas/LinkCtlSetupRunParams'
    LinkCtlResumeRunResult:
      $ref: '#/components/schemas/LinkCtlSetupRunResult'
    LinkCtlSnapshotPrepareParams:
      type: object
      description: '`snapshot.prepare` 无参数（M11a）'
    LinkCtlSnapshotPrepareResult:
      type: object
      description: '`snapshot.prepare` 的结果（M11a）：orbd 监督 dockerd 时已 `docker stop` 全部运行中的内层容器；未监督直接 `ok=true`'
      required: [ok]
      properties:
        ok: { type: boolean }
    LinkCtlWorktreeAddParams:
      type: object
      description: |
        `worktree.add`（orynd→orbd 请求，M11b，只有 runner 形态接受）：在 `repo` 旁新建 worktree 与同名分支；结果 `LinkCtlWorktreeAddResult`。
        `repo` 须在声明的目录内（否则 `dir_not_served`）且含 `.git`；`name` 须匹配 `^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$`（否则 `invalid_params`）。
        目录 = `<repo 的父目录>/<repo 名>-<name>`，目录或分支已存在则依次试 `-2`、`-3`…；git 失败 → `failed`（`message` 为 git 的 stderr）。
      required: [repo, name]
      properties:
        repo:
          type: string
          description: 原仓库目录（绝对路径）
        name: { type: string }
    LinkCtlWorktreeAddResult:
      type: object
      required: [dir, branch]
      properties:
        dir:
          type: string
          description: 新 worktree 的绝对路径
        branch: { type: string }
    LinkCtlWorktreeRemoveParams:
      type: object
      description: |
        `worktree.remove`（orynd→orbd 请求，M11b，只有 runner 形态接受）：`dir` 须是本 orbd 建过的 worktree（否则 `not_found`）；
        `git worktree remove`（不带 `--force`，有未提交改动 → `worktree_dirty`），随后 `git branch -d`（失败则 `branchKept: true`）。
      required: [dir]
      properties:
        dir: { type: string }
    LinkCtlWorktreeRemoveResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        branchKept:
          type: boolean
          description: 分支未合并、`git branch -d` 失败而保留了分支
    LinkCtlAgentStartParams:
      type: object
      required: [threadId, sessionDir, cwd, env, initFrames]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        sessionDir: { type: string }
        cwd:
          type: string
          description: runner 形态（M11b）必填，且须在声明的目录或已登记的 worktree 之内（否则 `dir_not_served`）；`sessionDir` 须在 `$HOME/.oryn/threads/` 之下
        env:
          type: object
          additionalProperties: { type: string }
        initFrames:
          type: array
          description: '`ready` 并完成 `negotiate_protocol` 后依次发送的 omp 命令帧'
          items: { $ref: '#/components/schemas/OmpFrame' }
        profile:
          type: string
          description: |
            M9：`coordinator` = 协调档（无代码工具、独立 HOME 与设置覆盖层、从零构造的环境，`cwd` 由 orbd 决定）。
            **只有协调宿主接受**：普通 orbd 收到非空 `profile` → `invalid_params`；协调宿主收到其它值或省略 → `invalid_params`。
          enum: [coordinator]
          x-enum-varnames: [AgentProfileCoordinator]
        systemPrompt:
          type: string
          description: M9 协调档的系统提示词（以字面量传给 omp `--system-prompt`，必须含换行，否则 `invalid_params`）；只有协调宿主接受
        web:
          type: boolean
          description: |
            M19：协调档是否打开第一层（内置 `web_search` 与 `generate_image`、`read` 读 URL、环境带 `PI_PROXY` 走 orynd 的正向代理）。
            只给全局助手的对话；Space 协调者省略（= false），工具与环境同 M19 之前（D10）。只有协调宿主接受。
        mcpToken:
          type: string
          description: |
            M19：协调宿主 /mcp/ 路由的凭据，只在 `web` 为真时生效：orbd 以环境变量 `ORYN_MCP_TOKEN` 交给该 agent，mcp.json 的
            `X-Oryn-MCP-Token` 请求头引用它，出站代理逐个请求核对（D10：Space 协调者没有它，直接请求 /mcp/ 一律 403）。只有协调宿主接受。
        memory: { $ref: '#/components/schemas/LinkCtlAgentMemory' }
        # M21：projectId / projectConfig 只对 runner 线程给出（同时出现）：runner 一台机器可同时跑多个项目的线程，项目层按线程
        # 随 agent.start 交付（原样不经变换，与 orb 相同；线程不属于项目或项目没有项目层时省略）。orb 线程不带（orb 的项目层经
        # setup.run / omphome.apply 下发）。
        projectId: { $ref: '#/components/schemas/ProjectId' }
        projectConfig: { $ref: '#/components/schemas/LinkCtlProjectConfig' }
    LinkCtlAgentStartResult:
      type: object
      required: [pid]
      properties:
        pid: { type: integer }
        sshPublicKey:
          type: string
          description: |
            M21：只有 runner 且 SSH 网关端口在监听时给出——orbd 为该线程的监督器生成的 ed25519 公钥（OpenSSH authorized_keys
            单行）。私钥只在 runner 本机（`$HOME/.oryn/threads/<线程>/ssh/id_ed25519`，agent 环境 `ORYN_SSH_KEY`），随监督器
            生灭：已有活动监督器时幂等返回同一把公钥。orynd 据此登记「公钥 → 线程」，SSH 网关对 runner 的 `ssh` 流按它认出线程。
    LinkCtlAgentStopParams:
      type: object
      required: [threadId, graceSeconds]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        graceSeconds: { type: integer }
    LinkCtlAgentStopResult:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer }
    LinkCtlBlobFetchParams:
      type: object
      required: [sha256]
      properties:
        sha256: { $ref: '#/components/schemas/Sha256' }
    LinkCtlBlobFetchResult:
      type: object
      description: '`found=true` 时 orbd 另开一条 `blob` 流'
      required: [found]
      properties:
        found: { type: boolean }
    LinkCtlLibrarySyncFile:
      type: object
      required: [path, size, sha256]
      properties:
        path:
          type: string
          description: 沙箱路径：共享文件 `~/library/shared/<fileId>/<name>`，对话文件 `~/library/threads/<threadId>/<fileId>/<name>`
        size:
          type: integer
          format: int64
        sha256: { $ref: '#/components/schemas/Sha256' }
    LinkCtlLibrarySyncParams:
      type: object
      description: |
        M13（orynd→协调宿主）：文件库在协调宿主沙箱里应有的全部文件。协调宿主删除 `~/library/shared/` 与 `~/library/threads/` 下
        不在清单里或内容不符的一切（含符号链接与空目录），确保 `~/library/out/` 存在，并回报还缺哪些文件；控制面随后为每个缺失文件开一条 `library` 流。
        清单里的路径必须是上述两种形态（`fileId` 为 `afl_…`，`name` 是单个路径段），否则整个请求 `invalid_params`。
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlLibrarySyncFile' }
    LinkCtlLibrarySyncResult:
      type: object
      required: [missing]
      properties:
        missing:
          type: array
          description: 清单中协调宿主上缺失或内容不符（已删除）的路径
          items: { type: string }
    LinkCtlLibraryFetchParams:
      type: object
      description: |
        M13（orynd→orbd）：取回一个文件的字节。orbd 校验通过后另开一条 `library` 流（流头 `id` 回带本请求的 `id`）发送原始字节，再应答。
        协调宿主只服务 `~/library/out/` 下的普通文件：`path` 可写成 `~/…`、绝对路径或相对 `~/library/out/` 的路径，含 `..` 段、解析符号链接后
        越出 `~/library/out/` 或不是普通文件一律 `invalid_params` / `not_found`。普通 orbd 只服务本 orb 正在经 `library.put` 存入的那个路径。
      required: [id, path]
      properties:
        id:
          type: string
          description: 控制面生成的关联 id
        path: { type: string }
    LinkCtlLibraryFetchResult:
      type: object
      required: [size]
      properties:
        size:
          type: integer
          format: int64
          description: '`library` 流上随后的字节数'
    LinkCtlLibraryPutParams:
      type: object
      description: |
        M13（orbd→orynd，由 orb 内 `oryn library put <文件>` 经 `orbd.sock` 转来）：把 orb 内的一个文件存进全局助手文件库，
        `scope = shared`、`source = orb`、`sourceThreadId` = 调用方线程；结果 `AssistantFile`。控制面先校验调用方
        （属于本 orb、`kind = work`、未归档，否则 `forbidden`），再对同一 orb 发 `library.fetch{path}` 取回字节。
      required: [threadId, path]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        path:
          type: string
          description: orb 内文件的绝对路径
        name:
          type: string
          description: 库内文件名；缺省取路径的最后一段
    LinkCtlArtifactCallParams:
      type: object
      description: |
        M14（orbd→orynd，由 orb / Runner 内 agent 的 artifact 工具经 `orbd.sock` / `runner.sock` 转来）：执行一个 artifact 操作。
        控制面先校验调用方（属于本 orb、`kind = work`、未归档，否则 `forbidden`）；`params.files[*].source` 是 orb 内的绝对路径，
        控制面在本次请求里经 `library.fetch` 取回字节（orbd 转发期间把这些路径登记为可取回）。
      required: [threadId, op, params]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        op:
          type: string
          description: 操作名（`create_artifact`、`read_artifact`、`update_artifact` 等，与 agent 工具同名）
        params:
          type: object
          additionalProperties: true
          description: 操作参数（camelCase，与 agent 工具同形）
    LinkCtlArtifactCallResult:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: 给 agent 的文本结果
        details:
          type: object
          additionalProperties: true
          description: 结构化结果（转录卡片用）
        image:
          type: object
          required: [mimeType, data]
          properties:
            mimeType: { type: string }
            data:
              type: string
              description: base64
    LinkCtlComputerStartParams:
      type: object
      description: M19（orynd→orbd）：确保工具执行器在跑，返回所列工具的定义（取不到的名字跳过）
      required: [names]
      properties:
        names:
          type: array
          items: { type: string }
    LinkCtlComputerStartResult:
      type: object
      required: [tools, agentVersion]
      properties:
        tools:
          type: array
          description: 工具定义（`{name, description, parameters}`，与宿主工具定义同形）
          items: { $ref: '#/components/schemas/OmpFrame' }
        agentVersion:
          type: string
          description: 执行器 omp 的版本
    LinkCtlComputerCallParams:
      type: object
      description: M19（orynd→orbd）：在工具执行器里直接执行一个内置工具；到时发取消并回错误 `timeout`
      required: [callId, tool, args, timeoutSec]
      properties:
        callId:
          type: string
          description: 调用 id（流式通知与取消按它配对）
        tool: { type: string }
        args:
          type: object
          additionalProperties: true
        timeoutSec:
          type: integer
          minimum: 1
          maximum: 1800
    LinkCtlComputerCallResult:
      type: object
      required: [result]
      properties:
        result:
          type: object
          additionalProperties: true
          description: 工具结果 `{content, details?, isError?}`（content 可含 image 块）
    LinkCtlComputerCancelParams:
      type: object
      required: [callId]
      properties:
        callId: { type: string }
    LinkCtlComputerUpdateParams:
      type: object
      description: M19（orbd→orynd 通知）：在途工具的流式部分结果
      required: [callId, partialResult]
      properties:
        callId: { type: string }
        partialResult:
          type: object
          additionalProperties: true
    LinkCtlFsCopyTreeParams:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    LinkCtlFsMoveParams:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    LinkCtlOkResult:
      type: object
      description: '`fs.copyTree` / `fs.move` / `shutdown` / `portal.configure` 的结果'
      required: [ok]
      properties:
        ok: { type: boolean }
    LinkCtlShutdownParams:
      type: object
      required: [graceSeconds]
      properties:
        graceSeconds: { type: integer }
    LinkCtlServicesStateParams:
      type: object
      description: orbd 的受管服务全量快照；每次定义或状态变化、link 建立后、收到 `portal.configure` 后发送
      required: [services]
      properties:
        services:
          type: array
          items: { $ref: '#/components/schemas/OrbService' }
    LinkCtlPortalConfigureParams:
      type: object
      description: hello 之后由 orynd 下发（仅对 `features` 含 `portal` 的 orbd）；结果为 `LinkCtlOkResult`
      required: [urlTemplate]
      properties:
        urlTemplate:
          type: string
          description: 'portal 地址模板，如 `https://t-{code}-p{port}.orb.example.com/`；空串 = 控制面未配置 `portal_domain`'
        primaryThreadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 文件服务与未指定线程的服务归属的线程（本 orb 最早创建的线程）
    LinkCtlDesktopStateParams:
      type: object
      description: |
        orbd→orynd 通知（M8）：桌面全量状态。发送时机：`displayReady`、`browser`、标记里的 `profileId` / `profileMode`、`dirty`、`control`、
        `apps`（M25）任一变化立即发送；只有 `windows`（M25）变化时合并发送，至少间隔 500ms；以及 link 建立后（脏标记 + 单发送者，
        断连时丢弃、重连必补发）。控制面写入 `orb_desktops` 镜像并经 WS `orb` 消息推送。
      required: [displayReady, browser, dirty]
      properties:
        displayReady: { type: boolean }
        browser: { $ref: '#/components/schemas/OrbBrowserStatus' }
        profileId:
          type: string
          description: orbd 本地标记里的 Profile（`bpf_…`）；空串或省略 = 没有
        profileMode:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileAccess'
          description: 标记里的使用方式；没有 Profile 时省略
        readonlyReason:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileReadonlyReason'
          description: '`profileMode=readonly` 时的原因'
        readonlyBy:
          type: string
          deprecated: true
          description: 已废弃：控制面不再把接管方信息发给 orbd（防跨线程信息外泄），恒为空；界面从控制面库里的 `orb_desktops.readonly_by*` 取
        dirty:
          type: boolean
          description: 自上次装载或关闭式导出以来浏览器启动过（有东西可存）；只读时恒为 false
        control:
          allOf:
            - $ref: '#/components/schemas/OrbDesktopControl'
          description: 桌面控制状态（orbd 权威，见 docs/protocol.md「桌面控制状态」）；旧 orbd 省略
        apps:
          type: array
          maxItems: 16
          description: 桌面应用清单与运行状态（M25，按任务栏顺序）；旧 orbd 省略
          items: { $ref: '#/components/schemas/OrbDesktopApp' }
        windows:
          type: array
          maxItems: 32
          description: 顶层窗口（M25，按 `_NET_CLIENT_LIST` 顺序）；旧 orbd 省略
          items: { $ref: '#/components/schemas/OrbDesktopWindow' }
    LinkCtlProfileModeParams:
      type: object
      description: |
        orynd→orbd 请求（M8；仅对 `features` 含 `desktop` 的 orbd；结果 `LinkCtlOkResult`，10s，失败只记日志）。
        目前只在接管时发给原持有者：`{profileId, mode: readonly, reason: taken_over}`；不带接管方的任何信息（orb 内 agent 可读标记文件）。
        orbd 只在标记的 `profileId` 与之相同时生效：改写标记的使用方式、`dirty=false`，浏览器照常运行、标签页不动，
        此后 `/desktop/profile/export` 回 409 `profile_readonly`（跳过一切保存）；标记不符 → 错误 `profile_mismatch`。
        `mode=exclusive` → 错误 `invalid_params`（独占只能经 `PUT /desktop/profile` 重新装载取得）。
        这条请求丢失无害：控制面按围栏代数丢弃迟到的保存（记 `profile.save_fenced`），且下次同步的 `PUT /desktop/profile` 带 `mode`。
        迟到的旧请求把已重新取得独占的 orb 误降为只读时，控制面在收到其 `desktop.state` 后以库为准纠正（`PUT /desktop/profile?keep=1&mode=exclusive`）；
        纠正生效前的冻结保存会被跳过（数据留在本地，纠正后可再保存）。彻底消除需给本请求加租约代数，暂未做。
      required: [profileId, mode, reason]
      properties:
        profileId: { $ref: '#/components/schemas/BrowserProfileId' }
        mode: { $ref: '#/components/schemas/BrowserProfileAccess' }
        reason: { $ref: '#/components/schemas/BrowserProfileReadonlyReason' }
        by:
          type: string
          deprecated: true
          description: 已废弃，控制面不再发送
        byThreadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          deprecated: true
          description: 已废弃，控制面不再发送
    LinkCtlThreadCreateParams:
      type: object
      description: |
        orbd→orynd 请求（M9，`features` 含 `threads` 的 orbd；由 orb 内 `oryn thread new` 经 `orbd.sock` 转来）。
        在调用方线程的项目（与 Space）里新建一个子线程（`parentThreadId` = 调用方），新 orb；结果 `LinkCtlThreadInfo`。
        调用方须属于本 orb、`kind = work`、未归档，否则 `forbidden`；超出子线程数 / 深度 / 全库速率 → `rate_limited`。
      required: [threadId, prompt]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        prompt: { type: string }
        title: { type: string }
        type:
          type: string
          description: orb 类型名；缺省取项目默认
    LinkCtlThreadInfo:
      type: object
      description: '`thread.create` / `thread.get` 的结果'
      required: [id, title, state, settled, url]
      properties:
        id: { $ref: '#/components/schemas/ThreadId' }
        title: { type: string }
        state: { $ref: '#/components/schemas/ThreadState' }
        settled:
          type: boolean
          description: '`state` ∈ {`idle`, `awaiting_input`, `error`}'
        lastAssistantText:
          type: string
          maxLength: 8000
          description: 最后一条 assistant 消息的文本（截断到 8000 字符）
        url:
          type: string
          description: 线程在 Web 上的地址（`<public_url>/t/<id>`）
    LinkCtlThreadSendParams:
      type: object
      description: |
        orbd→orynd 请求（M9）：以自动化身份向 `target` 追加一条消息（正文前加来源头行）；结果 `LinkCtlOkResult`。
        `target` 须是调用方的父线程或直接子线程且 `kind = work`，否则 `forbidden`。
      required: [threadId, target, message]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        target: { $ref: '#/components/schemas/ThreadId' }
        message: { type: string }
        steer:
          type: boolean
          description: 为真且目标正在工作时作为 steer 送达；否则排在当前回合之后
    LinkCtlThreadGetParams:
      type: object
      description: orbd→orynd 请求（M9）：读取亲属线程的状态；结果 `LinkCtlThreadInfo`；亲属规则同 `thread.send`
      required: [threadId, target]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        target: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlScheduleParams:
      type: object
      description: '`schedule.get` / `schedule.delete` 的参数（M9）：只作用于调用方线程自己的线程内定时；结果分别为 `LinkCtlScheduleResult` / `LinkCtlOkResult`'
      required: [threadId]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
    LinkCtlSchedulePutParams:
      type: object
      description: |
        `schedule.put`（M9）：设置调用方线程的线程内定时（`createdBy = agent`）；结果 `LinkCtlScheduleResult`。
        `input` 只接受线程内定时的字段：带 `mode = new_thread`、`threadId`（不等于调用方）或任一 `new_thread` 专属字段 → `invalid_schedule`。
      required: [threadId, input]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        input: { $ref: '#/components/schemas/ScheduleInput' }
    LinkCtlScheduleEnableParams:
      type: object
      description: '`schedule.enable`（M9）：暂停 / 恢复调用方线程的线程内定时；结果 `LinkCtlScheduleResult`'
      required: [threadId, enabled]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        enabled: { type: boolean }
    LinkCtlScheduleResult:
      type: object
      description: '`schedule.get` / `schedule.put` / `schedule.enable` 的结果；`schedule` 省略 = 该线程没有定时'
      properties:
        schedule: { $ref: '#/components/schemas/Schedule' }
