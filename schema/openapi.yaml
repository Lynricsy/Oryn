openapi: 3.0.3
info:
  title: Oryn 协议
  version: 0.1.0
  description: |
    Oryn 的唯一协议源。覆盖：

    - 客户端 REST（`/api/v1/...`）与客户端 WebSocket（`/api/v1/ws`，消息见 `WsClientMessage` / `WsServerMessage`）；
    - provider 协议（`/provider/v1/...`，Bearer `opv_…`）；
    - orb link（`/orb/v1/link`，WebSocket + yamux；流头见 `LinkStreamHeader`，`ctl` 流消息见 `LinkCtl*`）；
    - 健康检查 `/healthz`。

    约定：

    - 时间一律为 UTC 毫秒整数（`TimestampMs`）。
    - 错误体统一为 `Error`（`{code, message}`）。
    - 网页会话 Cookie `__Host-oryn_session`；凡变更类请求（POST/PUT/PATCH/DELETE）使用 Cookie 鉴权时必须带头 `X-Oryn-CSRF: 1`，
      使用设备令牌（`Authorization: Bearer odt_…`）时无需该头。
    - 路径参数中的 `/` 须编码为 `%2F`（`agent-config/files/{path}`、`secrets/{name}`）。
    - omp RPC 的命令与帧对控制面不透明（`OmpFrame`），其权威类型在 agent 仓库（`web/src/omp/rpc-types.d.ts`）。
  license:
    name: Proprietary
    url: https://github.com/Lynricsy/Oryn
servers:
  - url: http://127.0.0.1:7600
    description: 本机控制面（生产环境位于反代之后）
security:
  - cookieAuth: []
  - deviceBearer: []
tags:
  - name: meta
    description: 健康检查
  - name: auth
    description: Passkey 初始化、登录、恢复码
  - name: devices
    description: 设备配对与吊销
  - name: projects
    description: 项目
  - name: providers
    description: orb provider 管理（客户端侧）
  - name: threads
    description: 线程
  - name: orbs
    description: orb
  - name: blobs
    description: 内容寻址的二进制对象
  - name: attachments
    description: 消息附件（存控制面、随线程保存，投递到 orb 的仓库之外）
  - name: secrets
    description: 密钥库（只返回元数据）
  - name: agent-config
    description: omp 文本配置（omp-home）
  - name: settings
    description: 所有者级设置（如 orb 内的 git 提交身份）
  - name: stats
    description: 统计
  - name: realtime
    description: 客户端实时通道
  - name: provider-protocol
    description: provider → 控制面（C1）
  - name: websocket
    description: WebSocket 升级端点（不进入 strict server，由手写处理器服务）
  - name: shares
    description: 线程公开分享与文件发布（M5）
  - name: notifications
    description: 通知、通知渠道与推送订阅（M5）
  - name: public
    description: '匿名只读（免鉴权；响应一律带 `X-Robots-Tag: noindex, nofollow` 与 `Cache-Control: no-store`）'
  - name: desktop
    description: Desktop 面板与浏览器 Profile（M8）
  - name: spaces
    description: Space 与全局助手对话（M9）
  - name: schedules
    description: 定时（M9；线程内定时与「每次新建线程」定时）
  - name: automation
    description: 协调宿主状态与自动化操作记录（M9）

paths:
  /healthz:
    get:
      tags: [meta]
      operationId: getHealthz
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- auth
  /api/v1/auth/setup/begin:
    post:
      tags: [auth]
      operationId: authSetupBegin
      summary: 开始注册 Passkey
      description: |
        首次初始化：请求体带 `ost_` 初始化令牌。
        恢复流程：`auth/recovery` 成功后持有的一次性会话 Cookie 也可调用本端点（此时 `token` 省略），用于重新注册 Passkey。
      security:
        - {}
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthSetupBeginRequest' }
      responses:
        '200':
          description: WebAuthn 注册选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnCeremony' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/setup/finish:
    post:
      tags: [auth]
      operationId: authSetupFinish
      summary: 完成注册 Passkey
      description: 成功后建立网页会话（Set-Cookie `__Host-oryn_session`）。首次初始化时返回 10 个恢复码（仅此一次）。
      security:
        - {}
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthSetupFinishRequest' }
      responses:
        '200':
          description: 注册成功
          headers:
            Set-Cookie:
              description: '`__Host-oryn_session=…; Path=/; HttpOnly; Secure; SameSite=Lax`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSetupFinishResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/login/begin:
    post:
      tags: [auth]
      operationId: authLoginBegin
      summary: 开始 Passkey 登录（可发现凭据）
      security: [{}]
      responses:
        '200':
          description: WebAuthn 断言选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnCeremony' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/login/finish:
    post:
      tags: [auth]
      operationId: authLoginFinish
      summary: 完成 Passkey 登录
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthLoginFinishRequest' }
      responses:
        '200':
          description: 登录成功（Set-Cookie `__Host-oryn_session`，有效期 30 天，滑动续期）
          headers:
            Set-Cookie:
              description: '`__Host-oryn_session=…; Path=/; HttpOnly; Secure; SameSite=Lax`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/recovery:
    post:
      tags: [auth]
      operationId: authRecovery
      summary: 用恢复码换取「重新注册 Passkey」的一次性会话
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRecoveryRequest' }
      responses:
        '200':
          description: 恢复码有效且已作废；Set-Cookie 为仅能调用 `auth/setup/*` 的一次性会话
          headers:
            Set-Cookie:
              description: 一次性恢复会话
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthRecoveryResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: 注销当前网页会话
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '204': { description: 已注销 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/app-session:
    post:
      tags: [auth]
      operationId: createAppSession
      summary: 桌面 / 移动 App 用设备令牌换取网页会话的一次性码（M6）
      description: |
        只接受 `kind ∈ {desktop, mobile}` 的设备令牌（Bearer `odt_…`）；其它主体（含网页会话、cli 设备）返回
        403 `app_session_unsupported`。一次性码 30 秒有效、只能兑换一次：壳把主窗口导航到
        `GET /auth/app?code=<码>&next=<站内路径>`，服务端写会话 Cookie `__Host-oryn_session` 并 302 到 `next`。
        换得的会话绑定该设备：吊销设备即删除其会话；不能批准设备配对。详见 docs/protocol.md「M6：App 会话」。
      security:
        - deviceBearer: []
      responses:
        '200':
          description: 一次性码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSessionCode' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前身份
      responses:
        '200':
          description: 当前身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- devices
  /api/v1/devices/pair/start:
    post:
      tags: [devices]
      operationId: devicePairStart
      summary: 发起设备配对（免鉴权）
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePairStartRequest' }
      responses:
        '200':
          description: 配对码；`verifier` 只给发起方
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePairStartResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/pair/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: 配对码（大小写与分隔符不敏感）
        schema: { type: string }
    get:
      tags: [devices]
      operationId: getDevicePairing
      summary: 查看待批准的配对请求（需网页会话）
      description: 批准页展示发起方信息供所有者核对；已过期或不存在返回 404，已批准返回 409。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 待批准的配对请求
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePairing' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/pair/approve:
    post:
      tags: [devices]
      operationId: devicePairApprove
      summary: 在网页上批准配对（需网页会话）
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePairApproveRequest' }
      responses:
        '200':
          description: 已批准，返回新设备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/pair/poll:
    post:
      tags: [devices]
      operationId: devicePairPoll
      summary: 发起方轮询配对结果（免鉴权，靠 verifier）
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePairPollRequest' }
      responses:
        '200':
          description: 已批准；设备令牌只返回这一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePairPollResponse' }
        '202':
          description: 尚未批准，按 `interval` 秒后重试
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: 设备列表
      responses:
        '200':
          description: 设备列表（含已吊销）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/{id}:
    parameters:
      - { $ref: '#/components/parameters/DeviceIdPath' }
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: 吊销设备（之后该令牌请求返回 401）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已吊销 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- projects
  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 项目列表
      parameters:
        - name: archived
          in: query
          description: 为 true 时只返回已归档项目；缺省只返回未归档
          schema: { type: boolean }
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [projects]
      operationId: createProject
      summary: 新建项目
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: getProject
      summary: 项目详情
      responses:
        '200':
          description: 项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: 修改项目
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPatch' }
      responses:
        '200':
          description: 修改后的项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: 删除项目（其线程保留，`projectId` 置空）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- providers
  /api/v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: provider 列表
      responses:
        '200':
          description: provider 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [providers]
      operationId: createProvider
      summary: 新建 provider（令牌只显示一次）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCreateResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/providers/{id}:
    parameters:
      - { $ref: '#/components/parameters/ProviderIdPath' }
    delete:
      tags: [providers]
      operationId: deleteProvider
      summary: 删除（停用）provider，其令牌立即失效
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- threads
  /api/v1/threads:
    get:
      tags: [threads]
      operationId: listThreads
      summary: 线程列表
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ThreadState' }
        - name: project
          in: query
          description: 项目 id；传 `none` 只返回无项目线程
          schema: { type: string }
        - name: archived
          in: query
          description: 为 true 时只返回已归档线程；缺省只返回未归档
          schema: { type: boolean }
        - name: q
          in: query
          description: 标题 / 标签的模糊搜索
          schema: { type: string }
        - name: kind
          in: query
          description: 线程种类；缺省 `work`（只列工作线程），`all` = 全部种类（M9）
          schema:
            type: string
            enum: [work, space, assistant, all]
            x-enum-varnames: [ListThreadsKindWork, ListThreadsKindSpace, ListThreadsKindAssistant, ListThreadsKindAll]
            default: work
        - name: space
          in: query
          description: 只返回属于该 Space 的线程（M9）
          schema: { $ref: '#/components/schemas/SpaceId' }
      responses:
        '200':
          description: 线程列表（按 `updatedAt` 降序）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [threads]
      operationId: createThread
      summary: 新建线程
      description: 省略 `executor.provider` / `executor.type` 时依次取项目默认、`orb_defaults`、provider 的 `defaultType`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateThreadRequest' }
      responses:
        '201':
          description: 已创建（通常处于 `provisioning`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadEnvelope' }
        '409':
          description: '`profile_in_use`：选用的浏览器 Profile 被另一台运行中的 orb 独占持有且 `profileMode` 为 `exclusive`（其它 409 为普通 `Error`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileInUseConflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [threads]
      operationId: getThread
      summary: 线程详情
      responses:
        '200':
          description: 线程
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [threads]
      operationId: updateThread
      summary: 修改线程（改名时控制面同时向 agent 发 `set_session_name`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThreadPatch' }
      responses:
        '200':
          description: 修改后的线程
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [threads]
      operationId: deleteThread
      summary: 删除线程（停止其 agent，删除条目）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/entries:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [threads]
      operationId: listThreadEntries
      summary: 分页读取已复制条目（按 `seq` 升序）
      parameters:
        - name: after
          in: query
          description: 只返回 `seq > after` 的条目
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: 条目页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/fork:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    post:
      tags: [threads]
      operationId: forkThread
      summary: fork 线程（共用 orb 或连环境分叉）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForkThreadRequest' }
      responses:
        '201':
          description: 新线程（`env:"copy"` 时处于 `provisioning`，就绪后自动接续）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/wake:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    post:
      tags: [threads]
      operationId: wakeThread
      summary: 唤醒线程所在 orb（异步）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202': { description: 已受理 }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/threads/{id}/attachments:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [attachments]
      operationId: listThreadAttachments
      summary: 线程的附件（按上传时间）
      responses:
        '200':
          description: 附件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/shares:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [shares]
      operationId: listThreadShares
      summary: 该线程未撤销的公开分享（按创建时间降序）
      responses:
        '200':
          description: 分享列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadShareList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [shares]
      operationId: createThreadShare
      summary: 创建公开分享（快照 / 实时）
      description: |
        创建前对公开面上的全部文本做密钥扫描：线程标题、分享范围（活动分支上的主会话条目经公开过滤之后的内容）、
        将要列出的附件名（见 `PublicShare.attachments`）。有命中且未给 `acknowledgeFindings: true`
        → 409 `ShareScanConflict{code:"secrets_found"}`；确认后创建并把命中数记入 `findings`。
        快照在同一事务里固化扫描过的条目集合（按分支顺序，连同每行原始内容的 SHA-256）与当时的标题：
        此后被改写或删除的行不再公开（不回落到别的分支、不出现新内容），标题也不随线程改名变化。
        每线程未撤销分享 ≤20（超出 409 `invalid`）；`mode` 非法 → 400 `invalid`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateThreadShareRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadShare' }
        '409':
          description: '`secrets_found`：扫描有命中且未确认（其它 409 为普通 `Error`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareScanConflict' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orbs
  /api/v1/orbs:
    get:
      tags: [orbs]
      operationId: listOrbs
      summary: orb 列表
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/OrbState' }
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: orb 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrb
      summary: orb 详情
      responses:
        '200':
          description: orb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [orbs]
      operationId: deleteOrb
      summary: 删除 orb（先 shutdown 再 delete；其线程保留条目，`orbId` 置空）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202':
          description: 已进入 `deleting`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/pause:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: pauseOrb
      summary: 手动冻结或停机
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrbPauseRequest' }
      responses:
        '202':
          description: 已进入 `freezing` / `stopping`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/resume:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: resumeOrb
      summary: 唤醒 orb（`frozen` / `stopped` / `failed` → `waking`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202':
          description: 已进入 `waking`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/metrics:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbMetrics
      summary: orb 资源采样（按 `step` 降采样，取窗口内均值；网络字节取窗口末值）
