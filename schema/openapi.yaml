openapi: 3.0.3
info:
  title: Oryn 协议
  version: 0.1.0
  description: |
    Oryn 的唯一协议源。覆盖：

    - 客户端 REST（`/api/v1/...`）与客户端 WebSocket（`/api/v1/ws`，消息见 `WsClientMessage` / `WsServerMessage`）；
    - provider 协议（`/provider/v1/...`，Bearer `opv_…`）；
    - orb link（`/orb/v1/link`，WebSocket + yamux；流头见 `LinkStreamHeader`，`ctl` 流消息见 `LinkCtl*`）与 `/orb/v1/whoami`（M11b，orb / runner 令牌换取 orb id）；
    - 健康检查 `/healthz`。

    约定：

    - 时间一律为 UTC 毫秒整数（`TimestampMs`）。
    - 错误体统一为 `Error`（`{code, message}`）。
    - 网页会话 Cookie `__Host-oryn_session`；凡变更类请求（POST/PUT/PATCH/DELETE）使用 Cookie 鉴权时必须带头 `X-Oryn-CSRF: 1`，
      使用设备令牌（`Authorization: Bearer odt_…`）时无需该头。
    - 路径参数中的 `/` 须编码为 `%2F`（`agent-config/files/{path}`、`projects/{id}/agent-config/files/{path}`、`secrets/{name}`）。
    - omp RPC 的命令与帧对控制面不透明（`OmpFrame`），其权威类型在 agent 仓库（`web/src/omp/rpc-types.d.ts`）。
  license:
    name: Proprietary
    url: https://github.com/Lynricsy/Oryn
servers:
  - url: http://127.0.0.1:7600
    description: 本机控制面（生产环境位于反代之后）
security:
  - cookieAuth: []
  - deviceBearer: []
tags:
  - name: meta
    description: 健康检查
  - name: auth
    description: Passkey 初始化、登录、恢复码
  - name: devices
    description: 设备配对与吊销
  - name: projects
    description: 项目
  - name: providers
    description: orb provider 管理（客户端侧）
  - name: threads
    description: 线程
  - name: orbs
    description: orb
  - name: blobs
    description: 内容寻址的二进制对象
  - name: attachments
    description: 消息附件（存控制面、随线程保存，投递到 orb 的仓库之外）
  - name: secrets
    description: 密钥库（只返回元数据）
  - name: agent-config
    description: omp 文本配置（omp-home）
  - name: settings
    description: 所有者级设置（如 orb 内的 git 提交身份）
  - name: search
    description: 对话内容全文搜索
  - name: stats
    description: 统计
  - name: realtime
    description: 客户端实时通道
  - name: provider-protocol
    description: provider → 控制面（C1）
  - name: boxes
    description: Boxes：常驻机器与应用部署（M23）
  - name: websocket
    description: WebSocket 升级端点（不进入 strict server，由手写处理器服务）
  - name: shares
    description: 线程公开分享与文件发布（M5）
  - name: notifications
    description: 通知、通知渠道与推送订阅（M5）
  - name: public
    description: '匿名只读（免鉴权；响应一律带 `X-Robots-Tag: noindex, nofollow` 与 `Cache-Control: no-store`）'
  - name: desktop
    description: Desktop 面板与浏览器 Profile（M8）
  - name: spaces
    description: Space 与全局助手对话（M9）
  - name: schedules
    description: 定时（M9；线程内定时与「每次新建线程」定时）
  - name: automation
    description: 协调宿主状态与自动化操作记录（M9）
  - name: runners
    description: runner（M11b：用户自己的机器以 `orbd run --runner` 接入，作为一台常驻的执行位置）
  - name: orb-link
    description: orb / runner → 控制面的非 WebSocket 端点（M11b；由手写处理器服务，不进入 ServerInterface）
  - name: github
    description: GitHub 集成（M14）
  - name: artifacts
    description: Artifacts（M14：agent 产出的版本化交付物——页面、画布、文档、幻灯片）
  - name: memory
    description: 内置 Hindsight 记忆（M16：同项目共享、全局候选、模型中转）
  - name: owner-memory
    description: 全局助手的主人记忆（M17：Hindsight bank `oryn-owner`，只由控制面访问）
  - name: ssh
    description: SSH 主机、钥匙与网关审计（M18）

paths:
  /healthz:
    get:
      tags: [meta]
      operationId: getHealthz
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 正常
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- auth
  /api/v1/auth/setup/begin:
    post:
      tags: [auth]
      operationId: authSetupBegin
      summary: 开始注册 Passkey
      description: |
        首次初始化：请求体带 `ost_` 初始化令牌。
        恢复流程：`auth/recovery` 成功后持有的一次性会话 Cookie 也可调用本端点（此时 `token` 省略），用于重新注册 Passkey。
      security:
        - {}
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthSetupBeginRequest' }
      responses:
        '200':
          description: WebAuthn 注册选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnCeremony' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/setup/finish:
    post:
      tags: [auth]
      operationId: authSetupFinish
      summary: 完成注册 Passkey
      description: 成功后建立网页会话（Set-Cookie `__Host-oryn_session`）。首次初始化时返回 10 个恢复码（仅此一次）。
      security:
        - {}
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthSetupFinishRequest' }
      responses:
        '200':
          description: 注册成功
          headers:
            Set-Cookie:
              description: '`__Host-oryn_session=…; Path=/; HttpOnly; Secure; SameSite=Lax`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSetupFinishResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/login/begin:
    post:
      tags: [auth]
      operationId: authLoginBegin
      summary: 开始 Passkey 登录（可发现凭据）
      security: [{}]
      responses:
        '200':
          description: WebAuthn 断言选项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebAuthnCeremony' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/login/finish:
    post:
      tags: [auth]
      operationId: authLoginFinish
      summary: 完成 Passkey 登录
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthLoginFinishRequest' }
      responses:
        '200':
          description: 登录成功（Set-Cookie `__Host-oryn_session`，有效期 30 天，滑动续期）
          headers:
            Set-Cookie:
              description: '`__Host-oryn_session=…; Path=/; HttpOnly; Secure; SameSite=Lax`'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/recovery:
    post:
      tags: [auth]
      operationId: authRecovery
      summary: 用恢复码换取「重新注册 Passkey」的一次性会话
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthRecoveryRequest' }
      responses:
        '200':
          description: 恢复码有效且已作废；Set-Cookie 为仅能调用 `auth/setup/*` 的一次性会话
          headers:
            Set-Cookie:
              description: 一次性恢复会话
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthRecoveryResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: authLogout
      summary: 注销当前网页会话
      security:
        - cookieAuth: []
          csrfHeader: []
      responses:
        '204': { description: 已注销 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/app-session:
    post:
      tags: [auth]
      operationId: createAppSession
      summary: 桌面 / 移动 App 用设备令牌换取网页会话的一次性码（M6）
      description: |
        只接受 `kind ∈ {desktop, mobile}` 的设备令牌（Bearer `odt_…`）；其它主体（含网页会话、cli 设备）返回
        403 `app_session_unsupported`。一次性码 30 秒有效、只能兑换一次：壳把主窗口导航到
        `GET /auth/app?code=<码>&next=<站内路径>`，服务端写会话 Cookie `__Host-oryn_session` 并 302 到 `next`。
        换得的会话绑定该设备：吊销设备即删除其会话；不能批准设备配对。详见 docs/protocol.md「M6：App 会话」。
      security:
        - deviceBearer: []
      responses:
        '200':
          description: 一次性码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppSessionCode' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前身份
      responses:
        '200':
          description: 当前身份
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- devices
  /api/v1/devices/pair/start:
    post:
      tags: [devices]
      operationId: devicePairStart
      summary: 发起设备配对（免鉴权）
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePairStartRequest' }
      responses:
        '200':
          description: 配对码；`verifier` 只给发起方
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePairStartResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/pair/{code}:
    parameters:
      - name: code
        in: path
        required: true
        description: 配对码（大小写与分隔符不敏感）
        schema: { type: string }
    get:
      tags: [devices]
      operationId: getDevicePairing
      summary: 查看待批准的配对请求（需网页会话）
      description: 批准页展示发起方信息供所有者核对；已过期或不存在返回 404，已批准返回 409。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: 待批准的配对请求
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePairing' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/pair/approve:
    post:
      tags: [devices]
      operationId: devicePairApprove
      summary: 在网页上批准配对（需网页会话）
      security:
        - cookieAuth: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePairApproveRequest' }
      responses:
        '200':
          description: 已批准，返回新设备
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/pair/poll:
    post:
      tags: [devices]
      operationId: devicePairPoll
      summary: 发起方轮询配对结果（免鉴权，靠 verifier）
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePairPollRequest' }
      responses:
        '200':
          description: 已批准；设备令牌只返回这一次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevicePairPollResponse' }
        '202':
          description: 尚未批准，按 `interval` 秒后重试
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: 设备列表
      responses:
        '200':
          description: 设备列表（含已吊销）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/devices/{id}:
    parameters:
      - { $ref: '#/components/parameters/DeviceIdPath' }
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: 吊销设备（之后该令牌请求返回 401）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已吊销 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- projects
  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 项目列表
      parameters:
        - name: archived
          in: query
          description: 为 true 时只返回已归档项目；缺省只返回未归档
          schema: { type: boolean }
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [projects]
      operationId: createProject
      summary: 新建项目
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: getProject
      summary: 项目详情
      responses:
        '200':
          description: 项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: 修改项目
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectPatch' }
      responses:
        '200':
          description: 修改后的项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [projects]
      operationId: deleteProject
      summary: 删除项目（其线程保留，`projectId` 置空）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/repo:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: getProjectRepo
      summary: 项目仓库镜像状态（M24；未归档项目按需在后台克隆或拉取，不阻塞）
      description: 项目不存在 → 404 `not_found`。控制面没有可用的 git 时照常返回，`available:false` 并给出 `unavailableReason`。
      responses:
        '200':
          description: 仓库状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRepoStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/repo/sync:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    post:
      tags: [projects]
      operationId: syncProjectRepo
      summary: 立即克隆或拉取项目仓库镜像（M24；已归档项目也可以；在后台进行）
      description: 项目不存在 → 404 `not_found`；控制面没有可用的 git → 503 `repo_unavailable`；项目没有仓库地址 → 409 `no_repo`；托管仓库不需要同步 → 409 `repo_hosted`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202':
          description: 已开始；返回开始后的状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRepoStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/repo/hosted:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    post:
      tags: [projects]
      operationId: createProjectHostedRepo
      summary: 为没有仓库的项目创建 Oryn 托管仓库（M24 阶段 ③；带一个空树的初始提交，基线分支缺省 main）
      description: |
        项目不存在 → 404 `not_found`；已归档 → 409 `project_archived`；已有仓库地址或托管仓库 → 409 `repo_exists`；
        基线分支不合法 → 400 `invalid_request`；控制面没有可用的 git → 503 `repo_unavailable`。
        之后新建的 orb 会克隆它，正在运行的 orb 不受影响。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '201':
          description: 托管后的项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/webhook:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    put:
      tags: [projects]
      operationId: putProjectWebhook
      summary: 设置托管仓库的推送后 Webhook（M24 阶段 ③；只有主人能改）
      description: |
        每次推送成功后异步 POST 一次 JSON（`X-Oryn-Event: push`、`X-Oryn-Delivery`，设了密钥再带 `X-Oryn-Signature-256: sha256=<hex>`），
        不阻塞推送、不重试、不跟随重定向。线程里 agent 的推送同样触发（载荷 `pusher.kind` 为 `thread`）。
        地址须是不带用户名密码的 http(s) 地址（≤2048 字符），否则 400 `invalid_request`；项目不存在 → 404 `not_found`；
        非托管项目 → 409 `repo_not_hosted`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectWebhookInput' }
      responses:
        '200':
          description: 设置后的项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [projects]
      operationId: deleteProjectWebhook
      summary: 移除托管仓库的推送后 Webhook（M24 阶段 ③；幂等）
      description: 项目不存在 → 404 `not_found`；没有 Webhook 时同样回 204。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已移除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/repo/refs:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: listProjectRepoRefs
      summary: 项目仓库镜像的分支或标签（M24；按最近提交倒序，默认分支排第一）
      description: |
        项目没有仓库地址 → 409 `no_repo`；控制面没有可用的 git → 503 `repo_unavailable`；镜像不存在、克隆中或克隆失败 → 409 `repo_not_ready`。
        读取时与 `getProjectRepo` 一样按需在后台克隆或拉取（不阻塞）。至多列出前 10000 个。
      parameters:
        - name: kind
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ProjectRepoRefKind' }
        - { $ref: '#/components/parameters/RepoCursorQuery' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 一页分支或标签
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRepoRefList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/repo/commits:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: listProjectRepoCommits
      summary: 项目仓库镜像的提交（M24；新到旧，可按路径过滤）
      description: |
        `ref` 缺省为仓库状态里的 `baseBranch`；依次按分支、标签、提交 sha 解析，都不是 → 404 `ref_not_found`。
        翻页的 `cursor` 记着第一页的头提交，分支移动后后续页仍然稳定。镜像不可用时的错误同 `listProjectRepoRefs`。
      parameters:
        - { $ref: '#/components/parameters/RepoRefQuery' }
        - { $ref: '#/components/parameters/RepoPathQuery' }
        - { $ref: '#/components/parameters/RepoCursorQuery' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: 一页提交
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRepoCommitList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/repo/commits/{sha}:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
      - { $ref: '#/components/parameters/RepoShaPath' }
    get:
      tags: [projects]
      operationId: getProjectRepoCommit
      summary: 项目仓库镜像里的一个提交（M24；含改动文件与关联线程）
      description: |
        提交不存在 → 404 `commit_not_found`。关联线程依次取线程推送、线程里采样到的提交；GitHub 项目都没有时再按「提交所属 PR → 线程」反查一次（结果缓存，没有线程的结果 24 小时内不再反查）。
      responses:
        '200':
          description: 提交详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRepoCommitDetail' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/repo/commits/{sha}/diff:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
      - { $ref: '#/components/parameters/RepoShaPath' }
    get:
      tags: [projects]
      operationId: getProjectRepoCommitDiff
      summary: 提交里一个文件的 unified diff（M24；合并提交相对第一个父提交，根提交相对空树）
      parameters:
        - { $ref: '#/components/parameters/GitDiffPathQuery' }
        - { $ref: '#/components/parameters/GitDiffOldPathQuery' }
      responses:
        '200':
          description: 文件 diff（`-U3`，≤1MiB）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitFileDiff' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/repo/tree:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: getProjectRepoTree
      summary: 项目仓库镜像在某个 ref 下的目录或文件（M24）
      description: 路径不存在 → 404 `path_not_found`；`ref` 规则同 `listProjectRepoCommits`。
      parameters:
        - { $ref: '#/components/parameters/RepoRefQuery' }
        - { $ref: '#/components/parameters/RepoPathQuery' }
        - name: lastCommits
          in: query
          description: 目录时给每个直接子项找最后一次改动它的提交（有时限，可能不全，见 `lastCommitsComplete`）
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: 目录或文件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectRepoTree' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/repo/blob:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: getProjectRepoBlob
      summary: 项目仓库镜像里一个文件的内容（M24）
      description: |
        目录 → 409 `not_a_file`；超过 64MiB → 413 `too_large`；路径不存在 → 404 `path_not_found`。
        安全的栅格图片 `Content-Disposition: inline`，其余一律附件；`text/html` 改为 `text/plain; charset=utf-8`；
        带 `X-Content-Type-Options: nosniff` 与 `Content-Security-Policy: sandbox`。`ref` 是完整提交 sha 时可长期缓存。
        Git LFS 指针返回对象内容（`ETag` 仍是指针 blob 的 oid，`Content-Length` 是对象大小）；对象是本地文件时支持 Range。
        超过 100 MiB 的 LFS 对象只能 `download=1` 下载，否则 413 `too_large`；取对象失败 → `lfs_*` 错误码。
      parameters:
        - { $ref: '#/components/parameters/RepoRefQuery' }
        - name: path
          in: query
          required: true
          description: 仓库内相对路径
          schema: { type: string, minLength: 1, maxLength: 4096 }
        - { $ref: '#/components/parameters/RepoDownloadQuery' }
        - name: If-None-Match
          in: header
          description: 上次响应的 `ETag`；未变 → 304
          schema: { type: string }
      responses:
        '200':
          description: 文件字节
          headers:
            ETag:
              description: '`"<blob oid>"`'
              schema: { type: string }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Range 请求的部分内容（只在内容是本地文件时，如 LFS 对象）
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '304':
          description: 与 `If-None-Match` 相同，未改变
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/snapshots:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: listProjectSnapshots
      summary: 项目快照列表（M11a；按 createdAt 倒序，含 building / ready / retired）
      responses:
        '200':
          description: 项目快照
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSnapshotList' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [projects]
      operationId: deleteProjectSnapshots
      summary: 清除项目快照（M11a；把匹配的 ready 快照退役，原因 `manual`；镜像由回收器异步删除）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: type
          in: query
          description: 只退役该 orb 类型的快照；缺省 = 全部类型
          schema: { type: string }
      responses:
        '204': { description: 已退役 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/agent-config/files:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: listProjectAgentConfigFiles
      summary: 项目级 omp 配置文件列表（M12.2；目录结构同仓库里的 `.omp/`，未写过时为空列表）
      responses:
        '200':
          description: 文件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigFileList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/agent-config/files/{path}:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
      - { $ref: '#/components/parameters/AgentConfigPath' }
    get:
      tags: [projects]
      operationId: getProjectAgentConfigFile
      summary: 读取项目级 omp 配置文件原文（M12.2）
      responses:
        '200':
          description: 文件原文
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [projects]
      operationId: putProjectAgentConfigFile
      summary: 写入项目级 omp 配置文件（M12.2）
      description: |
        项目不存在（含写入期间被删除）→ 404 `not_found`；路径非法、属于运行时数据、为 `models.yml`（模型与密钥只在全局管理）、首段为 `plans/`，
        `config.yml` 不是单个 YAML 映射文档（含 `---` 分隔的多文档），或必须是文本的路径（`rules/` 下的一切与 `.md` / `.yml` / `.yaml` / `.json`）
        含 NUL 或非 UTF-8 字节 → 400 `invalid_request`；单文件超过 1 MiB、合计超过 16 MiB、超过 2000 个文件，
        或与全局配置按下发编码合计超过单次下发上限（88 MiB）→ 413 `invalid_request`。
        不做密钥抽取（不支持 `${oryn:secret:…}`），形似密钥的内容只给 `possible_secret` 警告。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: mode
          in: query
          description: 文件权限（八进制整数，如 420 = 0644）；缺省 0644
          schema: { type: integer, minimum: 0, maximum: 511 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 写入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigWriteResult' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [projects]
      operationId: deleteProjectAgentConfigFile
      summary: 删除项目级 omp 配置文件（M12.2）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/agent-config/import:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    post:
      tags: [projects]
      operationId: importProjectAgentConfig
      summary: 导入项目级 omp 配置 tar 包（M12.2；`oryn config push --project` 使用）
      description: |
        包内路径相对项目配置根（同仓库里的 `.omp/`）；整体替换该项目的配置（不在包内的文件被删除），其它项目与全局不受影响。
        运行时数据、`models.yml` 与 `plans/` 静默跳过；配额与错误同 `putProjectAgentConfigFile`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigImportResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/secrets:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [projects]
      operationId: listProjectSecrets
      summary: 项目级环境变量与 Git 令牌（M24 阶段 ④；保密条目不含值）
      description: 项目不存在 → 404 `not_found`。已归档的项目照常可读写。只对本项目的 orb 生效，与全局同名时以项目为准；不下发给 Runner 线程与协调宿主。
      responses:
        '200':
          description: 按名称排序
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSecretList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/secrets/{name}:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
      - { $ref: '#/components/parameters/SecretNamePath' }
    put:
      tags: [projects]
      operationId: putProjectSecret
      summary: 写入或覆盖项目级条目（覆盖保留原 id）
      description: |
        `mode:"env"`：名称须匹配 `[A-Z_][A-Z0-9_]*`；`secret` 缺省 true，`secret:false` 的值之后可经列表读回。
        `mode:"proxy"`：名称只能是 `git/<主机>/token`（主机小写），且必须保密；模型供应商密钥（`omp/models/…`）只能在全局 `/secrets` 设置。
        校验失败或值为空 → 400 `invalid_request`；项目不存在（含写入期间被删除）→ 404 `not_found`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectSecretPut' }
      responses:
        '200':
          description: 写入后的条目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSecret' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [projects]
      operationId: deleteProjectSecret
      summary: 删除项目级条目
      description: 项目或条目不存在 → 404 `not_found`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- providers
  /api/v1/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: provider 列表
      responses:
        '200':
          description: provider 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [providers]
      operationId: createProvider
      summary: 新建 provider（令牌只显示一次）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCreateRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderCreateResponse' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/providers/{id}:
    parameters:
      - { $ref: '#/components/parameters/ProviderIdPath' }
    delete:
      tags: [providers]
      operationId: deleteProvider
      summary: 删除（停用）provider，其令牌立即失效
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- runners（M11b）
  /api/v1/runners:
    get:
      tags: [runners]
      operationId: listRunners
      summary: runner 列表（不含已删除）
      responses:
        '200':
          description: runner 列表（按名称排序）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [runners]
      operationId: createRunner
      summary: 新建 runner（令牌只显示一次）
      description: 名称与 provider 共用唯一约束（重名 → 409 `conflict`）。新 runner 的 orb 处于 `stopped`，等 `orbd run --runner` 接入。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunnerCreated' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/runners/{id}:
    parameters:
      - { $ref: '#/components/parameters/ProviderIdPath' }
    delete:
      tags: [runners]
      operationId: deleteRunner
      summary: 删除 runner：令牌立即失效、其 orb 进入 `deleted`；线程保留转录（`orbId` 置空，只读）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- threads
  /api/v1/threads:
    get:
      tags: [threads]
      operationId: listThreads
      summary: 线程列表
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ThreadState' }
        - name: project
          in: query
          description: 项目 id；传 `none` 只返回无项目线程
          schema: { type: string }
        - name: archived
          in: query
          description: 为 true 时只返回已归档线程；缺省只返回未归档
          schema: { type: boolean }
        - name: q
          in: query
          description: 标题 / 标签的模糊搜索
          schema: { type: string }
        - name: kind
          in: query
          description: 线程种类；缺省 `work`（只列工作线程），`all` = 全部种类（M9）
          schema:
            type: string
            enum: [work, space, assistant, all]
            x-enum-varnames: [ListThreadsKindWork, ListThreadsKindSpace, ListThreadsKindAssistant, ListThreadsKindAll]
            default: work
        - name: space
          in: query
          description: 只返回属于该 Space 的线程（M9）
          schema: { $ref: '#/components/schemas/SpaceId' }
      responses:
        '200':
          description: 线程列表（按 `updatedAt` 降序）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [threads]
      operationId: createThread
      summary: 新建线程
      description: |
        省略 `executor.provider` / `executor.type` 时依次取项目默认、`orb_defaults`、provider 的 `defaultType`。
        `executor.kind = runner`（M11b）：runner 不在线 → 409 `runner_offline`；`dir` 不在 runner 声明的目录之内 → 400 `dir_not_served`；
        未要求 worktree、未给 `shareDir` 且已有未归档线程以同一目录为工作目录 → 409 `dir_in_use`（体为 `DirInUseConflict`）；
        建 worktree 失败 → 400 `worktree_failed`；给了非空 `browserProfileId` → 400 `invalid`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateThreadRequest' }
      responses:
        '201':
          description: 已创建（通常处于 `provisioning`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadEnvelope' }
        '409':
          description: |
            `profile_in_use`：选用的浏览器 Profile 被另一台运行中的 orb 独占持有且 `profileMode` 为 `exclusive`（体为 `ProfileInUseConflict`）；
            `dir_in_use`（M11b）：runner 上的该目录已被其它线程使用（体为 `DirInUseConflict`）。其它 409 为普通 `Error`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ProfileInUseConflict'
                  - $ref: '#/components/schemas/DirInUseConflict'
                discriminator:
                  propertyName: code
                  mapping:
                    profile_in_use: '#/components/schemas/ProfileInUseConflict'
                    dir_in_use: '#/components/schemas/DirInUseConflict'
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [threads]
      operationId: getThread
      summary: 线程详情
      responses:
        '200':
          description: 线程
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [threads]
      operationId: updateThread
      summary: 修改线程（改名时控制面同时向 agent 发 `set_session_name`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThreadPatch' }
      responses:
        '200':
          description: 修改后的线程
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [threads]
      operationId: deleteThread
      summary: 删除线程（停止其 agent，删除条目）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/entries:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [threads]
      operationId: listThreadEntries
      summary: 分页读取已复制条目（按 `seq` 升序）
      description: |
        `after` 向后翻、`before` 向前翻（M19）：给了 `before` 时返回 `seq < before` 的最新 `limit` 条（结果仍按 `seq` 升序），
        `hasMore` 表示还有更早的。`after` 与 `before` 同时给出 → 400 `invalid_request`。
      parameters:
        - name: after
          in: query
          description: 只返回 `seq > after` 的条目
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: before
          in: query
          description: 只返回 `seq < before` 的条目（M19，向前翻页）
          schema: { type: integer, format: int64, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: 条目页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntryPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/fork:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    post:
      tags: [threads]
      operationId: forkThread
      summary: fork 线程（共用 orb 或连环境分叉）
      description: '所在 orb 是 runner（M11b）时只能 `env: "share"`（子线程继承 `cwd`、不继承 `worktree`）；`env: "copy"` → 409 `runner_unsupported`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForkThreadRequest' }
      responses:
        '201':
          description: 新线程（`env:"copy"` 时处于 `provisioning`，就绪后自动接续）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/wake:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    post:
      tags: [threads]
      operationId: wakeThread
      summary: 唤醒线程所在 orb（异步）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202': { description: 已受理 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/worktree/remove:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    post:
      tags: [threads]
      operationId: removeThreadWorktree
      summary: 移除 Oryn 为该 runner 线程建的 worktree（M11b）
      description: |
        经 ctl `worktree.remove` 在 runner 上执行 `git worktree remove <dir>`（不带 `--force`）并尝试 `git branch -d`（分支未合并则保留）；
        成功后清空线程的 `worktree`。线程没有 `worktree` → 409 `conflict`；runner 不在线 → 409 `runner_offline`；
        worktree 有未提交改动 → 409 `worktree_dirty`（`message` 为 git 的报错）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已移除 }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/threads/{id}/attachments:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [attachments]
      operationId: listThreadAttachments
      summary: 线程的附件（按上传时间）
      responses:
        '200':
          description: 附件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/shares:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [shares]
      operationId: listThreadShares
      summary: 该线程未撤销的公开分享（按创建时间降序）
      responses:
        '200':
          description: 分享列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadShareList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [shares]
      operationId: createThreadShare
      summary: 创建公开分享（快照 / 实时）
      description: |
        创建前对公开面上的全部文本做密钥扫描：线程标题、分享范围（活动分支上的主会话条目经公开过滤之后的内容）、
        将要列出的附件名（见 `PublicShare.attachments`）。有命中且未给 `acknowledgeFindings: true`
        → 409 `ShareScanConflict{code:"secrets_found"}`；确认后创建并把命中数记入 `findings`。
        快照在同一事务里固化扫描过的条目集合（按分支顺序，连同每行原始内容的 SHA-256）与当时的标题：
        此后被改写或删除的行不再公开（不回落到别的分支、不出现新内容），标题也不随线程改名变化。
        每线程未撤销分享 ≤20（超出 409 `invalid`）；`mode` 非法 → 400 `invalid`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateThreadShareRequest' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadShare' }
        '409':
          description: '`secrets_found`：扫描有命中且未确认（其它 409 为普通 `Error`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareScanConflict' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orbs
  /api/v1/orbs:
    get:
      tags: [orbs]
      operationId: listOrbs
      summary: orb 列表
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/OrbState' }
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: orb 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrb
      summary: orb 详情
      responses:
        '200':
          description: orb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [orbs]
      operationId: deleteOrb
      summary: 删除 orb（先 shutdown 再 delete；其线程保留条目，`orbId` 置空）
      description: runner 的 orb（M11b）→ 409 `runner_unsupported`（改用 `DELETE runners/{id}`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202':
          description: 已进入 `deleting`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/pause:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: pauseOrb
      summary: 手动冻结或停机
      description: runner 的 orb（M11b）→ 409 `runner_unsupported`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrbPauseRequest' }
      responses:
        '202':
          description: 已进入 `freezing` / `stopping`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/resume:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: resumeOrb
      summary: 唤醒 orb（`frozen` / `stopped` / `failed` → `waking`）
      description: runner 的 orb（M11b）→ 409 `runner_unsupported`（runner 由用户机器上的 `orbd run --runner` 主动接入）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202':
          description: 已进入 `waking`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/metrics:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbMetrics
      summary: orb 资源采样（按 `step` 降采样，取窗口内均值；网络字节取窗口末值）
      parameters:
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
        - name: step
          in: query
          description: 降采样步长（秒）；缺省 = 原始采样（15s）
          schema: { type: integer, minimum: 15 }
      responses:
        '200':
          description: 采样序列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbMetrics' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/orbs/{id}/setup-runs:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: listOrbSetupRuns
      summary: 最近 20 次 setup / resume 运行（新到旧，不含日志）
      responses:
        '200':
          description: 运行记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbSetupRunList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/setup-runs/{runId}/log:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - name: runId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/SetupRunId' }
    get:
      tags: [orbs]
      operationId: getOrbSetupRunLog
      summary: 一次 setup / resume 运行的输出（末尾至多 256KiB）
      responses:
        '200':
          description: 纯文本日志
          content:
            text/plain:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orb 文件（M3，经 fs 流代理到 orbd）
  /api/v1/orbs/{id}/fs/roots:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    get:
      tags: [orbs]
      operationId: getOrbFsRoots
      summary: orb 内的文件根（`$HOME` 与当前工作目录）
      description: '经 orb link 的 `fs` 流转发到 orbd 本机 API（`GET /fs/roots` 等，见 docs/protocol.md M3 节）。orb 冻结 / 停机时默认唤醒并至多等待 25s；`bg=true` 时不唤醒、不计用户交互。'
      parameters:
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
        - { $ref: '#/components/parameters/OrbOfflineQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsRoots' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/list:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    get:
      tags: [orbs]
      operationId: listOrbFs
      summary: 列出目录（目录在前、按名不分大小写排序；≤5000 条）
      parameters:
        - { $ref: '#/components/parameters/FsPathQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
        - { $ref: '#/components/parameters/OrbOfflineQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsListing' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/stat:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    get:
      tags: [orbs]
      operationId: statOrbFs
      summary: 文件或目录元数据（含 `mime` 与 `text`）
      parameters:
        - { $ref: '#/components/parameters/FsPathQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
        - { $ref: '#/components/parameters/OrbOfflineQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/file:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
      - { $ref: '#/components/parameters/FsPathQuery' }
    get:
      tags: [orbs]
      operationId: readOrbFile
      summary: 下载文件（支持 `Range`）
      description: "一律以附件形式返回（`Content-Disposition: attachment`、`X-Content-Type-Options: nosniff`、`Content-Security-Policy: sandbox`、`Cache-Control: no-store`）；目录 → 409 `is_a_directory`。"
      parameters:
        - { $ref: '#/components/parameters/OrbOfflineQuery' }
        - name: Range
          in: header
          description: 标准 HTTP Range（单区间）
          schema: { type: string }
      responses:
        '200':
          description: 文件字节
          headers:
            ETag:
              description: '`"<mtimeUnixNano>-<size>"`'
              schema: { type: string }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Range 请求的部分字节
          headers:
            ETag:
              schema: { type: string }
            Content-Range:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [orbs]
      operationId: writeOrbFile
      summary: 写入文件（整文件覆盖，单文件 ≤512MiB）
      description: |
        父目录须存在。已存在且 `overwrite=false` → 409 `exists`；带 `If-Match` 且与当前 `etag` 不符（含文件不存在）→ 412 `modified`；
        超过 512MiB → 413 `too_large`；磁盘满 → 507 `no_space`。写临时文件后原子替换，沿用原文件权限（新文件 0644）；目标是符号链接时写入其指向的文件。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: overwrite
          in: query
          description: 目标已存在时是否覆盖
          schema: { type: boolean, default: true }
        - name: If-Match
          in: header
          description: 期望的当前 `etag`（`FsEntry.etag`）；不符 → 412 `modified`
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 写入后的文件元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/mkdir:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    post:
      tags: [orbs]
      operationId: mkdirOrbFs
      summary: 新建目录（含缺失的上级目录，0755）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsPathRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/rename:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    post:
      tags: [orbs]
      operationId: renameOrbFs
      summary: 移动 / 重命名
      description: 目标已存在且未 `overwrite` → 409 `exists`；不得移动当前工作目录本身。返回目标的元数据。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsRenameRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/delete:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    post:
      tags: [orbs]
      operationId: deleteOrbFs
      summary: 删除文件或目录（递归）
      description: 不得删除当前工作目录本身或 `$HOME/.oryn` 下的路径（403 `protected_path`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsPathRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/publish:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [shares]
      operationId: publishOrbFile
      summary: 把 orb 内的一个文件发布为公开 URL（发布的是此刻的副本，落成该线程的一个附件）
      description: |
        线程须在该 orb 上；必须是普通文件且 ≤100MiB（目录 409 `is_a_directory`，超限 413 `too_large`）。
        orb 冻结 / 停机时唤醒并至多等待 25s。之后 orb 里的修改不影响已发布的副本。
        runner 的 orb（M11b）：路径范围为 `threadId` 线程的工作目录（与带 `thread` 的文件接口相同），本接口不另设 `thread` 查询参数。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishOrbFileRequest' }
      responses:
        '201':
          description: 已发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedFile' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orb 改动（M3，git，经 fs 流代理到 orbd）
  /api/v1/orbs/{id}/git/status:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    get:
      tags: [orbs]
      operationId: getOrbGitStatus
      summary: 相对基线 / HEAD / 单个 commit 的改动文件列表（≤2000 个）
      description: '`base` 缺省时控制面以 orb 所属项目的 `baseBranch` 补上；仍无则 orbd 依次取 `origin/HEAD`、`main`、`master`。`root` 不是 git 仓库时返回 `repo=false` 与 `candidates`。'
      parameters:
        - { $ref: '#/components/parameters/GitRootQuery' }
        - { $ref: '#/components/parameters/GitScopeQuery' }
        - { $ref: '#/components/parameters/GitCommitQuery' }
        - { $ref: '#/components/parameters/GitBaseQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/diff:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    get:
      tags: [orbs]
      operationId: getOrbGitDiff
      summary: 单个文件的 unified diff（≤1MiB，按行截断）
      parameters:
        - { $ref: '#/components/parameters/GitRootQuery' }
        - { $ref: '#/components/parameters/GitScopeQuery' }
        - { $ref: '#/components/parameters/GitCommitQuery' }
        - { $ref: '#/components/parameters/GitBaseQuery' }
        - { $ref: '#/components/parameters/GitDiffPathQuery' }
        - { $ref: '#/components/parameters/GitDiffOldPathQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitFileDiff' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/commits:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    get:
      tags: [orbs]
      operationId: listOrbGitCommits
      summary: 基线（merge-base）到 HEAD 的提交，新到旧
      parameters:
        - { $ref: '#/components/parameters/GitRootQuery' }
        - { $ref: '#/components/parameters/GitBaseQuery' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitCommitList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/stage:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    post:
      tags: [orbs]
      operationId: stageOrbGit
      summary: 暂存文件（`git add -A -- <paths>`）
      description: '`index.lock` 被占用 → 409 `git_busy`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitPathsRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/unstage:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbThreadQuery' }
    post:
      tags: [orbs]
      operationId: unstageOrbGit
      summary: 取消暂存（`git reset -q HEAD -- <paths>`；HEAD 未出生时 `git rm -r -q --cached`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitPathsRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- oryn sync（M5，经 fs 流代理到 orbd，特性 `sync`）
  /api/v1/orbs/{id}/sync/prepare:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: prepareOrbSync
      summary: 生成工作区快照提交并按需打包 git bundle
      description: |
        orbd 用临时 index 把工作区（含未跟踪、遵守 `.gitignore`）写成以 HEAD 为父的快照提交（同树同父 → 同 sha），
        更新 `refs/oryn/sync/{head,snapshot}`；`snapshot ∉ have` 时以 `have` 中本仓库已有的提交为界打包 bundle。
        错误：HEAD 未出生 409 `sync_no_commits`；无共同提交且未给 `force` 409 `sync_no_common`；
        无共同提交、给了 `force` 但仓库是浅克隆 409 `sync_shallow`；bundle 超过 1GiB 413 `too_large`；
        旧版 orbd 409 `orbd_outdated`。截止 6 分钟。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrbSyncPrepareRequest' }
      responses:
        '200':
          description: 同步状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbSyncState' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/sync/bundle:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbSyncBundle
      summary: 下载 `prepareOrbSync` 打出的 bundle（保留 10 分钟；过期 404 `sync_bundle_gone`）
      parameters:
        - name: id
          in: query
          required: true
          description: '`OrbSyncState.bundle.id`'
          schema: { type: string, pattern: '^[0-9a-f]{16}$' }
      responses:
        '200':
          description: bundle 字节
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- 受管服务与 portal（M4）
  /api/v1/orbs/{id}/services:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: listOrbServices
      summary: orb 的受管服务与 portal（读控制面镜像，不唤醒、不计用户交互）
      description: 镜像来自 orbd 的 `services.state` 通知；orb 已删除或旧版 orbd 时两个列表为空。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbServiceList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/start:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    post:
      tags: [orbs]
      operationId: startOrbService
      summary: 启动已声明的服务（等待至多 60s 离开 `starting`）
      description: '经 `fs` 流转发到 orbd 本机 API `POST /services/{name}/start`。orb 不可用时唤醒并至多等待 25s；旧版 orbd → 409 `orbd_outdated`；未知服务 → 404 `service_not_found`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 操作后的服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbService' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/stop:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    post:
      tags: [orbs]
      operationId: stopOrbService
      summary: 停止服务（之后不再自动拉起，直到再次 start / restart）
      description: '经 `fs` 流转发到 orbd 本机 API `POST /services/{name}/stop`；进程组先 SIGTERM，10s 后 SIGKILL。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 操作后的服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbService' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/restart:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    post:
      tags: [orbs]
      operationId: restartOrbService
      summary: 重读 services.yaml 后重启服务（等待至多 60s 离开 `starting`）
      description: '经 `fs` 流转发到 orbd 本机 API `POST /services/{name}/restart`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 操作后的服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbService' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/log:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    get:
      tags: [orbs]
      operationId: getOrbServiceLog
      summary: 服务日志末尾（从整行开始）
      description: '经 `fs` 流转发到 orbd 本机 API `GET /services/{name}/log`；没有日志时返回空体。'
      parameters:
        - name: tail
          in: query
          description: 返回末尾至多多少字节
          schema: { type: integer, minimum: 1, maximum: 1048576, default: 65536 }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 纯文本日志
          content:
            text/plain:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/portals/{port}/share:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/PortalPortPath' }
    put:
      tags: [orbs]
      operationId: setOrbPortalShare
      summary: 限时公开该端口的 portal（首次公开与续期同一接口：`expiresAt = now + duration`）
      description: '只影响该 `(orb, 端口)`。端口未声明 portal → 404 `portal_not_found`；控制面未配置 `portal_domain` → 409 `portal_disabled`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalShareRequest' }
      responses:
        '200':
          description: 公开后的 portal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbPortal' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [orbs]
      operationId: endOrbPortalShare
      summary: 终止公开（立即断开该端口的全部匿名连接）
      description: 未公开时同样返回 204；控制面未配置 `portal_domain` → 409 `portal_disabled`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- desktop & browser profiles (M8)
  /api/v1/orbs/{id}/desktop/profile:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    put:
      tags: [desktop]
      operationId: setOrbDesktopProfile
      summary: 为 orb 选用、切换或解除浏览器 Profile
      description: |
        `profileId` 空串 = 解除。本 orb 以 `exclusive` 持有的旧 Profile 先做关闭式保存再释放租约；只读副本直接丢弃。
        `profileMode` 缺省 `exclusive`（语义见 `BrowserProfileMode`）：被另一台运行中的 orb 独占持有 → 409 `ProfileInUseConflict`，此时不做任何改动。
        先唤醒 orb 并至多等 25s；Profile 不存在 → 404 `profile_not_found`；旧 orbd（hello 不含 `desktop`）→ 409 `orbd_outdated`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrbDesktopProfilePut' }
      responses:
        '200':
          description: 同步完成后的 orb（`desktop.profile` 为新绑定）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        '409':
          description: '`profile_in_use`（其它 409 为普通 `Error`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileInUseConflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/profile/save:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [desktop]
      operationId: saveOrbDesktopProfile
      summary: 立即保存本 orb 持有的 Profile（活体保存，浏览器不关闭）
      description: |
        本 orb 没有独占持有 Profile → 409 `no_profile`；以只读副本使用 → 409 `profile_readonly`。
        内容与当前修订相同时不产生新修订，照常返回。归档超限 → 413 `profile_too_large`；导出或落盘失败 → 502 `profile_save_failed`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 保存后的 Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserProfile' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/browser/start:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [desktop]
      operationId: startOrbBrowser
      summary: 启动桌面上的 Chromium（幂等；返回时 DevTools 已就绪）
      description: 先唤醒 orb 并至多等 25s；显示或 Profile 未就绪 → 503 `orb_unavailable`；旧 orbd → 409 `orbd_outdated`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: orb（`desktop.browser` 为 `running`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/browser/stop:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [desktop]
      operationId: stopOrbBrowser
      summary: 关闭桌面上的 Chromium（SIGTERM，10s 后 SIGKILL；已停止则无操作）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: orb（`desktop.browser` 为 `stopped`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/control:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [desktop]
      operationId: setOrbDesktopControl
      summary: 接管或交还桌面控制
      description: |
        `take`：由用户持有桌面控制（`desktop.control.userHeld=true`）；已持有时只续期空闲计时（界面在用户有输入时至多每 30s 调一次）。
        持有期间 orbd 挂起 agent 经 CDP 前门发出的浏览器命令（单条至多 45s，之后回 CDP 错误），并在线程工作中时 steer 通知 agent。
        `release`：交还（未持有时无操作）。orbd 另在 10 分钟没有续期、或所有桌面观看者断开满 60s 后自动交还。
        `take` 先唤醒 orb 并至多等 25s；`release` 不唤醒，orb 不可用时回 503 `orb_unavailable`。旧 orbd → 409 `orbd_outdated`。
        状态机与时限见 docs/protocol.md「桌面控制状态」。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrbDesktopControlRequest' }
      responses:
        '200':
          description: orb（`desktop.control` 为 orbd 应答时的控制状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/apps/{app}/launch:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbDesktopAppIdPath' }
    post:
      tags: [desktop]
      operationId: launchOrbDesktopApp
      summary: 在桌面上启动一个应用（M25；每次都起一个新实例）
      description: |
        `app` 取自 `desktop.apps[].id`；`chromium` 走浏览器启动（同 `startOrbBrowser`），其余由 orbd 按镜像清单起进程。
        「切到已有窗口」由客户端改用 `operateOrbDesktopWindow` 决定，本接口不做。
        先唤醒 orb 并至多等 25s；orb 不可用 → 503 `orb_unavailable`；旧 orbd（hello 不含 `desktop-apps`）→ 409 `orbd_outdated`；
        `desktop.control.state = agent` → 409 `control_agent`（先接管再启动）；清单里没有该应用 → 404 `app_not_found`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: orb（被启动的应用 `launching=true`，直到出现它的窗口或过了 20s）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/apps/{app}/icon:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbDesktopAppIdPath' }
    get:
      tags: [desktop]
      operationId: getOrbDesktopAppIcon
      summary: 应用图标（M25；取自 orb 镜像里已安装应用自带的图标）
      description: |
        **不唤醒 orb**：orb 不在 `ready` → 409 `orb_unavailable`。旧 orbd（hello 不含 `desktop-apps`）→ 409 `orbd_outdated`；
        清单里没有该应用或它没有图标 → 404 `app_not_found`。图标内容来自 orb，始终带 `X-Content-Type-Options: nosniff`
        与 `Content-Security-Policy: sandbox`（SVG 直接打开时也不执行脚本）。
      responses:
        '200':
          description: 图标原始字节
          headers:
            Cache-Control:
              description: '`private, max-age=86400`'
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/windows/{window}/{action}:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/OrbDesktopWindowIdPath' }
      - { $ref: '#/components/parameters/OrbDesktopWindowActionPath' }
    post:
      tags: [desktop]
      operationId: operateOrbDesktopWindow
      summary: 激活、最小化或关闭桌面上的一个窗口（M25）
      description: |
        `window` 取自 `desktop.windows[].id`。`activate` 切到前台（最小化的窗口先还原）；`minimize` 最小化；
        `close` 请窗口自行关闭（EWMH `_NET_CLOSE_WINDOW`，应用可能先弹确认）。
        先唤醒 orb 并至多等 25s；orb 不可用 → 503 `orb_unavailable`；旧 orbd（hello 不含 `desktop-apps`）→ 409 `orbd_outdated`；
        `desktop.control.state = agent` → 409 `control_agent`；窗口已不存在 → 404 `window_not_found`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: orb（`desktop.windows` 为 orbd 应答时的窗口列表；窗口管理器的处理是异步的，结果随后续 `orb` 推送到达）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/ws:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [websocket, desktop]
      operationId: orbDesktopSocket
      summary: 桌面观看与操作通道（WebSocket，二进制消息 = RFB 字节）
      description: |
        挂载方式同 `/api/v1/ws`（不经鉴权组，由一次性票据鉴权）。票据无效或已用过 → 升级前 HTTP 401；orb 不存在 → 404。
        升级后唤醒 orb（至多 25s）并经 link 的 `desk` 流对接 Xvnc；客户端发来的每条消息都算一次（合并后的）用户交互。
        客户端单条消息 ≤1MiB；写超时 30s；每台 orb ≤8 个观看者。
        关闭码：`4401` 主体被吊销、`4409` `orbd_outdated`、`4410` `orb_deleted`、`4429` 观看者已满、
        `4502` 桌面不可达（`display_unavailable` / 拨号失败，reason 为错误码）、`4503` orb 不可用（冻结 / 停机 / 唤醒超时）。
      security: [{}]
      parameters:
        - name: ticket
          in: query
          required: true
          description: '`POST /api/v1/ws-ticket` 签发的票据'
          schema: { type: string }
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/browser-profiles:
    get:
      tags: [desktop]
      operationId: listBrowserProfiles
      summary: 浏览器 Profile 列表（按 `name`）
      responses:
        '200':
          description: Profile 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserProfileList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [desktop]
      operationId: createBrowserProfile
      summary: 新建空 Profile（`revision = 0`）
      description: 名字非法 → 400 `invalid_request`；重名 → 409 `profile_name_taken`；已有 50 个 → 409 `profile_limit`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserProfileCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserProfile' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/browser-profiles/{id}:
    parameters:
      - { $ref: '#/components/parameters/BrowserProfileIdPath' }
    patch:
      tags: [desktop]
      operationId: updateBrowserProfile
      summary: 重命名 Profile
      description: 不存在 → 404 `profile_not_found`；名字非法 → 400 `invalid_request`；重名 → 409 `profile_name_taken`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserProfilePatch' }
      responses:
        '200':
          description: 修改后的 Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserProfile' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [desktop]
      operationId: deleteBrowserProfile
      summary: 删除 Profile 及其全部归档（同时清除引用它的项目默认值）
      description: 仍被某台 orb 独占持有 → 409 `ProfileInUseConflict`；只读使用者不阻止删除（它们的本地副本保留到下次同步）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        '409':
          description: '`profile_in_use`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileInUseConflict' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- blobs
  /api/v1/blobs/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Sha256' }
    get:
      tags: [blobs]
      operationId: getBlob
      summary: 下载 blob（转录中 `blob:sha256:<hex>` 引用的图片等）
      description: |
        内容寻址，可长期缓存。入库时记录的 mime 由内容探测得出：只有安全栅格图片（png / jpeg / gif / webp）按该类型
        `Content-Disposition: inline` 返回，其余一律 `application/octet-stream` + `attachment`（与 `/f` 同一白名单）。
      responses:
        '200':
          description: 原始字节
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- attachments
  /api/v1/attachments:
    post:
      tags: [attachments]
      operationId: uploadAttachment
      summary: 上传附件（单文件 ≤100MiB；可先于线程创建上传，24h 内未绑定线程即被清理）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: name
          in: query
          required: true
          description: 原始文件名（服务端净化后 ≤200 字节）
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: threadId
          in: query
          description: 直接绑定到该线程；缺省 = 暂不绑定（随 `POST threads` 的 `attachments` 或 `prompt.orynAttachments` 绑定）
          schema: { $ref: '#/components/schemas/ThreadId' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/attachments/{id}:
    parameters:
      - { $ref: '#/components/parameters/AttachmentIdPath' }
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: 删除附件（控制面的副本；orb 可用时尽力删除 orb 内的投递副本）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/attachments/{id}/content:
    parameters:
      - { $ref: '#/components/parameters/AttachmentIdPath' }
    get:
      tags: [attachments]
      operationId: getAttachmentContent
      summary: 下载附件（支持 `Range`）
      description: "默认 `Content-Disposition: attachment`；仅当 `inline=true` 且 mime ∈ `image/png|jpeg|gif|webp` 时内联。始终带 `X-Content-Type-Options: nosniff` 与 `Content-Security-Policy: sandbox`。"
      parameters:
        - name: inline
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 附件字节
          content:
            '*/*':
              schema: { type: string, format: binary }
        '206':
          description: Range 请求的部分字节
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/attachments/{id}/publish:
    parameters:
      - { $ref: '#/components/parameters/AttachmentIdPath' }
    post:
      tags: [shares]
      operationId: publishAttachment
      summary: 把附件发布为公开 URL（幂等：已发布则返回现有发布）
      description: 附件须已绑定线程（未绑定 → 400 `invalid`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 发布记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedFile' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- shares（M5）
  /api/v1/shares:
    get:
      tags: [shares]
      operationId: listShares
      summary: 全部未撤销的线程分享与已发布文件（设置页总览）
      responses:
        '200':
          description: 总览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareOverview' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/shares/{id}:
    parameters:
      - { $ref: '#/components/parameters/ShareIdPath' }
    delete:
      tags: [shares]
      operationId: revokeShare
      summary: 撤销线程分享（页面、接口、图片立即 404，已连接的匿名 WebSocket 收到 `share.revoked` 后以 4001 关闭）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已撤销 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/published-files/{id}:
    parameters:
      - { $ref: '#/components/parameters/PublishedFileIdPath' }
    delete:
      tags: [shares]
      operationId: revokePublishedFile
      summary: 撤回已发布的文件（公开 URL 立即 404；附件本身保留）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已撤回 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- secrets
  /api/v1/secrets:
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: 密钥列表（仅名称与元数据）
      responses:
        '200':
          description: 密钥元数据列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/secrets/{name}:
    parameters:
      - { $ref: '#/components/parameters/SecretNamePath' }
    put:
      tags: [secrets]
      operationId: putSecret
      summary: 写入密钥
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretPut' }
      responses:
        '200':
          description: 写入后的元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretMeta' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: 删除密钥
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- settings
  /api/v1/settings/git-identity:
    get:
      tags: [settings]
      operationId: getGitIdentity
      summary: orb 内 git 提交身份的全局默认值
      responses:
        '200':
          description: 当前默认值（未设置时不含 identity）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitIdentitySettings' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putGitIdentity
      summary: 设置 git 提交身份的全局默认值（下次 setup / 唤醒时写入 orb）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitIdentity' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitIdentitySettings' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [settings]
      operationId: deleteGitIdentity
      summary: 清除 git 提交身份的全局默认值（已有 orb 的 git 配置保持不变）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已清除 }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/agent-identity:
    get:
      tags: [settings]
      operationId: getAgentIdentity
      summary: 全局 agent 身份（名字与头像；助手回合头的回落身份）
      description: 尚未初始化所有者 → `{}`。
      responses:
        '200':
          description: 当前设置（都省略 = 默认品牌标、不显示名字）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentIdentity' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putAgentIdentity
      summary: 设置全局 agent 身份（整体替换：省略的字段即清除；`{}` = 恢复默认）
      description: |
        `name` 去首尾空白后为空等同省略；超过 40 个字符或含控制字符 → 400 `invalid_request`。
        `avatarIcon` 与 `avatarImage` 至多给一个（都给 → 400 `invalid_request`）。`avatarImage` 必须是
        `data:image/(png|webp|jpeg);base64,` 开头的 data URL，整串超过 128KiB → 413 `too_large`。尚未初始化所有者 → 409 `conflict`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentIdentity' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentIdentity' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/assistant-identity:
    get:
      tags: [settings]
      operationId: getAssistantIdentity
      summary: 全局助手身份（原始值）
      description: |
        返回的是原始值：名字、头像各自省略 = 跟随全局 agent 身份，回落由客户端做（名字与头像分别回落）。
        尚未初始化所有者 → `{}`。
      responses:
        '200':
          description: 当前设置（都省略 = 完全跟随 agent 身份）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentIdentity' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putAssistantIdentity
      summary: 设置全局助手身份（整体替换：省略的字段即清除，即改为跟随 agent 身份）
      description: 校验同 `putAgentIdentity`（400 `invalid_request`、413 `too_large`、尚未初始化所有者 → 409 `conflict`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentIdentity' }
      responses:
        '200':
          description: 写入后的设置（原始值）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentIdentity' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/assistant:
    get:
      tags: [settings]
      operationId: getAssistantSettings
      summary: 全局助手的设置（M19：联网总开关、关掉的 MCP 服务器、助手的电脑）
      responses:
        '200':
          description: 当前设置（没有存过 = 默认：联网开、无禁用项）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantSettings' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putAssistantSettings
      summary: 设置全局助手（整体替换）
      description: |
        `disabledMcpServers` 每项 1–200 字符、至多 200 项，否则 400 `invalid_request`。保存后立即刷新协调宿主的出站策略，
        并让全部未归档的助手对话在静止后用新配置重启 agent。`computer` 只影响下一次创建助手的电脑。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantSettings' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantSettings' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/role-identities:
    get:
      tags: [settings]
      operationId: listRoleIdentities
      summary: omp role 的身份与头像（已知 role + 只剩头像的遗留项）
      description: |
        role 列表来自 omp-home 的 `config.yml`（只读全局配置，不读项目级 `.omp/config.yml`）：依次为 `cycleOrder`（按序）、
        `modelRoles` 中其余的键（字典序）、其余内置 role（default / smol / slow / vision / plan / commit / tiny / memory / task /
        advisor / widget）；名字取 `modelTags.<role>.name`，selector 取 `modelRoles.<role>` 的原始值。`config.yml` 不存在按缺省
        `cycleOrder`（`smol / default / slow`）；解析失败时照样 200，带 `configError`，roles 按缺省配置给出。不唤醒任何 orb。
      responses:
        '200':
          description: role 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleIdentityList' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putRoleIdentity
      summary: 设置或清除一个 role 的头像（两个头像字段都省略 = 清除）
      description: |
        `role` 原样保存（区分大小写）；去首尾空白后为空、超过 128 字节或含控制字符 → 400 `invalid_request`。
        头像校验同 `putAgentIdentity`（两字段同时给 → 400 `invalid_request`；图片超 128KiB → 413 `too_large`）。
        给不在上述已知 role 之列的 role **设置**头像 → 400 `invalid_request`；清除任何 role 的头像都允许（幂等，没有行也 200）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleIdentityInput' }
      responses:
        '200':
          description: 写入后的该 role（组装方式同列表；清除后的遗留项 `inCycle` 为假）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleIdentity' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/agent-avatars:
    get:
      tags: [settings]
      operationId: listAgentAvatars
      summary: 子 agent 的头像（内置 agent + omp-home `agents/*.md` + 只剩头像的遗留项）
      description: |
        内置 agent 为 task / sonic / scout / reviewer / security-reviewer / advisor；自定义 agent 取 `agents/*.md` frontmatter 的
        `name` 与 `description`（解析失败的文件跳过并列入 `warnings`）。内置 agent 没有自定义头像时省略头像字段，客户端显示各自的
        默认字形。不唤醒任何 orb。
      responses:
        '200':
          description: agent 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentAvatarList' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putAgentAvatar
      summary: 设置或清除一个 agent 的头像（两个头像字段都省略 = 清除）
      description: |
        `name` 原样保存（区分大小写）；去首尾空白后为空、超过 128 字节或含控制字符 → 400 `invalid_request`。
        头像校验同 `putAgentIdentity`。给既不是内置 agent、也不在 `agents/*.md` 里的名字**设置**头像 → 400 `invalid_request`；
        清除总是允许（幂等）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentAvatarInput' }
      responses:
        '200':
          description: 写入后的该 agent（组装方式同列表）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentAvatar' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/composer:
    get:
      tags: [settings]
      operationId: getComposerPrefs
      summary: 新对话输入框的偏好（首屏默认对象）
      responses:
        '200':
          description: 当前设置（尚未初始化所有者时为缺省值）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComposerPrefs' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putComposerPrefs
      summary: 设置新对话输入框的偏好（整体替换）
      description: 尚未初始化所有者 → 409。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComposerPrefs' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComposerPrefs' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/selection-actions:
    get:
      tags: [settings]
      operationId: getSelectionActions
      summary: 自定义选区快捷动作（选中文字后出现在右键菜单里）
      responses:
        '200':
          description: 当前列表（尚未初始化所有者时为空列表）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectionActions' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putSelectionActions
      summary: 设置自定义选区快捷动作（整体替换）
      description: 名称与提示词去首尾空白后保存；id 不得重复。尚未初始化所有者 → 409。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelectionActions' }
      responses:
        '200':
          description: 写入后的列表（已规整）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SelectionActions' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/models/catalog:
    get:
      tags: [settings]
      operationId: getModelCatalog
      summary: 中央模型目录（控制面用钉住的 Oryn Core 运行 `omp models --json --kind all` 得到，不唤醒任何 orb）
      description: |
        目录按 omp-home 的 `models.yml` 与 `config.yml` 渲染后的内容与 Core 版本缓存：内容变化后的首次请求会等待重新运行
        （约数秒）；超过 24 小时或控制面重启后先返回旧结果（`stale: true`）并在后台刷新。只列出有可用凭据（经 egress 代理）或
        免密钥的 provider 的模型。运行失败且没有任何旧结果 → 503 `catalog_unavailable`。
      parameters:
        - name: refresh
          in: query
          description: 为真时强制重新运行
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 模型目录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelCatalog' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/user-identity:
    get:
      tags: [settings]
      operationId: getUserIdentity
      summary: 用户头像（用户回合右侧与侧栏页脚显示）
      responses:
        '200':
          description: 当前设置（都省略 = 默认：git 身份名字首字或 User 图标）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarIdentity' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putUserIdentity
      summary: 设置用户头像（整体替换：省略的字段即清除；两者都省略 = 恢复默认）
      description: |
        规则同 agent 头像：`avatarIcon` 与 `avatarImage` 至多给一个（都给 → 400 `invalid_request`）。`avatarImage` 必须是
        `data:image/(png|webp|jpeg);base64,` 开头的 data URL，整串超过 128KiB → 413 `too_large`。尚未初始化所有者 → 409。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarIdentity' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarIdentity' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- agent-config
  /api/v1/agent-config/files:
    get:
      tags: [agent-config]
      operationId: listAgentConfigFiles
      summary: omp-home 文件列表
      responses:
        '200':
          description: 文件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigFileList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-config/files/{path}:
    parameters:
      - { $ref: '#/components/parameters/AgentConfigPath' }
    get:
      tags: [agent-config]
      operationId: getAgentConfigFile
      summary: 读取文件原文（`models.yml` 返回的是密钥已替换为 `${oryn:secret:…}` 的模板）
      responses:
        '200':
          description: 文件原文
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [agent-config]
      operationId: putAgentConfigFile
      summary: 写入文件（`models.yml` 会做 C5 的密钥抽取）
      description: |
        路径非法或属于运行时数据、`config.yml` 不是单个 YAML 映射文档（含 `---` 分隔的多文档），或必须是文本的路径（`rules/` 下的一切与
        `.md` / `.yml` / `.yaml` / `.json`）含 NUL 或非 UTF-8 字节 → 400 `invalid_request`；单文件超过 16 MiB，或与最大的项目级配置按下发
        编码合计超过单次下发上限（88 MiB）→ 413 `invalid_request`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: mode
          in: query
          description: 文件权限（八进制整数，如 420 = 0644）；缺省 0644
          schema: { type: integer, minimum: 0, maximum: 511 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 写入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigWriteResult' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [agent-config]
      operationId: deleteAgentConfigFile
      summary: 删除文件
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-config/import:
    post:
      tags: [agent-config]
      operationId: importAgentConfig
      summary: 导入 tar 包（`oryn config push` 使用）
      description: |
        包内路径相对 omp-home 根；整体替换现有 omp-home（不在包内的文件被删除）。运行时数据静默跳过；内容校验与下发上限同 `putAgentConfigFile`，
        另有合计 128 MiB、10000 个文件的上限（413 `invalid_request`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigImportResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-config/apply-status:
    get:
      tags: [agent-config]
      operationId: getAgentConfigApplyStatus
      summary: omp 配置在会话上的生效状态（M13）
      description: |
        全局 omp-home 或项目层的 `PUT` / `DELETE` / `import` 成功后防抖 1 秒，控制面把这一层下发到所有 `ready` 且支持
        `omphome-apply` 的 orb（协调宿主只收 `config.yml` 与 `models.yml`；项目层只发给该项目的 orb），再按变化分类作用到
        agent 在跑的会话：技能、命令、规则、提示片段、instruction、上下文文件、MCP 在会话静止时 `reload_plugins`；hook、
        扩展模块、自定义工具、`SYSTEM.md`、`APPEND_SYSTEM.md`、`PERSONALITY.md`、`models.yml` 以及设置 schema 中
        `restartRequired` 的键要重启会话，列在 `threads` 里。规则见 docs/protocol.md「M13：omp 配置立即下发」。
        状态只在内存里：agent 退出即清除，orynd 重启后为空。
      responses:
        '200':
          description: 生效状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigApplyStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-config/restart-sessions:
    post:
      tags: [agent-config]
      operationId: restartAgentConfigSessions
      summary: 重启需重启才能让配置生效的会话（M13）
      description: |
        对 apply-status 列出的每个会话：等它静止（正在跑的回合不受影响）后停掉 omp 进程，下一条消息经唤醒路径以原会话
        自动拉起。agent 已不在运行的会话直接清除标记。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 已安排重启的会话
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigRestartResult' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- search（对话内容全文搜索）
  /api/v1/search:
    get:
      tags: [search]
      operationId: searchMessages
      summary: 对话内容全文搜索
      description: |
        在全部线程（含已归档，结果里标出）主会话的 user / assistant 消息正文里搜索，按消息时间从新到旧排列。
        `q` 按空白切成词，全部命中才算命中（AND），不区分大小写；≥3 个字符的词走 trigram 全文索引（同时忽略变音符），
        更短的词对正文做子串过滤（只折叠 ASCII 大小写）。fork 拷贝来的同一条消息只返回一次（归最早的线程），
        `copies` 给出持有它的线程数。口径见 docs/protocol.md「对话内容搜索」。
      parameters:
        - name: q
          in: query
          required: true
          description: 搜索词，1–200 个字符，至多 8 个词
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          description: 每页条数，缺省 20，上限 50
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          description: 上一页的 `nextCursor`（不透明）
          schema: { type: string }
      responses:
        '200':
          description: 命中的消息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResults' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- stats（M10）
  # 窗口参数 from / to 缺省 = 近 7 天；from ≥ to → 400 `invalid_request`；tz 不可加载 → 400 `invalid_timezone`；
  # 时间桶超过 1000 个 → 400 `range_too_large`。口径见 docs/protocol.md「M10：统计分析」。
  /api/v1/stats/meta:
    get:
      tags: [stats]
      operationId: getStatsMeta
      summary: 统计元信息：服务端时间、事实行版本、历史回填进度、最早的用量时间与保留期
      responses:
        '200':
          description: 元信息
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatsMeta' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/stats/usage:
    get:
      tags: [stats]
      operationId: getUsageStats
      summary: 模型用量分组聚合（tokens、成本、请求与错误、TTFT、tokens/s、工具调用、回合）
      description: |
        `groupBy` 为时间粒度（`hour | day | week | month`）时 `groups` 稠密（窗口内每个桶一项，含全零），且不得再给 `series`。
        非时间分组按成本降序（并列按键）取前 `limit` 个，其余折叠成 `key = "__other__"` 的一项；`series` 各点的 `groups` 用同一批键。
        `model` 筛选生效或 `groupBy ∈ {model, purpose}` 时 `toolCalls / toolErrors / turns` 为 0。
        `format=csv` 时列为 `bucket,key,label,requests,request_errors,input_tokens,output_tokens,cache_read_tokens,cache_write_tokens,cost_usd,subagent_cost_usd,avg_ttft_ms,tokens_per_second,tool_calls,tool_errors,turns`。
      parameters:
        - name: groupBy
          in: query
          required: true
          schema: { $ref: '#/components/schemas/UsageGroupBy' }
        - { $ref: '#/components/parameters/StatsSeriesQuery' }
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
        - { $ref: '#/components/parameters/StatsTzQuery' }
        - { $ref: '#/components/parameters/StatsProjectQuery' }
        - { $ref: '#/components/parameters/StatsSpaceQuery' }
        - { $ref: '#/components/parameters/StatsThreadQuery' }
        - { $ref: '#/components/parameters/StatsModelQuery' }
        - { $ref: '#/components/parameters/StatsLimitQuery' }
        - { $ref: '#/components/parameters/StatsFormatQuery' }
        - { $ref: '#/components/parameters/StatsDownloadQuery' }
      responses:
        '200':
          description: 分组结果（`format=csv` 时为 CSV 附件）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageStats' }
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/stats/usage/records:
    get:
      tags: [stats]
      operationId: exportUsageRecords
      summary: 用量明细导出（CSV，每个请求一行；单次 ≤500000 行，超出 → 400 `range_too_large`）
      description: |
        列：`ts,time,thread_id,project_id,space_id,provider,model,purpose,subagent,stop_reason,input_tokens,output_tokens,cache_read_tokens,cache_write_tokens,cost_usd,duration_ms,ttft_ms`
        （`time` 为 RFC3339 UTC；归属列取线程当前的项目 / Space，已删线程取删除时的快照）。
      parameters:
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
        - { $ref: '#/components/parameters/StatsProjectQuery' }
        - { $ref: '#/components/parameters/StatsSpaceQuery' }
        - { $ref: '#/components/parameters/StatsThreadQuery' }
        - { $ref: '#/components/parameters/StatsModelQuery' }
      responses:
        '200':
          description: CSV 附件
          content:
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/stats/tools:
    get:
      tags: [stats]
      operationId: getToolStats
      summary: 工具调用与错误（按工具，前 `limit` 个，其余折叠成 `__other__`）
      description: '`format=csv` 时列为 `bucket,tool,calls,errors`。'
      parameters:
        - { $ref: '#/components/parameters/StatsSeriesQuery' }
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
        - { $ref: '#/components/parameters/StatsTzQuery' }
        - { $ref: '#/components/parameters/StatsProjectQuery' }
        - { $ref: '#/components/parameters/StatsSpaceQuery' }
        - { $ref: '#/components/parameters/StatsThreadQuery' }
        - { $ref: '#/components/parameters/StatsLimitQuery' }
        - { $ref: '#/components/parameters/StatsFormatQuery' }
        - { $ref: '#/components/parameters/StatsDownloadQuery' }
      responses:
        '200':
          description: 工具统计（`format=csv` 时为 CSV 附件）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ToolStats' }
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/stats/orbs:
    get:
      tags: [stats]
      operationId: getOrbStats
      summary: orb 运行 / 冻结 / 停机时长、次数与 setup 耗时（由 `orb_events`、`orb_setup_runs` 计算）
      description: |
        时间粒度分组把状态区间按桶边界切开分摊；次数只在 `from_state ≠ to_state` 时累加；末段区间截到「现在」。
        `format=csv` 时列为 `key,label,type,cpus,memory_mb,orbs,running_ms,frozen_ms,stopped_ms,setup_ms,spawns,snapshot_spawns,freezes,stops,wakes,failures`。
      parameters:
        - name: groupBy
          in: query
          description: 缺省 = `type`
          schema: { $ref: '#/components/schemas/OrbGroupBy' }
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
        - { $ref: '#/components/parameters/StatsTzQuery' }
        - { $ref: '#/components/parameters/StatsProjectQuery' }
        - { $ref: '#/components/parameters/StatsOrbQuery' }
        - { $ref: '#/components/parameters/StatsFormatQuery' }
        - { $ref: '#/components/parameters/StatsDownloadQuery' }
      responses:
        '200':
          description: 分组结果（`format=csv` 时为 CSV 附件）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbStats' }
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/timeline:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [stats]
      operationId: getOrbTimeline
      summary: 单台 orb 的状态时间线（相邻同状态合并；≤2000 段，超出置 `truncated`）；orb 不存在 → 404 `not_found`
      parameters:
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
      responses:
        '200':
          description: 时间线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbTimeline' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/stats/output:
    get:
      tags: [stats]
      operationId: getOutputStats
      summary: 线程产出（新建 / 已交付 / 已归档、提交数、回合、交付线程的全生命周期成本）
      description: '`format=csv` 时列为 `key,label,threads_created,threads_shipped,threads_archived,shipped_cost_usd,commits,turns`。'
      parameters:
        - name: groupBy
          in: query
          description: 缺省 = `day`
          schema: { $ref: '#/components/schemas/OutputGroupBy' }
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
        - { $ref: '#/components/parameters/StatsTzQuery' }
        - { $ref: '#/components/parameters/StatsProjectQuery' }
        - { $ref: '#/components/parameters/StatsSpaceQuery' }
        - { $ref: '#/components/parameters/StatsFormatQuery' }
        - { $ref: '#/components/parameters/StatsDownloadQuery' }
      responses:
        '200':
          description: 分组结果（`format=csv` 时为 CSV 附件）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutputStats' }
            text/csv:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/stats/budget:
    get:
      tags: [stats]
      operationId: getBudget
      summary: 预算设置与当日 / 当月花费（未设置时 `enabled = false`、`warnPct = 80`、`timezone = UTC`）
      responses:
        '200':
          description: 预算状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetStatus' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [stats]
      operationId: putBudget
      summary: 整体替换预算设置；金额 <0.01、`warnPct` 越界、时区非法 → 400 `invalid_budget`
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Budget' }
      responses:
        '200':
          description: 更新后的预算状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BudgetStatus' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- notifications（M5）
  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: 最近的通知（按创建时间降序，含各渠道的投递状态）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: 只返回 `createdAt < before` 的通知（翻页游标）
          schema: { $ref: '#/components/schemas/TimestampMs' }
        - name: unread
          in: query
          description: |
            `true` 只返回未读（`readAt` 为空）的通知。App 补拉被 FCM 丢弃的推送时用它翻页，
            避免较早的未读通知被一页已读通知挤出窗口。
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 通知列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: 标记已读（`id` 只标一条、`threadId` 只标该线程、都省略 = 全部）；随后向所有连接广播 `notifications.read`
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationsReadRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notifications/{id}/answer:
    parameters:
      - { $ref: '#/components/parameters/NotificationIdPath' }
    post:
      tags: [notifications]
      operationId: answerNotification
      summary: 以一个选项作答 input 通知对应的待答请求（推送通知上的操作按钮）
      description: |
        只接受可一触作答的请求：单选 `select`、`confirm`、单个单选题的 `ask` / `askDialog`，2–3 个不超过 24 字符的单行选项；
        与推送载荷里 `actions` 的判定相同（载荷另要求完整问题不超过 300 字符）。作答走与 `ui.response` 相同的先到先得路径。
        通知不存在 → 404 `not_found`；不是可一触作答的 input（done / error / 计划审批 / 文字输入 / 表单 / 多选等）→ 422 `not_answerable`；
        `option` 越界 → 400 `invalid_option`；已在别处作答或已取消 → 409 `input_resolved`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationAnswerRequest' }
      responses:
        '200':
          description: 已作答
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationAnswerResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notification-channels:
    get:
      tags: [notifications]
      operationId: listNotificationChannels
      summary: 通知渠道（机密字段只写不读）
      responses:
        '200':
          description: 渠道列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannelList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [notifications]
      operationId: createNotificationChannel
      summary: 新建通知渠道
      description: |
        恰好给出与 `kind` 同名的一个配置对象；URL 须是 http(s)，自定义头名不得是 `Host` / `Content-Length` / `Content-Type`
        （否则 400 `invalid_channel`）。Telegram：创建时以 `getMe` 校验 token（失败 400 `invalid_channel`），至多一个（409 `channel_exists`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notification-channels/{id}:
    parameters:
      - { $ref: '#/components/parameters/NotificationChannelIdPath' }
    patch:
      tags: [notifications]
      operationId: updateNotificationChannel
      summary: 修改通知渠道（给出配置对象 = 整体替换该渠道配置；Telegram 换 token 会清掉绑定）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelPatch' }
      responses:
        '200':
          description: 修改后的渠道
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [notifications]
      operationId: deleteNotificationChannel
      summary: 删除通知渠道（其投递记录一并删除）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notification-channels/{id}/test:
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      summary: 同步发送一条测试消息（不写通知表；结果写入渠道的 `lastError`）
      description: Telegram 未绑定私聊 → 409 `channel_not_linked`。
      parameters:
        - { $ref: '#/components/parameters/NotificationChannelIdPath' }
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 发送结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTestResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notification-channels/{id}/telegram/link:
    post:
      tags: [notifications]
      operationId: linkTelegramChannel
      summary: 生成 Telegram 绑定码（10 分钟有效；在 Telegram 里向 bot 私聊发送 `/start <码>` 完成绑定）
      description: 渠道不是 Telegram → 400 `invalid_channel`。
      parameters:
        - { $ref: '#/components/parameters/NotificationChannelIdPath' }
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 绑定码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLink' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/push/vapid-key:
    get:
      tags: [notifications]
      operationId: getVapidKey
      summary: Web Push 的 VAPID 公钥（`applicationServerKey`）
      responses:
        '200':
          description: 公钥
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VapidKey' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/push/subscriptions:
    get:
      tags: [notifications]
      operationId: listPushSubscriptions
      summary: 推送订阅（所有浏览器 / 设备）
      responses:
        '200':
          description: 订阅列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSubscriptionList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [notifications]
      operationId: createPushSubscription
      summary: 登记推送订阅（Web Push / UnifiedPush 按 `endpoint` upsert，FCM 按 `token` upsert；`userAgent` 取请求头；订阅归属当前网页会话或设备）
      description: |
        `kind` 缺省为 `webpush`：`endpoint` 须是 `https://`（`http://` 仅允许回环主机）；`keys.p256dh` 解码后须为 65 字节且以 0x04 开头、
        `keys.auth` 解码后须为 16 字节，否则 400 `push_invalid`。
        `kind: fcm`：须带 `token`（FCM 注册令牌）与 `keys`（App 生成的 RFC 8291 接收端密钥，校验同上），不得带 `endpoint`；
        缺 `keys` 或形态错误 → 400 `push_invalid`。FCM 载荷用这对密钥加密（`data` 只有 `{v:"2", id, e}`，见 docs/protocol.md「M7：移动推送」）。
        服务器未配置 FCM（`orynd.yaml` 的 `push.fcm.service_account_secret` 为空或该密钥不存在）时 409 `fcm_unavailable`。
        按 `token` upsert（再次登记覆盖 `keys`），返回的订阅 `endpoint` 即该令牌。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses:
        '201':
          description: 订阅
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSubscription' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/push/subscriptions/{id}:
    parameters:
      - { $ref: '#/components/parameters/PushSubscriptionIdPath' }
    delete:
      tags: [notifications]
      operationId: deletePushSubscription
      summary: 删除推送订阅
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Space、全局助手、定时与协调宿主（M9）
  /api/v1/spaces:
    get:
      tags: [spaces]
      operationId: listSpaces
      summary: Space 列表（按名称）
      parameters:
        - name: archived
          in: query
          description: 为 true 时同时返回已归档的 Space；缺省只返回未归档
          schema: { type: boolean }
      responses:
        '200':
          description: Space 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [spaces]
      operationId: createSpace
      summary: 新建 Space（同时创建它的协调聊天线程）
      description: |
        需要协调宿主可用：不可用时 409 `coordinator_unavailable`（`message` 为具体原因）。
        名称已被占用 → 409 `space_name_taken`；项目不存在 → 404 `not_found`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/spaces/{id}:
    parameters:
      - { $ref: '#/components/parameters/SpaceIdPath' }
    get:
      tags: [spaces]
      operationId: getSpace
      summary: Space 详情
      responses:
        '200':
          description: Space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [spaces]
      operationId: updateSpace
      summary: 修改 Space（改名同步聊天线程标题；`archived` 同步归档聊天线程）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpacePatch' }
      responses:
        '200':
          description: 修改后的 Space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [spaces]
      operationId: deleteSpace
      summary: 删除 Space（删除其聊天线程；其工作线程保留并移出 Space，其项目定时的 `spaceId` 清空）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/spaces/{id}/progress:
    parameters:
      - { $ref: '#/components/parameters/SpaceIdPath' }
    get:
      tags: [spaces]
      operationId: getSpaceProgress
      summary: 近 N 天的 Shipped / Archived / Open 进度（按自然日，最早的一天在前）
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
        - name: tz
          in: query
          description: IANA 时区，决定自然日的边界；缺省 `UTC`，非法 → 400 `invalid_request`
          schema: { type: string }
      responses:
        '200':
          description: 进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceProgress' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/conversations:
    post:
      tags: [spaces]
      operationId: createAssistantConversation
      summary: 新建一个全局助手对话（`kind = assistant` 的线程；标题由 agent 自动生成）
      description: |
        需要协调宿主可用：不可用时 409 `coordinator_unavailable`（`message` 为具体原因）。请求体可省略；给了 `prompt` / `files` /
        `images` 时新对话以它们作为第一条用户消息（`files` 是文件库里的文件 id，绑定到新对话）。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAssistantConversationRequest' }
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/mcp-servers:
    get:
      tags: [spaces]
      operationId: listAssistantMcpServers
      summary: 全局 `mcp.json` 里的服务器及其对全局助手是否可用（M19）
      description: |
        解析全局配置的 `mcp.json`（已停用的条目不列）。只有 HTTP / SSE 传输、鉴权头可由 orynd 注入的服务器可以给助手用；
        其余标 `usable: false` 并给出原因。解析失败 → 200 空列表。
      responses:
        '200':
          description: 服务器列表（按名字排序）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantMcpServerList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/main:
    get:
      tags: [spaces]
      operationId: getAssistantMain
      summary: 全局助手的主线对话（M19；没有则创建）
      description: |
        主线是 `kind = assistant`、`main = true` 的单例，不能归档或删除，不出现在助手对话列表里。
        需要新建而协调宿主不可用时 409 `coordinator_unavailable`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 主线
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/main/notes:
    get:
      tags: [spaces]
      operationId: getAssistantNotes
      summary: 主线备忘（M19）
      responses:
        '200':
          description: 备忘
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantNotes' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [spaces]
      operationId: putAssistantNotes
      summary: 改写主线备忘（整体替换，上限 1500 字，超出 → 400 `invalid_request`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantNotes' }
      responses:
        '200':
          description: 写入后的备忘
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantNotes' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/computer:
    get:
      tags: [spaces]
      operationId: getAssistantComputer
      summary: 助手的电脑（M19）：还没有时 `orbId` 省略
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantComputer' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/computer/wake:
    post:
      tags: [spaces]
      operationId: wakeAssistantComputer
      summary: 唤醒助手的电脑（没有则创建），等到就绪（至多 90 秒，超时 409 `computer_starting`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantComputer' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/computer/pause:
    post:
      tags: [spaces]
      operationId: pauseAssistantComputer
      summary: 冻结助手的电脑（没有 → 404 `not_found`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantComputer' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/computer/reset:
    post:
      tags: [spaces]
      operationId: resetAssistantComputer
      summary: 删除助手的电脑；下次用到时重新创建（没有 → 200，幂等）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 重置后的状态（`orbId` 省略）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantComputer' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/files:
    get:
      tags: [spaces]
      operationId: listAssistantFiles
      summary: 全局助手文件库（新的在前）
      parameters:
        - name: threadId
          in: query
          description: 只看该助手对话可见的文件（它自己的 + 库内共享的）
          schema: { $ref: '#/components/schemas/ThreadId' }
        - name: scope
          in: query
          schema: { $ref: '#/components/schemas/AssistantFileScope' }
      responses:
        '200':
          description: 文件列表（不含尚未随消息发送的上传）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantFileList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [spaces]
      operationId: uploadAssistantFile
      summary: 上传文件到全局助手文件库（单文件 ≤100MiB；24h 内未随消息发送即被清理）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: name
          in: query
          required: true
          description: 原始文件名（服务端净化后 ≤200 字节）
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: threadId
          in: query
          description: 所属助手对话；缺省 = 随 `createAssistantConversation` 的 `files` 绑定
          schema: { $ref: '#/components/schemas/ThreadId' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantFile' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/files/{id}:
    parameters:
      - { $ref: '#/components/parameters/AssistantFileIdPath' }
    patch:
      tags: [spaces]
      operationId: patchAssistantFile
      summary: 切换文件的可见范围（所属对话 / 库内共享）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssistantFilePatch' }
      responses:
        '200':
          description: 修改后的文件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssistantFile' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [spaces]
      operationId: deleteAssistantFile
      summary: 删除文件库里的文件（已复制给其它线程的附件不受影响）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/files/{id}/content:
    parameters:
      - { $ref: '#/components/parameters/AssistantFileIdPath' }
    get:
      tags: [spaces]
      operationId: getAssistantFileContent
      summary: 下载文件库里的文件（支持 `Range`；响应头规则同 `getAttachmentContent`）
      parameters:
        - name: inline
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 文件字节
          content:
            '*/*':
              schema: { type: string, format: binary }
        '206':
          description: Range 请求的部分字节
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts:
    get:
      tags: [artifacts]
      operationId: listArtifacts
      summary: 列出 artifact（最近更新的在前）
      parameters:
        - name: deleted
          in: query
          description: true = 只列「最近删除」里的；缺省只列未删除的
          schema: { type: boolean, default: false }
        - name: threadId
          in: query
          description: 只列该线程创建或写过版本的
          schema: { $ref: '#/components/schemas/ThreadId' }
        - name: projectId
          in: query
          schema: { $ref: '#/components/schemas/ProjectId' }
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    get:
      tags: [artifacts]
      operationId: getArtifact
      summary: artifact 详情（某个版本的文件清单与能力声明）
      parameters:
        - name: version
          in: query
          description: 缺省 = 最新版本
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactDetail' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [artifacts]
      operationId: patchArtifact
      summary: 重命名（不产生版本；回收站里的不能改）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactPatch' }
      responses:
        '200':
          description: 修改后的 artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [artifacts]
      operationId: deleteArtifact
      summary: 移到「最近删除」（保留 30 天）；`permanent=true` 永久删除回收站里的 artifact
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: permanent
          in: query
          schema: { type: boolean, default: false }
        - name: unpublish
          in: query
          description: 同时取消发布（软删除时；永久删除总会连带删除发布记录）
          schema: { type: boolean, default: false }
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/restore:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    post:
      tags: [artifacts]
      operationId: undeleteArtifact
      summary: 从「最近删除」恢复
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 恢复后的 artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/opened:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    post:
      tags: [artifacts]
      operationId: markArtifactOpened
      summary: 记一次「打开」（总览页按最近打开排序、首屏最近项用；存服务端，换设备一致）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已记录 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/versions:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    get:
      tags: [artifacts]
      operationId: listArtifactVersions
      summary: 版本列表（新的在前）
      responses:
        '200':
          description: 版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactVersionList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/versions/{n}/restore:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
      - { $ref: '#/components/parameters/ArtifactVersionPath' }
    post:
      tags: [artifacts]
      operationId: restoreArtifactVersion
      summary: 把旧版本复制成新的最新版本（作者是用户）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactRestoreVersion' }
      responses:
        '200':
          description: 恢复后的 artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '409':
          description: '`baseVersion` 之后相关文件被改过'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactConflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/file:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    get:
      tags: [artifacts]
      operationId: getArtifactFile
      summary: '下载某个版本里的一个文件（栅格图 inline，其余一律 attachment；带 `Content-Security-Policy: sandbox`，主域上从不把 HTML 当页面渲染）'
      parameters:
        - name: version
          in: query
          description: 缺省 = 最新版本
          schema: { type: integer, minimum: 1 }
        - name: path
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: 文件字节
          content:
            '*/*':
              schema: { type: string, format: binary }
        '206':
          description: Range 请求的部分字节
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/frames:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    post:
      tags: [artifacts]
      operationId: openArtifactFrame
      summary: 申请一个渲染帧（独立源里的沙箱页面）；帧令牌就是访问凭证，orynd 重启后全部失效
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactFrameRequest' }
      responses:
        '201':
          description: 帧
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactFrame' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifact-frames/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ArtifactFrameToken' }
    delete:
      tags: [artifacts]
      operationId: closeArtifactFrame
      summary: 关闭渲染帧（查看器卸载时调用；不存在也回 204）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已关闭 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/open-link:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    post:
      tags: [artifacts]
      operationId: openArtifactLink
      summary: 申请「在浏览器中打开」的顶层地址（短时有效的顶层帧，地址自带令牌、不需要登录态）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactFrameRequest' }
      responses:
        '200':
          description: 地址
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactOpenLink' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/import:
    post:
      tags: [artifacts]
      operationId: importArtifact
      summary: 导入一个 HTML 文件或带 index.html / canvas.json 的文件夹（每个 part 的字段名是相对路径）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: projectId
          in: query
          schema: { $ref: '#/components/schemas/ProjectId' }
        - name: name
          in: query
          description: 上传时的文件名或文件夹名（没有 `<title>` 时作标题）
          schema: { type: string, maxLength: 1024 }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties:
                type: string
                format: binary
      responses:
        '201':
          description: 已导入
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        default:
          description: 错误；导入特有的错误码：`too_large`、`too_many`（413）、`no_index`、`bad_canvas`、`bad_name`、`not_utf8`（400）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/v1/artifacts/{id}/export:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    get:
      tags: [artifacts]
      operationId: exportArtifact
      summary: 导出某个版本（`html` 只对单文件版本可用；`zip` 打包全部文件）
      parameters:
        - name: version
          in: query
          description: 缺省 = 最新版本
          schema: { type: integer, minimum: 1 }
        - name: format
          in: query
          required: true
          schema: { $ref: '#/components/schemas/ArtifactExportFormat' }
      responses:
        '200':
          description: '文件（`Content-Disposition: attachment`）'
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/capabilities:
    get:
      tags: [artifacts]
      operationId: getArtifactCapabilities
      summary: 本控制面的 artifact 能力（帧的寻址方式、能否渲染、能否向模型提问）
      responses:
        '200':
          description: 能力
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactCapabilities' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/comments:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    get:
      tags: [artifacts]
      operationId: listArtifactComments
      summary: 评论串（旧的在前）；返回前把锚点在最新版本上重新定位
      responses:
        '200':
          description: 评论串
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactCommentThreadList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [artifacts]
      operationId: createArtifactComment
      summary: 新建一个评论串（作者是用户）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactCommentCreate' }
      responses:
        '201':
          description: 新的评论串
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactCommentThread' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/comments/sent:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    post:
      tags: [artifacts]
      operationId: markArtifactCommentsSent
      summary: 记下这些评论串已发给某个线程
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactCommentsSent' }
      responses:
        '204': { description: 已记录 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/comments/{threadId}:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
      - { $ref: '#/components/parameters/ArtifactCommentThreadIdPath' }
    patch:
      tags: [artifacts]
      operationId: patchArtifactComment
      summary: 标为已解决 / 重新打开
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactCommentPatch' }
      responses:
        '200':
          description: 修改后的评论串
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactCommentThread' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/comments/{threadId}/replies:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
      - { $ref: '#/components/parameters/ArtifactCommentThreadIdPath' }
    post:
      tags: [artifacts]
      operationId: replyArtifactComment
      summary: 用户回复（清掉该串的已发送标记）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactCommentReply' }
      responses:
        '200':
          description: 修改后的评论串
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactCommentThread' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/element:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    post:
      tags: [artifacts]
      operationId: editArtifactElement
      summary: 直接编辑页面上的一个元素（文字与 7 个样式属性），落成一个用户版本
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactElementEdit' }
      responses:
        '200':
          description: 新版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactVersionRef' }
        '409':
          description: 元素所在的文件在 `baseVersion` 之后被改过，或偏移处已不是该标签
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactConflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/thumbnail:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    get:
      tags: [artifacts]
      operationId: getArtifactThumbnail
      summary: 缩略图（720×450 JPEG）；请求的版本还没有时回最近一个有缩略图的更早版本，都没有回 404 `no_thumbnail`
      parameters:
        - name: version
          in: query
          description: 缺省 = 最新版本
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/render.png:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    get:
      tags: [artifacts]
      operationId: renderArtifactPng
      summary: 在控制面渲染某个页面并下载 PNG（渲染不可用回 503 `render_unavailable`）
      parameters:
        - name: version
          in: query
          schema: { type: integer, minimum: 1 }
        - name: path
          in: query
          description: 缺省 = 入口文件
          schema: { type: string, maxLength: 512 }
        - name: width
          in: query
          schema: { type: integer, minimum: 64, maximum: 8000, default: 1280 }
        - name: height
          in: query
          schema: { type: integer, minimum: 64, maximum: 8000, default: 800 }
      responses:
        '200':
          description: PNG（`Content-Disposition` 为 attachment）
          content:
            image/png:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/canvas:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    get:
      tags: [artifacts]
      operationId: getArtifactCanvas
      summary: 画布的实时状态（最新版本 + 尚未落成版本的用户操作）
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactCanvasState' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/canvas/ops:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    post:
      tags: [artifacts]
      operationId: applyArtifactCanvasOps
      summary: 提交画布操作（实时广播给观看者；静默 30 秒后落成一个用户版本）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactCanvasOps' }
      responses:
        '200':
          description: 已应用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactCanvasSeq' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/params:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    put:
      tags: [artifacts]
      operationId: setArtifactParams
      summary: 写回页面声明的调节参数（`data-oryn-params`），落成一个用户版本
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactParamsSet' }
      responses:
        '200':
          description: 新版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactVersionRef' }
        '409':
          description: 文件在 `baseVersion` 之后被改过
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactConflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifact-consents:
    get:
      tags: [artifacts]
      operationId: listArtifactConsents
      summary: 已授权的 artifact 能力（不含回收站里的）
      responses:
        '200':
          description: 授权
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactConsentList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifact-consents/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: '`POST` 时是同意请求 id；`DELETE` 时是 artifact id'
        schema: { type: string, maxLength: 64 }
    post:
      tags: [artifacts]
      operationId: answerArtifactConsent
      summary: 回答一个同意请求（第一个回答生效；请求已结束时回 404）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactConsentAnswer' }
      responses:
        '204': { description: 已记录 }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [artifacts]
      operationId: revokeArtifactConsents
      summary: 收回一个 artifact 的全部能力授权
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已收回 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/publication:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    get:
      tags: [artifacts]
      operationId: getArtifactPublication
      summary: 发布状态
      responses:
        '200':
          description: 发布状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPublicationState' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [artifacts]
      operationId: publishArtifact
      summary: 发布或更新发布（访问级别、版本、是否跟随最新）；`code` / `public` 先做密钥扫描
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactPublishRequest' }
      responses:
        '200':
          description: 发布状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPublicationState' }
        '409':
          description: '`secrets_found`：扫描有命中且未确认'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareScanConflict' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [artifacts]
      operationId: unpublishArtifact
      summary: 取消发布（链接随即失效）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已取消 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifacts/{id}/publication/code:
    parameters:
      - { $ref: '#/components/parameters/ArtifactIdPath' }
    post:
      tags: [artifacts]
      operationId: rotateArtifactPublicationCode
      summary: 换一个访问码（旧码与已发出的授权随即失效，并解除锁定）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 发布状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPublicationState' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifact-publications:
    get:
      tags: [artifacts]
      operationId: listArtifactPublications
      summary: 全部已发布的 artifact
      responses:
        '200':
          description: 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPublicationList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/artifact-publications/{slug}/grant:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { $ref: '#/components/schemas/ArtifactFrameToken' }
    post:
      tags: [artifacts]
      operationId: grantArtifactPublication
      summary: 所有者直接打开自己的私有或访问码发布页：返回带授权段的地址
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 地址
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactOpenLink' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/settings/artifacts:
    get:
      tags: [artifacts]
      operationId: getArtifactPrefs
      summary: Artifacts 设置
      responses:
        '200':
          description: 设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPrefs' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [artifacts]
      operationId: putArtifactPrefs
      summary: 修改 Artifacts 设置
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactPrefs' }
      responses:
        '200':
          description: 修改后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactPrefs' }
        default: { $ref: '#/components/responses/Error' }
  # ---------------------------------------------------------------- memory (M16)
  /api/v1/memory/settings:
    get:
      tags: [memory]
      operationId: getMemorySettings
      summary: 记忆的连接与全局开关
      responses:
        '200':
          description: 设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorySettings' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [memory]
      operationId: putMemorySettings
      summary: 修改连接地址与全局开关
      description: |
        `hindsightUrl` 的主机不是 `127.0.0.1`、`localhost`、`::1` 或私有网段地址时必须用 `https://`，否则 400 `insecure_url`。
        全局开关变化时，运行中且需重启的线程进入 apply-status 的待重启列表（原因 `memory`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemorySettingsUpdate' }
      responses:
        '200':
          description: 修改后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorySettings' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/status:
    get:
      tags: [memory]
      operationId: getMemoryStatus
      summary: Hindsight 的连接状态、版本与记忆数（实时探测，最多 10 秒）
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/env-file:
    post:
      tags: [memory]
      operationId: createMemoryEnvFile
      summary: 生成 Hindsight 的 .env（同时轮换 Hindsight API key 与中转令牌，旧值立即失效）
      description: 返回的两个密钥只在这一次出现；之后的 `.env` 片段（模型协议变化时）用占位文本代替它们。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 完整的 .env 内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEnvFile' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/projects:
    get:
      tags: [memory]
      operationId: listMemoryProjects
      summary: 各项目的记忆开关（未单独设置的跟随全局）
      responses:
        '200':
          description: 全部未归档项目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryProjectList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/projects/{id}:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    put:
      tags: [memory]
      operationId: putMemoryProject
      summary: 设置项目的记忆开关
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryProjectUpdate' }
      responses:
        '200':
          description: 修改后的开关
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryProjectToggle' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/models:
    get:
      tags: [memory]
      operationId: getMemoryModels
      summary: 每种用途选定的模型、协议类型与是否需要重启 Hindsight
      responses:
        '200':
          description: 五种用途，顺序固定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryModels' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [memory]
      operationId: putMemoryModels
      summary: 修改各用途的模型（未列出或不带 providerKey 的用途跟随 default；default 必须指定）
      description: 模型必须在中央模型目录里，且 provider 的协议属于 openai 兼容、anthropic 或 gemini 之一，否则 400 `unsupported_model`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryModelsUpdate' }
      responses:
        '200':
          description: 修改后的选择
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryModels' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/models/deployed:
    post:
      tags: [memory]
      operationId: confirmMemoryModelsDeployed
      summary: 主人已按新 .env 重启 Hindsight：把各用途已部署的协议类型更新为当前选择
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 更新后的选择（needsRestart 全部为 false）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryModels' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/endpoints:
    get:
      tags: [memory]
      operationId: getMemoryEndpoints
      summary: 嵌入与重排的远端接口
      responses:
        '200':
          description: 接口配置（key 只回报是否已设置）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEndpoints' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/endpoints/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/MemoryEndpointKind' }
    put:
      tags: [memory]
      operationId: putMemoryEndpoint
      summary: 修改嵌入或重排接口
      description: |
        bank 已有记忆（`embedLocked`）时，修改嵌入的 `model` 或 `dimensions` 返回 409 `embed_locked`；地址与 key 仍可改。
        换嵌入模型（reembed）时带 `reembed: true`：orynd 先探测 Hindsight，仍可连上时返回 409 `hindsight_running`
        （对外只有一个别名 `oryn-embed`，Hindsight 认不出模型已换，运行中切换会让它用新模型读写旧向量），
        不可达（API 已停）时才接受。流程见 deploy.md「换嵌入模型」。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryEndpointUpdate' }
      responses:
        '200':
          description: 修改后的接口
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEndpoints' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [memory]
      operationId: deleteMemoryEndpoint
      summary: 删除重排接口（之后 Hindsight 改用 rrf，需按 envSnippet 改 .env 并重启）
      description: 只允许 `rerank`；`embed` 返回 400 `invalid_request`（嵌入接口不能删除）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 删除后的接口配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryEndpoints' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/usage:
    get:
      tags: [memory]
      operationId: getMemoryUsage
      summary: 中转计数：各用途最近 24 小时与 7 天的调用次数和 token 数
      responses:
        '200':
          description: 用量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryUsage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/documents:
    get:
      tags: [memory]
      operationId: listMemoryDocuments
      summary: 按项目或全局列出记忆 document（按更新时间倒序）
      parameters:
        - { name: projectId, in: query, schema: { $ref: '#/components/schemas/ProjectId' }, description: 与 `global` 二选一 }
        - { name: global, in: query, schema: { type: boolean }, description: 为真时列全局记忆 }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: 一页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryDocumentList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/documents/{documentId}:
    parameters:
      - { $ref: '#/components/parameters/MemoryDocumentIdPath' }
    delete:
      tags: [memory]
      operationId: deleteMemoryDocument
      summary: 删除一个 document（连同 Hindsight 从它派生的记忆）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/search:
    get:
      tags: [memory]
      operationId: searchMemory
      summary: 在项目（含全局）或仅全局范围内召回
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 800 } }
        - { name: projectId, in: query, schema: { $ref: '#/components/schemas/ProjectId' }, description: 省略 = 只搜全局 }
      responses:
        '200':
          description: 召回结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemorySearchResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/threads/{id}/forget:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    post:
      tags: [memory]
      operationId: forgetMemoryThread
      summary: 按线程遗忘：删除该线程写入的全部 document
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 删除结果（失败的进入重试队列，计入 pending）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryForgetResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/memory/candidates:
    get:
      tags: [memory]
      operationId: listMemoryCandidates
