      properties:
        documentId: { $ref: '#/components/schemas/MemoryDocumentId' }
        projectId: { $ref: '#/components/schemas/ProjectId' }
        attempts: { type: integer }
        nextAttemptAt: { type: integer, format: int64 }
        lastError: { type: string }
    MemoryPendingDeleteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MemoryPendingDelete' }
    MemoryExport:
      type: object
      required: [id, state, createdAt]
      properties:
        id: { type: string }
        state:
          type: string
          enum: [running, done, failed]
          x-enum-varnames: [MemoryExportRunning, MemoryExportDone, MemoryExportFailed]
        error: { type: string }
        createdAt: { type: integer, format: int64 }
    # ============================================================ owner memory（M17）
    OwnerMemoryDecideEndpoint:
      type: object
      required: [baseUrl, model, hasKey]
      properties:
        baseUrl: { type: string, description: Decisions API 根地址（不含 `/v1beta`） }
        model: { type: string, description: 如 `gemini-decision-1` }
        hasKey: { type: boolean }
    OwnerMemoryDecideUpdate:
      type: object
      required: [baseUrl, model]
      properties:
        baseUrl: { type: string }
        model: { type: string, minLength: 1, maxLength: 128 }
        apiKey: { type: string, description: 省略 = 保留原值 }
    OwnerMemorySettings:
      type: object
      required: [enabled, available, ownerNames]
      properties:
        enabled: { type: boolean, description: 助手记忆开关 }
        available: { type: boolean, description: M16 记忆已启用且已配置；为假时助手记忆不运行 }
        ownerNames:
          type: array
          description: 主人的名字与别名，写入时这些名字一律归为「主人」
          items: { type: string, minLength: 1, maxLength: 64 }
        decide: { $ref: '#/components/schemas/OwnerMemoryDecideEndpoint' }
    OwnerMemorySettingsUpdate:
      type: object
      required: [enabled, ownerNames]
      properties:
        enabled: { type: boolean }
        ownerNames:
          type: array
          maxItems: 16
          items: { type: string, minLength: 1, maxLength: 64 }
    OwnerMemoryStatus:
      type: object
      required: [state, backfillTotal, backfillDone, failingSources, pendingExplicit]
      properties:
        state:
          type: string
          description: |
            `unavailable`（M16 记忆未启用或未配置）、`disabled`（助手记忆关闭）、`ok`、`error`（连不上 Hindsight 等，见 error）。
          enum: [unavailable, disabled, ok, error]
          x-enum-varnames: [OwnerMemoryStateUnavailable, OwnerMemoryStateDisabled, OwnerMemoryStateOk, OwnerMemoryStateError]
        memoryCount: { type: integer, format: int64, description: bank `oryn-owner` 的记忆数 }
        documentCount: { type: integer, format: int64 }
        backfillSince: { type: integer, format: int64, description: 回填起点（Unix 毫秒） }
        backfillTotal: { type: integer }
        backfillDone: { type: integer }
        failingSources: { type: integer, description: 写入失败、等待重试的来源数 }
        pendingExplicit: { type: integer, description: 待确认的明确记忆数 }
        lastCuratedAt: { type: integer, format: int64 }
        usageDay: { $ref: '#/components/schemas/MemoryUsageCounts' }
        usageWeek: { $ref: '#/components/schemas/MemoryUsageCounts' }
        error: { type: string }
    OwnerMemoryTopic:
      type: object
      required: [id, name, scope, seed, status, stale]
      properties:
        id: { type: string }
        name: { type: string }
        scope: { type: string, description: 范围说明 }
        seed: { type: boolean, description: 固定种子（owner-profile），不会被归档 }
        status:
          type: string
          enum: [active, archived]
          x-enum-varnames: [OwnerMemoryTopicActive, OwnerMemoryTopicArchived]
        content: { type: string, description: 当前内容（注入的就是它） }
        stale: { type: boolean, description: 遗忘后等待刷新，期间不进入注入 }
        lastRefreshedAt: { type: integer, format: int64 }
    OwnerMemoryCuration:
      type: object
      required: [at, created, archived, kept]
      properties:
        at: { type: integer, format: int64 }
        created: { type: array, items: { type: string }, description: 新建的主题名 }
        archived: { type: array, items: { type: string } }
        kept: { type: array, items: { type: string } }
        error: { type: string }
    OwnerMemoryTopicList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OwnerMemoryTopic' }
        lastCuration: { $ref: '#/components/schemas/OwnerMemoryCuration' }
    OwnerMemoryBrief:
      type: object
      required: [content, generatedAt, cached]
      properties:
        content: { type: string, description: 追加到系统提示词的记忆段；助手记忆关闭时为空串 }
        generatedAt: { type: integer, format: int64 }
        cached: { type: boolean, description: 来自该对话的快照 }
    OwnerMemoryProvenance:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: '`owner`（来源只含主人消息）、`mixed`（含助手或 agent 消息，角色未确认）、`explicit`（明确记忆）、`unknown`（无法回溯）'
          enum: [owner, mixed, explicit, unknown]
          x-enum-varnames: [OwnerMemoryProvenanceOwner, OwnerMemoryProvenanceMixed, OwnerMemoryProvenanceExplicit, OwnerMemoryProvenanceUnknown]
        threadId: { $ref: '#/components/schemas/ThreadId' }
        threadTitle: { type: string }
        threadKind: { type: string }
        seqFrom: { type: integer, format: int64 }
        seqTo: { type: integer, format: int64 }
        documentId: { type: string }
    OwnerMemoryFact:
      type: object
      required: [id, type, text, state, provenance]
      properties:
        id: { type: string }
        type: { type: string, description: '`world` 或 `observation`' }
        text: { type: string }
        state:
          type: string
          enum: [valid, invalidated]
          x-enum-varnames: [OwnerMemoryFactValid, OwnerMemoryFactInvalidated]
        mentionedAt: { type: string }
        provenance: { $ref: '#/components/schemas/OwnerMemoryProvenance' }
    OwnerMemoryFactList:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OwnerMemoryFact' }
        hasMore: { type: boolean }
    OwnerMemoryFactStateUpdate:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [valid, invalidated]
        reason: { type: string, maxLength: 400 }
    OwnerMemorySource:
      type: object
      required: [threadId, kind, chunks, attempts, missing]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        threadTitle: { type: string }
        threadKind: { type: string }
        projectId: { $ref: '#/components/schemas/ProjectId' }
        kind:
          type: string
          enum: [conv, thread]
          x-enum-varnames: [OwnerMemorySourceConv, OwnerMemorySourceThread]
        chunks: { type: integer }
        retainedAt: { type: integer, format: int64 }
        attempts: { type: integer }
        nextAttemptAt: { type: integer, format: int64 }
        lastError: { type: string }
        missing: { type: boolean, description: 线程已删除，document 待清理 }
    OwnerMemorySourceList:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OwnerMemorySource' }
        hasMore: { type: boolean }
    OwnerMemoryExclusionKind:
      type: string
      enum: [thread, project]
      x-enum-varnames: [OwnerMemoryExclusionThread, OwnerMemoryExclusionProject]
    OwnerMemoryExclusion:
      type: object
      required: [kind, targetId, createdAt]
      properties:
        kind: { $ref: '#/components/schemas/OwnerMemoryExclusionKind' }
        targetId: { type: string }
        name: { type: string, description: 对话标题或项目名 }
        createdAt: { type: integer, format: int64 }
    OwnerMemoryExclusionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OwnerMemoryExclusion' }
    OwnerMemoryExplicit:
      type: object
      required: [id, content, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        content: { type: string }
        ownerQuote: { type: string, description: 助手调用 remember 时给出的主人原话 }
        sourceThreadId: { $ref: '#/components/schemas/ThreadId' }
        sourceThreadTitle: { type: string }
        status:
          type: string
          enum: [pending, active]
          x-enum-varnames: [OwnerMemoryExplicitPending, OwnerMemoryExplicitActive]
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
    OwnerMemoryExplicitList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OwnerMemoryExplicit' }
    LinkCtlAgentMemory:
      type: object
      description: |
        M16：本次 agent 启用 Hindsight 记忆（字段缺省 = 不启用）。orbd 写 `--config` 覆盖文件（`memory.backend: hindsight`、
        `hindsight.globalScope: true`），注入 `HINDSIGHT_API_URL=http://127.0.0.1:7811/memory/t/<threadId>`、`HINDSIGHT_BANK_ID=oryn`、
        `HINDSIGHT_SCOPING=per-project-tagged`、`NO_PROXY`；有 `project` 时注入 `ORYN_HINDSIGHT_PROJECT`，`autoRetain` 为假时注入
        `HINDSIGHT_AUTO_RETAIN=false`。只有 hello 含 `memory` 的 orbd 会收到。
      required: [autoRetain]
      properties:
        project: { type: string, pattern: '^[a-z0-9_]{1,64}$', description: 项目 ID 转小写；省略 = 无项目线程 }
        autoRetain: { type: boolean }
    CreateAssistantConversationRequest:
      type: object
      description: 新助手对话的第一条用户消息；全部省略 = 空对话
      properties:
        prompt: { type: string }
        files:
          type: array
          maxItems: 20
          description: 文件库里的文件 id（`uploadAssistantFile`）；绑定到新对话
          items: { $ref: '#/components/schemas/AssistantFileId' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageContent' }
        model: { $ref: '#/components/schemas/ModelRef' }
        thinkingLevel: { type: string }
    AssistantSettings:
      type: object
      description: 全局助手的设置（M19）
      required: [webAccess, disabledMcpServers, computer]
      properties:
        webAccess:
          type: boolean
          description: 联网总开关：关闭时协调宿主的正向代理拒绝一切 CONNECT 与转发（`web_search`、读网页随之失败）
        disabledMcpServers:
          type: array
          maxItems: 200
          description: 全局 `mcp.json` 里助手不用的服务器名
          items: { type: string, minLength: 1, maxLength: 200 }
        computer: { $ref: '#/components/schemas/AssistantComputerSettings' }
    AssistantComputerSettings:
      type: object
      description: 助手的电脑下一次创建时用的 provider 与 orb 类型；省略 = 默认解析
      properties:
        provider: { type: string }
        orbType: { type: string }
    AssistantMcpServer:
      type: object
      required: [name, transport, usable, enabled]
      properties:
        name: { type: string }
        transport:
          type: string
          enum: [http, sse, stdio]
          x-enum-varnames: [McpTransportHttp, McpTransportSse, McpTransportStdio]
        host:
          type: string
          description: URL 的主机（HTTP / SSE）
        usable:
          type: boolean
          description: 助手能否使用（传输与鉴权方式受支持）
        reason:
          type: string
          description: '`usable: false` 的原因：`stdio` 本地进程型；`oauth` 需要 OAuth；`command_header` 头由命令生成；`unresolved_env` 头引用了不存在的环境变量；`invalid_url` 地址无效'
          enum: [stdio, oauth, command_header, unresolved_env, invalid_url]
          x-enum-varnames: [McpReasonStdio, McpReasonOauth, McpReasonCommandHeader, McpReasonUnresolvedEnv, McpReasonInvalidUrl]
        enabled:
          type: boolean
          description: 不在助手设置的禁用表里
    AssistantMcpServerList:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items: { $ref: '#/components/schemas/AssistantMcpServer' }
    AssistantNotes:
      type: object
      description: 主线备忘（M19，助手每段开头带上）
      required: [text]
      properties:
        text:
          type: string
          description: 上限 1500 字（按 Unicode 字符计）
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          readOnly: true
    AssistantComputer:
      type: object
      description: 助手的电脑（M19）
      required: [toolsReady]
      properties:
        orbId:
          allOf:
            - $ref: '#/components/schemas/OrbId'
          description: 还没有电脑时省略
        state: { $ref: '#/components/schemas/OrbState' }
        providerName: { type: string }
        type: { type: string }
        toolsReady:
          type: boolean
          description: 电脑里的工具定义已缓存（`computer_*` 工具从下一轮起可用）

    # ============================================================ provider（客户端视图）
    OrbType:
      type: object
      required: [name, cpus, memoryMB]
      properties:
        name: { type: string }
        cpus: { type: number }
        memoryMB: { type: integer }
        features:
          type: array
          description: '该类型 orb 的可选能力（M11a）：`docker` = orb 内可用 Docker（嵌套 Docker，由 orbd 监督 dockerd）'
          items: { type: string }
    ProviderCapabilities:
      type: object
      required: [freeze, snapshot]
      properties:
        freeze: { type: boolean }
        snapshot: { type: boolean }
        offlineFs:
          type: boolean
          description: 能经 `/provider/v1/fs/*` 只读读取停机 orb 的文件（缺省 false）
    Provider:
      type: object
      required: [id, name, online, orbTypes, createdAt]
      properties:
        id: { $ref: '#/components/schemas/ProviderId' }
        name: { type: string }
        driver: { $ref: '#/components/schemas/ProviderDriver' }
        capabilities: { $ref: '#/components/schemas/ProviderCapabilities' }
        orbTypes:
          type: array
          items: { $ref: '#/components/schemas/OrbType' }
        defaultType: { type: string }
        online:
          type: boolean
          description: 是否有实例持有未过期租约
        instanceId: { type: string }
        leaseUntil: { $ref: '#/components/schemas/TimestampMs' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        disabledAt: { $ref: '#/components/schemas/TimestampMs' }
    ProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/Provider' }
        orbDefaults: { $ref: '#/components/schemas/OrbDefaults' }
    OrbDefaults:
      type: object
      description: >-
        控制面配置的 `orb_defaults`（新建 orb 省略 provider / 类型时，排在项目默认之后、provider 的 `defaultType` 之前）；
        未配置的字段省略。客户端据此预先显示新 orb 会落到哪个 provider / 类型。
      properties:
        provider: { type: string }
        type: { type: string }
    ProviderCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$' }
    ProviderCreateResponse:
      type: object
      required: [provider, token]
      properties:
        provider: { $ref: '#/components/schemas/Provider' }
        token:
          type: string
          description: '`opv_…`，只显示这一次'

    # ============================================================ runner（M11b）
    RunnerDir:
      type: object
      description: runner 声明（`orbd run --runner --dir`）的一个可用目录
      required: [path, name, git]
      properties:
        path:
          type: string
          description: 解析符号链接后的绝对路径
        name:
          type: string
          description: 显示名（目录的最后一段）
        git:
          type: boolean
          description: 该目录本身是 git 仓库（含 `.git`），可在其旁边新建 worktree
    Runner:
      type: object
      description: runner = 一行 `driver = runner` 的 provider + 一台常驻 orb（`kind = runner`）
      required: [id, name, online, orbId, dirs, features, createdAt]
      properties:
        id: { $ref: '#/components/schemas/ProviderId' }
        name: { type: string }
        online:
          type: boolean
          description: 其 orb 处于 `ready`（link 在线）
        orbId: { $ref: '#/components/schemas/OrbId' }
        hostname:
          type: string
          description: 最近一次 hello 上报的主机名；从未接入时省略
        os: { type: string }
        arch: { type: string }
        dirs:
          type: array
          description: 最近一次 hello 上报的目录；从未接入时为空
          items: { $ref: '#/components/schemas/RunnerDir' }
        features:
          type: array
          description: 最近一次 hello 上报的特性（同 `LinkCtlHelloParams.features`）
          items: { type: string }
        orbdVersion: { type: string }
        agentVersion: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        lastSeenAt:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 最近一次 link 在线的时间
    RunnerList:
      type: object
      required: [runners]
      properties:
        runners:
          type: array
          items: { $ref: '#/components/schemas/Runner' }
    RunnerCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9][a-z0-9_-]*$'
          description: 与 provider 名共用唯一约束
    RunnerCreated:
      type: object
      required: [runner, token]
      properties:
        runner: { $ref: '#/components/schemas/Runner' }
        token:
          type: string
          description: '`ort_…`，只显示这一次'
    DirInUseConflict:
      type: object
      description: |
        `createThread` 的 `executor.kind = runner` 未要求 worktree、未给 `shareDir`，而该目录已是其它未归档线程的工作目录时的 409 体（M11b）。
        客户端据此让用户在「新建 worktree」与「仍然共用（`shareDir: true`）」之间选择后重发。
      required: [code, message, threadIds]
      properties:
        code:
          type: string
          enum: [dir_in_use]
          x-enum-varnames: [DirInUseConflictCodeDirInUse]
        message: { type: string }
        threadIds:
          type: array
          items: { $ref: '#/components/schemas/ThreadId' }

    # ============================================================ 线程
    ModelRef:
      type: object
      required: [provider, id]
      properties:
        provider: { type: string }
        id: { type: string }
    ImageContent:
      type: object
      required: [type, data, mimeType]
      properties:
        type:
          type: string
          enum: [image]
        data:
          type: string
          description: base64
        mimeType: { type: string }
    ThreadExecutor:
      description: 线程执行位置（`runner` 为 M11b，`box` 为 M23）
      oneOf:
        - $ref: '#/components/schemas/ThreadExecutorNewOrb'
        - $ref: '#/components/schemas/ThreadExecutorOrb'
        - $ref: '#/components/schemas/ThreadExecutorRunner'
        - $ref: '#/components/schemas/ThreadExecutorBox'
      discriminator:
        propertyName: kind
        mapping:
          new_orb: '#/components/schemas/ThreadExecutorNewOrb'
          orb: '#/components/schemas/ThreadExecutorOrb'
          runner: '#/components/schemas/ThreadExecutorRunner'
          box: '#/components/schemas/ThreadExecutorBox'
    ThreadExecutorNewOrb:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [new_orb]
        provider:
          type: string
          description: provider 名称
        type:
          type: string
          description: orb 类型名
    ThreadExecutorOrb:
      type: object
      required: [kind, orbId]
      properties:
        kind:
          type: string
          enum: [orb]
        orbId: { $ref: '#/components/schemas/OrbId' }
    ThreadExecutorRunner:
      type: object
      description: 在 runner 上执行（M11b）：工作目录为 `dir`，或在 `dir`（须是 git 仓库）旁新建的 worktree
      required: [kind, runnerId, dir]
      properties:
        kind:
          type: string
          enum: [runner]
          x-enum-varnames: [ThreadExecutorRunnerKindRunner]
        runnerId: { $ref: '#/components/schemas/ProviderId' }
        dir:
          type: string
          description: 绝对路径，须等于或位于 runner 声明的某个目录之下
        worktree: { $ref: '#/components/schemas/ThreadExecutorRunnerWorktree' }
        shareDir:
          type: boolean
          description: 为真时允许与其它线程共用同一工作目录（不检查 `dir_in_use`）
    ThreadExecutorBox:
      type: object
      description: 在 box 上执行（M23）：省略 `app` = 机器（工作目录 `~`），否则 `~/apps/<app>/current`；工作目录由服务端决定
      required: [kind, boxId]
      properties:
        kind:
          type: string
          enum: [box]
          x-enum-varnames: [ThreadExecutorBoxKindBox]
        boxId:
          type: string
          description: box 的 id 或名字
        app: { type: string }
    ThreadExecutorRunnerWorktree:
      type: object
      description: '给出时先在 runner 上 `worktree.add {repo: dir, name}`，线程的工作目录取新 worktree'
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$'
          description: worktree 与分支的名字（目录 `<repo 的父目录>/<repo 名>-<name>`，重名依次加 `-2`、`-3`…）
    ThreadWorktree:
      type: object
      description: Oryn 为 runner 线程建的 worktree（M11b）
      required: [repo, dir, branch]
      properties:
        repo:
          type: string
          description: 原仓库目录
        dir:
          type: string
          description: worktree 目录（即线程的 `cwd`）
        branch: { type: string }
    CreateThreadRequest:
      type: object
      required: [prompt, executor]
      properties:
        projectId: { $ref: '#/components/schemas/ProjectId' }
        prompt: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageContent' }
        executor: { $ref: '#/components/schemas/ThreadExecutor' }
        model: { $ref: '#/components/schemas/ModelRef' }
        thinkingLevel: { type: string }
        role:
          type: string
          maxLength: 128
          description: |
            新线程以该 omp 模型 role 开场：首条提示词之前先发 `oryn_select_model{role}`（写入模型来源记录），给了 `thinkingLevel`
            时随后再设思考档位。与 `model` 同时给出时以 role 为准（`model` 只决定 agent 启动时的初始模型）。
        title: { type: string }
        labels:
          type: array
          items: { type: string }
        attachments:
          type: array
          maxItems: 20
          description: 已上传附件的 id（`POST attachments`）；建线程时绑定到新线程并投递到 orb（`$HOME/.oryn/attachments/<threadId>/<id>/<name>`）。`prompt`、`images`、`attachments` 至少其一非空
          items: { $ref: '#/components/schemas/AttachmentId' }
        browserProfileId:
          type: string
          description: |
            新 orb 选用的浏览器 Profile（M8；只对 `executor.kind = new_orb` 有效，挂到已有 orb 时给非空值 → 400 `invalid`）：
            省略 = 用项目的 `defaultBrowserProfileId`；空串 = 不用；`bpf_…` = 指定（不存在 → 404 `profile_not_found`）。
        profileMode:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileMode'
          description: 选用方式，缺省 `exclusive`；没有解析出 Profile 时忽略
        spaceId:
          allOf:
            - $ref: '#/components/schemas/SpaceId'
          description: 新线程加入该 Space（M9；不存在 → 404 `space_not_found`）；未给 `projectId` 时取 Space 的项目
    Thread:
      type: object
      required: [id, title, titleSource, state, stateChangedAt, pinned, labels, unread, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ThreadId' }
        projectId: { $ref: '#/components/schemas/ProjectId' }
        orbId:
          allOf:
            - $ref: '#/components/schemas/OrbId'
          description: 所在 orb；orb 被删除后省略（只读浏览）
        title: { type: string }
        titleSource:
          type: string
          enum: [auto, user]
        state: { $ref: '#/components/schemas/ThreadState' }
        stateChangedAt: { $ref: '#/components/schemas/TimestampMs' }
        parentThreadId: { $ref: '#/components/schemas/ThreadId' }
        forkedFromEntryId: { type: string }
        leafEntryId: { type: string }
        model: { $ref: '#/components/schemas/ModelRef' }
        thinkingLevel: { type: string }
        color: { type: string }
        pinned: { type: boolean }
        labels:
          type: array
          items: { type: string }
        snoozedUntil: { $ref: '#/components/schemas/TimestampMs' }
        archivedAt: { $ref: '#/components/schemas/TimestampMs' }
        unread: { type: boolean }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
        lastMessageAt: { $ref: '#/components/schemas/TimestampMs' }
        childCount:
          type: integer
          description: 子线程（fork 产生）数量，侧边栏显示 `n/m` 用
        childDoneCount:
          type: integer
          description: 处于 `idle` 的子线程数量
        error:
          $ref: '#/components/schemas/ThreadError'
        activity:
          type: string
          maxLength: 120
          readOnly: true
          description: |
            线程 `working` 时 agent 最近一次工具调用的意图（工具调用的 `i` / `intent` 参数，缺省时取 path / pattern / command 摘要），
            单行、至多 120 字符；只在内存中维护（不落库，控制面重启后为空），离开 `working` 即省略。变化时随 index.patch 推送
        portalUrlTemplate:
          type: string
          description: |
            该线程的 portal 地址模板：线程短码已代入、保留 `{port}`（如 `https://t-3f9a1c0b7e2d-p{port}.orb.example.com/`）。
            控制面未配置 `portal_domain` 时省略。
          example: 'https://t-3f9a1c0b7e2d-p{port}.orb.example.com/'
        publicShares:
          type: integer
          minimum: 1
          readOnly: true
          description: 未撤销的公开分享数；为 0 时省略
        kind:
          allOf:
            - $ref: '#/components/schemas/ThreadKind'
          description: 线程种类（M9）；省略 = `work`
        spaceId:
          allOf:
            - $ref: '#/components/schemas/SpaceId'
          description: 所属 Space（M9）
        shippedAt:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: '标记为已交付的时间（M9，`PATCH {shipped: true}`）'
        schedule:
          allOf:
            - $ref: '#/components/schemas/ThreadScheduleSummary'
          description: 该线程的线程内定时（M9）；没有则省略
        scheduleRun:
          allOf:
            - $ref: '#/components/schemas/ThreadScheduleRun'
          description: 由「新建线程」定时创建时给出（M9）
        cwd:
          type: string
          description: 线程的工作目录（M11b，runner 线程的绝对路径）；普通 orb 线程省略
        worktree:
          allOf:
            - $ref: '#/components/schemas/ThreadWorktree'
          description: Oryn 为该线程建的 worktree（M11b）；没有或已移除则省略
        pulls:
          type: array
          description: 关联的 GitHub PR（M14）；没有则省略
          items: { $ref: '#/components/schemas/ThreadPull' }
        githubTask:
          allOf:
            - $ref: '#/components/schemas/GitHubThreadTask'
          description: 触发规则建立的 issue 任务或发布哨兵状态（M15）；没有则省略
        main:
          type: boolean
          description: 是否为全局助手的主线对话（M19，`kind = assistant` 的单例）；不是则省略
    ThreadError:
      type: object
      description: |
        `state=error` 的原因（均可 `POST threads/{id}/wake` 重试）：
        - `orb_failed`：所在 orb 进入 `failed`，reason 为导致失败的原因；
        - `agent_failed`：orb 未失败，但 agent 在 orb 里没能启动，reason 为 orbd 返回的 ctl 错误 `code: message`
          （例如 runner 拒绝不在其服务目录内的 cwd：`dir_not_served: …`）；只在控制面内存中维护。
      required: [kind, reason]
      properties:
        kind:
          type: string
          enum: [orb_failed, agent_failed]
        reason: { type: string }
        cause:
          type: string
          enum: [image_pull_denied, image_missing, provider_command, orb_connect_timeout, fork_failed, dir_not_served, invalid_params, agent_start_timeout, agent_start_failed, unknown]
          description: |
            由 reason 原文归类（转 API 时计算，规则改了历史行也跟着变）：客户端据此显示一句人话，原文仍在 reason。
            `image_pull_denied` 拉取镜像被拒（不存在或无权限）；`image_missing` 找不到镜像或快照；`provider_command` 容器运行时命令非零退出；
            `orb_connect_timeout` orb 启动后没有连上控制面；`fork_failed` fork 复制环境失败；`dir_not_served` 工作目录不在 runner 服务的目录内；
            `invalid_params` agent 启动参数无效；`agent_start_timeout` agent 启动超时；`agent_start_failed` 其余 agent 启动失败；`unknown` 认不出。
        detail:
          type: string
          description: 归类时抽出的参数：`image_*` 为镜像名，`provider_command` 为退出码，`dir_not_served` 为目录；没有时省略
    ThreadEnvelope:
      type: object
      required: [thread]
      properties:
        thread: { $ref: '#/components/schemas/Thread' }
    SearchResults:
      type: object
      required: [hits, indexing]
      properties:
        hits:
          type: array
          items: { $ref: '#/components/schemas/SearchHit' }
        nextCursor:
          type: string
          description: 还有下一页时给出，原样传回 `cursor`
        indexing:
          type: boolean
          description: 历史消息仍在后台建索引，结果可能不全
    SearchHit:
      type: object
      required: [threadId, threadTitle, threadKind, archived, entryId, seq, role, ts, snippet, highlights, copies]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        threadTitle: { type: string }
        threadKind: { $ref: '#/components/schemas/ThreadKind' }
        archived:
          type: boolean
          description: 线程已归档
        entryId: { type: string }
        seq:
          type: integer
          format: int64
          description: 条目在线程内的序号（定位用）
        role:
          type: string
          enum: [user, assistant]
          x-enum-varnames: [SearchHitRoleUser, SearchHitRoleAssistant]
        ts:
          type: integer
          format: int64
          description: 消息时间（Unix 毫秒；条目没有时间时为 0）
        snippet:
          type: string
          description: 命中附近的一段正文（空白折叠为单个空格，截断处带 `…`）
        highlights:
          type: array
          description: '`snippet` 里命中的区间，按 UTF-16 码元计的 `[start, end)`，升序且互不重叠'
          items: { $ref: '#/components/schemas/TextRange' }
        copies:
          type: integer
          description: 持有这条消息的线程数（源线程与 fork 拷贝合计；没有 fork 时为 1）
    TextRange:
      type: object
      required: [start, end]
      properties:
        start: { type: integer }
        end: { type: integer }
    ThreadList:
      type: object
      required: [threads]
      properties:
        threads:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
    ThreadPatch:
      type: object
      description: 只修改出现的字段；`color` 传空串清除，`snoozedUntil` 传 0 清除
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        color: { type: string }
        pinned: { type: boolean }
        labels:
          type: array
          items: { type: string }
        archived: { type: boolean }
        snoozedUntil: { $ref: '#/components/schemas/TimestampMs' }
        unread: { type: boolean }
        spaceId:
          type: string
          description: 加入 Space（`spc_…`，不存在 → 404 `space_not_found`）；空串 = 移出 Space。只对 `kind = work` 的线程有效（M9）
        shipped:
          type: boolean
          description: '`true` 标记为已交付（记 `shippedAt`，未归档则同时归档）；`false` 清除标记（M9）'
    ForkThreadRequest:
      type: object
      required: [env]
      properties:
        entryId:
          type: string
          description: 从该条目分叉；缺省取当前叶子
        env:
          type: string
          description: '`copy` 连环境分叉（快照出副本 orb）；`share` 共用当前 orb'
          enum: [copy, share]
    Entry:
      type: object
      description: 会话 JSONL 的一行（已复制入库）
      required: [seq, file, entryId, type, payload]
      properties:
        seq:
          type: integer
          format: int64
          description: 线程内单调递增序号
        file:
          type: string
          description: 相对会话目录的 JSONL 文件路径
        entryId:
          type: string
          description: 行内 `id`；无 id 的行为合成 id `__title__` / `__session__`
        parentId: { type: string }
        type: { type: string }
        ts:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 行内 `timestamp` 换算的毫秒；无则省略
        payload:
          $ref: '#/components/schemas/OmpFrame'
    EntryPage:
      type: object
      required: [entries, lastSeq, hasMore]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 该线程当前最大 seq
        hasMore: { type: boolean }

    # ============================================================ orb
    Orb:
      type: object
      required: [id, providerId, type, cpus, memoryMB, image, state, stateChangedAt, createdAt, threadIds]
      properties:
        id: { $ref: '#/components/schemas/OrbId' }
        providerId: { $ref: '#/components/schemas/ProviderId' }
        providerName: { type: string }
        type: { type: string }
        cpus: { type: number }
        memoryMB: { type: integer }
        image: { type: string }
        projectId: { $ref: '#/components/schemas/ProjectId' }
        state: { $ref: '#/components/schemas/OrbState' }
        stateChangedAt: { $ref: '#/components/schemas/TimestampMs' }
        snapshotOf:
          allOf:
            - $ref: '#/components/schemas/SnapshotId'
          description: 由哪个快照创建
        lastAgentActivityAt: { $ref: '#/components/schemas/TimestampMs' }
        lastUserInteractionAt: { $ref: '#/components/schemas/TimestampMs' }
        orbdVersion: { type: string }
        agentVersion: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        deletedAt: { $ref: '#/components/schemas/TimestampMs' }
        threadIds:
          type: array
          items: { $ref: '#/components/schemas/ThreadId' }
        failureReason:
          type: string
          description: '`state=failed` 时导致失败的原因'
        lastSetup:
          allOf:
            - $ref: '#/components/schemas/OrbSetupRun'
          description: 最近一次 `phase=setup` 的运行
        lastResume:
          allOf:
            - $ref: '#/components/schemas/OrbSetupRun'
          description: 最近一次 `phase=resume` 的运行
        services:
          type: array
          description: orbd 上报的受管服务（控制面镜像，M4）；orb 已删除时省略
          items: { $ref: '#/components/schemas/OrbService' }
        portals:
          type: array
          description: 有 portal 的服务端口（M4）；orb 已删除时省略
          items: { $ref: '#/components/schemas/OrbPortal' }
        desktop:
          allOf:
            - $ref: '#/components/schemas/OrbDesktop'
          description: 桌面镜像（M8）；orbd 上报过 `desktop.state` 才有，orb 已删除时省略
        coordinator:
          type: boolean
          description: 协调 orb（M9，provider `@host`，跑在控制面宿主上的协调宿主）；为 false 时省略
        pool:
          allOf:
            - $ref: '#/components/schemas/OrbPoolState'
          description: 预热池状态（M11a）；不是池 orb 时省略
        snapshotKind:
          allOf:
            - $ref: '#/components/schemas/OrbSnapshotKind'
          description: '`snapshotOf` 非空时给出：`project` = 项目快照，`fork` = 连环境 fork 的快照'
        nestedDocker:
          type: boolean
          description: 该 orb 的类型声明了 `docker` 特性（M11a，orb 内可用 Docker）
        kind:
          allOf:
            - $ref: '#/components/schemas/OrbKind'
          description: 省略 = `orb`（M11b）
        features:
          type: array
          description: |
            orbd 的特性（同 `LinkCtlHelloParams.features`，M11b）：有活动 link 时取其 hello；没有时 runner 取最近一次上报的，普通 orb 省略。
            客户端据此决定右面板标签：`changes` 需要 `git`、`files` 需要 `fs`、`terminal` 需要 `terminal`；省略时保持 M3 的行为。
          items: { type: string }
        githubLogin:
          type: string
          description: orb 内 git / gh 使用的 GitHub 账号（M15）：工作 orb 的身份槽位已连接且可用时给出，与项目是否绑定无关；runner、协调宿主或槽位未连接 / 待重新授权时省略
        automation:
          type: boolean
          readOnly: true
          description: M18：这台 orb 由全自动入口（定时、GitHub 触发等）建立；为真时只能用放开了「允许全自动线程使用」的 SSH 主机。缺省 = false
        computer:
          type: boolean
          description: 助手的电脑（M19，全库至多一台，线程不能挂上去）；为 false 时省略
        box:
          type: boolean
          description: box 的常驻 orb（M23）；为 false 时省略
    OrbKind:
      type: string
      description: '`orb` = provider 创建的 orb；`runner` = runner 的常驻 orb（M11b）'
      enum: [orb, runner]
      x-enum-varnames: [OrbKindOrb, OrbKindRunner]
    OrbWhoami:
      type: object
      description: '`GET /orb/v1/whoami` 的结果（M11b）'
      required: [orbId, kind]
      properties:
        orbId: { $ref: '#/components/schemas/OrbId' }
        kind: { $ref: '#/components/schemas/OrbKind' }
    OrbSetupRun:
      type: object
      required: [id, orbId, phase, trigger, startedAt, finishedAt, ok, setupRan, durationMs, hasRepoScript, hasProjectScript]
      properties:
        id: { $ref: '#/components/schemas/SetupRunId' }
        orbId: { $ref: '#/components/schemas/OrbId' }
        phase: { $ref: '#/components/schemas/SetupPhase' }
        trigger: { $ref: '#/components/schemas/SetupTrigger' }
        startedAt: { $ref: '#/components/schemas/TimestampMs' }
        finishedAt: { $ref: '#/components/schemas/TimestampMs' }
        ok: { type: boolean }
        setupRan:
          type: boolean
          description: '`phase=setup` 时是否实际执行了脚本（`setup.done` 标记存在则为 false）'
        error:
          type: string
          description: '`ok=false` 时的失败原因'
        durationMs: { type: integer, format: int64 }
        hasRepoScript:
          type: boolean
          description: 仓库内存在可执行的 `.oryn/<phase>` 或 `.agents/<phase>`
        hasProjectScript:
          type: boolean
          description: 项目设置里配置了该阶段脚本
        prepared:
          type: boolean
          description: '本次开始时 `setup.done` 标记已存在（M11a：例如来自项目快照）'
        baseCommit:
          type: string
          description: 结束时检出的提交（40 位十六进制，M11a）；无仓库时省略
    SetupPhase:
      type: string
      enum: [setup, resume]
      x-enum-varnames: [SetupPhaseSetup, SetupPhaseResume]
    SetupTrigger:
      type: string
      description: '`auto` = orb 就绪 / 唤醒时自动运行；`manual` = orb 内 `oryn orb setup run`'
      enum: [auto, manual]
    OrbPoolState:
      type: string
      description: '预热池状态（M11a）：`warming` 已创建、尚未就绪；`idle` 就绪或冻结、可认领；`claimed` 已被线程认领、正在刷新'
      enum: [warming, idle, claimed]
    OrbSnapshotKind:
      type: string
      enum: [project, fork]
    OrbSetupRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/OrbSetupRun' }
    OrbServiceStatus:
      type: string
      description: |
        `starting` 已拉起、尚未通过就绪探测；`running` 运行中（需要探测的服务已通过探测）；`unhealthy` 60s 内未就绪（仍在探测）；
        `backoff` 进程退出、等待退避后重启；`stopped` 已被停止；`failed` 定义无效或连续 5 次短命。
      enum: [starting, running, unhealthy, backoff, stopped, failed]
    OrbPortalLink:
      type: object
      description: '服务的 portal 链接（`services.yaml` 的 `portal` / `portals[]`）：同一端口上的一个路径'
      required: [title, path]
      properties:
        title: { type: string, maxLength: 80 }
        path:
          type: string
          pattern: '^/'
          maxLength: 512
          description: 以 `/` 开头的路径（可带查询）
        folder:
          type: string
          maxLength: 80
          description: 链接菜单中的分组
    OrbService:
      type: object
      required: [name, source, command, status, restarts, links]
      properties:
        name: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
        source:
          type: string
          description: '`file` = `.oryn/services.yaml`（或 `.amp/services.yaml`）；`dynamic` = `oryn orb service start --command`；`app` = box app 的服务（M23，名字为 `<app>--<svc>`）'
          enum: [file, dynamic, app]
        command: { type: string, maxLength: 4096 }
        cwd:
          type: string
          description: 相对工作区根的目录
        port: { type: integer, minimum: 1, maximum: 65535 }
        health:
          type: string
          description: 就绪探测的 HTTP 路径
        links:
          type: array
          description: portal 链接；非空 = 该服务的端口有 portal
          maxItems: 20
          items: { $ref: '#/components/schemas/OrbPortalLink' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 所属线程（决定 `PUBLIC_URL` 用哪个线程短码）
        publicUrl:
          type: string
          description: 该服务进程拿到的 `PUBLIC_URL`（不带结尾 `/`）
        status: { $ref: '#/components/schemas/OrbServiceStatus' }
        pid: { type: integer }
        restarts:
          type: integer
          description: 自动重启次数
        exitCode:
          type: integer
          description: 最近一次退出码
        error:
          type: string
          description: '`failed` 的原因（如 `port_conflict`、`forbidden_port`、定义校验错误）'
        startedAt: { $ref: '#/components/schemas/TimestampMs' }
        app:
          type: string
          description: 所属 box app（M23；`source = app` 时给出）
    OrbPortal:
      type: object
      required: [port, service, links]
      properties:
        port: { type: integer, minimum: 1, maximum: 65535 }
        service:
          type: string
          description: 提供该端口的服务名
        links:
          type: array
          items: { $ref: '#/components/schemas/OrbPortalLink' }
        public:
          $ref: '#/components/schemas/OrbPortalPublic'
    OrbPortalPublic:
      type: object
      description: 限时公开中（省略 = 仅所有者可访问）
      required: [expiresAt]
      properties:
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
    OrbServiceList:
      type: object
      required: [services, portals]
      properties:
        services:
          type: array
          items: { $ref: '#/components/schemas/OrbService' }
        portals:
          type: array
          items: { $ref: '#/components/schemas/OrbPortal' }
    PortalShareDuration:
      type: string
      description: 公开时长（3600 / 10800 / 86400 / 604800 秒）
      enum: ['1h', '3h', '1d', '7d']
      x-enum-varnames: [PortalShareDuration1h, PortalShareDuration3h, PortalShareDuration1d, PortalShareDuration7d]
    PortalShareRequest:
      type: object
      required: [duration]
      properties:
        duration: { $ref: '#/components/schemas/PortalShareDuration' }

    # ============================================================ M8：Desktop 与浏览器 Profile
    OrbBrowserStatus:
      type: string
      description: orb 桌面上唯一那个 Chromium 的状态（由 orbd 启动；进程退出后不自动重启，也不做空闲回收）
      enum: [stopped, starting, running]
    BrowserProfileMode:
      type: string
