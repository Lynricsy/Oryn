          type: array
          minItems: 1
          description: 仓库内相对路径；拒绝空串、NUL、绝对路径与 `..` 段
          items: { type: string }
    Attachment:
      type: object
      required: [id, name, mime, size, sha256, createdAt]
      properties:
        id: { $ref: '#/components/schemas/AttachmentId' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 绑定的线程；尚未绑定时省略
        name:
          type: string
          description: 净化后的文件名（≤200 字节）
        mime: { type: string }
        size:
          type: integer
          format: int64
        sha256: { $ref: '#/components/schemas/Sha256' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        publicUrl:
          type: string
          description: 已发布时的公开 URL（`<public_url>/f/<slug>/<文件名>`）；未发布省略
    AttachmentList:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
    OrbAttachmentEnsureRequest:
      type: object
      description: 仅 orbd 本机 API 使用（`POST /attachments/ensure`，经 `fs` 流），不经 REST 暴露
      required: [threadId, id, name, size, sha256]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id: { $ref: '#/components/schemas/AttachmentId' }
        name: { type: string }
        size:
          type: integer
          format: int64
        sha256: { $ref: '#/components/schemas/Sha256' }
    OrbAttachmentEnsureResult:
      type: object
      description: 仅 orbd 本机 API 使用（`POST /attachments/ensure` 与 `PUT /attachments/file` 的结果）
      required: [present, path]
      properties:
        present:
          type: boolean
          description: '`path` 处已是大小相同的普通文件'
        path:
          type: string
          description: '`$HOME/.oryn/attachments/<threadId>/<id>/<safeName>` 的绝对路径'

    # ============================================================ 公开分享与文件发布（M5）
    ShareMode:
      type: string
      description: '`snapshot` 固化创建时刻扫描过的条目集合与标题（`untilSeq` + 当时的叶子）；`live` 持续跟随当前叶子'
      enum: [live, snapshot]
      # 显式常量名：避免与 JobOp 的 `snapshot` 冲突导致 oapi-codegen 给既有常量加前缀
      x-enum-varnames: [ShareModeLive, ShareModeSnapshot]
    ThreadShare:
      type: object
      required: [id, threadId, threadTitle, mode, slug, url, createdAt, findings]
      properties:
        id: { $ref: '#/components/schemas/ShareId' }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        threadTitle: { type: string }
        mode: { $ref: '#/components/schemas/ShareMode' }
        slug: { $ref: '#/components/schemas/ShareSlug' }
        url:
          type: string
          description: '`<public_url>/s/<slug>`'
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        untilSeq:
          type: integer
          format: int64
          description: 仅快照：创建时线程的 `last_seq`
        findings:
          type: integer
          description: 创建时确认过的密钥扫描命中数
    ThreadShareList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/ThreadShare' }
    CreateThreadShareRequest:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/ShareMode' }
        acknowledgeFindings:
          type: boolean
          default: false
          description: 已检查扫描命中项，仍然分享
    ShareFindingRule:
      type: string
      description: 密钥扫描规则名（规则表见 docs/protocol.md M5 节）
      enum:
        - vault_secret
        - private_key
        - api_key_sk
        - github_token
        - aws_access_key
        - google_api_key
        - slack_token
        - jwt
        - oryn_token
        - bearer_header
        - url_credentials
      x-enum-varnames:
        - ShareFindingRuleVaultSecret
        - ShareFindingRulePrivateKey
        - ShareFindingRuleApiKeySk
        - ShareFindingRuleGithubToken
        - ShareFindingRuleAwsAccessKey
        - ShareFindingRuleGoogleApiKey
        - ShareFindingRuleSlackToken
        - ShareFindingRuleJwt
        - ShareFindingRuleOrynToken
        - ShareFindingRuleBearerHeader
        - ShareFindingRuleUrlCredentials
    ShareFinding:
      type: object
      description: |
        一个 `(规则, 条目)` 的命中。标题与附件名的命中不对应条目：`entryId` 分别为 `__title__` 与 `attachment:<附件 id>`，`seq` 为 0
      required: [rule, seq, entryId, preview, count]
      properties:
        rule: { $ref: '#/components/schemas/ShareFindingRule' }
        secretName:
          type: string
          description: 仅 `vault_secret`：命中的密钥名
        seq:
          type: integer
          format: int64
        entryId: { type: string }
        role:
          type: string
          description: 所在消息的角色（`user` / `assistant` / `toolResult` …）；非消息条目省略
        tool:
          type: string
          description: 所在工具结果的工具名
        preview:
          type: string
          description: 脱敏片段：前 4 字符 + `…` + 后 2 字符；命中短于 12 字符时只留前 2 字符 + `…`
        count:
          type: integer
          description: 该条目内同一规则的命中次数
    ShareScan:
      type: object
      required: [findings, scanned, truncated]
      properties:
        findings:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ShareFinding' }
        scanned:
          type: integer
          description: 扫描过的条目数
        truncated:
          type: boolean
          description: 命中超过 200 项，只返回前 200 项
    ShareScanConflict:
      type: object
      description: '`createThreadShare` 的 409 体：扫描有命中且未确认'
      required: [code, message, scan]
      properties:
        code:
          type: string
          enum: [secrets_found]
          x-enum-varnames: [ShareScanConflictCodeSecretsFound]
        message: { type: string }
        scan: { $ref: '#/components/schemas/ShareScan' }
    PublishedFile:
      type: object
      required: [id, attachmentId, name, mime, size, url, createdAt]
      properties:
        id: { $ref: '#/components/schemas/PublishedFileId' }
        attachmentId: { $ref: '#/components/schemas/AttachmentId' }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        name: { type: string }
        mime: { type: string }
        size:
          type: integer
          format: int64
        url:
          type: string
          description: '`<public_url>/f/<slug>/<encodeURIComponent(name)>`'
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
    ShareOverview:
      type: object
      required: [shares, files]
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/ThreadShare' }
        files:
          type: array
          items: { $ref: '#/components/schemas/PublishedFile' }
    PublishOrbFileRequest:
      type: object
      required: [path, threadId]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: orb 内路径（同 `FsPathQuery` 的路径规则）
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 附件归属的线程（须在该 orb 上）
    PublicAttachment:
      type: object
      required: [id, name, size, mime]
      properties:
        id: { $ref: '#/components/schemas/AttachmentId' }
        name: { type: string }
        size:
          type: integer
          format: int64
        mime: { type: string }
        url:
          type: string
          description: 仅已发布：公开 URL
    PublicShare:
      type: object
      description: 公开分享的元数据。不含线程 id、orb、项目、标签、模型配置
      required: [mode, title, sharedAt, threadCreatedAt, lastSeq, transcriptRev, attachments]
      properties:
        mode: { $ref: '#/components/schemas/ShareMode' }
        title:
          type: string
          description: 线程标题（空则 `Untitled`）；快照为创建时的标题
        state:
          allOf:
            - $ref: '#/components/schemas/ThreadState'
          description: 仅实时：线程当前状态
        sharedAt: { $ref: '#/components/schemas/TimestampMs' }
        threadCreatedAt: { $ref: '#/components/schemas/TimestampMs' }
        lastSeq:
          type: integer
          format: int64
          description: 范围上界（快照 = `untilSeq`；实时 = 线程当前 `last_seq`）
        leafEntryId:
          type: string
          description: 范围的叶子（快照 = 创建时的叶子；实时 = 当前叶子）
        transcriptRev: { type: integer, format: int64 }
        attachments:
          type: array
          description: |
            公开的附件元数据：已发布的附件，以及被范围内公开（过滤后）条目引用的附件（按附件 id 匹配）；
            快照只考虑分享创建时已存在的附件。其余附件的名字与元数据不出控制面
          items: { $ref: '#/components/schemas/PublicAttachment' }
    PublicEntryPage:
      type: object
      required: [entries, hasMore, lastSeq]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/Entry' }
        hasMore:
          type: boolean
          description: 为假时已到达范围末尾
        lastSeq:
          type: integer
          format: int64
          description: 范围上界（同 `PublicShare.lastSeq`）
        leafEntryId: { type: string }

    # ============================================================ 通知（M5）
    NotificationKind:
      type: string
      description: '`done` 回合完成、`input` 等待作答、`error` 出错；也是渠道 `events` 的元素'
      enum: [done, input, error]
    NotificationDeliveryTarget:
      type: string
      description: 投递目标（`apns` / `fcm` 为 M7 预留）
      enum: [telegram, webhook, ntfy, bark, webpush, apns, fcm]
    NotificationDeliveryStatus:
      type: string
      enum: [pending, sent, failed]
    NotificationDelivery:
      type: object
      required: [target, status, attempts, at]
      properties:
        target: { $ref: '#/components/schemas/NotificationDeliveryTarget' }
        channelId: { $ref: '#/components/schemas/NotificationChannelId' }
        channelName: { type: string }
        status: { $ref: '#/components/schemas/NotificationDeliveryStatus' }
        attempts: { type: integer }
        at:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: '`pending` = 下次尝试时间；`sent` / `failed` = 完成时间'
        error:
          type: string
          description: 最近一次失败原因（≤500 字符）
    Notification:
      type: object
      required: [id, kind, title, body, url, createdAt, deliveries]
      properties:
        id: { $ref: '#/components/schemas/NotificationId' }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        title: { type: string }
        body: { type: string }
        url:
          type: string
          description: 站内路径 `/t/<threadId>`
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        readAt: { $ref: '#/components/schemas/TimestampMs' }
        resolvedAt:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 仅 `input`：请求已被作答 / 取消 / 随 agent 重启消失
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/NotificationDelivery' }
    NotificationList:
      type: object
      required: [notifications, unread]
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unread:
          type: integer
          description: 全部未读通知数
    NotificationsReadRequest:
      type: object
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 只标该线程的通知；省略 = 全部
    NotificationChannelKind:
      type: string
      enum: [telegram, webhook, ntfy, bark]
    NotificationLocale:
      type: string
      description: 渠道消息的固定文案语言
      enum: [zh-CN, en]
      x-enum-varnames: [NotificationLocaleZhCN, NotificationLocaleEn]
    TelegramChannelConfig:
      type: object
      required: [botToken]
      properties:
        botToken: { type: string, minLength: 1 }
        apiBase:
          type: string
          description: Bot API 根地址，默认 `https://api.telegram.org`（自建 Bot API 服务器与测试用）
    WebhookChannelConfig:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1 }
        secret:
          type: string
          description: '给出时请求带 `X-Oryn-Signature: sha256=<hex(HMAC-SHA256(secret, body))>`'
        headers:
          type: object
          maxProperties: 16
          description: 自定义请求头（名不得是 `Host` / `Content-Length` / `Content-Type`）
          additionalProperties: { type: string }
    NtfyChannelConfig:
      type: object
      required: [topic]
      properties:
        server:
          type: string
          description: 默认 `https://ntfy.sh`
        topic: { type: string, minLength: 1 }
        token:
          type: string
          description: '给出时带 `Authorization: Bearer <token>`'
    BarkChannelConfig:
      type: object
      required: [deviceKey]
      properties:
        server:
          type: string
          description: 默认 `https://api.day.app`
        deviceKey: { type: string, minLength: 1 }
    NotificationChannelInput:
      type: object
      description: 恰好给出与 `kind` 同名的一个配置对象
      required: [kind, name]
      properties:
        kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        name: { type: string, minLength: 1, maxLength: 80 }
        enabled:
          type: boolean
          default: true
        events:
          type: array
          description: 缺省 = 三者全选
          items: { $ref: '#/components/schemas/NotificationKind' }
        locale: { $ref: '#/components/schemas/NotificationLocale' }
        telegram: { $ref: '#/components/schemas/TelegramChannelConfig' }
        webhook: { $ref: '#/components/schemas/WebhookChannelConfig' }
        ntfy: { $ref: '#/components/schemas/NtfyChannelConfig' }
        bark: { $ref: '#/components/schemas/BarkChannelConfig' }
    NotificationChannelPatch:
      type: object
      description: 只修改出现的字段；给出与渠道 `kind` 同名的配置对象 = 整体替换该渠道配置
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        enabled: { type: boolean }
        events:
          type: array
          items: { $ref: '#/components/schemas/NotificationKind' }
        locale: { $ref: '#/components/schemas/NotificationLocale' }
        telegram: { $ref: '#/components/schemas/TelegramChannelConfig' }
        webhook: { $ref: '#/components/schemas/WebhookChannelConfig' }
        ntfy: { $ref: '#/components/schemas/NtfyChannelConfig' }
        bark: { $ref: '#/components/schemas/BarkChannelConfig' }
    NotificationChannelTelegram:
      type: object
      required: [botUsername, linked]
      properties:
        botUsername: { type: string }
        linked:
          type: boolean
          description: 已绑定私聊
        chatTitle: { type: string }
    NotificationChannelLastDelivery:
      type: object
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/NotificationDeliveryStatus' }
        at: { $ref: '#/components/schemas/TimestampMs' }
        error: { type: string }
    NotificationChannel:
      type: object
      description: 机密字段（token、secret、topic、deviceKey、URL 全文）只写不读
      required: [id, kind, name, enabled, events, locale, summary, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/NotificationChannelId' }
        kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        name: { type: string }
        enabled: { type: boolean }
        events:
          type: array
          items: { $ref: '#/components/schemas/NotificationKind' }
        locale: { $ref: '#/components/schemas/NotificationLocale' }
        summary:
          type: string
          description: 脱敏展示串（如 `@bot_name`、`hooks.example.com/…ab12`、`ntfy.sh/…9f3c`、`api.day.app`）
        telegram: { $ref: '#/components/schemas/NotificationChannelTelegram' }
        lastError: { type: string }
        lastDelivery: { $ref: '#/components/schemas/NotificationChannelLastDelivery' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
    NotificationChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/NotificationChannel' }
    NotificationTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
    TelegramLink:
      type: object
      required: [code, botUsername, expiresAt]
      properties:
        code:
          type: string
          description: 8 位绑定码，显示为 `ABCD-EFGH`
          example: ABCD-EFGH
        botUsername: { type: string }
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
    VapidKey:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
          description: base64url（无填充）的 65 字节未压缩 P-256 点
    PushSubscriptionKind:
      type: string
      description: '`fcm` 自 M7 起使用（`endpoint` 存 FCM 注册令牌）；`apns` 预留'
      enum: [webpush, apns, fcm]
    PushSubscription:
      type: object
      required: [id, kind, endpoint, userAgent, createdAt]
      properties:
        id: { $ref: '#/components/schemas/PushSubscriptionId' }
        kind: { $ref: '#/components/schemas/PushSubscriptionKind' }
        endpoint: { type: string }
        userAgent: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        lastSuccessAt: { $ref: '#/components/schemas/TimestampMs' }
        lastError: { type: string }
    PushSubscriptionList:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/PushSubscription' }
    PushSubscriptionKeys:
      type: object
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
          description: base64url，解码后 65 字节且以 0x04 开头
        auth:
          type: string
          description: base64url，解码后 16 字节
    PushSubscriptionInput:
      type: object
      description: |
        两种形态，按 `kind` 区分（缺省 `webpush`）：
        - `webpush`：浏览器 `PushSubscription.toJSON()` 的子集，须带 `endpoint` 与 `keys`（Android 的 UnifiedPush 同此形态）；
        - `fcm`：只带 `token`（Android `gms` 包的 FCM 注册令牌）。
      properties:
        kind:
          type: string
          enum: [webpush, fcm]
          default: webpush
        endpoint: { type: string, minLength: 1, maxLength: 2048 }
        keys: { $ref: '#/components/schemas/PushSubscriptionKeys' }
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: 'FCM 注册令牌（`kind: fcm` 时必填）'

    # ============================================================ oryn sync（M5）
    OrbSyncPrepareRequest:
      type: object
      properties:
        root:
          type: string
          maxLength: 4096
          description: 仓库所在目录（同 `GitRootQuery` 的路径规则）；缺省 = orb 当前工作目录
        have:
          type: array
          maxItems: 256
          description: 本地已有的提交（用于确定 bundle 的边界）
          items: { type: string, pattern: '^[0-9a-f]{40}$' }
        force:
          type: boolean
          default: false
          description: 无共同提交时仍打包完整历史（浅克隆仍会 409 `sync_shallow`）
    OrbSyncBundle:
      type: object
      required: [id, size]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
        size:
          type: integer
          format: int64
    OrbSyncState:
      type: object
      required: [root, head, snapshot, dirty, common]
      properties:
        root:
          type: string
          description: 仓库顶层的绝对路径
        branch:
          type: string
          description: 当前分支短名；游离 HEAD 时省略
        head:
          type: string
          description: HEAD 提交
        snapshot:
          type: string
          description: 工作区快照提交（无未提交改动时等于 `head`）
        dirty:
          type: boolean
          description: 有未提交改动（`snapshot != head`）
        common:
          type: array
          description: '`have` 中本仓库已有的提交'
          items: { type: string }
        bundle:
          allOf:
            - $ref: '#/components/schemas/OrbSyncBundle'
          description: '`snapshot ∉ have` 时打出的 bundle（含 `refs/oryn/sync/snapshot` 与 `refs/oryn/sync/head`）'

    WsTicket:
      type: object
      required: [ticket, expiresIn]
      properties:
        ticket: { type: string }
        expiresIn:
          type: integer
          description: 秒
          example: 30
    WsClientMessage:
      description: 客户端 → 服务端 WS 消息
      oneOf:
        - $ref: '#/components/schemas/WsClientFocus'
        - $ref: '#/components/schemas/WsClientSub'
        - $ref: '#/components/schemas/WsClientUnsub'
        - $ref: '#/components/schemas/WsClientCmd'
        - $ref: '#/components/schemas/WsClientUiResponse'
        - $ref: '#/components/schemas/WsClientPing'
        - $ref: '#/components/schemas/WsClientTermWatch'
      discriminator:
        propertyName: type
        mapping:
          focus: '#/components/schemas/WsClientFocus'
          sub: '#/components/schemas/WsClientSub'
          unsub: '#/components/schemas/WsClientUnsub'
          cmd: '#/components/schemas/WsClientCmd'
          ui.response: '#/components/schemas/WsClientUiResponse'
          ping: '#/components/schemas/WsClientPing'
          term.watch: '#/components/schemas/WsClientTermWatch'
    WsClientFocus:
      type: object
      description: 当前正在看的线程（用于未读、通知抑制、唤醒）；记为一次用户交互
      required: [type, threadId]
      properties:
        type: { type: string, enum: [focus] }
        threadId:
          type: string
          nullable: true
          description: 线程 id；null 表示不看任何线程
    WsClientSub:
      type: object
      required: [type, threadId]
      properties:
        type: { type: string, enum: [sub] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        afterSeq:
          type: integer
          format: int64
          description: 客户端已有条目的可续传游标（最近一条 `entries` 消息的 `lastSeq`）；缺省 0 = 全量
        transcriptRev:
          type: integer
          format: int64
          description: |
            客户端缓存条目所属的转录版本（来自 `thread.snapshot` / `transcript.reset`）。与服务端当前版本不同，
            或缺省但 `afterSeq > 0` 且服务端版本 > 0 时，服务端忽略 `afterSeq` 从头补发，并在快照中置 `fullReplay: true`。
    WsClientUnsub:
      type: object
      required: [type, threadId]
      properties:
        type: { type: string, enum: [unsub] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsClientCmd:
      type: object
      description: omp RPC 命令；控制面注入唯一 id 后下发，应答以 `res` 回到本连接
      required: [type, threadId, id, frame]
      properties:
        type: { type: string, enum: [cmd] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id:
          type: string
          description: 客户端侧请求 id（仅在本连接内唯一）
        frame:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 不带 `id` 的 omp RPC 命令对象
    WsClientUiResponse:
      type: object
      description: |
        侧通道应答；`frame.type` 只能是 `extension_ui_response`、`host_tool_result`、`host_tool_update`、`host_uri_result`
        之一且带字符串 `id`（与 omp `dispatchRpcControlFrame` 的判定一致），否则回 `error{code:"invalid_frame"}`。
        `extension_ui_response` 先到先得：只有对应请求仍待答且应答已成功交给 agent（或在 orb 暂停时入队）才广播 `ui.resolved`。
      required: [type, threadId, frame]
      properties:
        type: { type: string, enum: [ui.response] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        frame: { $ref: '#/components/schemas/OmpFrame' }
    WsClientPing:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [ping] }
    WsClientTermWatch:
      type: object
      description: |
        开关本连接对该线程 `terminal_output` 帧的接收（须先 `sub`，否则回 `error{code:"not_subscribed"}`）。
        `terminal_output` 默认不发给未开启的连接；其它终端帧（`terminal_opened|exit|closed`）照常随 `frame` 广播。
        待发超过阈值时服务端丢弃终端输出、关闭本开关并发 `term.lagged`：客户端应经 `terminal_snapshot` 重同步后重新开启。
      required: [type, threadId, 'on']
      properties:
        type: { type: string, enum: [term.watch] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        'on': { type: boolean }

    WsServerMessage:
      description: 服务端 → 客户端 WS 消息
      oneOf:
        - $ref: '#/components/schemas/WsServerIndex'
        - $ref: '#/components/schemas/WsServerIndexPatch'
        - $ref: '#/components/schemas/WsServerThreadSnapshot'
        - $ref: '#/components/schemas/WsServerEntries'
        - $ref: '#/components/schemas/WsServerFrame'
        - $ref: '#/components/schemas/WsServerRes'
        - $ref: '#/components/schemas/WsServerUiResolved'
        - $ref: '#/components/schemas/WsServerLiveReset'
        - $ref: '#/components/schemas/WsServerTranscriptReset'
        - $ref: '#/components/schemas/WsServerPlanResolved'
        - $ref: '#/components/schemas/WsServerOrb'
        - $ref: '#/components/schemas/WsServerError'
        - $ref: '#/components/schemas/WsServerPong'
        - $ref: '#/components/schemas/WsServerTermLagged'
        - $ref: '#/components/schemas/WsServerTermResized'
        - $ref: '#/components/schemas/WsServerNotification'
        - $ref: '#/components/schemas/WsServerNotificationsRead'
      discriminator:
        propertyName: type
        mapping:
          index: '#/components/schemas/WsServerIndex'
          index.patch: '#/components/schemas/WsServerIndexPatch'
          thread.snapshot: '#/components/schemas/WsServerThreadSnapshot'
          entries: '#/components/schemas/WsServerEntries'
          frame: '#/components/schemas/WsServerFrame'
          res: '#/components/schemas/WsServerRes'
          ui.resolved: '#/components/schemas/WsServerUiResolved'
          live.reset: '#/components/schemas/WsServerLiveReset'
          transcript.reset: '#/components/schemas/WsServerTranscriptReset'
          plan.resolved: '#/components/schemas/WsServerPlanResolved'
          orb: '#/components/schemas/WsServerOrb'
          error: '#/components/schemas/WsServerError'
          pong: '#/components/schemas/WsServerPong'
          term.lagged: '#/components/schemas/WsServerTermLagged'
          term.resized: '#/components/schemas/WsServerTermResized'
          notification: '#/components/schemas/WsServerNotification'
          notifications.read: '#/components/schemas/WsServerNotificationsRead'
    WsServerIndex:
      type: object
      description: 线程摘要全量（连接建立后首条）
      required: [type, threads, rev]
      properties:
        type: { type: string, enum: [index] }
        threads:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
        rev: { type: integer, format: int64 }
    WsServerIndexPatch:
      type: object
      required: [type, upsert, remove, rev]
      properties:
        type: { type: string, enum: [index.patch] }
        upsert:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
        remove:
          type: array
          items: { $ref: '#/components/schemas/ThreadId' }
        rev: { type: integer, format: int64 }
    AgentLiveState:
      type: object
      description: 线程实时缓冲（只含未被条目覆盖的部分）
      required: [status, pendingUi, subagents, live]
      properties:
        status: { $ref: '#/components/schemas/AgentStatus' }
        state:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 最近一次 `get_state` 应答的 data
        queue:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 最新 `queue_update` 帧
        pendingUi:
          type: array
          description: 未应答的 `extension_ui_request` 帧
          items: { $ref: '#/components/schemas/OmpFrame' }
        planProposal:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 未决的 `plan_proposal` 帧
        subagents:
          type: array
          description: 各子 agent 最新的 `subagent_lifecycle` / `subagent_progress` 帧
          items: { $ref: '#/components/schemas/OmpFrame' }
        live:
          type: array
          description: 在途消息（`openMessage`）与运行中工具（`openTools`）的帧，按到达顺序
          items: { $ref: '#/components/schemas/OmpFrame' }
    WsServerThreadSnapshot:
      type: object
      description: '`sub` 后的首条消息'
      required: [type, threadId, thread, agent, lastSeq, transcriptRev, fullReplay]
      properties:
        type: { type: string, enum: [thread.snapshot] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        thread: { $ref: '#/components/schemas/Thread' }
        orb:
          allOf:
            - $ref: '#/components/schemas/Orb'
          description: 线程所在 orb；无 orb 时省略
        agent: { $ref: '#/components/schemas/AgentLiveState' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 快照时刻线程的最大 seq（补发的目标；不是可续传游标，游标以各条 `entries.lastSeq` 为准）
        transcriptRev:
          type: integer
          format: int64
          description: 当前转录版本；之后的 `sub` 应带上它
        fullReplay:
          type: boolean
          description: 为真时服务端从 seq 0 补发：客户端须先丢弃该线程已缓存的全部条目
    WsServerEntries:
      type: object
      required: [type, threadId, entries, lastSeq]
      properties:
        type: { type: string, enum: [entries] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        entries:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Entry' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 本条消息覆盖到的最大 seq（可续传游标：≤ 它的条目都已送达）；分批时每批各自填写
    WsServerFrame:
      type: object
      description: 实时 omp 帧（`response` 以外的帧广播给该线程全部订阅者）
      required: [type, threadId, frame]
      properties:
        type: { type: string, enum: [frame] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        frame: { $ref: '#/components/schemas/OmpFrame' }
    WsServerRes:
      type: object
      description: '`cmd` 的应答，只发给发起连接；`id` 为客户端原始 id'
      required: [type, threadId, id, response]
      properties:
        type: { type: string, enum: [res] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id: { type: string }
        response: { $ref: '#/components/schemas/OmpFrame' }
    WsServerUiResolved:
      type: object
      required: [type, threadId, requestId]
      properties:
        type: { type: string, enum: [ui.resolved] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        requestId: { type: string }
    WsServerLiveReset:
      type: object
      description: 丢弃叠加层，仅按条目渲染，直到下一个 `message_start`
      required: [type, threadId]
      properties:
        type: { type: string, enum: [live.reset] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsServerTranscriptReset:
      type: object
      description: |
        线程转录版本递增（会话文件重写后删除了旧行、fork 回退移除了某文件，或 `switch_leaf` / `navigate_tree` 成功把叶子移离
        受理时的位置）：客户端丢弃该线程的全部已缓存条目，并以 `sub{afterSeq: 0, transcriptRev}` 重新订阅
      required: [type, threadId, transcriptRev]
      properties:
        type: { type: string, enum: [transcript.reset] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        transcriptRev: { type: integer, format: int64 }
    WsServerPlanResolved:
      type: object
      description: 计划提案已被成功批准 / 处理（`plan_approval` 成功应答）：所有客户端清除该线程的 `planProposal`
      required: [type, threadId]
      properties:
        type: { type: string, enum: [plan.resolved] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsServerOrb:
      type: object
      required: [type, orb]
      properties:
        type: { type: string, enum: [orb] }
        orb: { $ref: '#/components/schemas/Orb' }
    WsServerError:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, enum: [error] }
        code: { type: string }
        message: { type: string }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id:
          type: string
          description: 若由某条 `cmd` 引起，为其客户端 id
    WsServerPong:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [pong] }
    WsServerTermLagged:
      type: object
      description: |
        该线程的 `terminal_output` 有丢失（本连接待发超过阈值，或 orbd 帧缓冲溢出后的 `terminal.gap`）：
        客户端应以 `terminal_list` + `terminal_snapshot` 重同步，并重新 `term.watch{on:true}`。
      required: [type, threadId]
      properties:
        type: { type: string, enum: [term.lagged] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsServerTermResized:
      type: object
      description: 某个连接发出的 `terminal_resize` 已入队（发给该线程全部订阅者，含发起方）；omp 自身不为 resize 发帧
      required: [type, threadId, terminalId, cols, rows]
      properties:
        type: { type: string, enum: [term.resized] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        terminalId: { type: string }
        cols: { type: integer }
        rows: { type: integer }
    WsServerNotification:
      type: object
      description: 新通知（发给全部私有连接）
      required: [type, notification]
      properties:
        type: { type: string, enum: [notification] }
        notification: { $ref: '#/components/schemas/Notification' }
    WsServerNotificationsRead:
      type: object
      description: 通知已读（发给全部私有连接）
      required: [type]
      properties:
        type: { type: string, enum: [notifications.read] }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 只该线程的通知已读；省略 = 全部已读

    # ============================================================ 匿名分享 WebSocket（M5）
    WsPublicServerMessage:
      description: |
        `GET /api/v1/public/shares/{slug}/ws` 上服务端 → 匿名客户端的消息（都不带 `threadId`）。
        私有通道的 `index` / `orb` / `ui.*` / 终端 / 应答 / 通知消息在结构上到不了匿名连接。客户端只许发 `WsClientPing`。
      oneOf:
        - $ref: '#/components/schemas/WsPublicSnapshot'
        - $ref: '#/components/schemas/WsPublicEntries'
        - $ref: '#/components/schemas/WsPublicFrame'
        - $ref: '#/components/schemas/WsPublicLiveReset'
        - $ref: '#/components/schemas/WsPublicTranscriptReset'
        - $ref: '#/components/schemas/WsPublicState'
        - $ref: '#/components/schemas/WsPublicRevoked'
        - $ref: '#/components/schemas/WsServerPong'
      discriminator:
        propertyName: type
        mapping:
          share.snapshot: '#/components/schemas/WsPublicSnapshot'
          entries: '#/components/schemas/WsPublicEntries'
          frame: '#/components/schemas/WsPublicFrame'
          live.reset: '#/components/schemas/WsPublicLiveReset'
          transcript.reset: '#/components/schemas/WsPublicTranscriptReset'
          share.state: '#/components/schemas/WsPublicState'
          share.revoked: '#/components/schemas/WsPublicRevoked'
          pong: '#/components/schemas/WsServerPong'
    WsPublicSnapshot:
      type: object
      description: 连接后的首条消息
      required: [type, title, state, lastSeq, transcriptRev, fullReplay, live, subagents]
      properties:
        type: { type: string, enum: [share.snapshot] }
        title: { type: string }
        state: { $ref: '#/components/schemas/ThreadState' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 快照时刻线程的最大 seq（补发的目标）
        transcriptRev: { type: integer, format: int64 }
        fullReplay:
          type: boolean
          description: 为真时从 seq 0 补发：客户端先丢弃已缓存的全部条目
        live:
          type: array
          description: 在途消息与运行中工具的帧（与 `WsPublicFrame` 同一过滤）
          items: { $ref: '#/components/schemas/OmpFrame' }
        subagents:
          type: array
          description: 恒为空：子 agent 的进度与转录不公开
          items: { $ref: '#/components/schemas/OmpFrame' }
    WsPublicEntries:
      type: object
      required: [type, entries, lastSeq]
      properties:
        type: { type: string, enum: [entries], x-enum-varnames: [WsPublicEntriesTypeEntries] }
        entries:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Entry' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 本条消息覆盖到的最大 seq（可续传游标）
    WsPublicFrame:
      type: object
      description: |
        实时 omp 帧，仅限 `message_start` / `message_update` / `message_end` / `tool_execution_start` / `tool_execution_update` /
        `tool_stream_update` / `tool_execution_end` / `agent_start` / `agent_end`，且与条目共用公开过滤：
        `display:false` 的注入消息不发；`message_update` 只发 assistant 的；`agent_end` 只留 `{type, isTerminal?}`；
        子 agent 工具（`task`）的 `tool_execution_update` / `tool_stream_update` 不发。`subagent_*` 帧一律不发
      required: [type, frame]
      properties:
        type: { type: string, enum: [frame], x-enum-varnames: [WsPublicFrameTypeFrame] }
        frame: { $ref: '#/components/schemas/OmpFrame' }
    WsPublicLiveReset:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [live.reset], x-enum-varnames: [WsPublicLiveResetTypeLiveReset] }
    WsPublicTranscriptReset:
      type: object
      description: |
        转录版本递增（同 `WsServerTranscriptReset`），或所有者把叶子移到了客户端未持有的分支上：
        客户端丢弃全部已缓存条目，以 `after=0&rev=<transcriptRev>` 重连
      required: [type, transcriptRev]
      properties:
        type: { type: string, enum: [transcript.reset], x-enum-varnames: [WsPublicTranscriptResetTypeTranscriptReset] }
        transcriptRev: { type: integer, format: int64 }
    WsPublicState:
      type: object
      description: 线程状态或标题变化
      required: [type, state, title]
      properties:
        type: { type: string, enum: [share.state] }
        state: { $ref: '#/components/schemas/ThreadState' }
        title: { type: string }
    WsPublicRevoked:
      type: object
      description: 分享已撤销或线程已删除；随后服务端以 4001 关闭连接
      required: [type]
      properties:
        type: { type: string, enum: [share.revoked] }

    # ============================================================ provider 协议（C1）
    ProviderHelloRequest:
      type: object
      required: [instanceId, driver, version, capabilities, types, defaultType, allowMultiple]
      properties:
        instanceId:
          type: string
          description: 本进程实例的随机 id
        driver: { $ref: '#/components/schemas/ProviderDriver' }
        version: { type: string }
        capabilities: { $ref: '#/components/schemas/ProviderCapabilities' }
        types:
          type: array
          items: { $ref: '#/components/schemas/OrbType' }
        defaultType: { type: string }
        allowMultiple: { type: boolean }
    ProviderHelloResponse:
      type: object
      required: [providerId, leaseSeconds]
      properties:
        providerId: { $ref: '#/components/schemas/ProviderId' }
        leaseSeconds:
          type: integer
          example: 45
    ProviderClaimRequest:
      type: object
      required: [instanceId, waitSeconds]
      properties:
        instanceId: { type: string }
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 60
          example: 30
    ProviderJob:
      type: object
      required: [id, op, orbId, params, attempt, claimGen]
      properties:
        id: { $ref: '#/components/schemas/JobId' }
        op: { $ref: '#/components/schemas/JobOp' }
        orbId: { $ref: '#/components/schemas/OrbId' }
        params:
          type: object
          additionalProperties: true
          description: |
            按 `op` 取：`spawn` → `JobSpawnParams`；`pause` → `JobPauseParams`；`snapshot` → `JobSnapshotParams`；
            `delete` → `JobDeleteParams`；`delete_snapshot` → `JobDeleteSnapshotParams`。
            每个操作必须幂等，5 分钟超时。
        attempt:
          type: integer
          minimum: 1
          maximum: 3
        claimGen:
          type: integer
          format: int64
          minimum: 1
          description: 本次认领的代数（每次认领 +1）；完成上报必须原样回传，控制面只接受与当前认领代数一致的结果。
    ProviderClaimResponse:
      type: object
      required: [job]
      properties:
        job: { $ref: '#/components/schemas/ProviderJob' }
    ProviderCompleteRequest:
      type: object
      required: [claimGen, ok, output, durationMs]
      properties:
        claimGen:
          type: integer
          format: int64
          description: 认领应答中的 `job.claimGen`；与任务当前认领代数不一致（该次认领已过期被重排或被巡检判失败）时回 409。
        ok: { type: boolean }
        output:
          type: string
          maxLength: 65536
          description: 输出尾部（≤64KB）
        error: { type: string }
        durationMs: { type: integer, format: int64 }
    ProviderByeRequest:
      type: object
      required: [instanceId]
      properties:
        instanceId: { type: string }
    JobSpawnEnv:
      type: object
      required: [ORYN_URL, ORYN_ORB_ID, ORYN_ORB_TOKEN]
      properties:
        ORYN_URL:
          type: string
          x-go-name: OrynURL
        ORYN_ORB_ID:
          type: string
          pattern: '^orb-[0-9a-z]{26}$'
          x-go-name: OrynOrbID
        ORYN_ORB_TOKEN:
          type: string
          description: '`oot_…`'
          x-go-name: OrynOrbToken
    JobSpawnParams:
      type: object
      required: [image, type, env]
      properties:
        image: { type: string }
        snapshotId: { $ref: '#/components/schemas/SnapshotId' }
        type:
          type: string
          description: orb 类型名
        env: { $ref: '#/components/schemas/JobSpawnEnv' }
    JobPauseParams:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/PauseMode' }
    JobSnapshotParams:
      type: object
      required: [snapshotId]
      properties:
        snapshotId: { $ref: '#/components/schemas/SnapshotId' }
    JobDeleteParams:
      type: object
      properties: {}
    JobDeleteSnapshotParams:
      type: object
      required: [snapshotId]
      properties:
        snapshotId: { $ref: '#/components/schemas/SnapshotId' }

    # ============================================================ orb link（C2）
    LinkStreamHeader:
      description: yamux 流的第一行（JSON + `\n`）。
      oneOf:
        - $ref: '#/components/schemas/LinkStreamCtl'
        - $ref: '#/components/schemas/LinkStreamAgent'
        - $ref: '#/components/schemas/LinkStreamEgress'
        - $ref: '#/components/schemas/LinkStreamBlob'
        - $ref: '#/components/schemas/LinkStreamFs'
        - $ref: '#/components/schemas/LinkStreamPortal'
        - $ref: '#/components/schemas/LinkStreamDesk'
      discriminator:
        propertyName: t
        mapping:
          ctl: '#/components/schemas/LinkStreamCtl'
          agent: '#/components/schemas/LinkStreamAgent'
          egress: '#/components/schemas/LinkStreamEgress'
          blob: '#/components/schemas/LinkStreamBlob'
          fs: '#/components/schemas/LinkStreamFs'
          portal: '#/components/schemas/LinkStreamPortal'
          desk: '#/components/schemas/LinkStreamDesk'
    LinkStreamCtl:
      type: object
      description: orbd 建连后开的第一条且唯一的控制流
      required: [t]
      properties:
        t: { type: string, enum: [ctl] }
    LinkStreamAgent:
      type: object
      description: 'agent 启动时由 orbd 开；orbd→orynd 为重组后的 omp 逻辑帧，orynd→orbd 为写入 omp stdin 的命令帧（一行一个 JSON）'
      required: [t, threadId]
      properties:
        t: { type: string, enum: [agent] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkStreamEgress:
      type: object
      description: 每个出站代理连接一条；之后为裸 HTTP/1.1 字节流
      required: [t]
      properties:
        t: { type: string, enum: [egress] }
    LinkStreamBlob:
      type: object
      description: 应 `blob.fetch` 请求由 orbd 开；流头之后为 `size` 字节原始内容
      required: [t, sha256, size]
      properties:
        t: { type: string, enum: [blob] }
        sha256: { $ref: '#/components/schemas/Sha256' }
        size: { type: integer, format: int64 }
    LinkStreamFs:
      type: object
      description: |
        由 orynd 打开（M3）；流头之后是 HTTP/1.1，一条流一个请求（控制面 `Connection: close`），orbd 以本机 API 的
        `http.Server` 服务（路由见 docs/protocol.md「orbd 本机 API」）。只有 hello `features` 含相应特性的 orbd 才接受。
      required: [t]
      properties:
        t: { type: string, enum: [fs] }
    LinkStreamPortal:
      type: object
      description: |
        由 orynd 打开（M4），每个代理连接一条。orbd 先回一行 `LinkPortalReply` + `\n`；`ok=true` 之后流上是与
        `127.0.0.1:<port>`（被拒绝时回退 `[::1]:<port>`）之间的原始字节。只有 hello `features` 含 `portal` 的 orbd 才接受。
      required: [t, port]
      properties:
        t: { type: string, enum: [portal] }
        port: { type: integer, minimum: 1, maximum: 65535 }
    LinkPortalReply:
      type: object
      description: orbd 对 `portal` 流的应答行
      required: [ok]
      properties:
        ok: { type: boolean }
        code:
          type: string
          description: '`ok=false` 时：`not_exposed`（端口不属于有 portal 的服务）、`forbidden_port`（egress 端口）、`connection_refused`、`timeout`、`failed`'
        message: { type: string }
    LinkStreamDesk:
      type: object
      description: |
        由 orynd 打开（M8），每个桌面观看者一条。orbd 先回一行 `LinkDeskReply` + `\n`；`ok=true` 之后流上是与
        Xvnc（unix socket `$HOME/.oryn/vnc.sock`）之间的原始 RFB 字节。只有 hello `features` 含 `desktop` 的 orbd 才接受。
      required: [t]
      properties:
        t: { type: string, enum: [desk] }
    LinkDeskReply:
      type: object
      description: orbd 对 `desk` 流的应答行
      required: [ok]
      properties:
        ok: { type: boolean }
        code:
          type: string
          description: '`ok=false` 时：`display_unavailable`（显示未就绪）、`failed`（连 Xvnc 的 socket 失败，5s）'
        message: { type: string }

    LinkCtlMethod:
      type: string
      description: |
        `ctl` 方法（括号内为方向与形态）：
        `hello`（orbd→orynd 通知）、`entries.cursors`（orbd→orynd 请求）、`entries.append`（orbd→orynd 请求）、
        `entries.reset` / `entries.reset_done`（orbd→orynd 通知）、`agent.status`、`agent.gap`、`setup.log`、`metrics.sample`（orbd→orynd 通知）、
        `setup.run`、`resume.run`、`agent.start`、`agent.stop`、`blob.fetch`、`fs.copyTree`、`fs.move`、`shutdown`（orynd→orbd 请求）；
        `setup.result`（orbd→orynd 通知）、`project.scripts.get` / `project.scripts.set`（orbd→orynd 请求，只作用于本 orb 所属项目）；
        `terminal.gap`（orbd→orynd 通知，M3）；
        `services.state`（orbd→orynd 通知，M4，受管服务全量快照）、`portal.configure`（orynd→orbd 请求，M4）。
        `desktop.state`（orbd→orynd 通知，M8，桌面全量状态）、`profile.mode`（orynd→orbd 请求，M8，改变本地 Profile 的使用方式）。
        `thread.create`、`thread.send`、`thread.get`、`schedule.get`、`schedule.put`、`schedule.delete`、`schedule.enable`
        （orbd→orynd 请求，M9，orb 内 agent 间协作与自我定时；只有 `features` 含 `threads` 的 orbd 发起，协调宿主不接受）。
      enum:
        - hello
        - entries.cursors
        - entries.append
        - entries.reset
        - entries.reset_done
        - agent.status
        - agent.gap
        - setup.log
        - metrics.sample
        - setup.run
        - resume.run
        - agent.start
        - agent.stop
        - blob.fetch
        - fs.copyTree
        - fs.move
        - shutdown
        - setup.result
        - project.scripts.get
        - project.scripts.set
        - terminal.gap
        - services.state
        - portal.configure
        - desktop.state
        - profile.mode
        - thread.create
        - thread.send
        - thread.get
        - schedule.get
        - schedule.put
        - schedule.delete
        - schedule.enable
      x-enum-varnames:
        - MethodHello
        - MethodEntriesCursors
        - MethodEntriesAppend
        - MethodEntriesReset
        - MethodEntriesResetDone
        - MethodAgentStatus
        - MethodAgentGap
        - MethodSetupLog
        - MethodMetricsSample
        - MethodSetupRun
        - MethodResumeRun
        - MethodAgentStart
        - MethodAgentStop
        - MethodBlobFetch
        - MethodFsCopyTree
        - MethodFsMove
        - MethodShutdown
        - MethodSetupResult
        - MethodProjectScriptsGet
        - MethodProjectScriptsSet
        - MethodTerminalGap
        - MethodServicesState
        - MethodPortalConfigure
        - MethodDesktopState
        - MethodProfileMode
        - MethodThreadCreate
        - MethodThreadSend
        - MethodThreadGet
        - MethodScheduleGet
        - MethodSchedulePut
        - MethodScheduleDelete
        - MethodScheduleEnable
    LinkCtlRequest:
      type: object
      required: [id, method, params]
      properties:
        id:
          type: integer
          format: int64
          description: 发起方内单调递增；双方各自独立编号
        method: { $ref: '#/components/schemas/LinkCtlMethod' }
        params:
          type: object
          additionalProperties: true
          description: 见 `LinkCtl<Method>Params`
    LinkCtlResponse:
      type: object
      description: '`result` 与 `error` 二者恰有其一'
      required: [id]
      properties:
        id: { type: integer, format: int64 }
        result:
          type: object
          additionalProperties: true
          description: 见 `LinkCtl<Method>Result`
        error: { $ref: '#/components/schemas/LinkCtlError' }
    LinkCtlError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            `unknown_method`、`invalid_params`、`not_found`、`failed`、`timeout`、`cursor_mismatch` 等；`busy` = 对端同时在途的请求已达上限（每个 ctl 端点 32 个），本请求未执行，可稍后重试。
            M9 orb 内方法另有：`forbidden`（非亲属线程、不属于本 orb 的调用方）、`rate_limited`、`invalid_schedule`、`thread_archived`、`schedule_name_taken`。
        message: { type: string }
    LinkCtlNotification:
      type: object
      required: [method, params]
      properties:
        method: { $ref: '#/components/schemas/LinkCtlMethod' }
        params:
          type: object
          additionalProperties: true
          description: 见 `LinkCtl<Method>Params`

    LinkCtlHelloThread:
      type: object
      required: [threadId, agentRunning]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        agentRunning: { type: boolean }
    LinkCtlHelloParams:
      type: object
      required: [orbdVersion, agentVersion, os, arch, threads]
      properties:
        orbdVersion: { type: string }
        agentVersion: { type: string }
        os: { type: string }
        arch: { type: string }
        threads:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlHelloThread' }
        features:
          type: array
          description: |
            orbd 支持的可选能力（M3 起）：`fs`（`fs` 流上的文件接口）、`git`（`/git/*`）、`attachments`（`/attachments/*`）；
            M4 起：`services`（`services.state` 通知与 `/services/*`）、`portal`（`portal` 流与 `portal.configure`）；M5 起：`sync`（`/sync/*`）；
            M8 起：`desktop`（`desk` 流、`desktop.state` 通知、`profile.mode` 请求与 `/desktop/*`）。
            M9 起：`threads`（orb 内线程与定时方法 `thread.*` / `schedule.*`，普通 orbd 上报）；
            `coordinator`（认识 `agent.start` 的 `profile = coordinator`，**只由** `orynd coordinator-host` 上报，且此时特性表恰为 `["coordinator"]`）。
            缺省 = 旧版 orbd，控制面对其文件 / 改动 / 附件 / 服务 / portal / sync / 桌面请求回 409 `orbd_outdated`。
          items: { type: string }
    LinkCtlEntriesCursorsParams:
      type: object
      required: [threadId]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlEntryCursor:
      type: object
      required: [file, offset]
      properties:
        file:
          type: string
          description: 相对会话目录的路径
        offset:
          type: integer
          format: int64
          description: 已入库的字节偏移（下一次 append 的 baseOffset）
    LinkCtlEntriesCursorsResult:
      type: object
      required: [cursors]
      properties:
        cursors:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlEntryCursor' }
    LinkCtlEntriesAppendParams:
      type: object
      description: '`lines` 为 `[baseOffset, endOffset)` 内以 `\n` 结尾的完整行（不含 `\n`）'
      required: [threadId, file, baseOffset, endOffset, lines]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        file: { type: string }
        baseOffset: { type: integer, format: int64 }
        endOffset: { type: integer, format: int64 }
        lines:
          type: array
          items: { type: string }
    LinkCtlEntriesAppendResult:
      type: object
      description: '`accepted=false` 表示 `baseOffset` 与服务端游标不符，orbd 应从 `offset` 重发'
      required: [accepted, offset]
      properties:
        accepted: { type: boolean }
        offset:
          type: integer
          format: int64
          description: 服务端当前游标
    LinkCtlEntriesResetParams:
      type: object
      description: 文件被重写（变小或 inode 变化）：之后从 0 重发
      required: [threadId, file]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        file: { type: string }
    LinkCtlEntriesResetDoneParams:
      type: object
      description: 全量重发完毕；服务端删除仍为 stale 的行
      required: [threadId, file]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        file: { type: string }
    LinkCtlAgentStatusParams:
      type: object
      required: [threadId, status]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        status:
          type: string
          enum: [starting, ready, exited]
        exitCode: { type: integer }
        stderrTail:
          type: string
          description: '`exited` 时 stderr 尾部 20 行'
        restartsLeft:
          type: integer
          description: '`exited` 时剩余自动重启次数；0 表示不再重启'
    LinkCtlAgentGapParams:
      type: object
      description: 断连期间帧缓冲溢出，实时状态不连续
      required: [threadId]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlTerminalGapParams:
      type: object
      description: |
        orbd 帧缓冲 ≥8MiB 时丢弃了该线程的 `terminal_output` 帧，缓冲回落到 ≤1MiB 后发送一次（M3）。
        控制面向该线程开启 `term.watch` 的连接发 `term.lagged`。
      required: [threadId]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlSetupLogParams:
      type: object
      required: [phase, stream, data]
      properties:
        phase:
          type: string
          enum: [omp_home, git, clone, setup, resume]
        stream:
          type: string
          enum: [stdout, stderr, system]
        data: { type: string }
    LinkCtlSetupResultParams:
      type: object
      description: 每次 setup / resume 结束（含 orb 内手动重跑）时 orbd 发送；控制面写入 `orb_setup_runs`
      required: [phase, trigger, startedAt, ok, setupRan, durationMs, hasRepoScript, hasProjectScript]
      properties:
        phase: { $ref: '#/components/schemas/SetupPhase' }
        trigger: { $ref: '#/components/schemas/SetupTrigger' }
        startedAt: { $ref: '#/components/schemas/TimestampMs' }
        ok: { type: boolean }
        setupRan: { type: boolean }
        error: { type: string }
        durationMs: { type: integer, format: int64 }
        hasRepoScript: { type: boolean }
        hasProjectScript: { type: boolean }
    LinkCtlProjectScriptsGetParams:
      type: object
      description: 无参数
    LinkCtlProjectScripts:
      type: object
      description: 本 orb 所属项目的项目脚本；`project.scripts.get` 的结果与 `project.scripts.set` 的结果
      required: [projectId, projectName]
      properties:
        projectId: { $ref: '#/components/schemas/ProjectId' }
        projectName: { type: string }
        setup: { type: string }
        resume: { type: string }
    LinkCtlProjectScriptsSetParams:
      type: object
      description: 省略的字段保持不变；空串表示清除该脚本。orb 不属于任何项目时返回错误 `no_project`；单个脚本超过 256KiB 时返回错误 `too_large`。每次成功写入记一条 orb_events（`detail.event = project_scripts_set`，带两个脚本的 SHA-256）
      properties:
        setup: { type: string }
        resume: { type: string }
    LinkCtlMetricsSampleParams:
      $ref: '#/components/schemas/OrbMetricSample'
    LinkCtlSetupRepo:
      type: object
      required: [url, shallow]
      properties:
        url: { type: string }
        branch: { type: string }
        shallow: { type: boolean }
    LinkCtlSetupScripts:
      type: object
      properties:
        setup: { type: string }
        resume: { type: string }
    LinkCtlOmpHomeFile:
      type: object
      required: [path, mode, contentB64]
      properties:
        path:
          type: string
          description: 相对 `$HOME/.omp/agent/` 的路径
        mode:
          type: integer
          description: Unix 权限位（十进制）
        contentB64: { type: string }
    LinkCtlSetupRunParams:
      type: object
      required: [workdir, gitHosts, scripts, ompHome, env]
      properties:
        workdir: { type: string }
        repo: { $ref: '#/components/schemas/LinkCtlSetupRepo' }
        gitHosts:
          type: array
          description: 为每个主机写 git `url."http://127.0.0.1:7811/git/<host>/".insteadOf "https://<host>/"`
          items: { type: string }
        scripts: { $ref: '#/components/schemas/LinkCtlSetupScripts' }
        ompHome:
          type: array
          items: { $ref: '#/components/schemas/LinkCtlOmpHomeFile' }
        env:
          type: object
          additionalProperties: { type: string }
        gitIdentity:
          $ref: '#/components/schemas/GitIdentity'
          description: 写入 `git config --global user.name / user.email`（项目覆盖 > 所有者默认）；缺省时不改动现有配置
    LinkCtlSetupRunResult:
      type: object
      required: [ok, setupRan, durationMs]
      properties:
        ok:
          type: boolean
          description: setup 脚本失败（含超时）时为 false；orb 仍可使用，agent 照常启动以便修复脚本
        setupRan:
          type: boolean
          description: 本次是否实际执行了 setup（标记已存在则为 false）
        setupError:
          type: string
          description: setup 脚本失败原因（ok=false 时给出；完整输出见 setup.log）
        durationMs: { type: integer, format: int64 }
    LinkCtlResumeRunParams:
      description: 同 `setup.run`，但不 clone、不跑 setup
      allOf:
        - $ref: '#/components/schemas/LinkCtlSetupRunParams'
    LinkCtlResumeRunResult:
      $ref: '#/components/schemas/LinkCtlSetupRunResult'
    LinkCtlAgentStartParams:
      type: object
      required: [threadId, sessionDir, cwd, env, initFrames]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        sessionDir: { type: string }
        cwd: { type: string }
        env:
          type: object
          additionalProperties: { type: string }
        initFrames:
          type: array
          description: '`ready` 并完成 `negotiate_protocol` 后依次发送的 omp 命令帧'
          items: { $ref: '#/components/schemas/OmpFrame' }
        profile:
          type: string
          description: |
            M9：`coordinator` = 协调档（无代码工具、独立 HOME 与设置覆盖层、从零构造的环境，`cwd` 由 orbd 决定）。
            **只有协调宿主接受**：普通 orbd 收到非空 `profile` → `invalid_params`；协调宿主收到其它值或省略 → `invalid_params`。
          enum: [coordinator]
          x-enum-varnames: [AgentProfileCoordinator]
        systemPrompt:
          type: string
          description: M9 协调档的系统提示词（以字面量传给 omp `--system-prompt`，必须含换行，否则 `invalid_params`）；只有协调宿主接受
    LinkCtlAgentStartResult:
      type: object
      required: [pid]
      properties:
        pid: { type: integer }
    LinkCtlAgentStopParams:
      type: object
      required: [threadId, graceSeconds]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        graceSeconds: { type: integer }
    LinkCtlAgentStopResult:
      type: object
      required: [exitCode]
      properties:
        exitCode: { type: integer }
    LinkCtlBlobFetchParams:
      type: object
      required: [sha256]
      properties:
        sha256: { $ref: '#/components/schemas/Sha256' }
    LinkCtlBlobFetchResult:
      type: object
      description: '`found=true` 时 orbd 另开一条 `blob` 流'
      required: [found]
      properties:
        found: { type: boolean }
    LinkCtlFsCopyTreeParams:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    LinkCtlFsMoveParams:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
    LinkCtlOkResult:
      type: object
      description: '`fs.copyTree` / `fs.move` / `shutdown` / `portal.configure` 的结果'
      required: [ok]
      properties:
        ok: { type: boolean }
    LinkCtlShutdownParams:
      type: object
      required: [graceSeconds]
      properties:
        graceSeconds: { type: integer }
    LinkCtlServicesStateParams:
      type: object
      description: orbd 的受管服务全量快照；每次定义或状态变化、link 建立后、收到 `portal.configure` 后发送
      required: [services]
      properties:
        services:
          type: array
          items: { $ref: '#/components/schemas/OrbService' }
    LinkCtlPortalConfigureParams:
      type: object
      description: hello 之后由 orynd 下发（仅对 `features` 含 `portal` 的 orbd）；结果为 `LinkCtlOkResult`
      required: [urlTemplate]
      properties:
        urlTemplate:
          type: string
          description: 'portal 地址模板，如 `https://t-{code}-p{port}.orb.example.com/`；空串 = 控制面未配置 `portal_domain`'
        primaryThreadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 文件服务与未指定线程的服务归属的线程（本 orb 最早创建的线程）
    LinkCtlDesktopStateParams:
      type: object
      description: |
        orbd→orynd 通知（M8）：桌面全量状态。发送时机：`displayReady`、`browser`、标记里的 `profileId` / `profileMode`、`dirty`
        任一变化，以及 link 建立后（脏标记 + 单发送者，断连时丢弃、重连必补发）。控制面写入 `orb_desktops` 镜像并经 WS `orb` 消息推送。
      required: [displayReady, browser, dirty]
      properties:
        displayReady: { type: boolean }
        browser: { $ref: '#/components/schemas/OrbBrowserStatus' }
        profileId:
          type: string
          description: orbd 本地标记里的 Profile（`bpf_…`）；空串或省略 = 没有
        profileMode:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileAccess'
          description: 标记里的使用方式；没有 Profile 时省略
        readonlyReason:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileReadonlyReason'
          description: '`profileMode=readonly` 时的原因'
        readonlyBy:
          type: string
          description: '`readonlyReason=taken_over` 时接管方线程的标题（来自 `profile.mode` 的 `by`）'
        dirty:
          type: boolean
          description: 自上次装载或关闭式导出以来浏览器启动过（有东西可存）；只读时恒为 false
    LinkCtlProfileModeParams:
      type: object
      description: |
        orynd→orbd 请求（M8；仅对 `features` 含 `desktop` 的 orbd；结果 `LinkCtlOkResult`，10s，失败只记日志）。
        目前只在接管时发给原持有者：`{profileId, mode: readonly, reason: taken_over, by: <接管方线程标题>}`。
        orbd 只在标记的 `profileId` 与之相同时生效：改写标记的使用方式、`dirty=false`，浏览器照常运行、标签页不动，
        此后 `/desktop/profile/export` 回 409 `profile_readonly`（跳过一切保存）；标记不符 → 错误 `profile_mismatch`。
        `mode=exclusive` → 错误 `invalid_params`（独占只能经 `PUT /desktop/profile` 重新装载取得）。
        这条请求丢失无害：控制面按围栏代数丢弃迟到的保存（记 `profile.save_fenced`），且下次同步的 `PUT /desktop/profile` 带 `mode`。
      required: [profileId, mode, reason]
      properties:
        profileId: { $ref: '#/components/schemas/BrowserProfileId' }
        mode: { $ref: '#/components/schemas/BrowserProfileAccess' }
        reason: { $ref: '#/components/schemas/BrowserProfileReadonlyReason' }
        by:
          type: string
          description: 接管方线程的标题（`reason=taken_over` 时）
        byThreadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 接管方的代表线程
    LinkCtlThreadCreateParams:
      type: object
      description: |
        orbd→orynd 请求（M9，`features` 含 `threads` 的 orbd；由 orb 内 `oryn thread new` 经 `orbd.sock` 转来）。
        在调用方线程的项目（与 Space）里新建一个子线程（`parentThreadId` = 调用方），新 orb；结果 `LinkCtlThreadInfo`。
        调用方须属于本 orb、`kind = work`、未归档，否则 `forbidden`；超出子线程数 / 深度 / 全库速率 → `rate_limited`。
      required: [threadId, prompt]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        prompt: { type: string }
        title: { type: string }
        type:
          type: string
          description: orb 类型名；缺省取项目默认
    LinkCtlThreadInfo:
      type: object
      description: '`thread.create` / `thread.get` 的结果'
      required: [id, title, state, settled, url]
      properties:
        id: { $ref: '#/components/schemas/ThreadId' }
        title: { type: string }
        state: { $ref: '#/components/schemas/ThreadState' }
        settled:
          type: boolean
          description: '`state` ∈ {`idle`, `awaiting_input`, `error`}'
        lastAssistantText:
          type: string
          maxLength: 8000
          description: 最后一条 assistant 消息的文本（截断到 8000 字符）
        url:
          type: string
          description: 线程在 Web 上的地址（`<public_url>/t/<id>`）
    LinkCtlThreadSendParams:
      type: object
      description: |
        orbd→orynd 请求（M9）：以自动化身份向 `target` 追加一条消息（正文前加来源头行）；结果 `LinkCtlOkResult`。
        `target` 须是调用方的父线程或直接子线程且 `kind = work`，否则 `forbidden`。
      required: [threadId, target, message]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        target: { $ref: '#/components/schemas/ThreadId' }
        message: { type: string }
        steer:
          type: boolean
          description: 为真且目标正在工作时作为 steer 送达；否则排在当前回合之后
    LinkCtlThreadGetParams:
      type: object
      description: orbd→orynd 请求（M9）：读取亲属线程的状态；结果 `LinkCtlThreadInfo`；亲属规则同 `thread.send`
      required: [threadId, target]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        target: { $ref: '#/components/schemas/ThreadId' }
    LinkCtlScheduleParams:
      type: object
      description: '`schedule.get` / `schedule.delete` 的参数（M9）：只作用于调用方线程自己的线程内定时；结果分别为 `LinkCtlScheduleResult` / `LinkCtlOkResult`'
      required: [threadId]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
    LinkCtlSchedulePutParams:
      type: object
      description: |
        `schedule.put`（M9）：设置调用方线程的线程内定时（`createdBy = agent`）；结果 `LinkCtlScheduleResult`。
        `input` 只接受线程内定时的字段：带 `mode = new_thread`、`threadId`（不等于调用方）或任一 `new_thread` 专属字段 → `invalid_schedule`。
      required: [threadId, input]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        input: { $ref: '#/components/schemas/ScheduleInput' }
    LinkCtlScheduleEnableParams:
      type: object
      description: '`schedule.enable`（M9）：暂停 / 恢复调用方线程的线程内定时；结果 `LinkCtlScheduleResult`'
      required: [threadId, enabled]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 调用方线程
        enabled: { type: boolean }
    LinkCtlScheduleResult:
      type: object
      description: '`schedule.get` / `schedule.put` / `schedule.enable` 的结果；`schedule` 省略 = 该线程没有定时'
      properties:
        schedule: { $ref: '#/components/schemas/Schedule' }
