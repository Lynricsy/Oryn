      x-enum-varnames: [SchedulePausedReasonUser, SchedulePausedReasonFailures, SchedulePausedReasonArchived, SchedulePausedReasonDone]
    ScheduleCreatedBy:
      type: string
      enum: [user, agent]
      x-enum-varnames: [ScheduleCreatedByUser, ScheduleCreatedByAgent]
    ScheduleInput:
      type: object
      description: |
        定时的定义（创建、替换、预览共用）。时间字段：`kind = cron` 须给 `cron`（恰好 5 段，或 `@hourly @daily @midnight @weekly @monthly @yearly @annually`；
        不接受 `TZ=` / `CRON_TZ=` 前缀与 `@every`）；`kind = every` 须给 `every`（Go 时长串，≥`1m`、≤`8784h`、整秒）；`kind = once` 须给 `at`（不早于当前 60 秒）。
        `timezone` 为 IANA 名称，缺省 `UTC`；`endsAt` 须晚于当前。
        模式规则（违反即 400 `invalid_schedule`）：`POST /schedules` 必须给 `mode`；`thread` 必须给 `threadId` 且不得带
        `projectId` / `spaceId` / `model` / `thinkingLevel` / `provider` / `orbType` / `overlap` / `keepLast`；
        `new_thread` 不得带 `threadId`，`name` 必填（1–80）；`PUT /schedules/{id}` 里 `mode` / `threadId` / `projectId` 若出现必须与现值相同；
        `PUT /threads/{id}/schedule` 隐含 `mode = thread`。
        `prompt` 里的占位符 `{{now}}` `{{date}}` `{{scheduled_at}}` `{{run_number}}` `{{last_run_at}}` 在投递时替换。
      required: [kind, prompt]
      properties:
        mode: { $ref: '#/components/schemas/ScheduleMode' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 仅 `thread`：目标线程
        name: { type: string, maxLength: 80 }
        kind: { $ref: '#/components/schemas/ScheduleKind' }
        cron: { type: string }
        every:
          type: string
          example: 30m
        at: { $ref: '#/components/schemas/TimestampMs' }
        timezone:
          type: string
          example: Asia/Shanghai
        endsAt: { $ref: '#/components/schemas/TimestampMs' }
        prompt:
          type: string
          maxLength: 20000
          description: 1–20000 字符（预览时可为空串）
        enabled:
          type: boolean
          description: 缺省 true；false 时保存为暂停（`pausedReason = user`）
        projectId:
          allOf:
            - $ref: '#/components/schemas/ProjectId'
          description: 仅 `new_thread`：新线程所在项目；省略 = 无项目
        spaceId:
