  # ---------------------------------------------------------------- owner memory (M17)
  /api/v1/owner-memory/settings:
    get:
      tags: [owner-memory]
      operationId: getOwnerMemorySettings
      summary: 助手记忆的开关、主人的名字与别名、判断模型接口
      responses:
        '200':
          description: 设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemorySettings' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [owner-memory]
      operationId: putOwnerMemorySettings
      summary: 修改助手记忆开关与主人的名字和别名
      description: |
        首次开启时定下回填起点（30 天前）。名字或别名变化时，下一次写入前重写 bank 配置。
        关闭后写入、主题整理、注入与检索全部停止，已有数据保留。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerMemorySettingsUpdate' }
      responses:
        '200':
          description: 修改后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemorySettings' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/decide-endpoint:
    put:
      tags: [owner-memory]
      operationId: putOwnerMemoryDecideEndpoint
      summary: 配置判断模型接口（Google Decisions API，用于召回重排）
      description: 远端地址必须用 `https://`，否则 400 `insecure_url`。key 加密保存，之后只返回 `hasKey`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerMemoryDecideUpdate' }
      responses:
        '200':
          description: 修改后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemorySettings' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [owner-memory]
      operationId: deleteOwnerMemoryDecideEndpoint
      summary: 删除判断模型接口（召回改按 RRF 顺序给出并标注未经重排）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 修改后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemorySettings' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/status:
    get:
      tags: [owner-memory]
      operationId: getOwnerMemoryStatus
      summary: 助手记忆的运行状态：bank 统计、回填进度、写入失败数、最近主题整理与用量
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemoryStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/topics:
    get:
      tags: [owner-memory]
      operationId: listOwnerMemoryTopics
      summary: 主题（注入「关于主人」的那部分）与最近一次主题整理的结果
      responses:
        '200':
          description: 主题
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemoryTopicList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/topics/{topicId}/refresh:
    parameters:
      - { $ref: '#/components/parameters/OwnerMemoryTopicIdPath' }
    post:
      tags: [owner-memory]
      operationId: refreshOwnerMemoryTopic
      summary: 立即刷新一个主题（不受刷新间隔限制）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202': { description: 已提交刷新 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/curate:
    post:
      tags: [owner-memory]
      operationId: curateOwnerMemoryTopics
      summary: 立即运行一次主题整理（新增、归档主题）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 整理结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemoryCuration' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/brief:
    get:
      tags: [owner-memory]
      operationId: getOwnerMemoryBrief
      summary: 注入预览：助手对话启动时追加到系统提示词的记忆段
      parameters:
        - { name: threadId, in: query, schema: { $ref: '#/components/schemas/ThreadId' }, description: 给出时返回该对话的快照（没有或过期时现生成，不写入）；省略 = 现生成 }
      responses:
        '200':
          description: 记忆段
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemoryBrief' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/facts:
    get:
      tags: [owner-memory]
      operationId: listOwnerMemoryFacts
      summary: 浏览或召回主人记忆里的事实（带出处）
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 800 }, description: 给出时按召回排序（不分页），否则按时间倒序列出 }
        - { name: type, in: query, schema: { type: string, enum: [world, observation] } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: 一页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemoryFactList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/facts/{factId}/state:
    parameters:
      - { $ref: '#/components/parameters/OwnerMemoryFactIdPath' }
    put:
      tags: [owner-memory]
      operationId: setOwnerMemoryFactState
      summary: 让一条 world 事实失效或恢复（observation 不能直接失效，只能失效它的来源事实）
      description: 失效后，全部活跃主题在刷新完成前不进入注入（遗忘保护）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnerMemoryFactStateUpdate' }
      responses:
        '204': { description: 已修改 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/sources:
    get:
      tags: [owner-memory]
      operationId: listOwnerMemorySources
      summary: 已写入（或写入失败）的来源对话与线程（按最近更新倒序）
      parameters:
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: 一页
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemorySourceList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/sources/{id}:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    delete:
      tags: [owner-memory]
      operationId: forgetOwnerMemorySource
      summary: 按来源遗忘：删除该对话或线程写入的全部 document（之后有新内容仍会再写入，除非设了排除）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 删除结果（失败的进入重试队列，计入 pending）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryForgetResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/exclusions:
    get:
      tags: [owner-memory]
      operationId: listOwnerMemoryExclusions
      summary: 不进助手记忆的对话与项目
      responses:
        '200':
          description: 排除项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemoryExclusionList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/exclusions/{kind}/{targetId}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { $ref: '#/components/schemas/OwnerMemoryExclusionKind' }
      - name: targetId
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    put:
      tags: [owner-memory]
      operationId: putOwnerMemoryExclusion
      summary: 设为不进助手记忆（已写入的随之遗忘）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 遗忘结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemoryForgetResult' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [owner-memory]
      operationId: deleteOwnerMemoryExclusion
      summary: 取消排除（之后有新内容时重新写入）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已取消 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/explicit:
    get:
      tags: [owner-memory]
      operationId: listOwnerMemoryExplicit
      summary: 明确记忆（待确认的在前）
      responses:
        '200':
          description: 明确记忆
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemoryExplicitList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [owner-memory]
      operationId: createOwnerMemoryExplicit
      summary: 新建一条明确记忆（直接生效）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryContent' }
      responses:
        '200':
          description: 新建的记忆
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemoryExplicit' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/explicit/{explicitId}:
    parameters:
      - { $ref: '#/components/parameters/OwnerMemoryExplicitIdPath' }
    patch:
      tags: [owner-memory]
      operationId: updateOwnerMemoryExplicit
      summary: 修改内容（已生效的随之重写 document）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryContent' }
      responses:
        '200':
          description: 修改后的记忆
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemoryExplicit' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [owner-memory]
      operationId: deleteOwnerMemoryExplicit
      summary: 删除（已生效的连同 document 一起删除；待确认的即拒绝）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/owner-memory/explicit/{explicitId}/approve:
    parameters:
      - { $ref: '#/components/parameters/OwnerMemoryExplicitIdPath' }
    post:
      tags: [owner-memory]
      operationId: approveOwnerMemoryExplicit
      summary: 批准待确认的明确记忆（可先改写内容），写入 bank
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MemoryCandidateApprove' }
      responses:
        '200':
          description: 生效后的记忆
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerMemoryExplicit' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/coordinator:
    get:
      tags: [automation]
      operationId: getCoordinator
      summary: 协调宿主的可用性与沙箱报告
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoordinatorStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/automation/actions:
    get:
      tags: [automation]
      operationId: listAutomationActions
      summary: 协调者与 orb 内 agent 的操作记录（审计，新的在前，保留 90 天）
      parameters:
        - name: thread
          in: query
          description: 只返回该线程作为发起方或目标的记录
          schema: { $ref: '#/components/schemas/ThreadId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 操作记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationActionList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules:
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: 定时列表（两种模式；按创建时间）
      parameters:
        - name: mode
          in: query
          schema: { $ref: '#/components/schemas/ScheduleMode' }
        - name: project
          in: query
          description: 项目 id：该项目的 `new_thread` 定时；`none` = 没有项目的 `new_thread` 定时
          schema: { type: string }
        - name: space
          in: query
          description: '`spaceId` 为它的 `new_thread` 定时，加上挂在该 Space 线程上的线程内定时'
          schema: { $ref: '#/components/schemas/SpaceId' }
        - name: thread
          in: query
          description: 该线程的线程内定时
          schema: { $ref: '#/components/schemas/ThreadId' }
      responses:
        '200':
          description: 定时列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: 新建定时（必须给 `mode`）
      description: |
        `mode = thread`：须给 `threadId`（每线程至多一个，已有 → 409 `conflict`；线程已归档 → 409 `thread_archived`）。
        `mode = new_thread`：须给 `name`；同项目（或同为无项目）下重名 → 409 `schedule_name_taken`。
        字段规则见 `ScheduleInput`，违反 → 400 `invalid_schedule`；全库启用中的定时已达 200 → 409 `schedule_limit`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/preview:
    post:
      tags: [schedules]
      operationId: previewSchedule
      summary: 预览接下来的触发时间（至多 5 个；只看时间字段，`prompt` 可为空串）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: 预览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePreview' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/{id}:
    parameters:
      - { $ref: '#/components/parameters/ScheduleIdPath' }
    get:
      tags: [schedules]
      operationId: getSchedule
      summary: 定时详情
      responses:
        '200':
          description: 定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [schedules]
      operationId: putSchedule
      summary: 替换定时的定义（保留 `id`、`runCount`；清零 `failures` 与 `pausedReason`；重算 `nextRunAt`）
      description: '`mode` / `threadId` / `projectId` 若出现必须与现值相同（目标不可改），否则 400 `invalid_schedule`。带 `ifRev` 且与当前 `rev` 不等（或定时已不存在）→ 409 `schedule_conflict`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: 修改后的定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: 删除定时（连同运行记录；它建出的线程保留）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/{id}/pause:
    parameters:
      - { $ref: '#/components/parameters/ScheduleIdPath' }
    post:
      tags: [schedules]
      operationId: pauseSchedule
      summary: 暂停（`pausedReason = user`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/{id}/resume:
    parameters:
      - { $ref: '#/components/parameters/ScheduleIdPath' }
    post:
      tags: [schedules]
      operationId: resumeSchedule
      summary: 恢复（重算 `nextRunAt`，不补跑暂停期间错过的触发；已结束的一次性定时 → 400 `invalid_schedule`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/{id}/run:
    parameters:
      - { $ref: '#/components/parameters/ScheduleIdPath' }
    post:
      tags: [schedules]
      operationId: runSchedule
      summary: 立即触发一次（`trigger = manual`；不改 `nextRunAt`；暂停中的定时也可触发）
      description: 已有未结束的运行且不允许并存（线程内定时，或 `overlap = skip`）→ 409 `schedule_busy`。设了运行前闸门（`gate`）时同样先过闸门，返回的运行此时可能仍是 `pending`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 本次运行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleRun' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/{id}/runs:
    parameters:
      - { $ref: '#/components/parameters/ScheduleIdPath' }
    get:
      tags: [schedules]
      operationId: listScheduleRuns
      summary: 最近的运行记录（新的在前；每个定时保留最近 200 条）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 运行记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleRunList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/schedule:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [schedules]
      operationId: getThreadSchedule
      summary: 线程内定时（没有 → 404 `schedule_not_found`）
      responses:
        '200':
          description: 定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [schedules]
      operationId: putThreadSchedule
      summary: 设置线程内定时（没有则新建，有则替换定义；隐含 `mode = thread`）
      description: 请求体不得带 `new_thread` 专属字段，`mode` / `threadId` 若出现须为 `thread` / 本线程，否则 400 `invalid_schedule`；线程已归档 → 409 `thread_archived`；带 `ifRev` 且不满足版本条件 → 409 `schedule_conflict`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: 定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [schedules]
      operationId: deleteThreadSchedule
      summary: 删除线程内定时（没有 → 404 `schedule_not_found`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- github（M14）
  /api/v1/github:
    get:
      tags: [github]
      operationId: getGitHubStatus
      summary: GitHub 集成状态（OAuth App、两个身份槽位、自动化身份、webhook 基址、最近投递）
      responses:
        '200':
          description: 当前状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/identities/{slot}/authorize:
    parameters:
      - { $ref: '#/components/parameters/GitHubIdentitySlotPath' }
    post:
      tags: [github]
      operationId: authorizeGitHubIdentity
      summary: 开始连接身份槽位（返回 GitHub 授权地址，10 分钟内有效；没有 OAuth App → 409 `github_not_configured`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 授权地址
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubRedirect' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/identities/{slot}:
    parameters:
      - { $ref: '#/components/parameters/GitHubIdentitySlotPath' }
    delete:
      tags: [github]
      operationId: deleteGitHubIdentity
      summary: 断开身份槽位（断开我的账号前先删除 Oryn 建的全部仓库 hook；未连接 → 404 `not_found`）
      description: |
        不改动「自动化任务的 GitHub 身份」设置（仍为 `agent` 时不会改回 `user`）。Agent 账号断开后，全自动线程按 Q6 处理：
        「任何人」档规则与外部 PR 评审规则不回退，事件记为 `ignored:agent_required` 并通知主人；其余全自动线程回退到我的账号，
        并在线程里写一条提示。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已断开 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/settings:
    put:
      tags: [github]
      operationId: putGitHubSettings
      summary: 设置自动化任务的 GitHub 身份（`user` / `agent`；Agent 账号未连接时也可选 `agent`，实际使用时按 Q6 回退）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubSettings' }
      responses:
        '200':
          description: 写入后的状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/repos:
    get:
      tags: [github]
      operationId: listGitHubRepos
      summary: 我的账号可访问的仓库（按最近推送倒序，至多 50 个；我的账号未连接 → 409 `github_identity_required`）
      parameters:
        - name: q
          in: query
          description: 按 `owner/name` 子串过滤（忽略大小写）
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 仓库列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubRepoList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/oauth-app:
    put:
      tags: [github]
      operationId: setGitHubOAuthApp
      summary: 保存 OAuth App 的 Client ID / Secret 与 webhook 基址（M15；`clientSecret` 缺省时沿用已存的值）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubOAuthAppInput' }
      responses:
        '200':
          description: 写入后的状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubStatus' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [github]
      operationId: deleteGitHubOAuthApp
      summary: 删除 OAuth App 配置（M15；先删除 Oryn 建的全部仓库 hook，再断开两个身份）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/hooks:
    get:
      tags: [github]
      operationId: listGitHubHooks
      summary: Oryn 管理的仓库 webhook 及其状态（M15）
      responses:
        '200':
          description: hook 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubHookList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/audit:
    get:
      tags: [github]
      operationId: listGitHubAudit
      summary: GitHub 写操作审计（M15；按时间倒序，保留 30 天）
      parameters:
        - name: thread
          in: query
          schema: { $ref: '#/components/schemas/ThreadId' }
        - name: repo
          in: query
          description: '`owner/repo`'
          schema: { type: string, maxLength: 200 }
        - name: before
          in: query
          description: 只返回 id 小于该值的记录（分页游标）
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 审计记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubAuditList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/tasks:
    get:
      tags: [github]
      operationId: listGitHubTasks
      summary: 触发规则建立的 issue 线程与发布哨兵的状态（M15）
      responses:
        '200':
          description: 任务列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubTaskList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/tasks/cleanup:
    post:
      tags: [github]
      operationId: cleanupGitHubTask
      summary: 把 issue 线程置为 `abandoned` 并冻结其 orb（M15；不改动远端）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubTaskRef' }
      responses:
        '200':
          description: 修改后的任务
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubTask' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/triage:
    post:
      tags: [github]
      operationId: triageGitHubIssue
      summary: 拉取线上 issue，合成 `issues.opened` 交给触发规则（M15）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubTriageRequest' }
      responses:
        '200':
          description: 新建或已关联的线程
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubTriageResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/deliveries/{guid}/replay:
    parameters:
      - name: guid
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 200 }
    post:
      tags: [github]
      operationId: replayGitHubDelivery
      summary: 重放 7 天内已结束的投递（M15）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202': { description: 已重新入队 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/presets:
    get:
      tags: [github]
      operationId: listGitHubPresets
      summary: 触发规则预设（M15：robomp 分诊 / PR 评审 / 发布哨兵）
      responses:
        '200':
          description: 预设列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubPresetList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/github/triggers:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [github]
      operationId: listGitHubTriggers
      summary: 项目的 GitHub 触发规则
      responses:
        '200':
          description: 规则列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubTriggerList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [github]
      operationId: createGitHubTrigger
      summary: 新建触发规则（项目未绑定 → 409 `github_not_bound`；`mention` 规则要求 Agent 已连接 → 409 `github_agent_required`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubTriggerInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubTrigger' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/github/triggers/{id}:
    parameters:
      - { $ref: '#/components/parameters/GitHubTriggerIdPath' }
    patch:
      tags: [github]
      operationId: updateGitHubTrigger
      summary: 修改触发规则（只改出现的字段）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitHubTriggerPatch' }
      responses:
        '200':
          description: 修改后的规则
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubTrigger' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [github]
      operationId: deleteGitHubTrigger
      summary: 删除触发规则
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/github/refs:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
    get:
      tags: [github]
      operationId: listGitHubRefs
      summary: 输入框 `#` 引用的 issue / PR 候选（项目未绑定 → 409 `github_not_bound`）
      parameters:
        - name: q
          in: query
          description: 空 = 最近更新的打开项；纯数字 = 按编号；其它 = 搜索
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 候选
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitHubRefList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/projects/{id}/github/refs/{number}/attachment:
    parameters:
      - { $ref: '#/components/parameters/ProjectIdPath' }
      - { $ref: '#/components/parameters/GitHubNumberPath' }
    post:
      tags: [github]
      operationId: attachGitHubRef
      summary: 把 issue / PR（含评论）渲染成 Markdown 附件（未绑定线程，随消息绑定）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '201':
          description: 已保存的附件
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/github/pulls/{number}:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
      - { $ref: '#/components/parameters/GitHubNumberPath' }
    put:
      tags: [github]
      operationId: putThreadPull
      summary: 暂停 / 恢复关联 PR 的事件回流（恢复时 CI 轮数清零）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThreadPullPatch' }
      responses:
        '200':
          description: 修改后的线程
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [github]
      operationId: deleteThreadPull
      summary: 取消线程与 PR 的关联（之后不会自动重连）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 修改后的线程
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thread' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/public/github/webhook:
    post:
      tags: [public]
      operationId: receiveGitHubWebhook
      summary: 仓库 webhook 入口（按该仓库 hook 的 secret 校验 `X-Hub-Signature-256`；同一 `X-GitHub-Delivery` 只处理一次）
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202': { description: 已受理 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/public/github/oauth/callback:
    get:
      tags: [public]
      operationId: finishGitHubOAuth
      summary: 身份授权回调（302 回设置页，`?connected=<slot>` 或 `?error=<code>`）
      security: [{}]
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        '302':
          description: 回到设置页
          headers:
            Location:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- boxes（M23：常驻机器与应用部署）
  /api/v1/boxes:
    get:
      tags: [boxes]
      operationId: listBoxes
      summary: 全部 box（按创建时间）
      responses:
        '200':
          description: box 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [boxes]
      operationId: createBox
      summary: 新建 box
      description: |
        名字不合规 → 400 `invalid_request`；重名 → 409 `box_exists`；已有 16 台 → 409 `box_limit`。
        provider / type 省略时按默认落点解析；box 的 orb 不冻结、不随线程回收。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBoxRequest' }
      responses:
        '201':
          description: 新 box
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Box' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/box-activity:
    get:
      tags: [boxes]
      operationId: listAllBoxActivity
      summary: 全部 box 的最近活动（新到旧）
      parameters:
        - { $ref: '#/components/parameters/BoxActivityLimit' }
      responses:
        '200':
          description: 活动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxActivityList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
    get:
      tags: [boxes]
      operationId: getBox
      summary: 单台 box（`box` 为 id 或名字）
      responses:
        '200':
          description: box
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Box' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [boxes]
      operationId: updateBox
      summary: 改名或设置运行时段
      description: 有未结束的部署时改名 → 409 `deploy_in_progress`。app 地址不含 box 名，改名不影响地址。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBoxRequest' }
      responses:
        '200':
          description: 修改后的 box
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Box' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [boxes]
      operationId: deleteBox
      summary: 删除 box（连同全部 app 与数据，不可恢复）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204':
          description: 已删除
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/start:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
    post:
      tags: [boxes]
      operationId: startBox
      summary: 启动 box（期望状态改为 running；保持到下一个时段边界）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Box' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/stop:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
    post:
      tags: [boxes]
      operationId: stopBox
      summary: 停止 box（期望状态改为 stopped；保持到下一个时段边界）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '202':
          description: 已受理
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Box' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/activity:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
    get:
      tags: [boxes]
      operationId: listBoxActivity
      summary: 这台 box 的活动（含近 30 天在它上面开的工作线程），新到旧
      parameters:
        - { $ref: '#/components/parameters/BoxActivityLimit' }
      responses:
        '200':
          description: 活动
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxActivityList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/usage:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
    get:
      tags: [boxes]
      operationId: getBoxUsage
      summary: 最近 21 个 UTC 自然日的线程数与在线率
      responses:
        '200':
          description: 用量
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxUsage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/exec:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
    post:
      tags: [boxes]
      operationId: execBox
      summary: 在 box 上执行命令（流式）
      description: |
        `bash -lc <command>`；给了 `app` 时工作目录为 `~/apps/<app>/current`，否则 `~`。响应每行一个 JSON 对象：
        `{"s":"o"|"e","d":"<文本块>"}`，最后一行 `{"exit":<退出码>}`（超时为 124）。客户端断开时远端进程组被杀。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoxExecRequest' }
      responses:
        '200':
          description: NDJSON 流
          content:
            application/x-ndjson:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/apps/{app}:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
      - { $ref: '#/components/parameters/BoxAppPath' }
    patch:
      tags: [boxes]
      operationId: updateBoxApp
      summary: 切换 app 的公开性
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBoxAppRequest' }
      responses:
        '200':
          description: 修改后的 app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxApp' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [boxes]
      operationId: undeployBoxApp
      summary: 下线 app（停止服务、删除 release；`purgeData` 为真时连数据目录一起删）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: purgeData
          in: query
          required: false
          schema: { type: boolean }
      responses:
        '204':
          description: 已下线
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/apps/{app}/restart:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
      - { $ref: '#/components/parameters/BoxAppPath' }
    post:
      tags: [boxes]
      operationId: restartBoxApp
      summary: 重启 app 的全部服务（重新下发密钥与环境变量）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxApp' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/apps/{app}/rollback:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
      - { $ref: '#/components/parameters/BoxAppPath' }
    post:
      tags: [boxes]
      operationId: rollbackBoxApp
      summary: 回滚到保留着的 release（省略 `releaseId` = 上一个）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BoxRollbackRequest' }
      responses:
        '200':
          description: app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxApp' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/apps/{app}/cancel-deploy:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
      - { $ref: '#/components/parameters/BoxAppPath' }
    post:
      tags: [boxes]
      operationId: cancelBoxDeploy
      summary: 取消 app 未结束的部署（已进入激活 → 409 `deploy_in_progress`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204':
          description: 已取消
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/apps/{app}/releases:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
      - { $ref: '#/components/parameters/BoxAppPath' }
    get:
      tags: [boxes]
      operationId: listBoxReleases
      summary: app 的 release（新到旧）
      responses:
        '200':
          description: release 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxReleaseList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/apps/{app}/secrets:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
      - { $ref: '#/components/parameters/BoxAppPath' }
    get:
      tags: [boxes]
      operationId: listBoxSecrets
      summary: app 的密钥与环境变量（密文项不回值）
      responses:
        '200':
          description: 密钥列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoxSecretList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/boxes/{box}/apps/{app}/secrets/{name}:
    parameters:
      - { $ref: '#/components/parameters/BoxPath' }
      - { $ref: '#/components/parameters/BoxAppPath' }
      - { $ref: '#/components/parameters/BoxSecretNamePath' }
    put:
      tags: [boxes]
      operationId: putBoxSecret
      summary: 设置密钥或环境变量（下一次部署或重启后生效）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PutBoxSecretRequest' }
      responses:
        '204':
          description: 已保存
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [boxes]
      operationId: deleteBoxSecret
      summary: 删除密钥或环境变量
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204':
          description: 已删除
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- ssh（M18：SSH 主机、钥匙与网关审计）
  /api/v1/ssh/hosts:
    get:
      tags: [ssh]
      operationId: listSshHosts
      summary: 全部 SSH 主机（全局在前，再按项目、名称）
      responses:
        '200':
          description: 主机列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshHostList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [ssh]
      operationId: createSshHost
      summary: 登记 SSH 主机
      description: |
        校验失败 → 400 `invalid_request`（`message` 为可直接展示的中文说明）；同作用域重名 → 409 `conflict`；项目不存在 → 404 `not_found`。
        私钥与密码只存控制面；orb 内经 orbd 的回环端口连到控制面 SSH 网关，由网关代为登录。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SshHostCreate' }
      responses:
        '201':
          description: 新主机
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshHost' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
    get:
      tags: [ssh]
      operationId: getSshHost
      summary: 单台 SSH 主机
      responses:
        '200':
          description: 主机
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshHost' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [ssh]
      operationId: updateSshHost
      summary: 修改 SSH 主机（只改给出的字段；作用域建后不可改）
      description: |
        改地址或端口会清掉已固定的主机指纹；改动后经这台主机（含以它为跳板）的网关会话、终端与文件连接立即断开。
        停用仍被启用中主机当作跳板的主机 → 409 `conflict`；启用跳板已停用的主机 → 409 `conflict`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SshHostUpdate' }
      responses:
        '200':
          description: 修改后的主机
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshHost' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [ssh]
      operationId: deleteSshHost
      summary: 删除 SSH 主机（被其他主机用作跳板时 409 `conflict`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}/test:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
    post:
      tags: [ssh]
      operationId: testSshHost
      summary: 测试连接并采一次状态快照
      description: 连接失败同样回 200，`ok=false` 且带 `error`。首次成功连接会固定主机指纹。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 测试结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshTestResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}/reset-host-key:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
    post:
      tags: [ssh]
      operationId: resetSshHostKey
      summary: 清掉已固定的主机指纹（下次成功连接重新固定）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 重置后的主机
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshHost' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/keys:
    get:
      tags: [ssh]
      operationId: listSshKeys
      summary: SSH 钥匙（按名称；不含私钥）
      responses:
        '200':
          description: 钥匙列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshKeyList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [ssh]
      operationId: createSshKey
      summary: 生成 ed25519 钥匙，或导入私钥（带口令的私钥解开后转存为无口令格式，口令不落库）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SshKeyCreate' }
      responses:
        '201':
          description: 新钥匙
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshKey' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/keys/{id}:
    parameters:
      - { $ref: '#/components/parameters/SshKeyIdPath' }
    patch:
      tags: [ssh]
      operationId: renameSshKey
      summary: 重命名钥匙（公钥注释随之改写）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SshKeyRename' }
      responses:
        '200':
          description: 改名后的钥匙
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshKey' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [ssh]
      operationId: deleteSshKey
      summary: 删除钥匙（仍有主机使用时 409 `conflict`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/audit:
    get:
      tags: [ssh]
      operationId: listSshAudit
      summary: SSH 审计（按时间倒序，保留 30 天）
      parameters:
        - name: host
          in: query
          description: 主机 id
          schema: { $ref: '#/components/schemas/SshHostId' }
        - name: thread
          in: query
          schema: { $ref: '#/components/schemas/ThreadId' }
        - name: before
          in: query
          description: 只返回 id 小于该值的记录（分页游标）
          schema: { type: integer, format: int64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 审计记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshAuditList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/ssh-hosts:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [ssh]
      operationId: listThreadSshHosts
      summary: 线程所在 orb 可见的 SSH 主机
      description: runner、协调线程与没有 orb 的线程 `managed=false`（主机不由 Oryn 管）。线程不存在 → 404。
      responses:
        '200':
          description: 主机与可用性
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadSshHosts' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}/fs/roots:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
    get:
      tags: [ssh]
      operationId: getSshFsRoots
      summary: 目标机上登录用户的主目录（经 SFTP）
      description: 拨号失败 → 502 `ssh_unreachable`（`message` 为连接错误）。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SshFsRoots' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}/fs/list:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
    get:
      tags: [ssh]
      operationId: listSshFs
      summary: 列出目录（目录在前、按名不分大小写排序；≤5000 条）
      parameters:
        - { $ref: '#/components/parameters/SshFsPathQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsListing' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}/fs/stat:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
    get:
      tags: [ssh]
      operationId: statSshFs
      summary: 文件或目录元数据（含 `mime` 与 `text`）
      parameters:
        - { $ref: '#/components/parameters/SshFsPathQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}/fs/file:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
      - { $ref: '#/components/parameters/SshFsPathQuery' }
    get:
      tags: [ssh]
      operationId: readSshFile
      summary: 下载文件（支持 `Range`）
      description: "一律以附件形式返回（`Content-Disposition: attachment`、`X-Content-Type-Options: nosniff`、`Content-Security-Policy: sandbox`、`Cache-Control: no-store`）；目录 → 409 `is_a_directory`。"
      parameters:
        - name: Range
          in: header
          description: 标准 HTTP Range（单区间）
          schema: { type: string }
      responses:
        '200':
          description: 文件字节
          headers:
            ETag:
              description: '`"<mtimeUnixNano>-<size>"`'
              schema: { type: string }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Range 请求的部分字节
          headers:
            ETag:
              schema: { type: string }
            Content-Range:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [ssh]
      operationId: writeSshFile
      summary: 写入文件（整文件覆盖，单文件 ≤512MiB）
      description: |
        父目录须存在。已存在且 `overwrite=false` → 409 `exists`；带 `If-Match` 且与当前 `etag` 不符（含文件不存在）→ 412 `modified`；
        超过 512MiB → 413 `too_large`。写同目录临时文件后原子替换，沿用原文件权限（新文件 0644）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: overwrite
          in: query
          description: 目标已存在时是否覆盖
          schema: { type: boolean, default: true }
        - name: If-Match
          in: header
          description: 期望的当前 `etag`（`FsEntry.etag`）；不符 → 412 `modified`
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 写入后的文件元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}/fs/mkdir:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
    post:
      tags: [ssh]
      operationId: mkdirSshFs
      summary: 新建目录（含缺失的上级目录）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsPathRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}/fs/rename:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
    post:
      tags: [ssh]
      operationId: renameSshFs
      summary: 移动 / 重命名（目标已存在且未 `overwrite` → 409 `exists`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsRenameRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}/fs/delete:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
    post:
      tags: [ssh]
      operationId: deleteSshFs
      summary: 删除文件或目录（递归；`/` 与登录用户主目录 → 403 `protected_path`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsPathRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ssh/hosts/{id}/terminal:
    parameters:
      - { $ref: '#/components/parameters/SshHostIdPath' }
    get:
      tags: [websocket, ssh]
      operationId: sshHostTerminal
      summary: 主机网页终端（WebSocket；客户端二进制帧 = 输入字节，文本帧 = resize JSON；服务端只发二进制帧 = PTY 输出）
      description: |
        挂载方式同 `/api/v1/ws`（不经鉴权组，由一次性票据鉴权）。票据无效或已用过 → 升级前 HTTP 401；主机不存在 → 404。
        文本帧 `{"type":"resize","cols":N,"rows":N}`。客户端单条消息 ≤1MiB；写超时 30s；同时在线 ≤8 条。
        关闭码：`1000` shell 退出、`4401` 主体被吊销或主机被修改、`4429` 连接数已满、`4502` 连不上目标机（reason 为错误文案）。
      security: [{}]
      parameters:
        - name: ticket
          in: query
          required: true
          description: '`POST /api/v1/ws-ticket` 签发的票据'
          schema: { type: string }
        - name: cols
          in: query
          schema: { type: integer, minimum: 20, maximum: 500, default: 120 }
        - name: rows
          in: query
          schema: { type: integer, minimum: 5, maximum: 200, default: 30 }
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- public（M5，匿名只读）
  /api/v1/public/shares/{slug}:
    parameters:
      - { $ref: '#/components/parameters/ShareSlugPath' }
    get:
      tags: [public]
      operationId: getPublicShare
      summary: 公开分享的元数据（不含线程 id、orb、项目、标签、模型配置）
      description: slug 不存在或已撤销一律 404 `not_found`。
      security: [{}]
      responses:
        '200':
          description: 分享
          headers:
            X-Robots-Tag:
              schema: { type: string, example: 'noindex, nofollow' }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicShare' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/public/shares/{slug}/identity:
    parameters:
      - { $ref: '#/components/parameters/ShareSlugPath' }
    get:
      tags: [public]
      operationId: getPublicShareIdentity
      summary: 分享页的身份（全局 agent 身份 + 这段对话里用到且设了头像的 role）
      description: |
        快照分享返回创建时固化的身份（升级前创建、没有身份记录的快照 → `{roles: []}`）；实时分享每次按当前设置现算。
        未被用到的 role 不出现。slug 不存在或已撤销 → 404 `not_found`（同 `getPublicShare`）。
      security: [{}]
      responses:
        '200':
          description: 身份
          headers:
            X-Robots-Tag:
              schema: { type: string, example: 'noindex, nofollow' }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicShareIdentity' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/public/shares/{slug}/entries:
    parameters:
      - { $ref: '#/components/parameters/ShareSlugPath' }
    get:
      tags: [public]
      operationId: listPublicShareEntries
      summary: 分享范围内的条目（活动分支上的主会话条目，按 `seq` 升序；隐藏类型的条目保留链、清空 payload）
      security: [{}]
      parameters:
        - name: after
          in: query
          description: 只返回 `seq > after` 的条目
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: 条目页
          headers:
            X-Robots-Tag:
              schema: { type: string, example: 'noindex, nofollow' }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEntryPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/public/shares/{slug}/blobs/{sha256}:
    parameters:
      - { $ref: '#/components/parameters/ShareSlugPath' }
      - name: sha256
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Sha256' }
    get:
      tags: [public]
      operationId: getPublicShareBlob
      summary: 分享范围内公开条目引用的 blob（范围外 / 别的线程 / 只被隐藏条目引用 / 不存在 → 404）
      description: |
        授权以公开过滤之后的内容为准：`display:false` 的注入消息、非渲染类型条目里的引用不算；快照只认创建时固化且未被改写的行。
        头同 `getBlob`（类型白名单、`nosniff` + `Content-Security-Policy: sandbox`），但 `Cache-Control: no-store`。
      security: [{}]
      responses:
        '200':
          description: 原始字节
          headers:
            X-Robots-Tag:
              schema: { type: string, example: 'noindex, nofollow' }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/public/shares/{slug}/ws:
    parameters:
      - { $ref: '#/components/parameters/ShareSlugPath' }
    get:
      tags: [websocket, public]
      operationId: connectPublicShareWs
      summary: 实时分享的匿名 WebSocket（仅 `mode=live`；快照分享 → 404）
      description: |
        S→C 消息见 `WsPublicServerMessage`（都不带 `threadId`）；客户端只许发 `WsClientPing`，其它消息以 1008 关闭。
        连接后先收到 `share.snapshot`，再分批收到 `entries`（每批 ≤200 条），之后转发实时 `frame`。
        撤销时收到 `share.revoked` 并以 4001 关闭。名额：每分享 ≤64、全局 ≤512，已满 503 `share_busy`；读上限 4KiB。
      security: [{}]
      parameters:
        - name: after
          in: query
          description: 已缓存条目的最大 seq（补发从其后开始）
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: rev
          in: query
          description: 客户端缓存的 `transcriptRev`；与当前不同时服务端从 0 补发（`fullReplay`）
          schema: { type: integer, format: int64 }
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- realtime
  /api/v1/ws-ticket:
    post:
      tags: [realtime]
      operationId: createWsTicket
      summary: 签发 WebSocket 票据（一次性，30 秒有效）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 票据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WsTicket' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ws:
    get:
      tags: [websocket, realtime]
      operationId: connectWs
      summary: 客户端实时通道（WebSocket，JSON 文本消息）
      description: |
        C→S 消息见 `WsClientMessage`，S→C 消息见 `WsServerMessage`。
        `sub` 后服务端先发 `thread.snapshot`，再分批发 `entries`（每条 ≤200 个条目），之后转发实时 `frame`。
        待发数据超过 8MiB 的慢消费者会被断开，客户端应重连并以 `afterSeq` 补拉。
      security: [{}]
      parameters:
        - name: ticket
          in: query
          required: true
          description: '`POST /api/v1/ws-ticket` 签发的票据'
          schema: { type: string }
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- provider protocol (C1)
  /provider/v1/hello:
    post:
      tags: [provider-protocol]
      operationId: providerHello
      summary: provider 实例上线并取得租约
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderHelloRequest' }
      responses:
        '200':
          description: 已登记；须在 `leaseSeconds` 内以 `jobs/claim` 续租
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderHelloResponse' }
        '409':
          description: 另一实例租约未过期且未声明 `allowMultiple`（`code:"provider_already_connected"`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/jobs/claim:
    post:
      tags: [provider-protocol]
      operationId: providerClaimJob
      summary: 长轮询认领任务（同时续租）
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderClaimRequest' }
      responses:
        '200':
          description: 认领到任务（认领租约 6 分钟）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderClaimResponse' }
        '204':
          description: 等待超时，无任务
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/jobs/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/JobId' }
    post:
      tags: [provider-protocol]
      operationId: providerCompleteJob
      summary: 上报任务结果
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCompleteRequest' }
      responses:
        '204': { description: 已记录 }
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/bye:
    post:
      tags: [provider-protocol]
      operationId: providerBye
      summary: provider 实例下线，释放租约
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderByeRequest' }
      responses:
        '204': { description: 已下线 }
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/fs/claim:
    post:
      tags: [provider-protocol]
      operationId: providerClaimFs
      summary: 长轮询认领停机 orb 的只读文件请求（同时续租）
      description: |
        只有 hello 声明了 `capabilities.offlineFs` 的 provider 会收到请求。请求只在内存中排队，不落库、不重试：
        控制面 10s 内无人认领即判 503 `provider_unavailable`；认领后须在 60s 内以 `fs/{id}/reply` 回应。
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderFsClaimRequest' }
      responses:
        '200':
          description: 认领到请求
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderFsClaimResponse' }
        '204':
          description: 等待超时，无请求
        '409':
          description: 另一实例持有租约（`code:"provider_already_connected"`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/fs/{id}/reply:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 64 }
    post:
      tags: [provider-protocol]
      operationId: providerReplyFs
      summary: 回应一个已认领的只读文件请求（请求体即响应体，流式转给浏览器）
      description: |
        请求体原样成为用户请求的响应体：`roots` / `list` / `stat` 与所有错误为 JSON（`FsRoots` / `FsListing` / `FsEntry` / `Error`），
        `read` 成功时为文件字节。状态码经 `X-Oryn-Status` 给出；`read` 另带 `Content-Range`（206）、`Content-Length`（已知时）与 `ETag`。
        控制面把请求体转完（或浏览器断开）后才回 204。
      security:
        - providerBearer: []
      parameters:
        - name: X-Oryn-Status
          in: header
          required: true
          description: 用户请求的 HTTP 状态码（200 / 206 / 400 / 403 / 404 / 409 / 416 / 500 / 503）
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/json:
            schema: {}
      responses:
        '204': { description: 已转交 }
        '404':
          description: 请求不存在、已超时或不属于该 provider（`code:"not_found"`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orb link (C2)
  /orb/v1/link:
    get:
      tags: [websocket]
      operationId: orbLink
      summary: orb link（WebSocket 子协议 `oryn.orb.v1` + yamux）
      description: |
        升级后在 WS 二进制消息流上跑 yamux（orbd = client，orynd = server，keepalive 10s）。
        每条 yamux 流的第一行是 `LinkStreamHeader` JSON + `\n`。
        `ctl` 流（orbd 建连后第一条且唯一）为双向 JSON 行：`LinkCtlRequest` / `LinkCtlResponse` / `LinkCtlNotification`；
        各方法的 params / result 见 `LinkCtlMethod` 与 `LinkCtl<Method>Params` / `LinkCtl<Method>Result`。
        orb 令牌只对本 orb 有效：`threadId` 不属于该 orb 的 `entries.*`、`agent` 流、`egress` 流会导致 link 被关闭。
        M11b：runner 以 `ort_…` 令牌接入同一端点（对应其常驻 orb；该 orb 的 `egress` 流直接关闭）。
      security:
        - orbBearer: []
        - runnerBearer: []
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema:
            type: string
            enum: [oryn.orb.v1]
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }
  /orb/v1/whoami:
    get:
      tags: [orb-link]
      operationId: orbWhoami
      summary: 令牌对应的 orb（M11b）
      description: |
        `Authorization: Bearer oot_… | ort_…`。runner 形态的 orbd 在拨 link 之前用它得知自己的 orb id。
        令牌无效、已吊销或其 orb 已删除 → 401 `unauthorized`。由手写处理器服务（挂在 `/orb/v1/link` 旁），不进入 ServerInterface。
      security:
        - orbBearer: []
        - runnerBearer: []
      responses:
        '200':
          description: 令牌对应的 orb
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbWhoami' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-oryn_session
      description: 网页会话（`__Host-` 前缀：Path=/、无 Domain；HttpOnly、Secure、SameSite=Lax，30 天滑动续期）
    csrfHeader:
      type: apiKey
      in: header
      name: X-Oryn-CSRF
      description: 'Cookie 鉴权的变更类请求必须带 `X-Oryn-CSRF: 1`'
    deviceBearer:
      type: http
      scheme: bearer
      description: 设备令牌 `odt_…`
    providerBearer:
      type: http
      scheme: bearer
      description: provider 令牌 `opv_…`
    orbBearer:
      type: http
      scheme: bearer
      description: orb 令牌 `oot_…`
    runnerBearer:
      type: http
      scheme: bearer
      description: runner 令牌 `ort_…`（M11b；只用于 `/orb/v1/link` 与 `/orb/v1/whoami`）

  parameters:
    DeviceIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/DeviceId' }
    ProjectIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProjectId' }
    ProviderIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProviderId' }
    ThreadIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ThreadId' }
    MemoryDocumentIdPath:
      name: documentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/MemoryDocumentId' }
    MemoryCandidateIdPath:
      name: candidateId
      in: path
      required: true
      schema: { type: string, pattern: '^mcd_[0-9A-Z]{26}$' }
    MemoryExportIdPath:
      name: exportId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,128}$' }
    OwnerMemoryTopicIdPath:
      name: topicId
      in: path
      required: true
      schema: { type: string, pattern: '^owner-[a-z0-9-]{1,64}$' }
    OwnerMemoryFactIdPath:
      name: factId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' }
    OwnerMemoryExplicitIdPath:
      name: explicitId
      in: path
      required: true
      schema: { type: string, pattern: '^ome_[0-9A-Z]{26}$' }
    OrbIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrbId' }
    AttachmentIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AttachmentId' }
    AssistantFileIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AssistantFileId' }
    ArtifactIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ArtifactId' }
    ArtifactVersionPath:
      name: n
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ArtifactCommentThreadIdPath:
      name: threadId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ArtifactCommentThreadId' }
    SshHostIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SshHostId' }
    BoxPath:
      name: box
      in: path
      required: true
      description: box 的 id 或名字
      schema: { type: string }
    BoxAppPath:
      name: app
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$' }
    BoxSecretNamePath:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$' }
    BoxActivityLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    SshKeyIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SshKeyId' }
    SshFsPathQuery:
      name: path
      in: query
      required: true
      description: 目标机上的绝对路径（`path.Clean` 之后必须以 `/` 开头）
      schema: { type: string, minLength: 1, maxLength: 4096 }
    FsPathQuery:
      name: path
      in: query
      required: true
      description: |
        orb 内路径：绝对路径或 `~/…`；跟随符号链接后必须位于 `$HOME` 之下（否则 403 `outside_home`）。响应中的路径一律为绝对路径。
        runner 的 orb（M11b）：范围改为 `thread` 线程的工作目录（越界 → 403 `dir_not_served`）。
      schema: { type: string, minLength: 1, maxLength: 4096 }
    OrbBackgroundQuery:
      name: bg
      in: query
      description: 后台请求（轮询用）：orb 不可用时直接 409 `orb_not_ready`，不唤醒、不计用户交互。接受 `1` / `true`
      schema: { type: boolean, default: false }
    OrbOfflineQuery:
      name: offline
      in: query
      description: |
        只读预览停机的 orb：orb 处于 `stopped` 时不唤醒，由 provider 直接读取停机容器的文件（只读；`$HOME/.oryn` 不可见）；
        其它状态与不带此参数相同。provider 不支持（runner、旧版 provider、非 docker 驱动）→ 409 `offline_unsupported`；
        provider 不在线 → 503 `provider_unavailable`；首次读取某次停机的文件索引期间 → 503 `offline_indexing`（带 `Retry-After`）。
        接受 `1` / `true`
      schema: { type: boolean, default: false }
    OrbThreadQuery:
      name: thread
      in: query
      description: |
        发起请求的线程（M11b）：须是该 orb 上的线程（否则 400 `invalid_request`）；该线程有工作目录（`Thread.cwd`）时，
        控制面以请求头 `X-Oryn-Workdir` 把它转给 orbd，文件与改动的范围、`root` 的缺省值随之改为该目录。
        runner 的 orb 必须带（否则 400 `thread_required`）；普通 orb 可省略，行为与 M3 相同。
      schema: { $ref: '#/components/schemas/ThreadId' }
    GitRootQuery:
      name: root
      in: query
      description: 仓库所在目录（同 `FsPathQuery` 的路径规则）；缺省 = orb 当前工作目录
      schema: { type: string, maxLength: 4096 }
    GitScopeQuery:
      name: scope
      in: query
      schema: { $ref: '#/components/schemas/GitScope' }
    GitCommitQuery:
      name: commit
      in: query
      description: '`scope=commit` 时必填'
      schema: { type: string, pattern: '^[0-9a-f]{7,40}$' }
    GitBaseQuery:
      name: base
      in: query
      description: 基线分支名（如 `main`）
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$' }
    GitDiffPathQuery:
      name: path
      in: query
      required: true
      description: 仓库内相对路径（`GitFileChange.path`）
      schema: { type: string, minLength: 1, maxLength: 4096 }
    GitDiffOldPathQuery:
      name: oldPath
      in: query
      description: 重命名 / 复制前的路径（`GitFileChange.oldPath`）
      schema: { type: string, maxLength: 4096 }
    RepoRefQuery:
      name: ref
      in: query
      description: 分支、标签或提交 sha；缺省 = 仓库状态里的 `baseBranch`
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$' }
    RepoPathQuery:
      name: path
      in: query
      description: 仓库内相对路径；空 = 根
      schema: { type: string, maxLength: 4096 }
    RepoShaPath:
      name: sha
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-f]{7,40}$' }
    RepoCursorQuery:
      name: cursor
      in: query
      description: 上一页返回的 `nextCursor`
      schema: { type: string, maxLength: 200 }
    RepoDownloadQuery:
      name: download
      in: query
      required: false
      schema: { type: boolean, default: false }
      description: 为 true 时一律 Content-Disposition attachment，并允许下载超过 100 MiB 的 Git LFS 对象
    SecretNamePath:
      name: name
      in: path
      required: true
      description: 密钥名（如 `omp/models/anthropic/apiKey`、`git/github.com/token`、`GITHUB_TOKEN`），`/` 编码为 `%2F`
      schema: { type: string, minLength: 1, maxLength: 256 }
    AgentConfigPath:
      name: path
      in: path
      required: true
      description: 相对配置根的路径（全局为 omp-home 根，项目级为项目配置根，如 `skills/foo/SKILL.md`），`/` 编码为 `%2F`；不得含 `..`
      schema: { type: string, minLength: 1, maxLength: 1024 }
    FromQuery:
      name: from
      in: query
      description: 起始时间（含，UTC 毫秒）；缺省 = 7 天前
      schema: { $ref: '#/components/schemas/TimestampMs' }
    ToQuery:
      name: to
      in: query
      description: 结束时间（不含，UTC 毫秒）；缺省 = 现在
      schema: { $ref: '#/components/schemas/TimestampMs' }
    StatsTzQuery:
      name: tz
      in: query
      description: 时间桶使用的 IANA 时区；缺省 = `UTC`。不可加载 → 400 `invalid_timezone`
      schema: { type: string, default: UTC, maxLength: 64 }
    StatsSeriesQuery:
      name: series
      in: query
      description: 另给出按该粒度的时间序列（稠密：窗口内每个桶都有）；`groupBy` 本身是时间粒度时不得再给（400 `invalid_request`）
      schema: { $ref: '#/components/schemas/StatsGrain' }
    StatsProjectQuery:
      name: project
      in: query
      description: 只统计该项目（项目 id）；字面量 `none` = 无项目
      schema: { type: string, maxLength: 64 }
    StatsSpaceQuery:
      name: space
      in: query
      description: 只统计该 Space（Space id）；字面量 `none` = 不在任何 Space
      schema: { type: string, maxLength: 64 }
    StatsThreadQuery:
      name: thread
      in: query
      description: 只统计该线程
      schema: { $ref: '#/components/schemas/ThreadId' }
    StatsModelQuery:
      name: model
      in: query
      description: 只统计该模型（`<provider>/<model>`）；生效时 `toolCalls` / `toolErrors` / `turns` 为 0
      schema: { type: string, maxLength: 256 }
    StatsOrbQuery:
      name: orb
      in: query
      description: 只统计该 orb
      schema: { $ref: '#/components/schemas/OrbId' }
    StatsLimitQuery:
      name: limit
      in: query
      description: 非时间分组按成本降序保留的组数，其余折叠成 `key = "__other__"` 的一项
      schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
    StatsFormatQuery:
      name: format
      in: query
      description: '`csv` 返回 `text/csv; charset=utf-8` 附件（列见 docs/protocol.md「M10：统计分析」）'
      schema: { $ref: '#/components/schemas/StatsFormat' }
    StatsDownloadQuery:
      name: download
      in: query
      description: '为真时 JSON 响应也带 `Content-Disposition: attachment`（`.json` 文件名）'
      schema: { type: boolean, default: false }
    ServiceNamePath:
      name: name
      in: path
      required: true
      description: 受管服务名
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
    PortalPortPath:
      name: port
      in: path
      required: true
      description: portal 端口（服务的 `PORT`）
      schema: { type: integer, minimum: 1, maximum: 65535 }
    ShareIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ShareId' }
    ShareSlugPath:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ShareSlug' }
    PublishedFileIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublishedFileId' }
    NotificationChannelIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NotificationChannelId' }
    NotificationIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NotificationId' }
    PushSubscriptionIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PushSubscriptionId' }
    BrowserProfileIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BrowserProfileId' }
    OrbDesktopAppIdPath:
      name: app
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrbDesktopAppId' }
    OrbDesktopWindowIdPath:
      name: window
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrbDesktopWindowId' }
    OrbDesktopWindowActionPath:
      name: action
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrbDesktopWindowAction' }
    SpaceIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SpaceId' }
    ScheduleIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ScheduleId' }
    GitHubIdentitySlotPath:
      name: slot
      in: path
      required: true
      schema: { $ref: '#/components/schemas/GitHubIdentitySlot' }
    GitHubTriggerIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ght_[0-9A-Z]{26}$'
    GitHubNumberPath:
      name: number
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ============================================================ 基础类型
    TimestampMs:
      type: integer
      format: int64
      description: UTC 毫秒时间戳
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 小写十六进制
    ThreadId:
      type: string
      pattern: '^T-[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: '`T-<uuidv7>`'
      example: T-01932f6e-8d1a-7c3b-9f2e-0123456789ab
    OrbId:
      type: string
      pattern: '^orb-[0-9a-z]{26}$'
      description: '`orb-<26 位小写 ULID>`（同时是容器名与 hostname）'
      example: orb-01jcz8m3w4x5y6z7a8b9c0d1e2
    ProjectId:
      type: string
      pattern: '^prj_[0-9A-Z]{26}$'
      description: '`prj_<ulid>`'
    ProviderId:
      type: string
      pattern: '^prov_[0-9A-Z]{26}$'
      description: '`prov_<ulid>`'
    DeviceId:
      type: string
      pattern: '^dev_[0-9A-Z]{26}$'
      description: '`dev_<ulid>`'
    JobId:
      type: string
      pattern: '^job_[0-9A-Z]{26}$'
      description: '`job_<ulid>`'
    SetupRunId:
      type: string
      description: setup / resume 运行记录 id
      pattern: '^osr_[0-9A-Z]{26}$'
      example: osr_01HZX3J9Q4W8E5R6T7Y8U9I0OP
    SnapshotId:
      type: string
      pattern: '^oryn-snap-[0-9a-z]{26}$'
      description: 快照 id，同时是 Docker 镜像名
    AttachmentId:
      type: string
      pattern: '^att_[0-9A-Z]{26}$'
      description: '`att_<ulid>`'
    AssistantFileId:
      type: string
      pattern: '^afl_[0-9A-Z]{26}$'
      description: '`afl_<ulid>`（全局助手文件库）'
    ArtifactId:
      type: string
      pattern: '^art_[0-9A-Z]{26}$'
      description: '`art_<ulid>`（M14 artifact）'
    ShareId:
      type: string
      pattern: '^shr_[0-9A-Z]{26}$'
      description: '`shr_<ulid>`'
    ShareSlug:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: 公开分享 / 发布文件的能力令牌（16 字节随机的小写十六进制，明文存储）
    PublishedFileId:
      type: string
      pattern: '^pub_[0-9A-Z]{26}$'
      description: '`pub_<ulid>`'
    NotificationId:
      type: string
      pattern: '^ntf_[0-9A-Z]{26}$'
      description: '`ntf_<ulid>`'
    NotificationChannelId:
      type: string
      pattern: '^nch_[0-9A-Z]{26}$'
      description: '`nch_<ulid>`'
    PushSubscriptionId:
      type: string
      pattern: '^psub_[0-9A-Z]{26}$'
      description: '`psub_<ulid>`'
    BrowserProfileId:
      type: string
      pattern: '^bpf_[0-9A-Z]{26}$'
      description: '`bpf_<ulid>`'
    SpaceId:
      type: string
      pattern: '^spc_[0-9A-Z]{26}$'
      description: '`spc_<ulid>`（M9）'
    ScheduleId:
      type: string
      pattern: '^sch_[0-9A-Z]{26}$'
      description: '`sch_<ulid>`（M9）'
    ScheduleRunId:
      type: string
      pattern: '^srn_[0-9A-Z]{26}$'
      description: '`srn_<ulid>`（M9，定时的一次运行）'
    AutomationActionId:
      type: string
      pattern: '^cac_[0-9A-Z]{26}$'
      description: '`cac_<ulid>`（M9，操作记录）'
    OmpFrame:
      type: object
      additionalProperties: true
      description: omp RPC 的命令、应答或帧，控制面不解释其内容。权威类型见 agent 仓库 `rpc-types.ts`。
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            机器可读错误码。已定义：`unauthorized`、`forbidden`、`not_found`、`invalid_request`、`conflict`、
            `provider_already_connected`、`managed_by_oryn`、`use_oryn_fork`、`queue_full`、`orb_unavailable`、`rate_limited`（429，带 `Retry-After`）、`internal`。
            M3（orb 文件 / 改动 / 附件，HTTP 状态见 docs/protocol.md）：`invalid_path`、`outside_home`、`protected_path`、`exists`、`is_a_directory`、
            `not_a_directory`、`not_a_repo`、`git_busy`、`modified`（412）、`too_large`（413）、`checksum_mismatch`（422）、`git_failed`、`no_space`（507）、
            `orb_not_ready`、`orbd_outdated`、`orb_deleted`（410）、`no_orb`、`orb_unavailable`（503，带 `Retry-After: 3`）、`orbd_unreachable`（502）、`orbd_bad_response`（502，orbd 返回了非预期状态）、`orbd_timeout`（504）、`attachment_not_found`。
            M4（受管服务与 portal，HTTP 状态见 docs/protocol.md）：`portal_disabled`（409，未配置 `portal_domain`）、`portal_not_found`（404）、`portal_unauthorized`（401）、
            `cross_site_blocked`（403）、`forbidden_port`（403）、`service_unreachable`（502）、`portal_unreachable`（502）、`portal_timeout`（504）、`portal_busy`（503）、
            `service_not_found`（404）、`invalid_service`（400）、`name_conflict`（409）、`services_not_ready`（409）。
            M5（分享、通知与 sync，HTTP 状态见 docs/protocol.md）：`invalid`（400 / 409）、`secrets_found`（409，体为 `ShareScanConflict`）、
            `channel_exists`（409，已有 Telegram 渠道）、`invalid_channel`（400）、`channel_not_linked`（409）、`push_invalid`（400）、
            `share_busy`（503，匿名连接数已满）、`sync_no_commits`（409）、`sync_no_common`（409）、`sync_shallow`（409）、`sync_bundle_gone`（404）。
            M6（App 会话）：`app_session_unsupported`（403，只有 desktop / mobile 设备令牌能换取 App 会话）。
            M8（Desktop 与浏览器 Profile，HTTP 状态见 docs/protocol.md）：`profile_not_found`（404）、`profile_in_use`（409，体为 `ProfileInUseConflict`）、
            `profile_name_taken`（409）、`profile_limit`（409）、`no_profile`（409）、`profile_readonly`（409）、`profile_too_large`（413）、`profile_save_failed`（502）。
            M9（Space、助手与定时，HTTP 状态见 docs/protocol.md）：`invalid_schedule`（400）、`schedule_not_found`（404）、`space_not_found`（404）、
            `schedule_busy`（409）、`schedule_name_taken`（409）、`schedule_limit`（409，启用中的定时已达 200）、`schedule_conflict`（409，`ifRev` 与当前 `rev` 不符）、`space_name_taken`（409）、
            `thread_archived`（409）、`space_thread`（409，不能直接删除 Space 的聊天线程）、`coordinator_unavailable`（409，`message` 为原因）、
            `coordinator_restricted`（400 / WS `error`，协调线程不允许的命令、fork、分享、附件，或把线程挂到协调 orb / `@host`）。
            M9.6（身份与角色头像）不新增错误码：名字 / role / 头像非法 → `invalid_request`（400），图片超 128KiB → `too_large`（413），
            agent / 助手身份尚无所有者 → `conflict`（409），公开分享身份接口的 slug 不存在或已撤销 → `not_found`（404）。
            M11a（项目快照与预热池）：`orb_is_pooled`（409，把线程挂到预热池里的 orb 上）。
            M11b（runner，HTTP 状态见 docs/protocol.md）：`runner_offline`（409）、`runner_unsupported`（409，runner 的 orb 不支持冻结 / 停机 / 删除 / 快照 / 连环境 fork）、
            `dir_not_served`（400；经 orb 文件 / 改动代理时为 orbd 的 403）、`dir_in_use`（409，体为 `DirInUseConflict`）、`thread_required`（400）、
            `worktree_failed`（400）、`worktree_dirty`（409）。
            M14 / M15（GitHub）：`github_not_configured`（409，尚未配置 OAuth App）、`github_identity_required`（409，所需身份未连接或需要重新授权）、
            `github_agent_required`（409，Agent 账号未连接）、`github_not_bound`（409，项目未绑定 GitHub 仓库）、`github_upstream`（502，GitHub 请求失败）。
            M24（项目仓库镜像）：`repo_unavailable`（503，控制面没有可用的 git）、`no_repo`（409，项目没有仓库地址）、`repo_not_ready`（409，镜像不存在、克隆中或克隆失败）、
            `ref_not_found`、`commit_not_found`、`path_not_found`（404）、`not_a_file`、`not_a_directory`（409）、`too_large`（413）；
            Git LFS：`lfs_missing`（404）、`lfs_auth_failed`（409）、`lfs_unreachable`（502）、`lfs_corrupt`（502）、`lfs_no_space`（507）。
            M24（托管仓库）：`repo_hosted`（409，托管项目上改外部仓库地址或同步）、`repo_exists`（409，项目已有仓库时再创建托管仓库）、
            `project_archived`（409，已归档项目上创建托管仓库）、`repo_not_hosted`（409，非托管项目上设置推送后 Webhook）。
        message:
          type: string
    HealthResponse:
      type: object
      required: [ok, version]
      properties:
        ok: { type: boolean }
        version: { type: string }

    # ============================================================ 状态枚举
    ThreadState:
      type: string
      description: |
        线程状态（全端统一，自上而下取首个成立）：
        `provisioning` orb 未到 ready 且 agent 从未 ready；
        `awaiting_input` 有待答 UI 或计划提案；
        `working` 已见 agent_start 且尚无终结 agent_end，或 state.hasPendingAsyncWork；
        `error` 最近 prompt_result 为 error 或 agent 重启耗尽；
        `idle` 其它。
      enum: [provisioning, awaiting_input, working, error, idle]
    OrbState:
      type: string
      description: orb 状态机（计划 E 节）
      enum:
        - requested
        - spawning
        - connecting
        - setting_up
        - resuming
        - ready
        - freezing
        - frozen
        - stopping
        - stopped
        - waking
        - deleting
        - deleted
        - failed
    AgentStatus:
      type: string
      description: 线程 agent 进程状态；`none` = 尚未启动或 orb 不可用
      enum: [none, starting, ready, exited]
    PauseMode:
      type: string
      enum: [freeze, stop]
    DeviceKind:
      type: string
      enum: [cli, desktop, mobile]
    SecretMode:
      type: string
      description: '`proxy` 经 egress 注入（不进 orb）；`env` 以同名环境变量注入 agent 进程'
      enum: [proxy, env]
    JobOp:
      type: string
      enum: [spawn, pause, snapshot, delete, delete_snapshot]
    JobState:
      type: string
      enum: [queued, claimed, succeeded, failed]
    ProviderDriver:
      type: string
      description: '`runner`（M11b）= runner 的 provider 行（由 `createRunner` 建立，不经 provider 进程，不出现在 `listProviders` 中）'
      enum: [docker, dispatch, process, firecracker, runner]
      x-enum-varnames: [Docker, Dispatch, Process, Firecracker, ProviderDriverRunner]

    # ============================================================ 认证
    AuthSetupBeginRequest:
      type: object
      properties:
        token:
          type: string
          description: '`ost_…` 初始化令牌；恢复流程中省略'
        name:
          type: string
          description: Passkey 显示名
    WebAuthnCeremony:
      type: object
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          description: 本次仪式的服务端会话句柄，finish 时回传
        options:
          type: object
          additionalProperties: true
          description: '`PublicKeyCredentialCreationOptionsJSON` 或 `PublicKeyCredentialRequestOptionsJSON`（WebAuthn L3 JSON 形态）'
    AuthSetupFinishRequest:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId: { type: string }
        credential:
          type: object
          additionalProperties: true
          description: '`RegistrationResponseJSON`'
    AuthSetupFinishResponse:
      type: object
      required: [me]
      properties:
        me: { $ref: '#/components/schemas/Me' }
        recoveryCodes:
          type: array
          description: 首次初始化时返回 10 个恢复码（仅此一次）；恢复流程重新注册时为空
          items: { type: string }
    AuthLoginFinishRequest:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId: { type: string }
        credential:
          type: object
          additionalProperties: true
          description: '`AuthenticationResponseJSON`'
    AuthRecoveryRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    AuthRecoveryResponse:
      type: object
      required: [expiresAt, remainingCodes]
      properties:
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
        remainingCodes:
          type: integer
          description: 剩余未使用的恢复码数量
    Me:
      type: object
      required: [displayName, createdAt, auth]
      properties:
        displayName: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        auth:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [web, device, recovery]
            deviceId:
              allOf:
                - $ref: '#/components/schemas/DeviceId'
              description: 设备令牌鉴权时为该设备；App 会话（`kind = web` 且由设备换取）时同样给出
        passkeyCount: { type: integer }
    AppSessionCode:
      type: object
      required: [code, expiresIn]
      description: App 会话一次性码（M6）；以 `GET /auth/app?code=…&next=…` 兑换
      properties:
        code:
          type: string
          description: '`oac_…`，只能兑换一次'
        expiresIn:
          type: integer
          description: 有效秒数
          example: 30

    # ============================================================ 设备
    Device:
      type: object
      required: [id, name, kind, platform, createdAt]
      properties:
        id: { $ref: '#/components/schemas/DeviceId' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        platform: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        lastSeenAt: { $ref: '#/components/schemas/TimestampMs' }
        revokedAt: { $ref: '#/components/schemas/TimestampMs' }
        current:
          type: boolean
          description: 是否为发起本请求的设备
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: '#/components/schemas/Device' }
    DevicePairStartRequest:
      type: object
      required: [name, kind, platform]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        platform:
          type: string
          description: 如 `linux-x64`、`ios`、`windows`
    DevicePairStartResponse:
      type: object
      required: [code, verifier, verifyUrl, expiresAt, interval]
      properties:
        code:
          type: string
          pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$'
          description: 8 位配对码（去易混字符），10 分钟有效
        verifier:
          type: string
          description: 仅发起方持有，轮询时回传
        verifyUrl:
          type: string
          description: 网页批准地址（`<public_url>/pair`，不预填配对码，所有者须手动输入设备上显示的码）
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
        interval:
          type: integer
          description: 建议轮询间隔（秒）
          example: 2
    DevicePairing:
      type: object
      required: [code, name, kind, platform, ip, userAgent, createdAt, expiresAt]
      properties:
        code: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        platform: { type: string }
        ip:
          type: string
          description: 发起方 IP
        userAgent:
          type: string
          description: 发起方 User-Agent
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
    DevicePairApproveRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    DevicePairPollRequest:
      type: object
      required: [code, verifier]
      properties:
        code: { type: string }
        verifier: { type: string }
    DevicePairPollResponse:
      type: object
      required: [deviceToken, device]
      properties:
        deviceToken:
          type: string
          description: '`odt_…`，只返回这一次'
        device: { $ref: '#/components/schemas/Device' }

    # ============================================================ 项目
    Project:
      type: object
      required: [id, name, shallowClone, snapshots, warmOrbs, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ProjectId' }
        name: { type: string }
        description:
          type: string
          description: 一行描述（M24）；未设置时省略
        repoUrl: { type: string }
        baseBranch: { type: string }
        defaultProvider:
          type: string
          description: provider 名称
        defaultOrbType: { type: string }
        setupScript: { type: string }
        resumeScript: { type: string }
        shallowClone: { type: boolean }
        color: { type: string }
        icon:
          type: string
          description: 项目图标：单个字形（Nerd Font 私有区字符或 emoji）。未设置时省略；线程自动标题带卡片图标且项目尚无图标时由控制面自动填入一次
        gitAuthorName:
          type: string
          description: 本项目 orb 的 git 提交身份覆盖（与 gitAuthorEmail 同时存在或同时缺省）
        gitAuthorEmail: { type: string }
        defaultBrowserProfileId:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileId'
          description: 新线程（新建 orb 时）缺省选用的浏览器 Profile（M8）；未设置时省略
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
        archivedAt: { $ref: '#/components/schemas/TimestampMs' }
        snapshots:
          type: boolean
          description: 是否为本项目建立并使用项目快照（M11a；缺省 true）
        warmOrbs:
          type: integer
          minimum: 0
          maximum: 3
          description: 预热池里为本项目常备的 orb 数（M11a；缺省 0 = 不预热）
        github:
          allOf:
            - $ref: '#/components/schemas/ProjectGitHub'
          description: GitHub 仓库绑定（M14）；仓库地址从未解析出 GitHub 仓库 id 时省略
        githubGates:
          allOf:
            - $ref: '#/components/schemas/GitHubGates'
          description: 推送 / 开 PR 门禁（M15）；未配置时省略
        hosted:
          type: boolean
          description: 仓库由 Oryn 托管（M24）：仅托管项目为 true，其余省略；此时 repoUrl 恒省略
        cloneUrl:
          type: string
          description: 托管仓库的克隆地址 https://<Oryn 地址>/git/<id>.git（M24）；非托管项目省略
        webhook:
          allOf:
            - $ref: '#/components/schemas/ProjectWebhook'
          description: 推送后 Webhook（M24）；仅托管项目且已设置时出现；从不返回签名密钥
    ProjectWebhook:
      type: object
      description: 托管仓库的推送后 Webhook（M24 阶段 ③）：每次推送成功后异步 POST 一次 JSON，不重试
      required: [url, hasSecret]
      properties:
        url: { type: string }
        hasSecret:
          type: boolean
          description: '设置了签名密钥：请求带 `X-Oryn-Signature-256` 头（`sha256=<hex>`，HMAC-SHA256）'
        lastDeliveryAt: { $ref: '#/components/schemas/TimestampMs' }
        lastStatus:
          type: integer
          description: 最近一次投递的 HTTP 状态码；0 = 没拿到响应（连接失败、超时或没有发出）
        lastError:
          type: string
          description: 最近一次投递失败的简短原因（非 2xx 为 `HTTP <code>`，或传输错误）；成功时省略
    ProjectWebhookInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          maxLength: 2048
          description: http:// 或 https:// 地址，不能带用户名密码
        secret:
          type: string
          maxLength: 256
          description: 签名密钥；省略 = 不改；空串 = 清除
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/Project' }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description:
          type: string
          maxLength: 200
          description: 一行描述（M24，≤200 字符）；空串等同省略
        repoUrl: { type: string }
        baseBranch: { type: string }
        defaultProvider: { type: string }
        defaultOrbType: { type: string }
        setupScript: { type: string }
        resumeScript: { type: string }
        shallowClone: { type: boolean, default: false }
        color: { type: string }
        icon:
          type: string
          maxLength: 16
          description: 单个字形（一个字素，≤16 字节）；空串等同省略
        gitAuthorName:
          type: string
          description: 须与 gitAuthorEmail 同时给出；规则同 GitIdentity.name
        gitAuthorEmail:
          type: string
          description: 须与 gitAuthorName 同时给出；规则同 GitIdentity.email
        defaultBrowserProfileId:
          type: string
          description: '默认浏览器 Profile（`bpf_…`）；空串等同省略。不存在 → 404 `profile_not_found`'
        snapshots:
          type: boolean
          description: 项目快照开关（M11a）；缺省 true
        warmOrbs:
          type: integer
          minimum: 0
          maximum: 3
          description: 预热 orb 数（M11a）；缺省 0；越界 → 400 `invalid_request`
        hosted:
          type: boolean
          description: 新建 Oryn 托管仓库（M24；带一个空树的初始提交，基线分支缺省 main）；与 repoUrl 互斥；缺省 false
        emptyRepo:
          type: boolean
          description: 只与 hosted 同用：不建初始提交（oryn project create --push 用，本机已有的历史才能推上来）；缺省 false
    ProjectPatch:
      type: object
      description: 只修改出现的字段；可选字符串字段传空串表示清除
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description:
          type: string
          maxLength: 200
          description: 一行描述（M24，≤200 字符）；空串表示清除
        repoUrl: { type: string }
        baseBranch: { type: string }
        defaultProvider: { type: string }
        defaultOrbType: { type: string }
        setupScript: { type: string }
        resumeScript: { type: string }
        shallowClone: { type: boolean }
        color: { type: string }
        icon:
          type: string
          maxLength: 16
          description: 单个字形（一个字素，≤16 字节）；空串表示清除（之后可再被自动标题的卡片图标填入）
        gitAuthorName:
          type: string
          description: 须与 gitAuthorEmail 同时给出；两者都传空串表示清除项目覆盖
        gitAuthorEmail: { type: string }
        defaultBrowserProfileId:
          type: string
          description: '默认浏览器 Profile（`bpf_…`）；空串表示清除。不存在 → 404 `profile_not_found`'
        archived: { type: boolean }
        snapshots:
          type: boolean
          description: 项目快照开关（M11a）
        warmOrbs:
          type: integer
          minimum: 0
          maximum: 3
          description: 预热 orb 数（M11a）；越界 → 400 `invalid_request`
        githubListen:
          allOf:
            - $ref: '#/components/schemas/GitHubListen'
          description: GitHub 事件回流开关（M14）
        githubGates:
          allOf:
            - $ref: '#/components/schemas/GitHubGates'
          description: 推送 / 开 PR 门禁（M15）
    ProjectSnapshotState:
      type: string
      description: '`building` 正在提交镜像；`ready` 可被新 orb 使用（同键至多一个）；`retired` 已退役、等待回收器删除镜像'
      enum: [building, ready, retired]
    ProjectSnapshot:
      type: object
      description: 项目快照（M11a）：某项目在某 provider、某 orb 类型上跑完 setup 后的 orb 镜像；键 = (项目, provider, 类型)
      required: [id, providerId, type, state, configHash, depth, lineageAt, createdAt, useCount]
      properties:
        id: { $ref: '#/components/schemas/SnapshotId' }
        providerId: { $ref: '#/components/schemas/ProviderId' }
        providerName: { type: string }
        type:
          type: string
          description: orb 类型名
        state: { $ref: '#/components/schemas/ProjectSnapshotState' }
        configHash:
          type: string
          description: 建立快照时的项目配置哈希（SHA-256 十六进制）；与当前不等时快照不再命中
        baseCommit:
          type: string
          description: 快照里检出的提交（40 位十六进制）；无仓库或尚未发布时省略
        depth:
          type: integer
          description: 血统内第几次刷新（0 = 从基础镜像全新 setup）
        lineageAt:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 血统起点（刷新不重置；超过 `snapshots.max_age` 即退役）
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        readyAt: { $ref: '#/components/schemas/TimestampMs' }
        lastUsedAt: { $ref: '#/components/schemas/TimestampMs' }
        useCount:
          type: integer
          format: int64
          description: 被新 orb 命中的次数
        sizeBytes:
          type: integer
          format: int64
          description: 相对基础镜像多占的字节数；provider 未上报时省略
        retireReason:
          type: string
          description: |
            `state=retired` 时的原因：`config_changed`（项目配置哈希变化）、`expired`（血统超过 `max_age`）、`image_missing`（provider 上镜像不存在，已退回基础镜像）、
            `refresh_failed`（刷新时 setup 失败）、`depth`（刷新次数超过 `max_depth`）、`superseded`（被同键的新快照取代）、`quota`（超出 `max_total_gb`，或单个快照超出 `max_snapshot_gb`）、
            `setup_changed`（`repo.update` 改动了 setup 相关文件或基线不是快进，不再以它为父发布）、
            `manual`（用户清除）、`project_deleted`（项目被删除）、`provider_removed`（provider 被删除 / 停用）
    ProjectSnapshotList:
      type: object
      required: [snapshots]
      properties:
        snapshots:
          type: array
          items: { $ref: '#/components/schemas/ProjectSnapshot' }
    ProjectRepoStatus:
      type: object
      description: M24：项目仓库在控制面的裸镜像
      required: [kind, state, available, syncing, empty]
      properties:
        kind: { type: string, enum: [mirror, hosted, none], description: '`mirror` = 外部仓库的镜像；`hosted` = Oryn 托管的正本；`none` = 项目没有仓库' }
        state: { type: string, enum: [absent, cloning, ready, error] }
        available: { type: boolean, description: 控制面有可用的 git（≥2.31） }
        unavailableReason: { type: string, enum: [git_missing, git_too_old], x-enum-varnames: [ProjectRepoGitMissing, ProjectRepoGitTooOld] }
        syncing: { type: boolean, description: state=ready 时后台拉取进行中 }
        empty: { type: boolean, description: 镜像就绪但没有任何分支 }
        cloneUrl: { type: string, description: 用户 `git clone` 用的地址（mirror = 项目 repoUrl；hosted = https://<Oryn 地址>/git/<id>.git） }
        defaultBranch: { type: string }
        baseBranch: { type: string, description: 'mirror：项目 baseBranch 在镜像里存在时取它，否则 defaultBranch；hosted：项目 baseBranch' }
        syncedAt: { $ref: '#/components/schemas/TimestampMs' }
        sizeBytes: { type: integer, format: int64 }
        lastError: { $ref: '#/components/schemas/ProjectRepoError' }
    ProjectRepoError:
      type: object
      description: 最近一次失败的克隆或拉取
      required: [code, message, at]
      properties:
        code:
          type: string
          enum: [unsupported_url, auth_required, auth_failed, not_found, blocked_address, unreachable, timeout, too_large, no_space, fetch_failed]
          x-enum-varnames: [RepoErrUnsupportedURL, RepoErrAuthRequired, RepoErrAuthFailed, RepoErrNotFound, RepoErrBlockedAddress, RepoErrUnreachable, RepoErrTimeout, RepoErrTooLarge, RepoErrNoSpace, RepoErrFetchFailed]
        message: { type: string, description: 已脱敏的 git 输出末尾（≤500 字符） }
        at: { $ref: '#/components/schemas/TimestampMs' }
    ProjectRepoRefKind:
      type: string
      enum: [branch, tag]
      x-enum-varnames: [RepoRefBranch, RepoRefTag]
    ProjectRepoCommitSummary:
      type: object
      description: 提交摘要（字段同 `GitCommit`）
      required: [sha, shortSha, subject, authorName, authorEmail, ts]
      properties:
        sha: { type: string }
        shortSha: { type: string }
        subject: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        ts:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 作者时间
    ProjectRepoThreadLink:
      type: object
      description: 提交关联的线程
      required: [id, title, source]
      properties:
        id: { $ref: '#/components/schemas/ThreadId' }
        title: { type: string }
        source:
          type: string
          description: '`push` = 由该线程经出站代理推送；`sampled` = 线程里采样到过该提交；`pull` = 经 GitHub PR 合并'
          enum: [push, sampled, pull]
          x-enum-varnames: [RepoThreadPush, RepoThreadSampled, RepoThreadPull]
    ProjectRepoCommit:
      type: object
      description: 提交摘要、父提交与关联线程
      required: [sha, shortSha, subject, authorName, authorEmail, ts, parents]
      properties:
        sha: { type: string }
        shortSha: { type: string }
        subject: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        ts:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 作者时间
        parents:
          type: array
          items: { type: string }
        thread: { $ref: '#/components/schemas/ProjectRepoThreadLink' }
    ProjectRepoCommitList:
      type: object
      required: [ref, commit, commits]
      properties:
        ref: { type: string, description: 实际使用的 ref（缺省时为基线分支） }
        commit: { type: string, description: 本次列表的头提交 sha（翻页时为 cursor 里记下的那个） }
        commits:
          type: array
          maxItems: 100
          description: 新到旧
          items: { $ref: '#/components/schemas/ProjectRepoCommit' }
        nextCursor: { type: string, description: 还有更早的提交时给出 }
    ProjectRepoCommitDetail:
      type: object
      required: [sha, shortSha, subject, authorName, authorEmail, ts, parents, body, committerName, committedAt, files, additions, deletions, truncated]
      properties:
        sha: { type: string }
        shortSha: { type: string }
        subject: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        ts:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 作者时间
        parents:
          type: array
          items: { type: string }
        thread: { $ref: '#/components/schemas/ProjectRepoThreadLink' }
        body: { type: string, description: 去掉 subject 行后的正文（≤64KiB） }
        committerName: { type: string }
        committerEmail: { type: string }
        committedAt:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 提交者时间
        files:
          type: array
          maxItems: 2000
          description: 按路径排序；合并提交相对第一个父提交，根提交相对空树；`staged` 恒为 `none`
          items: { $ref: '#/components/schemas/GitFileChange' }
        additions: { type: integer, description: 非二进制文件的新增行数之和 }
        deletions: { type: integer, description: 非二进制文件的删除行数之和 }
        truncated: { type: boolean, description: 改动文件超过 2000 个，只列出前 2000 个 }
    ProjectRepoRef:
      type: object
      required: [name, kind, commit, default]
      properties:
        name: { type: string, description: 分支或标签名（不含 refs/heads/、refs/tags/） }
        kind: { $ref: '#/components/schemas/ProjectRepoRefKind' }
        commit: { $ref: '#/components/schemas/ProjectRepoCommitSummary' }
        default: { type: boolean, description: 是默认分支 }
        annotated: { type: boolean, description: 附注标签 }
    ProjectRepoRefList:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ProjectRepoRef' }
        nextCursor: { type: string }
    ProjectRepoTreeEntry:
      type: object
      required: [name, path, type, mode, size, oid]
      properties:
        name: { type: string }
        path: { type: string, description: 仓库内相对路径（根为 ""） }
        type:
          type: string
          enum: [dir, file, symlink, submodule]
          x-enum-varnames: [RepoEntryDir, RepoEntryFile, RepoEntrySymlink, RepoEntrySubmodule]
        mode: { type: integer, description: Unix 权限位（100644→420，100755→493，040000→493，120000→511，160000→0） }
        size: { type: integer, format: int64, description: 仅 file / symlink；其余为 0 }
        oid: { type: string, description: blob / tree / 子模块提交的 sha }
        target: { type: string, description: 符号链接目标（≤4KiB） }
        lastCommit: { $ref: '#/components/schemas/ProjectRepoCommitSummary' }
        mime: { type: string, description: 仅 self 且 type=file }
        text: { type: boolean, description: 仅 self 且 type=file：前 8KiB 没有 NUL 且是合法 UTF-8 }
        lfs: { $ref: '#/components/schemas/ProjectRepoLfs' }
    ProjectRepoLfs:
      type: object
      description: 文件是 Git LFS 指针（M24）；此时条目的 size 是对象的真实大小，oid 仍是指针 blob 的 sha
      required: [oid]
      properties:
        oid: { type: string, pattern: '^[0-9a-f]{64}$', description: LFS 对象的 sha256 }
        error:
          type: string
          enum: [lfs_missing, lfs_auth_failed, lfs_unreachable, lfs_corrupt, lfs_no_space]
          description: 只出现在 self 上：取对象失败的原因（对象 ≤ 100 MiB 时 tree 先取对象）
    ProjectRepoTree:
      type: object
      required: [ref, commit, path, self, entries, truncated, lastCommitsComplete]
      properties:
        ref: { type: string, description: 实际使用的 ref }
        commit: { type: string, description: ref 解析出的提交 sha }
        path: { type: string }
        self: { $ref: '#/components/schemas/ProjectRepoTreeEntry' }
        entries:
          type: array
          maxItems: 5000
          description: self 是目录时为直接子项（目录在前、按名不分大小写排序），否则为空
          items: { $ref: '#/components/schemas/ProjectRepoTreeEntry' }
        truncated: { type: boolean, description: 子项超过 5000 个被截断 }
        lastCommitsComplete: { type: boolean, description: 每个子项都找到了最后提交（lastCommits=false 时恒为 true） }

    # ============================================================ 设置
    GitIdentity:
      type: object
      required: [name, email]
      description: orb 内 `git config --global user.name / user.email`；不得含换行或控制字符
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: 须包含 `@`
    GitIdentitySettings:
      type: object
      properties:
        identity: { $ref: '#/components/schemas/GitIdentity' }

    # ============================================================ GitHub（M14）
    GitHubIdentitySlot:
      type: string
      description: '`user` = 我的账号；`agent` = Agent 账号'
      enum: [user, agent]
    GitHubIdentity:
      type: object
      required: [login, githubId, avatarUrl, status, connectedAt]
      properties:
        login: { type: string }
        githubId: { type: integer, format: int64 }
        name: { type: string }
        avatarUrl: { type: string }
        status:
          type: string
          description: '`reauth` = 令牌失效（GitHub 返回 401），需要重新授权'
          enum: [ok, reauth]
        connectedAt: { $ref: '#/components/schemas/TimestampMs' }
        scopes:
          type: array
          description: 实际授予的 OAuth scope（M15，取自 `X-OAuth-Scopes`）
          items: { type: string }
        missingScopes:
          type: array
          description: 相对所需 scope 缺少的项（M15）；非空时需要重新授权
          items: { type: string }
    GitHubIdentities:
      type: object
      properties:
        user: { $ref: '#/components/schemas/GitHubIdentity' }
        agent: { $ref: '#/components/schemas/GitHubIdentity' }
    GitHubStatus:
      type: object
      required: [identities, automationIdentity, callbackUrl, webhookBase, webUrl]
      properties:
        oauthApp:
          allOf:
            - $ref: '#/components/schemas/GitHubOAuthApp'
          description: OAuth App 配置；未配置时省略
        identities: { $ref: '#/components/schemas/GitHubIdentities' }
        automationIdentity: { $ref: '#/components/schemas/GitHubIdentitySlot' }
        callbackUrl:
          type: string
          description: 需要在 GitHub 的 OAuth App 设置里登记的回调地址（`<public_url>/api/v1/public/github/oauth/callback`；未配置 OAuth App 时也给出）
        webhookBase:
          type: string
          description: 仓库 webhook 的基址（默认等于 public_url）
        webUrl:
          type: string
          description: GitHub 网页基址（`github.web_url`，默认 `https://github.com`），用于拼接 GitHub 上的链接
        lastDeliveryAt: { $ref: '#/components/schemas/TimestampMs' }
        lastDeliverySource:
          type: string
          enum: [webhook, poll]
    GitHubRedirect:
      type: object
      required: [url]
      properties:
        url: { type: string }
    GitHubSettings:
      type: object
      required: [automationIdentity]
      properties:
        automationIdentity: { $ref: '#/components/schemas/GitHubIdentitySlot' }
    GitHubRepo:
      type: object
      required: [id, fullName, private, defaultBranch]
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string }
        private: { type: boolean }
        defaultBranch: { type: string }
        description: { type: string }
        pushedAt: { $ref: '#/components/schemas/TimestampMs' }
    GitHubRepoList:
      type: object
      required: [repos]
      properties:
        repos:
          type: array
          items: { $ref: '#/components/schemas/GitHubRepo' }
    GitHubListen:
      type: object
      required: [reviews, comments, ci]
      properties:
        reviews: { type: boolean }
        comments: { type: boolean }
        ci: { type: boolean }
    ProjectGitHub:
      type: object
      required: [repoId, fullName, bound, listen]
      properties:
        repoId: { type: integer, format: int64 }
        fullName:
          type: string
          description: '`owner/repo`（取自仓库地址）'
        bound:
          type: boolean
          description: 我的账号能读到该仓库（已记录 `github_repo_id`）
        listen: { $ref: '#/components/schemas/GitHubListen' }
