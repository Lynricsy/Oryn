        links:
          type: array
          items: { $ref: '#/components/schemas/OrbPortalLink' }
        public:
          $ref: '#/components/schemas/OrbPortalPublic'
    OrbPortalPublic:
      type: object
      description: 限时公开中（省略 = 仅所有者可访问）
      required: [expiresAt]
      properties:
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
    OrbServiceList:
      type: object
      required: [services, portals]
      properties:
        services:
          type: array
          items: { $ref: '#/components/schemas/OrbService' }
        portals:
          type: array
          items: { $ref: '#/components/schemas/OrbPortal' }
    PortalShareDuration:
      type: string
      description: 公开时长（3600 / 10800 / 86400 / 604800 秒）
      enum: ['1h', '3h', '1d', '7d']
      x-enum-varnames: [PortalShareDuration1h, PortalShareDuration3h, PortalShareDuration1d, PortalShareDuration7d]
    PortalShareRequest:
      type: object
      required: [duration]
      properties:
        duration: { $ref: '#/components/schemas/PortalShareDuration' }

    # ============================================================ M8：Desktop 与浏览器 Profile
    OrbBrowserStatus:
      type: string
      description: orb 桌面上唯一那个 Chromium 的状态（由 orbd 启动；进程退出后不自动重启，也不做空闲回收）
      enum: [stopped, starting, running]
    BrowserProfileMode:
      type: string
      description: |
        选用 Profile 的方式（缺省 `exclusive`）：

        - `exclusive`：取租约；Profile 被另一台运行中的 orb 独占持有 → 409 `ProfileInUseConflict`（体带持有者线程标题与开始时间）。
        - `readonly`：装载最近一次已保存修订的副本，不取租约、不阻塞持有者；本 orb 的保存 / 冻结 / 停机都不回写，
          持有者之后保存的新修订也不推送过来。
        - `takeover`：接管。控制面先请原持有者做一次活体保存（15s；原 orb 已冻结或不可达则跳过，用最近一次已保存修订），
          再在同一事务里把租约转给本 orb、围栏代数 +1、把原持有者降级为只读（`readonlyReason = taken_over`），
          随后经 link 向原 orbd 发 `profile.mode`。原 orb 的浏览器照常运行、标签页不动，只是此后不再回写；
          它要重新写回只能反过来再接管一次。
      enum: [exclusive, readonly, takeover]
    BrowserProfileAccess:
      type: string
      description: 'orb 实际使用 Profile 的方式：`exclusive`（持有或等待持有租约，可回写）/ `readonly`（只读副本，从不回写）'
      enum: [exclusive, readonly]
    BrowserProfileReadonlyReason:
      type: string
      description: '只读的原因：`requested`（选用时指定 `readonly`）/ `taken_over`（原本独占持有，被另一台 orb 接管）'
      enum: [requested, taken_over]
    BrowserProfileSaveError:
      type: string
      description: |
        最近一次保存失败的原因（成功保存后清除）：`too_large`（归档超过 256MiB）、`export_failed`（orbd 导出或落盘失败）、
        `takeover_unsaved`（接管前对原持有者的保存失败，接管方装载的是更早的修订）。
      enum: [too_large, export_failed, takeover_unsaved]
    BrowserProfileEvent:
      type: string
      description: |
        Profile 审计事件名（表 `browser_profile_events.event`，同时作为 slog 的 `event` 字段；不推送给客户端）：
        `profile.saved`（产生新修订）、`profile.save_failed`、
        `profile.save_fenced`（迟到的保存因围栏代数不符被丢弃；不报错给用户）、`profile.taken_over`（`orb_id` = 被降级为只读的原持有者）。
      enum: [profile.saved, profile.save_failed, profile.save_fenced, profile.taken_over]
      x-enum-varnames: [BrowserProfileEventSaved, BrowserProfileEventSaveFailed, BrowserProfileEventSaveFenced, BrowserProfileEventTakenOver]
    BrowserProfileHolder:
      type: object
      description: 正在使用 Profile 的 orb（独占持有者或只读使用者）
      required: [orbId, threadIds, since]
      properties:
        orbId: { $ref: '#/components/schemas/OrbId' }
        threadIds:
          type: array
          description: 该 orb 上的线程（按创建时间）
          items: { $ref: '#/components/schemas/ThreadId' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 代表线程（该 orb 最早创建的线程）；orb 上没有线程时省略
        threadTitle:
          type: string
          description: 代表线程的标题
        since:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 开始使用的时间（独占：取得租约；只读：选用只读副本或被降级）
    BrowserProfile:
      type: object
      required: [id, name, revision, sizeBytes, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/BrowserProfileId' }
        name: { type: string, minLength: 1, maxLength: 40 }
        revision:
          type: integer
          format: int64
          description: 当前修订；0 = 空（从未保存过）
        sizeBytes:
          type: integer
          format: int64
          description: 当前修订归档的密文字节数
        savedAt: { $ref: '#/components/schemas/TimestampMs' }
        saveError: { $ref: '#/components/schemas/BrowserProfileSaveError' }
        holder:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileHolder'
          description: 独占持有者（租约）；没人持有时省略
        readers:
          type: array
          description: 以只读副本使用它的 orb（不含已删除的）；为空时省略
          items: { $ref: '#/components/schemas/BrowserProfileHolder' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
    BrowserProfileList:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items: { $ref: '#/components/schemas/BrowserProfile' }
    BrowserProfileCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: 1–40 个字符，trim 后非空，不含控制字符；全局唯一
    BrowserProfilePatch:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
          description: 规则同 `BrowserProfileCreate.name`
    ProfileInUseConflict:
      type: object
      description: |
        Profile 被另一台运行中的 orb 独占持有时的 409 体（`createThread` / `setOrbDesktopProfile` 以 `exclusive` 选用，
        或 `deleteBrowserProfile` 时仍被持有）。客户端据此让用户在「只读使用」与「接管」之间选择后重发。
      required: [code, message, profileId, profileName, holder]
      properties:
        code:
          type: string
          enum: [profile_in_use]
          x-enum-varnames: [ProfileInUseConflictCodeProfileInUse]
        message: { type: string }
        profileId: { $ref: '#/components/schemas/BrowserProfileId' }
        profileName: { type: string }
        holder:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileHolder'
          description: 当前持有者（带代表线程的标题与开始持有的时间）
    OrbDesktopProfileStatus:
      type: string
      description: |
        本 orb 与所选 Profile 的关系：`attached`（本 orb 独占持有）、`readonly`（本 orb 以只读副本使用，见 `readonlyReason`）、
        `released`（独占方式但没人持有；本 orb 下次运行时自动取回）、`in_use`（独占方式但被另一台 orb 持有；本地目录已清空）、
        `error`（装载失败，见 `error`）。
      enum: [attached, readonly, released, in_use, error]
    OrbDesktopTakenOver:
      type: object
      description: 本 orb 因被接管而降级为只读的记录
      required: [at]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 接管方的代表线程
        threadTitle:
          type: string
          description: 接管当时接管方线程的标题（即 `profile.mode` 的 `by`）
        at: { $ref: '#/components/schemas/TimestampMs' }
    OrbDesktopProfile:
      type: object
      required: [id, name, status, mode, revision]
      properties:
        id: { $ref: '#/components/schemas/BrowserProfileId' }
        name: { type: string }
        status: { $ref: '#/components/schemas/OrbDesktopProfileStatus' }
        mode: { $ref: '#/components/schemas/BrowserProfileAccess' }
        revision:
          type: integer
          format: int64
          description: 本 orb 本地目录对应的修订（未装载为 0）
        error:
          type: string
          description: '`status=error` 时的错误码（orbd 本机 API 的 `invalid_archive` / `too_large` / `no_space` 等）'
        heldBy:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileHolder'
          description: '`status=in_use` 时的持有者'
        readonlyReason:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileReadonlyReason'
          description: '`mode=readonly` 时的原因'
        takenOverBy:
          allOf:
            - $ref: '#/components/schemas/OrbDesktopTakenOver'
          description: '`readonlyReason=taken_over` 时：被谁接管（界面显示「只读 Profile · 已被〈线程〉接管」）'
    OrbDesktop:
      type: object
      required: [displayReady, browser]
      properties:
        displayReady:
          type: boolean
          description: X 显示 `:1` 与窗口管理器已就绪
        browser: { $ref: '#/components/schemas/OrbBrowserStatus' }
        profile:
          allOf:
            - $ref: '#/components/schemas/OrbDesktopProfile'
          description: 选用的 Profile；不用 Profile 时省略
    OrbDesktopProfilePut:
      type: object
      required: [profileId]
      properties:
        profileId:
          type: string
          description: '`bpf_…`；空串 = 解除（定为不用 Profile）'
        profileMode:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileMode'
          description: 选用方式，缺省 `exclusive`；`profileId` 为空串时忽略
    OrbList:
      type: object
      required: [orbs]
      properties:
        orbs:
          type: array
          items: { $ref: '#/components/schemas/Orb' }
    OrbPauseRequest:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/PauseMode' }
    OrbMetricSample:
      type: object
      required: [ts, cpuPct, memUsedMB, memLimitMB, diskUsedMB, netRxBytes, netTxBytes]
      properties:
        ts: { $ref: '#/components/schemas/TimestampMs' }
        cpuPct: { type: number }
        memUsedMB: { type: number }
        memLimitMB: { type: number }
        diskUsedMB: { type: number }
        netRxBytes: { type: integer, format: int64 }
        netTxBytes: { type: integer, format: int64 }
    OrbMetrics:
      type: object
      required: [orbId, step, samples]
      properties:
        orbId: { $ref: '#/components/schemas/OrbId' }
        step:
          type: integer
          description: 实际步长（秒）
        samples:
          type: array
          items: { $ref: '#/components/schemas/OrbMetricSample' }

    # ============================================================ M9：Space、全局助手、定时与协调宿主
    ThreadKind:
      type: string
      description: |
        线程种类：`work` 普通工作线程；`space` Space 的协调聊天；`assistant` 全局助手对话。
        后两者合称「协调对话」：跑在控制面宿主的协调宿主里，没有工作区，只有 Oryn 宿主工具。
      enum: [work, space, assistant]
      x-enum-varnames: [ThreadKindWork, ThreadKindSpace, ThreadKindAssistant]
    ThreadScheduleSummary:
      type: object
      description: 线程内定时（`mode = thread`）的摘要；完整定义见 `GET threads/{id}/schedule`
      required: [enabled]
      properties:
        enabled: { type: boolean }
        nextRunAt: { $ref: '#/components/schemas/TimestampMs' }
    ThreadScheduleRun:
      type: object
      description: 该线程由「新建线程」定时的第 `run` 次运行创建
      required: [scheduleId, run]
      properties:
        scheduleId: { $ref: '#/components/schemas/ScheduleId' }
        run:
          type: integer
          format: int64
          minimum: 1
    Space:
      type: object
      required: [id, name, goal, threadId, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/SpaceId' }
        name: { type: string, minLength: 1, maxLength: 100 }
        goal: { type: string, maxLength: 2000 }
        projectId:
          allOf:
            - $ref: '#/components/schemas/ProjectId'
          description: 新线程的默认项目；省略 = 无项目
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 它的协调聊天线程（`kind = space`）
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
        archivedAt: { $ref: '#/components/schemas/TimestampMs' }
    SpaceCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        goal: { type: string, maxLength: 2000 }
        projectId: { $ref: '#/components/schemas/ProjectId' }
    SpacePatch:
      type: object
      description: 只修改出现的字段；`name` / `goal` / `projectId` 变化后协调者在静止时以新设定重启
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        goal: { type: string, maxLength: 2000 }
        projectId:
          type: string
          description: '`prj_…`；空串 = 改为无项目'
        archived: { type: boolean }
    SpaceList:
      type: object
      required: [spaces]
      properties:
        spaces:
          type: array
          items: { $ref: '#/components/schemas/Space' }
    SpaceProgress:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items: { $ref: '#/components/schemas/SpaceProgressDay' }
    SpaceProgressDay:
      type: object
      description: |
        一个自然日（按请求的 `tz`）里本 Space 的工作线程：`shipped` 当日标记为已交付的数量；
        `archived` 当日归档且未标记已交付的数量；`open` 当日结束时已创建且未归档的数量。
      required: [date, shipped, archived, open]
      properties:
        date:
          type: string
          description: YYYY-MM-DD
          example: '2026-11-14'
        shipped: { type: integer }
        archived: { type: integer }
        open: { type: integer }
    ScheduleKind:
      type: string
      description: '`cron` 5 段表达式或宏；`every` 固定间隔；`once` 一次性'
      enum: [cron, every, once]
      x-enum-varnames: [ScheduleKindCron, ScheduleKindEvery, ScheduleKindOnce]
    ScheduleMode:
      type: string
      description: '`thread` 到点向一个已有线程追加提示词；`new_thread` 每次运行用固定提示词新建一个线程'
      enum: [thread, new_thread]
      x-enum-varnames: [ScheduleModeThread, ScheduleModeNewThread]
    ScheduleOverlap:
      type: string
      description: |
        `new_thread` 定时在上一次运行未结束（线程仍 `provisioning` / `working`）时到点的处理：
        `skip` 记一次 `skipped`（`error = overlap`）；`allow` 照常新建，同一定时至多 3 个并存（超出记 `skipped`，`error = overlap_cap`）。
        线程内定时恒为 `skip`（`needs_input` 同样算未结束）。
      enum: [skip, allow]
