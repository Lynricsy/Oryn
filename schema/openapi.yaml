  # ---------------------------------------------------------------- orb 文件（M3，经 fs 流代理到 orbd）
  /api/v1/orbs/{id}/fs/roots:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbFsRoots
      summary: orb 内的文件根（`$HOME` 与当前工作目录）
      description: '经 orb link 的 `fs` 流转发到 orbd 本机 API（`GET /fs/roots` 等，见 docs/protocol.md M3 节）。orb 冻结 / 停机时默认唤醒并至多等待 25s；`bg=true` 时不唤醒、不计用户交互。'
      parameters:
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsRoots' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/list:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: listOrbFs
      summary: 列出目录（目录在前、按名不分大小写排序；≤5000 条）
      parameters:
        - { $ref: '#/components/parameters/FsPathQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsListing' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/stat:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: statOrbFs
      summary: 文件或目录元数据（含 `mime` 与 `text`）
      parameters:
        - { $ref: '#/components/parameters/FsPathQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/file:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/FsPathQuery' }
    get:
      tags: [orbs]
      operationId: readOrbFile
      summary: 下载文件（支持 `Range`）
      description: "一律以附件形式返回（`Content-Disposition: attachment`、`X-Content-Type-Options: nosniff`、`Content-Security-Policy: sandbox`、`Cache-Control: no-store`）；目录 → 409 `is_a_directory`。"
      parameters:
        - name: Range
          in: header
          description: 标准 HTTP Range（单区间）
          schema: { type: string }
      responses:
        '200':
          description: 文件字节
          headers:
            ETag:
              description: '`"<mtimeUnixNano>-<size>"`'
              schema: { type: string }
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: Range 请求的部分字节
          headers:
            ETag:
              schema: { type: string }
            Content-Range:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [orbs]
      operationId: writeOrbFile
      summary: 写入文件（整文件覆盖，单文件 ≤512MiB）
      description: |
        父目录须存在。已存在且 `overwrite=false` → 409 `exists`；带 `If-Match` 且与当前 `etag` 不符（含文件不存在）→ 412 `modified`；
        超过 512MiB → 413 `too_large`；磁盘满 → 507 `no_space`。写临时文件后原子替换，沿用原文件权限（新文件 0644）；目标是符号链接时写入其指向的文件。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: overwrite
          in: query
          description: 目标已存在时是否覆盖
          schema: { type: boolean, default: true }
        - name: If-Match
          in: header
          description: 期望的当前 `etag`（`FsEntry.etag`）；不符 → 412 `modified`
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 写入后的文件元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/mkdir:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: mkdirOrbFs
      summary: 新建目录（含缺失的上级目录，0755）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsPathRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/rename:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: renameOrbFs
      summary: 移动 / 重命名
      description: 目标已存在且未 `overwrite` → 409 `exists`；不得移动当前工作目录本身。返回目标的元数据。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsRenameRequest' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FsEntry' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/delete:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: deleteOrbFs
      summary: 删除文件或目录（递归）
      description: 不得删除当前工作目录本身或 `$HOME/.oryn` 下的路径（403 `protected_path`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FsPathRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/fs/publish:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [shares]
      operationId: publishOrbFile
      summary: 把 orb 内的一个文件发布为公开 URL（发布的是此刻的副本，落成该线程的一个附件）
      description: |
        线程须在该 orb 上；必须是普通文件且 ≤100MiB（目录 409 `is_a_directory`，超限 413 `too_large`）。
        orb 冻结 / 停机时唤醒并至多等待 25s。之后 orb 里的修改不影响已发布的副本。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishOrbFileRequest' }
      responses:
        '201':
          description: 已发布
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedFile' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orb 改动（M3，git，经 fs 流代理到 orbd）
  /api/v1/orbs/{id}/git/status:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbGitStatus
      summary: 相对基线 / HEAD / 单个 commit 的改动文件列表（≤2000 个）
      description: '`base` 缺省时控制面以 orb 所属项目的 `baseBranch` 补上；仍无则 orbd 依次取 `origin/HEAD`、`main`、`master`。`root` 不是 git 仓库时返回 `repo=false` 与 `candidates`。'
      parameters:
        - { $ref: '#/components/parameters/GitRootQuery' }
        - { $ref: '#/components/parameters/GitScopeQuery' }
        - { $ref: '#/components/parameters/GitCommitQuery' }
        - { $ref: '#/components/parameters/GitBaseQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/diff:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbGitDiff
      summary: 单个文件的 unified diff（≤1MiB，按行截断）
      parameters:
        - { $ref: '#/components/parameters/GitRootQuery' }
        - { $ref: '#/components/parameters/GitScopeQuery' }
        - { $ref: '#/components/parameters/GitCommitQuery' }
        - { $ref: '#/components/parameters/GitBaseQuery' }
        - { $ref: '#/components/parameters/GitDiffPathQuery' }
        - { $ref: '#/components/parameters/GitDiffOldPathQuery' }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitFileDiff' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/commits:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: listOrbGitCommits
      summary: 基线（merge-base）到 HEAD 的提交，新到旧
      parameters:
        - { $ref: '#/components/parameters/GitRootQuery' }
        - { $ref: '#/components/parameters/GitBaseQuery' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitCommitList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/stage:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: stageOrbGit
      summary: 暂存文件（`git add -A -- <paths>`）
      description: '`index.lock` 被占用 → 409 `git_busy`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitPathsRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/git/unstage:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: unstageOrbGit
      summary: 取消暂存（`git reset -q HEAD -- <paths>`；HEAD 未出生时 `git rm -r -q --cached`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitPathsRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- oryn sync（M5，经 fs 流代理到 orbd，特性 `sync`）
  /api/v1/orbs/{id}/sync/prepare:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [orbs]
      operationId: prepareOrbSync
      summary: 生成工作区快照提交并按需打包 git bundle
      description: |
        orbd 用临时 index 把工作区（含未跟踪、遵守 `.gitignore`）写成以 HEAD 为父的快照提交（同树同父 → 同 sha），
        更新 `refs/oryn/sync/{head,snapshot}`；`snapshot ∉ have` 时以 `have` 中本仓库已有的提交为界打包 bundle。
        错误：HEAD 未出生 409 `sync_no_commits`；无共同提交且未给 `force` 409 `sync_no_common`；
        无共同提交、给了 `force` 但仓库是浅克隆 409 `sync_shallow`；bundle 超过 1GiB 413 `too_large`；
        旧版 orbd 409 `orbd_outdated`。截止 6 分钟。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrbSyncPrepareRequest' }
      responses:
        '200':
          description: 同步状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbSyncState' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/sync/bundle:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: getOrbSyncBundle
      summary: 下载 `prepareOrbSync` 打出的 bundle（保留 10 分钟；过期 404 `sync_bundle_gone`）
      parameters:
        - name: id
          in: query
          required: true
          description: '`OrbSyncState.bundle.id`'
          schema: { type: string, pattern: '^[0-9a-f]{16}$' }
      responses:
        '200':
          description: bundle 字节
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- 受管服务与 portal（M4）
  /api/v1/orbs/{id}/services:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [orbs]
      operationId: listOrbServices
      summary: orb 的受管服务与 portal（读控制面镜像，不唤醒、不计用户交互）
      description: 镜像来自 orbd 的 `services.state` 通知；orb 已删除或旧版 orbd 时两个列表为空。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbServiceList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/start:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    post:
      tags: [orbs]
      operationId: startOrbService
      summary: 启动已声明的服务（等待至多 60s 离开 `starting`）
      description: '经 `fs` 流转发到 orbd 本机 API `POST /services/{name}/start`。orb 不可用时唤醒并至多等待 25s；旧版 orbd → 409 `orbd_outdated`；未知服务 → 404 `service_not_found`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 操作后的服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbService' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/stop:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    post:
      tags: [orbs]
      operationId: stopOrbService
      summary: 停止服务（之后不再自动拉起，直到再次 start / restart）
      description: '经 `fs` 流转发到 orbd 本机 API `POST /services/{name}/stop`；进程组先 SIGTERM，10s 后 SIGKILL。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 操作后的服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbService' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/restart:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    post:
      tags: [orbs]
      operationId: restartOrbService
      summary: 重读 services.yaml 后重启服务（等待至多 60s 离开 `starting`）
      description: '经 `fs` 流转发到 orbd 本机 API `POST /services/{name}/restart`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 操作后的服务状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbService' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/services/{name}/log:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/ServiceNamePath' }
    get:
      tags: [orbs]
      operationId: getOrbServiceLog
      summary: 服务日志末尾（从整行开始）
      description: '经 `fs` 流转发到 orbd 本机 API `GET /services/{name}/log`；没有日志时返回空体。'
      parameters:
        - name: tail
          in: query
          description: 返回末尾至多多少字节
          schema: { type: integer, minimum: 1, maximum: 1048576, default: 65536 }
        - { $ref: '#/components/parameters/OrbBackgroundQuery' }
      responses:
        '200':
          description: 纯文本日志
          content:
            text/plain:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/portals/{port}/share:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
      - { $ref: '#/components/parameters/PortalPortPath' }
    put:
      tags: [orbs]
      operationId: setOrbPortalShare
      summary: 限时公开该端口的 portal（首次公开与续期同一接口：`expiresAt = now + duration`）
      description: '只影响该 `(orb, 端口)`。端口未声明 portal → 404 `portal_not_found`；控制面未配置 `portal_domain` → 409 `portal_disabled`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalShareRequest' }
      responses:
        '200':
          description: 公开后的 portal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbPortal' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [orbs]
      operationId: endOrbPortalShare
      summary: 终止公开（立即断开该端口的全部匿名连接）
      description: 未公开时同样返回 204；控制面未配置 `portal_domain` → 409 `portal_disabled`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- desktop & browser profiles (M8)
  /api/v1/orbs/{id}/desktop/profile:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    put:
      tags: [desktop]
      operationId: setOrbDesktopProfile
      summary: 为 orb 选用、切换或解除浏览器 Profile
      description: |
        `profileId` 空串 = 解除。本 orb 以 `exclusive` 持有的旧 Profile 先做关闭式保存再释放租约；只读副本直接丢弃。
        `profileMode` 缺省 `exclusive`（语义见 `BrowserProfileMode`）：被另一台运行中的 orb 独占持有 → 409 `ProfileInUseConflict`，此时不做任何改动。
        先唤醒 orb 并至多等 25s；Profile 不存在 → 404 `profile_not_found`；旧 orbd（hello 不含 `desktop`）→ 409 `orbd_outdated`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrbDesktopProfilePut' }
      responses:
        '200':
          description: 同步完成后的 orb（`desktop.profile` 为新绑定）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        '409':
          description: '`profile_in_use`（其它 409 为普通 `Error`）'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileInUseConflict' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/profile/save:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [desktop]
      operationId: saveOrbDesktopProfile
      summary: 立即保存本 orb 持有的 Profile（活体保存，浏览器不关闭）
      description: |
        本 orb 没有独占持有 Profile → 409 `no_profile`；以只读副本使用 → 409 `profile_readonly`。
        内容与当前修订相同时不产生新修订，照常返回。归档超限 → 413 `profile_too_large`；导出或落盘失败 → 502 `profile_save_failed`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 保存后的 Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserProfile' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/browser/start:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [desktop]
      operationId: startOrbBrowser
      summary: 启动桌面上的 Chromium（幂等；返回时 DevTools 已就绪）
      description: 先唤醒 orb 并至多等 25s；显示或 Profile 未就绪 → 503 `orb_unavailable`；旧 orbd → 409 `orbd_outdated`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: orb（`desktop.browser` 为 `running`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/browser/stop:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    post:
      tags: [desktop]
      operationId: stopOrbBrowser
      summary: 关闭桌面上的 Chromium（SIGTERM，10s 后 SIGKILL；已停止则无操作）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: orb（`desktop.browser` 为 `stopped`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Orb' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/orbs/{id}/desktop/ws:
    parameters:
      - { $ref: '#/components/parameters/OrbIdPath' }
    get:
      tags: [websocket, desktop]
      operationId: orbDesktopSocket
      summary: 桌面观看与操作通道（WebSocket，二进制消息 = RFB 字节）
      description: |
        挂载方式同 `/api/v1/ws`（不经鉴权组，由一次性票据鉴权）。票据无效或已用过 → 升级前 HTTP 401；orb 不存在 → 404。
        升级后唤醒 orb（至多 25s）并经 link 的 `desk` 流对接 Xvnc；客户端发来的每条消息都算一次（合并后的）用户交互。
        客户端单条消息 ≤1MiB；写超时 30s；每台 orb ≤8 个观看者。
        关闭码：`4401` 主体被吊销、`4409` `orbd_outdated`、`4410` `orb_deleted`、`4429` 观看者已满、
        `4502` 桌面不可达（`display_unavailable` / 拨号失败，reason 为错误码）、`4503` orb 不可用（冻结 / 停机 / 唤醒超时）。
      security: [{}]
      parameters:
        - name: ticket
          in: query
          required: true
          description: '`POST /api/v1/ws-ticket` 签发的票据'
          schema: { type: string }
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/browser-profiles:
    get:
      tags: [desktop]
      operationId: listBrowserProfiles
      summary: 浏览器 Profile 列表（按 `name`）
      responses:
        '200':
          description: Profile 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserProfileList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [desktop]
      operationId: createBrowserProfile
      summary: 新建空 Profile（`revision = 0`）
      description: 名字非法 → 400 `invalid_request`；重名 → 409 `profile_name_taken`；已有 50 个 → 409 `profile_limit`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserProfileCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserProfile' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/browser-profiles/{id}:
    parameters:
      - { $ref: '#/components/parameters/BrowserProfileIdPath' }
    patch:
      tags: [desktop]
      operationId: updateBrowserProfile
      summary: 重命名 Profile
      description: 不存在 → 404 `profile_not_found`；名字非法 → 400 `invalid_request`；重名 → 409 `profile_name_taken`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserProfilePatch' }
      responses:
        '200':
          description: 修改后的 Profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowserProfile' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [desktop]
      operationId: deleteBrowserProfile
      summary: 删除 Profile 及其全部归档（同时清除引用它的项目默认值）
      description: 仍被某台 orb 独占持有 → 409 `ProfileInUseConflict`；只读使用者不阻止删除（它们的本地副本保留到下次同步）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        '409':
          description: '`profile_in_use`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileInUseConflict' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- blobs
  /api/v1/blobs/{sha256}:
    parameters:
      - name: sha256
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Sha256' }
    get:
      tags: [blobs]
      operationId: getBlob
      summary: 下载 blob（转录中 `blob:sha256:<hex>` 引用的图片等）
      description: |
        内容寻址，可长期缓存。入库时记录的 mime 由内容探测得出：只有安全栅格图片（png / jpeg / gif / webp）按该类型
        `Content-Disposition: inline` 返回，其余一律 `application/octet-stream` + `attachment`（与 `/f` 同一白名单）。
      responses:
        '200':
          description: 原始字节
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- attachments
  /api/v1/attachments:
    post:
      tags: [attachments]
      operationId: uploadAttachment
      summary: 上传附件（单文件 ≤100MiB；可先于线程创建上传，24h 内未绑定线程即被清理）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: name
          in: query
          required: true
          description: 原始文件名（服务端净化后 ≤200 字节）
          schema: { type: string, minLength: 1, maxLength: 1024 }
        - name: threadId
          in: query
          description: 直接绑定到该线程；缺省 = 暂不绑定（随 `POST threads` 的 `attachments` 或 `prompt.orynAttachments` 绑定）
          schema: { $ref: '#/components/schemas/ThreadId' }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: 已保存
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/attachments/{id}:
    parameters:
      - { $ref: '#/components/parameters/AttachmentIdPath' }
    delete:
      tags: [attachments]
      operationId: deleteAttachment
      summary: 删除附件（控制面的副本；orb 可用时尽力删除 orb 内的投递副本）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/attachments/{id}/content:
    parameters:
      - { $ref: '#/components/parameters/AttachmentIdPath' }
    get:
      tags: [attachments]
      operationId: getAttachmentContent
      summary: 下载附件（支持 `Range`）
      description: "默认 `Content-Disposition: attachment`；仅当 `inline=true` 且 mime ∈ `image/png|jpeg|gif|webp` 时内联。始终带 `X-Content-Type-Options: nosniff` 与 `Content-Security-Policy: sandbox`。"
      parameters:
        - name: inline
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 附件字节
          content:
            '*/*':
              schema: { type: string, format: binary }
        '206':
          description: Range 请求的部分字节
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/attachments/{id}/publish:
    parameters:
      - { $ref: '#/components/parameters/AttachmentIdPath' }
    post:
      tags: [shares]
      operationId: publishAttachment
      summary: 把附件发布为公开 URL（幂等：已发布则返回现有发布）
      description: 附件须已绑定线程（未绑定 → 400 `invalid`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 发布记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishedFile' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- shares（M5）
  /api/v1/shares:
    get:
      tags: [shares]
      operationId: listShares
      summary: 全部未撤销的线程分享与已发布文件（设置页总览）
      responses:
        '200':
          description: 总览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareOverview' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/shares/{id}:
    parameters:
      - { $ref: '#/components/parameters/ShareIdPath' }
    delete:
      tags: [shares]
      operationId: revokeShare
      summary: 撤销线程分享（页面、接口、图片立即 404，已连接的匿名 WebSocket 收到 `share.revoked` 后以 4001 关闭）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已撤销 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/published-files/{id}:
    parameters:
      - { $ref: '#/components/parameters/PublishedFileIdPath' }
    delete:
      tags: [shares]
      operationId: revokePublishedFile
      summary: 撤回已发布的文件（公开 URL 立即 404；附件本身保留）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已撤回 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- secrets
  /api/v1/secrets:
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: 密钥列表（仅名称与元数据）
      responses:
        '200':
          description: 密钥元数据列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/secrets/{name}:
    parameters:
      - { $ref: '#/components/parameters/SecretNamePath' }
    put:
      tags: [secrets]
      operationId: putSecret
      summary: 写入密钥
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretPut' }
      responses:
        '200':
          description: 写入后的元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretMeta' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: 删除密钥
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- settings
  /api/v1/settings/git-identity:
    get:
      tags: [settings]
      operationId: getGitIdentity
      summary: orb 内 git 提交身份的全局默认值
      responses:
        '200':
          description: 当前默认值（未设置时不含 identity）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitIdentitySettings' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putGitIdentity
      summary: 设置 git 提交身份的全局默认值（下次 setup / 唤醒时写入 orb）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GitIdentity' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GitIdentitySettings' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [settings]
      operationId: deleteGitIdentity
      summary: 清除 git 提交身份的全局默认值（已有 orb 的 git 配置保持不变）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已清除 }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/agent-identity:
    get:
      tags: [settings]
      operationId: getAgentIdentity
      summary: agent 头像（助手回合左侧显示）
      responses:
        '200':
          description: 当前设置（都省略 = 默认品牌标）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarIdentity' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putAgentIdentity
      summary: 设置 agent 头像（整体替换：省略的字段即清除；两者都省略 = 恢复默认）
      description: |
        `avatarIcon` 与 `avatarImage` 至多给一个（都给 → 400 `invalid_request`）。`avatarImage` 必须是
        `data:image/(png|webp|jpeg);base64,` 开头的 data URL，整串超过 128KiB → 413 `too_large`。尚未初始化所有者 → 409。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarIdentity' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarIdentity' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/settings/user-identity:
    get:
      tags: [settings]
      operationId: getUserIdentity
      summary: 用户头像（用户回合右侧与侧栏页脚显示）
      responses:
        '200':
          description: 当前设置（都省略 = 默认：git 身份名字首字或 User 图标）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarIdentity' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [settings]
      operationId: putUserIdentity
      summary: 设置用户头像（整体替换：省略的字段即清除；两者都省略 = 恢复默认）
      description: |
        规则同 agent 头像：`avatarIcon` 与 `avatarImage` 至多给一个（都给 → 400 `invalid_request`）。`avatarImage` 必须是
        `data:image/(png|webp|jpeg);base64,` 开头的 data URL，整串超过 128KiB → 413 `too_large`。尚未初始化所有者 → 409。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvatarIdentity' }
      responses:
        '200':
          description: 写入后的设置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvatarIdentity' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- agent-config
  /api/v1/agent-config/files:
    get:
      tags: [agent-config]
      operationId: listAgentConfigFiles
      summary: omp-home 文件列表
      responses:
        '200':
          description: 文件列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigFileList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-config/files/{path}:
    parameters:
      - { $ref: '#/components/parameters/AgentConfigPath' }
    get:
      tags: [agent-config]
      operationId: getAgentConfigFile
      summary: 读取文件原文（`models.yml` 返回的是密钥已替换为 `${oryn:secret:…}` 的模板）
      responses:
        '200':
          description: 文件原文
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [agent-config]
      operationId: putAgentConfigFile
      summary: 写入文件（`models.yml` 会做 C5 的密钥抽取）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      parameters:
        - name: mode
          in: query
          description: 文件权限（八进制整数，如 420 = 0644）；缺省 0644
          schema: { type: integer, minimum: 0, maximum: 511 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 写入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigWriteResult' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [agent-config]
      operationId: deleteAgentConfigFile
      summary: 删除文件
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/agent-config/import:
    post:
      tags: [agent-config]
      operationId: importAgentConfig
      summary: 导入 tar 包（`oryn config push` 使用）
      description: 包内路径相对 omp-home 根；整体替换现有 omp-home（不在包内的文件被删除）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/x-tar:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 导入结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentConfigImportResult' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- stats
  /api/v1/stats/usage:
    get:
      tags: [stats]
      operationId: getUsageStats
      summary: 模型用量分组聚合
      parameters:
        - name: groupBy
          in: query
          required: true
          schema:
            type: string
            enum: [day, model, thread, project]
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
      responses:
        '200':
          description: 分组结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageStats' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/stats/orbs:
    get:
      tags: [stats]
      operationId: getOrbStats
      summary: orb 生命周期统计（由 `orb_events` 计算）
      parameters:
        - { $ref: '#/components/parameters/FromQuery' }
        - { $ref: '#/components/parameters/ToQuery' }
      responses:
        '200':
          description: 按 orb 类型汇总
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrbStats' }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- notifications（M5）
  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: 最近的通知（按创建时间降序，含各渠道的投递状态）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: 只返回 `createdAt < before` 的通知（翻页游标）
          schema: { $ref: '#/components/schemas/TimestampMs' }
      responses:
        '200':
          description: 通知列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: 标记已读（给 `threadId` 只标该线程，省略 = 全部）；随后向所有连接广播 `notifications.read`
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationsReadRequest' }
      responses:
        '204': { description: 成功 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notification-channels:
    get:
      tags: [notifications]
      operationId: listNotificationChannels
      summary: 通知渠道（机密字段只写不读）
      responses:
        '200':
          description: 渠道列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannelList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [notifications]
      operationId: createNotificationChannel
      summary: 新建通知渠道
      description: |
        恰好给出与 `kind` 同名的一个配置对象；URL 须是 http(s)，自定义头名不得是 `Host` / `Content-Length` / `Content-Type`
        （否则 400 `invalid_channel`）。Telegram：创建时以 `getMe` 校验 token（失败 400 `invalid_channel`），至多一个（409 `channel_exists`）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notification-channels/{id}:
    parameters:
      - { $ref: '#/components/parameters/NotificationChannelIdPath' }
    patch:
      tags: [notifications]
      operationId: updateNotificationChannel
      summary: 修改通知渠道（给出配置对象 = 整体替换该渠道配置；Telegram 换 token 会清掉绑定）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationChannelPatch' }
      responses:
        '200':
          description: 修改后的渠道
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationChannel' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [notifications]
      operationId: deleteNotificationChannel
      summary: 删除通知渠道（其投递记录一并删除）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notification-channels/{id}/test:
    post:
      tags: [notifications]
      operationId: testNotificationChannel
      summary: 同步发送一条测试消息（不写通知表；结果写入渠道的 `lastError`）
      description: Telegram 未绑定私聊 → 409 `channel_not_linked`。
      parameters:
        - { $ref: '#/components/parameters/NotificationChannelIdPath' }
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 发送结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTestResult' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/notification-channels/{id}/telegram/link:
    post:
      tags: [notifications]
      operationId: linkTelegramChannel
      summary: 生成 Telegram 绑定码（10 分钟有效；在 Telegram 里向 bot 私聊发送 `/start <码>` 完成绑定）
      description: 渠道不是 Telegram → 400 `invalid_channel`。
      parameters:
        - { $ref: '#/components/parameters/NotificationChannelIdPath' }
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 绑定码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLink' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/push/vapid-key:
    get:
      tags: [notifications]
      operationId: getVapidKey
      summary: Web Push 的 VAPID 公钥（`applicationServerKey`）
      responses:
        '200':
          description: 公钥
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VapidKey' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/push/subscriptions:
    get:
      tags: [notifications]
      operationId: listPushSubscriptions
      summary: 推送订阅（所有浏览器 / 设备）
      responses:
        '200':
          description: 订阅列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSubscriptionList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [notifications]
      operationId: createPushSubscription
      summary: 登记推送订阅（Web Push / UnifiedPush 按 `endpoint` upsert，FCM 按 `token` upsert；`userAgent` 取请求头；订阅归属当前网页会话或设备）
      description: |
        `kind` 缺省为 `webpush`：`endpoint` 须是 `https://`（`http://` 仅允许回环主机）；`keys.p256dh` 解码后须为 65 字节且以 0x04 开头、
        `keys.auth` 解码后须为 16 字节，否则 400 `push_invalid`。
        `kind: fcm`：须带 `token`（FCM 注册令牌，不得带 `endpoint` / `keys`），否则 400 `push_invalid`；
        服务器未配置 FCM（`orynd.yaml` 的 `push.fcm.service_account_secret` 为空或该密钥不存在）时 409 `fcm_unavailable`。
        返回的订阅 `endpoint` 即该令牌。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionInput' }
      responses:
        '201':
          description: 订阅
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushSubscription' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/push/subscriptions/{id}:
    parameters:
      - { $ref: '#/components/parameters/PushSubscriptionIdPath' }
    delete:
      tags: [notifications]
      operationId: deletePushSubscription
      summary: 删除推送订阅
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- Space、全局助手、定时与协调宿主（M9）
  /api/v1/spaces:
    get:
      tags: [spaces]
      operationId: listSpaces
      summary: Space 列表（按名称）
      parameters:
        - name: archived
          in: query
          description: 为 true 时同时返回已归档的 Space；缺省只返回未归档
          schema: { type: boolean }
      responses:
        '200':
          description: Space 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [spaces]
      operationId: createSpace
      summary: 新建 Space（同时创建它的协调聊天线程）
      description: |
        需要协调宿主可用：不可用时 409 `coordinator_unavailable`（`message` 为具体原因）。
        名称已被占用 → 409 `space_name_taken`；项目不存在 → 404 `not_found`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpaceCreate' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/spaces/{id}:
    parameters:
      - { $ref: '#/components/parameters/SpaceIdPath' }
    get:
      tags: [spaces]
      operationId: getSpace
      summary: Space 详情
      responses:
        '200':
          description: Space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [spaces]
      operationId: updateSpace
      summary: 修改 Space（改名同步聊天线程标题；`archived` 同步归档聊天线程）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpacePatch' }
      responses:
        '200':
          description: 修改后的 Space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Space' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [spaces]
      operationId: deleteSpace
      summary: 删除 Space（删除其聊天线程；其工作线程保留并移出 Space，其项目定时的 `spaceId` 清空）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/spaces/{id}/progress:
    parameters:
      - { $ref: '#/components/parameters/SpaceIdPath' }
    get:
      tags: [spaces]
      operationId: getSpaceProgress
      summary: 近 N 天的 Shipped / Archived / Open 进度（按自然日，最早的一天在前）
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
        - name: tz
          in: query
          description: IANA 时区，决定自然日的边界；缺省 `UTC`，非法 → 400 `invalid_request`
          schema: { type: string }
      responses:
        '200':
          description: 进度
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SpaceProgress' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/assistant/conversations:
    post:
      tags: [spaces]
      operationId: createAssistantConversation
      summary: 新建一个全局助手对话（`kind = assistant` 的线程；无请求体，标题由 agent 自动生成）
      description: 需要协调宿主可用：不可用时 409 `coordinator_unavailable`（`message` 为具体原因）。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThreadEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/coordinator:
    get:
      tags: [automation]
      operationId: getCoordinator
      summary: 协调宿主的可用性与沙箱报告
      responses:
        '200':
          description: 状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoordinatorStatus' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/automation/actions:
    get:
      tags: [automation]
      operationId: listAutomationActions
      summary: 协调者与 orb 内 agent 的操作记录（审计，新的在前，保留 90 天）
      parameters:
        - name: thread
          in: query
          description: 只返回该线程作为发起方或目标的记录
          schema: { $ref: '#/components/schemas/ThreadId' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: 操作记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomationActionList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules:
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: 定时列表（两种模式；按创建时间）
      parameters:
        - name: mode
          in: query
          schema: { $ref: '#/components/schemas/ScheduleMode' }
        - name: project
          in: query
          description: 项目 id：该项目的 `new_thread` 定时；`none` = 没有项目的 `new_thread` 定时
          schema: { type: string }
        - name: space
          in: query
          description: '`spaceId` 为它的 `new_thread` 定时，加上挂在该 Space 线程上的线程内定时'
          schema: { $ref: '#/components/schemas/SpaceId' }
        - name: thread
          in: query
          description: 该线程的线程内定时
          schema: { $ref: '#/components/schemas/ThreadId' }
      responses:
        '200':
          description: 定时列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: 新建定时（必须给 `mode`）
      description: |
        `mode = thread`：须给 `threadId`（每线程至多一个，已有 → 409 `conflict`；线程已归档 → 409 `thread_archived`）。
        `mode = new_thread`：须给 `name`；同项目（或同为无项目）下重名 → 409 `schedule_name_taken`。
        字段规则见 `ScheduleInput`，违反 → 400 `invalid_schedule`；全库启用中的定时已达 200 → 409 `schedule_limit`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/preview:
    post:
      tags: [schedules]
      operationId: previewSchedule
      summary: 预览接下来的触发时间（至多 5 个；只看时间字段，`prompt` 可为空串）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: 预览
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePreview' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/{id}:
    parameters:
      - { $ref: '#/components/parameters/ScheduleIdPath' }
    get:
      tags: [schedules]
      operationId: getSchedule
      summary: 定时详情
      responses:
        '200':
          description: 定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [schedules]
      operationId: putSchedule
      summary: 替换定时的定义（保留 `id`、`runCount`；清零 `failures` 与 `pausedReason`；重算 `nextRunAt`）
      description: '`mode` / `threadId` / `projectId` 若出现必须与现值相同（目标不可改），否则 400 `invalid_schedule`。'
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: 修改后的定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: 删除定时（连同运行记录；它建出的线程保留）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/{id}/pause:
    parameters:
      - { $ref: '#/components/parameters/ScheduleIdPath' }
    post:
      tags: [schedules]
      operationId: pauseSchedule
      summary: 暂停（`pausedReason = user`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/{id}/resume:
    parameters:
      - { $ref: '#/components/parameters/ScheduleIdPath' }
    post:
      tags: [schedules]
      operationId: resumeSchedule
      summary: 恢复（重算 `nextRunAt`，不补跑暂停期间错过的触发；已结束的一次性定时 → 400 `invalid_schedule`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/{id}/run:
    parameters:
      - { $ref: '#/components/parameters/ScheduleIdPath' }
    post:
      tags: [schedules]
      operationId: runSchedule
      summary: 立即触发一次（`trigger = manual`；不改 `nextRunAt`；暂停中的定时也可触发）
      description: 已有未结束的运行且不允许并存（线程内定时，或 `overlap = skip`）→ 409 `schedule_busy`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 本次运行
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleRun' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/schedules/{id}/runs:
    parameters:
      - { $ref: '#/components/parameters/ScheduleIdPath' }
    get:
      tags: [schedules]
      operationId: listScheduleRuns
      summary: 最近的运行记录（新的在前；每个定时保留最近 200 条）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 运行记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleRunList' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/threads/{id}/schedule:
    parameters:
      - { $ref: '#/components/parameters/ThreadIdPath' }
    get:
      tags: [schedules]
      operationId: getThreadSchedule
      summary: 线程内定时（没有 → 404 `schedule_not_found`）
      responses:
        '200':
          description: 定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
    put:
      tags: [schedules]
      operationId: putThreadSchedule
      summary: 设置线程内定时（没有则新建，有则替换定义；隐含 `mode = thread`）
      description: 请求体不得带 `new_thread` 专属字段，`mode` / `threadId` 若出现须为 `thread` / 本线程，否则 400 `invalid_schedule`；线程已归档 → 409 `thread_archived`。
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: 定时
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [schedules]
      operationId: deleteThreadSchedule
      summary: 删除线程内定时（没有 → 404 `schedule_not_found`）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '204': { description: 已删除 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- public（M5，匿名只读）
  /api/v1/public/shares/{slug}:
    parameters:
      - { $ref: '#/components/parameters/ShareSlugPath' }
    get:
      tags: [public]
      operationId: getPublicShare
      summary: 公开分享的元数据（不含线程 id、orb、项目、标签、模型配置）
      description: slug 不存在或已撤销一律 404 `not_found`。
      security: [{}]
      responses:
        '200':
          description: 分享
          headers:
            X-Robots-Tag:
              schema: { type: string, example: 'noindex, nofollow' }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicShare' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/public/shares/{slug}/entries:
    parameters:
      - { $ref: '#/components/parameters/ShareSlugPath' }
    get:
      tags: [public]
      operationId: listPublicShareEntries
      summary: 分享范围内的条目（活动分支上的主会话条目，按 `seq` 升序；隐藏类型的条目保留链、清空 payload）
      security: [{}]
      parameters:
        - name: after
          in: query
          description: 只返回 `seq > after` 的条目
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: 条目页
          headers:
            X-Robots-Tag:
              schema: { type: string, example: 'noindex, nofollow' }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicEntryPage' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/public/shares/{slug}/blobs/{sha256}:
    parameters:
      - { $ref: '#/components/parameters/ShareSlugPath' }
      - name: sha256
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Sha256' }
    get:
      tags: [public]
      operationId: getPublicShareBlob
      summary: 分享范围内公开条目引用的 blob（范围外 / 别的线程 / 只被隐藏条目引用 / 不存在 → 404）
      description: |
        授权以公开过滤之后的内容为准：`display:false` 的注入消息、非渲染类型条目里的引用不算；快照只认创建时固化且未被改写的行。
        头同 `getBlob`（类型白名单、`nosniff` + `Content-Security-Policy: sandbox`），但 `Cache-Control: no-store`。
      security: [{}]
      responses:
        '200':
          description: 原始字节
          headers:
            X-Robots-Tag:
              schema: { type: string, example: 'noindex, nofollow' }
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            '*/*':
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/public/shares/{slug}/ws:
    parameters:
      - { $ref: '#/components/parameters/ShareSlugPath' }
    get:
      tags: [websocket, public]
      operationId: connectPublicShareWs
      summary: 实时分享的匿名 WebSocket（仅 `mode=live`；快照分享 → 404）
      description: |
        S→C 消息见 `WsPublicServerMessage`（都不带 `threadId`）；客户端只许发 `WsClientPing`，其它消息以 1008 关闭。
        连接后先收到 `share.snapshot`，再分批收到 `entries`（每批 ≤200 条），之后转发实时 `frame`。
        撤销时收到 `share.revoked` 并以 4001 关闭。名额：每分享 ≤64、全局 ≤512，已满 503 `share_busy`；读上限 4KiB。
      security: [{}]
      parameters:
        - name: after
          in: query
          description: 已缓存条目的最大 seq（补发从其后开始）
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: rev
          in: query
          description: 客户端缓存的 `transcriptRev`；与当前不同时服务端从 0 补发（`fullReplay`）
          schema: { type: integer, format: int64 }
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- realtime
  /api/v1/ws-ticket:
    post:
      tags: [realtime]
      operationId: createWsTicket
      summary: 签发 WebSocket 票据（一次性，30 秒有效）
      security:
        - cookieAuth: []
          csrfHeader: []
        - deviceBearer: []
      responses:
        '200':
          description: 票据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WsTicket' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/ws:
    get:
      tags: [websocket, realtime]
      operationId: connectWs
      summary: 客户端实时通道（WebSocket，JSON 文本消息）
      description: |
        C→S 消息见 `WsClientMessage`，S→C 消息见 `WsServerMessage`。
        `sub` 后服务端先发 `thread.snapshot`，再分批发 `entries`（每条 ≤200 个条目），之后转发实时 `frame`。
        待发数据超过 8MiB 的慢消费者会被断开，客户端应重连并以 `afterSeq` 补拉。
      security: [{}]
      parameters:
        - name: ticket
          in: query
          required: true
          description: '`POST /api/v1/ws-ticket` 签发的票据'
          schema: { type: string }
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- provider protocol (C1)
  /provider/v1/hello:
    post:
      tags: [provider-protocol]
      operationId: providerHello
      summary: provider 实例上线并取得租约
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderHelloRequest' }
      responses:
        '200':
          description: 已登记；须在 `leaseSeconds` 内以 `jobs/claim` 续租
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderHelloResponse' }
        '409':
          description: 另一实例租约未过期且未声明 `allowMultiple`（`code:"provider_already_connected"`）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/jobs/claim:
    post:
      tags: [provider-protocol]
      operationId: providerClaimJob
      summary: 长轮询认领任务（同时续租）
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderClaimRequest' }
      responses:
        '200':
          description: 认领到任务（认领租约 6 分钟）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProviderClaimResponse' }
        '204':
          description: 等待超时，无任务
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/jobs/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { $ref: '#/components/schemas/JobId' }
    post:
      tags: [provider-protocol]
      operationId: providerCompleteJob
      summary: 上报任务结果
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderCompleteRequest' }
      responses:
        '204': { description: 已记录 }
        default: { $ref: '#/components/responses/Error' }
  /provider/v1/bye:
    post:
      tags: [provider-protocol]
      operationId: providerBye
      summary: provider 实例下线，释放租约
      security:
        - providerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProviderByeRequest' }
      responses:
        '204': { description: 已下线 }
        default: { $ref: '#/components/responses/Error' }

  # ---------------------------------------------------------------- orb link (C2)
  /orb/v1/link:
    get:
      tags: [websocket]
      operationId: orbLink
      summary: orb link（WebSocket 子协议 `oryn.orb.v1` + yamux）
      description: |
        升级后在 WS 二进制消息流上跑 yamux（orbd = client，orynd = server，keepalive 10s）。
        每条 yamux 流的第一行是 `LinkStreamHeader` JSON + `\n`。
        `ctl` 流（orbd 建连后第一条且唯一）为双向 JSON 行：`LinkCtlRequest` / `LinkCtlResponse` / `LinkCtlNotification`；
        各方法的 params / result 见 `LinkCtlMethod` 与 `LinkCtl<Method>Params` / `LinkCtl<Method>Result`。
        orb 令牌只对本 orb 有效：`threadId` 不属于该 orb 的 `entries.*`、`agent` 流、`egress` 流会导致 link 被关闭。
      security:
        - orbBearer: []
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: true
          schema:
            type: string
            enum: [oryn.orb.v1]
      responses:
        '101': { description: 切换到 WebSocket }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-oryn_session
      description: 网页会话（`__Host-` 前缀：Path=/、无 Domain；HttpOnly、Secure、SameSite=Lax，30 天滑动续期）
    csrfHeader:
      type: apiKey
      in: header
      name: X-Oryn-CSRF
      description: 'Cookie 鉴权的变更类请求必须带 `X-Oryn-CSRF: 1`'
    deviceBearer:
      type: http
      scheme: bearer
      description: 设备令牌 `odt_…`
    providerBearer:
      type: http
      scheme: bearer
      description: provider 令牌 `opv_…`
    orbBearer:
      type: http
      scheme: bearer
      description: orb 令牌 `oot_…`

  parameters:
    DeviceIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/DeviceId' }
    ProjectIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProjectId' }
    ProviderIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ProviderId' }
    ThreadIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ThreadId' }
    OrbIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrbId' }
    AttachmentIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/AttachmentId' }
    FsPathQuery:
      name: path
      in: query
      required: true
      description: orb 内路径：绝对路径或 `~/…`；跟随符号链接后必须位于 `$HOME` 之下（否则 403 `outside_home`）。响应中的路径一律为绝对路径
      schema: { type: string, minLength: 1, maxLength: 4096 }
    OrbBackgroundQuery:
      name: bg
      in: query
      description: 后台请求（轮询用）：orb 不可用时直接 409 `orb_not_ready`，不唤醒、不计用户交互。接受 `1` / `true`
      schema: { type: boolean, default: false }
    GitRootQuery:
      name: root
      in: query
      description: 仓库所在目录（同 `FsPathQuery` 的路径规则）；缺省 = orb 当前工作目录
      schema: { type: string, maxLength: 4096 }
    GitScopeQuery:
      name: scope
      in: query
      schema: { $ref: '#/components/schemas/GitScope' }
    GitCommitQuery:
      name: commit
      in: query
      description: '`scope=commit` 时必填'
      schema: { type: string, pattern: '^[0-9a-f]{7,40}$' }
    GitBaseQuery:
      name: base
      in: query
      description: 基线分支名（如 `main`）
      schema: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,200}$' }
    GitDiffPathQuery:
      name: path
      in: query
      required: true
      description: 仓库内相对路径（`GitFileChange.path`）
      schema: { type: string, minLength: 1, maxLength: 4096 }
    GitDiffOldPathQuery:
      name: oldPath
      in: query
      description: 重命名 / 复制前的路径（`GitFileChange.oldPath`）
      schema: { type: string, maxLength: 4096 }
    SecretNamePath:
      name: name
      in: path
      required: true
      description: 密钥名（如 `omp/models/anthropic/apiKey`、`git/github.com/token`、`GITHUB_TOKEN`），`/` 编码为 `%2F`
      schema: { type: string, minLength: 1, maxLength: 256 }
    AgentConfigPath:
      name: path
      in: path
      required: true
      description: 相对 omp-home 根的路径（如 `skills/foo/SKILL.md`），`/` 编码为 `%2F`；不得含 `..`
      schema: { type: string, minLength: 1, maxLength: 1024 }
    FromQuery:
      name: from
      in: query
      description: 起始时间（含，UTC 毫秒）；缺省 = 7 天前
      schema: { $ref: '#/components/schemas/TimestampMs' }
    ToQuery:
      name: to
      in: query
      description: 结束时间（不含，UTC 毫秒）；缺省 = 现在
      schema: { $ref: '#/components/schemas/TimestampMs' }
    ServiceNamePath:
      name: name
      in: path
      required: true
      description: 受管服务名
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$' }
    PortalPortPath:
      name: port
      in: path
      required: true
      description: portal 端口（服务的 `PORT`）
      schema: { type: integer, minimum: 1, maximum: 65535 }
    ShareIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ShareId' }
    ShareSlugPath:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ShareSlug' }
    PublishedFileIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PublishedFileId' }
    NotificationChannelIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/NotificationChannelId' }
    PushSubscriptionIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PushSubscriptionId' }
    BrowserProfileIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BrowserProfileId' }
    SpaceIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SpaceId' }
    ScheduleIdPath:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ScheduleId' }

  responses:
    Error:
      description: 错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ============================================================ 基础类型
    TimestampMs:
      type: integer
      format: int64
      description: UTC 毫秒时间戳
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: SHA-256 小写十六进制
    ThreadId:
      type: string
      pattern: '^T-[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: '`T-<uuidv7>`'
      example: T-01932f6e-8d1a-7c3b-9f2e-0123456789ab
    OrbId:
      type: string
      pattern: '^orb-[0-9a-z]{26}$'
      description: '`orb-<26 位小写 ULID>`（同时是容器名与 hostname）'
      example: orb-01jcz8m3w4x5y6z7a8b9c0d1e2
    ProjectId:
      type: string
      pattern: '^prj_[0-9A-Z]{26}$'
      description: '`prj_<ulid>`'
    ProviderId:
      type: string
      pattern: '^prov_[0-9A-Z]{26}$'
      description: '`prov_<ulid>`'
    DeviceId:
      type: string
      pattern: '^dev_[0-9A-Z]{26}$'
      description: '`dev_<ulid>`'
    JobId:
      type: string
      pattern: '^job_[0-9A-Z]{26}$'
      description: '`job_<ulid>`'
    SetupRunId:
      type: string
      description: setup / resume 运行记录 id
      pattern: '^osr_[0-9A-Z]{26}$'
      example: osr_01HZX3J9Q4W8E5R6T7Y8U9I0OP
    SnapshotId:
      type: string
      pattern: '^oryn-snap-[0-9a-z]{26}$'
      description: 快照 id，同时是 Docker 镜像名
    AttachmentId:
      type: string
      pattern: '^att_[0-9A-Z]{26}$'
      description: '`att_<ulid>`'
    ShareId:
      type: string
      pattern: '^shr_[0-9A-Z]{26}$'
      description: '`shr_<ulid>`'
    ShareSlug:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: 公开分享 / 发布文件的能力令牌（16 字节随机的小写十六进制，明文存储）
    PublishedFileId:
      type: string
      pattern: '^pub_[0-9A-Z]{26}$'
      description: '`pub_<ulid>`'
    NotificationId:
      type: string
      pattern: '^ntf_[0-9A-Z]{26}$'
      description: '`ntf_<ulid>`'
    NotificationChannelId:
      type: string
      pattern: '^nch_[0-9A-Z]{26}$'
      description: '`nch_<ulid>`'
    PushSubscriptionId:
      type: string
      pattern: '^psub_[0-9A-Z]{26}$'
      description: '`psub_<ulid>`'
    BrowserProfileId:
      type: string
      pattern: '^bpf_[0-9A-Z]{26}$'
      description: '`bpf_<ulid>`'
    SpaceId:
      type: string
      pattern: '^spc_[0-9A-Z]{26}$'
      description: '`spc_<ulid>`（M9）'
    ScheduleId:
      type: string
      pattern: '^sch_[0-9A-Z]{26}$'
      description: '`sch_<ulid>`（M9）'
    ScheduleRunId:
      type: string
      pattern: '^srn_[0-9A-Z]{26}$'
      description: '`srn_<ulid>`（M9，定时的一次运行）'
    AutomationActionId:
      type: string
      pattern: '^cac_[0-9A-Z]{26}$'
      description: '`cac_<ulid>`（M9，操作记录）'
    OmpFrame:
      type: object
      additionalProperties: true
      description: omp RPC 的命令、应答或帧，控制面不解释其内容。权威类型见 agent 仓库 `rpc-types.ts`。
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            机器可读错误码。已定义：`unauthorized`、`forbidden`、`not_found`、`invalid_request`、`conflict`、
            `provider_already_connected`、`managed_by_oryn`、`use_oryn_fork`、`queue_full`、`orb_unavailable`、`rate_limited`（429，带 `Retry-After`）、`internal`。
            M3（orb 文件 / 改动 / 附件，HTTP 状态见 docs/protocol.md）：`invalid_path`、`outside_home`、`protected_path`、`exists`、`is_a_directory`、
            `not_a_directory`、`not_a_repo`、`git_busy`、`modified`（412）、`too_large`（413）、`checksum_mismatch`（422）、`git_failed`、`no_space`（507）、
            `orb_not_ready`、`orbd_outdated`、`orb_deleted`（410）、`no_orb`、`orb_unavailable`（503，带 `Retry-After: 3`）、`orbd_unreachable`（502）、`orbd_bad_response`（502，orbd 返回了非预期状态）、`orbd_timeout`（504）、`attachment_not_found`。
            M4（受管服务与 portal，HTTP 状态见 docs/protocol.md）：`portal_disabled`（409，未配置 `portal_domain`）、`portal_not_found`（404）、`portal_unauthorized`（401）、
            `cross_site_blocked`（403）、`forbidden_port`（403）、`service_unreachable`（502）、`portal_unreachable`（502）、`portal_timeout`（504）、`portal_busy`（503）、
            `service_not_found`（404）、`invalid_service`（400）、`name_conflict`（409）、`services_not_ready`（409）。
            M5（分享、通知与 sync，HTTP 状态见 docs/protocol.md）：`invalid`（400 / 409）、`secrets_found`（409，体为 `ShareScanConflict`）、
            `channel_exists`（409，已有 Telegram 渠道）、`invalid_channel`（400）、`channel_not_linked`（409）、`push_invalid`（400）、
            `share_busy`（503，匿名连接数已满）、`sync_no_commits`（409）、`sync_no_common`（409）、`sync_shallow`（409）、`sync_bundle_gone`（404）。
            M6（App 会话）：`app_session_unsupported`（403，只有 desktop / mobile 设备令牌能换取 App 会话）。
            M8（Desktop 与浏览器 Profile，HTTP 状态见 docs/protocol.md）：`profile_not_found`（404）、`profile_in_use`（409，体为 `ProfileInUseConflict`）、
            `profile_name_taken`（409）、`profile_limit`（409）、`no_profile`（409）、`profile_readonly`（409）、`profile_too_large`（413）、`profile_save_failed`（502）。
            M9（Space、助手与定时，HTTP 状态见 docs/protocol.md）：`invalid_schedule`（400）、`schedule_not_found`（404）、`space_not_found`（404）、
            `schedule_busy`（409）、`schedule_name_taken`（409）、`schedule_limit`（409，启用中的定时已达 200）、`space_name_taken`（409）、
            `thread_archived`（409）、`space_thread`（409，不能直接删除 Space 的聊天线程）、`coordinator_unavailable`（409，`message` 为原因）、
            `coordinator_restricted`（400 / WS `error`，协调线程不允许的命令、fork、分享、附件，或把线程挂到协调 orb / `@host`）。
        message:
          type: string
    HealthResponse:
      type: object
      required: [ok, version]
      properties:
        ok: { type: boolean }
        version: { type: string }

    # ============================================================ 状态枚举
    ThreadState:
      type: string
      description: |
        线程状态（全端统一，自上而下取首个成立）：
        `provisioning` orb 未到 ready 且 agent 从未 ready；
        `awaiting_input` 有待答 UI 或计划提案；
        `working` 已见 agent_start 且尚无终结 agent_end，或 state.hasPendingAsyncWork；
        `error` 最近 prompt_result 为 error 或 agent 重启耗尽；
        `idle` 其它。
      enum: [provisioning, awaiting_input, working, error, idle]
    OrbState:
      type: string
      description: orb 状态机（计划 E 节）
      enum:
        - requested
        - spawning
        - connecting
        - setting_up
        - resuming
        - ready
        - freezing
        - frozen
        - stopping
        - stopped
        - waking
        - deleting
        - deleted
        - failed
    AgentStatus:
      type: string
      description: 线程 agent 进程状态；`none` = 尚未启动或 orb 不可用
      enum: [none, starting, ready, exited]
    PauseMode:
      type: string
      enum: [freeze, stop]
    DeviceKind:
      type: string
      enum: [cli, desktop, mobile]
    SecretMode:
      type: string
      description: '`proxy` 经 egress 注入（不进 orb）；`env` 以同名环境变量注入 agent 进程'
      enum: [proxy, env]
    JobOp:
      type: string
      enum: [spawn, pause, snapshot, delete, delete_snapshot]
    JobState:
      type: string
      enum: [queued, claimed, succeeded, failed]
    ProviderDriver:
      type: string
      enum: [docker, dispatch, process]

    # ============================================================ 认证
    AuthSetupBeginRequest:
      type: object
      properties:
        token:
          type: string
          description: '`ost_…` 初始化令牌；恢复流程中省略'
        name:
          type: string
          description: Passkey 显示名
    WebAuthnCeremony:
      type: object
      required: [ceremonyId, options]
      properties:
        ceremonyId:
          type: string
          description: 本次仪式的服务端会话句柄，finish 时回传
        options:
          type: object
          additionalProperties: true
          description: '`PublicKeyCredentialCreationOptionsJSON` 或 `PublicKeyCredentialRequestOptionsJSON`（WebAuthn L3 JSON 形态）'
    AuthSetupFinishRequest:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId: { type: string }
        credential:
          type: object
          additionalProperties: true
          description: '`RegistrationResponseJSON`'
    AuthSetupFinishResponse:
      type: object
      required: [me]
      properties:
        me: { $ref: '#/components/schemas/Me' }
        recoveryCodes:
          type: array
          description: 首次初始化时返回 10 个恢复码（仅此一次）；恢复流程重新注册时为空
          items: { type: string }
    AuthLoginFinishRequest:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId: { type: string }
        credential:
          type: object
          additionalProperties: true
          description: '`AuthenticationResponseJSON`'
    AuthRecoveryRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    AuthRecoveryResponse:
      type: object
      required: [expiresAt, remainingCodes]
      properties:
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
        remainingCodes:
          type: integer
          description: 剩余未使用的恢复码数量
    Me:
      type: object
      required: [displayName, createdAt, auth]
      properties:
        displayName: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        auth:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [web, device, recovery]
            deviceId:
              allOf:
                - $ref: '#/components/schemas/DeviceId'
              description: 设备令牌鉴权时为该设备；App 会话（`kind = web` 且由设备换取）时同样给出
        passkeyCount: { type: integer }
    AppSessionCode:
      type: object
      required: [code, expiresIn]
      description: App 会话一次性码（M6）；以 `GET /auth/app?code=…&next=…` 兑换
      properties:
        code:
          type: string
          description: '`oac_…`，只能兑换一次'
        expiresIn:
          type: integer
          description: 有效秒数
          example: 30

    # ============================================================ 设备
    Device:
      type: object
      required: [id, name, kind, platform, createdAt]
      properties:
        id: { $ref: '#/components/schemas/DeviceId' }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        platform: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        lastSeenAt: { $ref: '#/components/schemas/TimestampMs' }
        revokedAt: { $ref: '#/components/schemas/TimestampMs' }
        current:
          type: boolean
          description: 是否为发起本请求的设备
    DeviceList:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: '#/components/schemas/Device' }
    DevicePairStartRequest:
      type: object
      required: [name, kind, platform]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        platform:
          type: string
          description: 如 `linux-x64`、`ios`、`windows`
    DevicePairStartResponse:
      type: object
      required: [code, verifier, verifyUrl, expiresAt, interval]
      properties:
        code:
          type: string
          pattern: '^[A-Z2-9]{4}-[A-Z2-9]{4}$'
          description: 8 位配对码（去易混字符），10 分钟有效
        verifier:
          type: string
          description: 仅发起方持有，轮询时回传
        verifyUrl:
          type: string
          description: 网页批准地址（`<public_url>/pair`，不预填配对码，所有者须手动输入设备上显示的码）
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
        interval:
          type: integer
          description: 建议轮询间隔（秒）
          example: 2
    DevicePairing:
      type: object
      required: [code, name, kind, platform, ip, userAgent, createdAt, expiresAt]
      properties:
        code: { type: string }
        name: { type: string }
        kind: { $ref: '#/components/schemas/DeviceKind' }
        platform: { type: string }
        ip:
          type: string
          description: 发起方 IP
        userAgent:
          type: string
          description: 发起方 User-Agent
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
    DevicePairApproveRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    DevicePairPollRequest:
      type: object
      required: [code, verifier]
      properties:
        code: { type: string }
        verifier: { type: string }
    DevicePairPollResponse:
      type: object
      required: [deviceToken, device]
      properties:
        deviceToken:
          type: string
          description: '`odt_…`，只返回这一次'
        device: { $ref: '#/components/schemas/Device' }

    # ============================================================ 项目
    Project:
      type: object
      required: [id, name, shallowClone, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ProjectId' }
        name: { type: string }
        repoUrl: { type: string }
        baseBranch: { type: string }
        defaultProvider:
          type: string
          description: provider 名称
        defaultOrbType: { type: string }
        setupScript: { type: string }
        resumeScript: { type: string }
        shallowClone: { type: boolean }
        color: { type: string }
        icon:
          type: string
          description: 项目图标：单个字形（Nerd Font 私有区字符或 emoji）。未设置时省略；线程自动标题带卡片图标且项目尚无图标时由控制面自动填入一次
        gitAuthorName:
          type: string
          description: 本项目 orb 的 git 提交身份覆盖（与 gitAuthorEmail 同时存在或同时缺省）
        gitAuthorEmail: { type: string }
        defaultBrowserProfileId:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileId'
          description: 新线程（新建 orb 时）缺省选用的浏览器 Profile（M8）；未设置时省略
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
        archivedAt: { $ref: '#/components/schemas/TimestampMs' }
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/Project' }
    ProjectCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        repoUrl: { type: string }
        baseBranch: { type: string }
        defaultProvider: { type: string }
        defaultOrbType: { type: string }
        setupScript: { type: string }
        resumeScript: { type: string }
        shallowClone: { type: boolean, default: false }
        color: { type: string }
        icon:
          type: string
          maxLength: 16
          description: 单个字形（一个字素，≤16 字节）；空串等同省略
        gitAuthorName:
          type: string
          description: 须与 gitAuthorEmail 同时给出；规则同 GitIdentity.name
        gitAuthorEmail:
          type: string
          description: 须与 gitAuthorName 同时给出；规则同 GitIdentity.email
        defaultBrowserProfileId:
          type: string
          description: '默认浏览器 Profile（`bpf_…`）；空串等同省略。不存在 → 404 `profile_not_found`'
    ProjectPatch:
      type: object
      description: 只修改出现的字段；可选字符串字段传空串表示清除
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        repoUrl: { type: string }
        baseBranch: { type: string }
        defaultProvider: { type: string }
        defaultOrbType: { type: string }
        setupScript: { type: string }
        resumeScript: { type: string }
        shallowClone: { type: boolean }
        color: { type: string }
        icon:
          type: string
          maxLength: 16
          description: 单个字形（一个字素，≤16 字节）；空串表示清除（之后可再被自动标题的卡片图标填入）
        gitAuthorName:
          type: string
          description: 须与 gitAuthorEmail 同时给出；两者都传空串表示清除项目覆盖
        gitAuthorEmail: { type: string }
        defaultBrowserProfileId:
          type: string
          description: '默认浏览器 Profile（`bpf_…`）；空串表示清除。不存在 → 404 `profile_not_found`'
        archived: { type: boolean }

    # ============================================================ 设置
    GitIdentity:
      type: object
      required: [name, email]
      description: orb 内 `git config --global user.name / user.email`；不得含换行或控制字符
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: 须包含 `@`
    GitIdentitySettings:
      type: object
      properties:
        identity: { $ref: '#/components/schemas/GitIdentity' }
    AvatarIdentity:
      type: object
      description: 头像（agent 头像与用户头像共用）；两个字段至多出现一个，都省略表示默认
      properties:
        avatarIcon:
          type: string
          maxLength: 64
          description: 内置图标字形（Nerd Font 私有区字符或 emoji）；空串等同省略
        avatarImage:
          type: string
          maxLength: 131072
          description: '`data:image/(png|webp|jpeg);base64,...`，前端先缩到 128×128；整串 ≤ 128KiB；空串等同省略'

    # ============================================================ provider（客户端视图）
    OrbType:
      type: object
      required: [name, cpus, memoryMB]
      properties:
        name: { type: string }
        cpus: { type: number }
        memoryMB: { type: integer }
    ProviderCapabilities:
      type: object
      required: [freeze, snapshot]
      properties:
        freeze: { type: boolean }
        snapshot: { type: boolean }
    Provider:
      type: object
      required: [id, name, online, orbTypes, createdAt]
      properties:
        id: { $ref: '#/components/schemas/ProviderId' }
        name: { type: string }
        driver: { $ref: '#/components/schemas/ProviderDriver' }
        capabilities: { $ref: '#/components/schemas/ProviderCapabilities' }
        orbTypes:
          type: array
          items: { $ref: '#/components/schemas/OrbType' }
        defaultType: { type: string }
        online:
          type: boolean
          description: 是否有实例持有未过期租约
        instanceId: { type: string }
        leaseUntil: { $ref: '#/components/schemas/TimestampMs' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        disabledAt: { $ref: '#/components/schemas/TimestampMs' }
    ProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: '#/components/schemas/Provider' }
    ProviderCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$' }
    ProviderCreateResponse:
      type: object
      required: [provider, token]
      properties:
        provider: { $ref: '#/components/schemas/Provider' }
        token:
          type: string
          description: '`opv_…`，只显示这一次'

    # ============================================================ 线程
    ModelRef:
      type: object
      required: [provider, id]
      properties:
        provider: { type: string }
        id: { type: string }
    ImageContent:
      type: object
      required: [type, data, mimeType]
      properties:
        type:
          type: string
          enum: [image]
        data:
          type: string
          description: base64
        mimeType: { type: string }
    ThreadExecutor:
      description: 线程执行位置
      oneOf:
        - $ref: '#/components/schemas/ThreadExecutorNewOrb'
        - $ref: '#/components/schemas/ThreadExecutorOrb'
      discriminator:
        propertyName: kind
        mapping:
          new_orb: '#/components/schemas/ThreadExecutorNewOrb'
          orb: '#/components/schemas/ThreadExecutorOrb'
    ThreadExecutorNewOrb:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [new_orb]
        provider:
          type: string
          description: provider 名称
        type:
          type: string
          description: orb 类型名
    ThreadExecutorOrb:
      type: object
      required: [kind, orbId]
      properties:
        kind:
          type: string
          enum: [orb]
        orbId: { $ref: '#/components/schemas/OrbId' }
    CreateThreadRequest:
      type: object
      required: [prompt, executor]
      properties:
        projectId: { $ref: '#/components/schemas/ProjectId' }
        prompt: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ImageContent' }
        executor: { $ref: '#/components/schemas/ThreadExecutor' }
        model: { $ref: '#/components/schemas/ModelRef' }
        thinkingLevel: { type: string }
        title: { type: string }
        labels:
          type: array
          items: { type: string }
        attachments:
          type: array
          maxItems: 20
          description: 已上传附件的 id（`POST attachments`）；建线程时绑定到新线程并投递到 orb（`$HOME/.oryn/attachments/<threadId>/<id>/<name>`）。`prompt`、`images`、`attachments` 至少其一非空
          items: { $ref: '#/components/schemas/AttachmentId' }
        browserProfileId:
          type: string
          description: |
            新 orb 选用的浏览器 Profile（M8；只对 `executor.kind = new_orb` 有效，挂到已有 orb 时给非空值 → 400 `invalid`）：
            省略 = 用项目的 `defaultBrowserProfileId`；空串 = 不用；`bpf_…` = 指定（不存在 → 404 `profile_not_found`）。
        profileMode:
          allOf:
            - $ref: '#/components/schemas/BrowserProfileMode'
          description: 选用方式，缺省 `exclusive`；没有解析出 Profile 时忽略
        spaceId:
          allOf:
            - $ref: '#/components/schemas/SpaceId'
          description: 新线程加入该 Space（M9；不存在 → 404 `space_not_found`）；未给 `projectId` 时取 Space 的项目
    Thread:
      type: object
      required: [id, title, titleSource, state, stateChangedAt, pinned, labels, unread, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ThreadId' }
        projectId: { $ref: '#/components/schemas/ProjectId' }
        orbId:
          allOf:
            - $ref: '#/components/schemas/OrbId'
          description: 所在 orb；orb 被删除后省略（只读浏览）
        title: { type: string }
        titleSource:
          type: string
          enum: [auto, user]
        state: { $ref: '#/components/schemas/ThreadState' }
        stateChangedAt: { $ref: '#/components/schemas/TimestampMs' }
        parentThreadId: { $ref: '#/components/schemas/ThreadId' }
        forkedFromEntryId: { type: string }
        leafEntryId: { type: string }
        model: { $ref: '#/components/schemas/ModelRef' }
        thinkingLevel: { type: string }
        color: { type: string }
        pinned: { type: boolean }
        labels:
          type: array
          items: { type: string }
        snoozedUntil: { $ref: '#/components/schemas/TimestampMs' }
        archivedAt: { $ref: '#/components/schemas/TimestampMs' }
        unread: { type: boolean }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
        lastMessageAt: { $ref: '#/components/schemas/TimestampMs' }
        childCount:
          type: integer
          description: 子线程（fork 产生）数量，侧边栏显示 `n/m` 用
        childDoneCount:
          type: integer
          description: 处于 `idle` 的子线程数量
        error:
          $ref: '#/components/schemas/ThreadError'
        activity:
          type: string
          maxLength: 120
          readOnly: true
          description: |
            线程 `working` 时 agent 最近一次工具调用的意图（工具调用的 `i` / `intent` 参数，缺省时取 path / pattern / command 摘要），
            单行、至多 120 字符；只在内存中维护（不落库，控制面重启后为空），离开 `working` 即省略。变化时随 index.patch 推送
        portalUrlTemplate:
          type: string
          description: |
            该线程的 portal 地址模板：线程短码已代入、保留 `{port}`（如 `https://t-3f9a1c0b7e2d-p{port}.orb.example.com/`）。
            控制面未配置 `portal_domain` 时省略。
          example: 'https://t-3f9a1c0b7e2d-p{port}.orb.example.com/'
        publicShares:
          type: integer
          minimum: 1
          readOnly: true
          description: 未撤销的公开分享数；为 0 时省略
        kind:
          allOf:
            - $ref: '#/components/schemas/ThreadKind'
          description: 线程种类（M9）；省略 = `work`
        spaceId:
          allOf:
            - $ref: '#/components/schemas/SpaceId'
          description: 所属 Space（M9）
        shippedAt:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: '标记为已交付的时间（M9，`PATCH {shipped: true}`）'
        schedule:
          allOf:
            - $ref: '#/components/schemas/ThreadScheduleSummary'
          description: 该线程的线程内定时（M9）；没有则省略
        scheduleRun:
          allOf:
            - $ref: '#/components/schemas/ThreadScheduleRun'
          description: 由「新建线程」定时创建时给出（M9）
    ThreadError:
      type: object
      description: '`state=error` 的原因（目前只有 orb 进入 `failed`；可 `POST threads/{id}/wake` 重试）'
      required: [kind, reason]
      properties:
        kind:
          type: string
          enum: [orb_failed]
        reason: { type: string }
    ThreadEnvelope:
      type: object
      required: [thread]
      properties:
        thread: { $ref: '#/components/schemas/Thread' }
    ThreadList:
      type: object
      required: [threads]
      properties:
        threads:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
    ThreadPatch:
      type: object
      description: 只修改出现的字段；`color` 传空串清除，`snoozedUntil` 传 0 清除
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        color: { type: string }
        pinned: { type: boolean }
        labels:
          type: array
          items: { type: string }
        archived: { type: boolean }
        snoozedUntil: { $ref: '#/components/schemas/TimestampMs' }
        unread: { type: boolean }
        spaceId:
          type: string
          description: 加入 Space（`spc_…`，不存在 → 404 `space_not_found`）；空串 = 移出 Space。只对 `kind = work` 的线程有效（M9）
        shipped:
          type: boolean
          description: '`true` 标记为已交付（记 `shippedAt`，未归档则同时归档）；`false` 清除标记（M9）'
    ForkThreadRequest:
      type: object
      required: [env]
      properties:
        entryId:
          type: string
          description: 从该条目分叉；缺省取当前叶子
        env:
          type: string
          description: '`copy` 连环境分叉（快照出副本 orb）；`share` 共用当前 orb'
          enum: [copy, share]
    Entry:
      type: object
      description: 会话 JSONL 的一行（已复制入库）
      required: [seq, file, entryId, type, payload]
      properties:
        seq:
          type: integer
          format: int64
          description: 线程内单调递增序号
        file:
          type: string
          description: 相对会话目录的 JSONL 文件路径
        entryId:
          type: string
          description: 行内 `id`；无 id 的行为合成 id `__title__` / `__session__`
        parentId: { type: string }
        type: { type: string }
        ts:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 行内 `timestamp` 换算的毫秒；无则省略
        payload:
