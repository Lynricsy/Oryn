      description: |
        定时的定义（创建、替换、预览共用）。时间字段：`kind = cron` 须给 `cron`（恰好 5 段，或 `@hourly @daily @midnight @weekly @monthly @yearly @annually`；
        不接受 `TZ=` / `CRON_TZ=` 前缀与 `@every`）；`kind = every` 须给 `every`（Go 时长串，≥`1m`、≤`8784h`、整秒）；`kind = once` 须给 `at`（不早于当前 60 秒）。
        `timezone` 为 IANA 名称，缺省 `UTC`；`endsAt` 须晚于当前。
        模式规则（违反即 400 `invalid_schedule`）：`POST /schedules` 必须给 `mode`；`thread` 必须给 `threadId` 且不得带
        `projectId` / `spaceId` / `role` / `model` / `thinkingLevel` / `provider` / `orbType` / `overlap` / `keepLast`；
        `new_thread` 的 `role` 与 `model` 至多给一个；
        `new_thread` 不得带 `threadId`，`name` 必填（1–80）；`PUT /schedules/{id}` 里 `mode` / `threadId` / `projectId` 若出现必须与现值相同；
        `PUT /threads/{id}/schedule` 隐含 `mode = thread`。
        `prompt` 里的占位符 `{{now}}` `{{date}}` `{{scheduled_at}}` `{{run_number}}` `{{last_run_at}}` 在投递时替换。
        安静结束：本次运行这段全由自动化投递的活动里，agent 的最后一条回复是 `[SILENT]`（整条，或独占第一行 / 最后一行；不区分大小写）时，
        该回合不置未读、不发完成通知，也不交给助手（仅工作线程；主线用 `stay_silent`）。
      required: [kind, prompt]
      properties:
        mode: { $ref: '#/components/schemas/ScheduleMode' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 仅 `thread`：目标线程
        name: { type: string, maxLength: 80 }
        kind: { $ref: '#/components/schemas/ScheduleKind' }
        cron: { type: string }
        every:
          type: string
          example: 30m
        at: { $ref: '#/components/schemas/TimestampMs' }
        timezone:
          type: string
          example: Asia/Shanghai
        endsAt: { $ref: '#/components/schemas/TimestampMs' }
        prompt:
          type: string
          maxLength: 20000
          description: 1–20000 字符（预览时可为空串）
        enabled:
          type: boolean
          description: 缺省 true；false 时保存为暂停（`pausedReason = user`）
        projectId:
          allOf:
            - $ref: '#/components/schemas/ProjectId'
          description: 仅 `new_thread`：新线程所在项目；省略 = 无项目
        spaceId:
          allOf:
            - $ref: '#/components/schemas/SpaceId'
          description: 仅 `new_thread`：新线程加入该 Space
        role:
          type: string
          description: |
            仅 `new_thread`：每次运行的新线程以该 omp 模型 role 开场（同 `CreateThreadRequest.role`）；去首尾空白后不超过 128 字节、不含控制字符。
            与 `model` 互斥；都省略 = omp 的默认模型。
        model:
          allOf:
            - $ref: '#/components/schemas/ModelRef'
          description: 仅 `new_thread`
        thinkingLevel:
          type: string
          description: 仅 `new_thread`
        provider:
          type: string
          description: 仅 `new_thread`：provider 名称（不得为 `@host`）；省略按建线程的回退链
        orbType:
          type: string
          description: 仅 `new_thread`：orb 类型名
        overlap:
          allOf:
            - $ref: '#/components/schemas/ScheduleOverlap'
          description: 仅 `new_thread`；缺省 `skip`
        keepLast:
          type: integer
          minimum: 1
          maximum: 50
          description: 仅 `new_thread`：只保留最近 N 个未归档的运行线程，更早且已静止、未置顶的自动归档（缺省 5）
        handToAssistant:
          type: boolean
          description: 仅 `new_thread`：交给助手——每次运行的结果合并进助手的主线，该运行的完成通知不单独推送；`thread` 模式带 true 即 400 `invalid_schedule`；缺省 false
        ifRev:
          type: integer
          format: int64
          description: |
            仅 `PUT /schedules/{id}` 与 `PUT /threads/{id}/schedule` 使用（其它入口忽略）：给出时只在定时当前 `rev` 等于它时才替换，否则 409 `schedule_conflict`。
            线程内定时：`0` = 只在该线程没有定时时新建；线程没有定时而给了非 0 值同样 409。省略 = 不做版本检查。
        gate:
          allOf:
            - $ref: '#/components/schemas/ScheduleGate'
          description: |
            运行前闸门；省略 = 不设（`POST` / `PUT` 整份替换，省略即去掉）。agent 定义时不能设置；agent 改写时忽略本字段、沿用现值。
    Schedule:
      type: object
      description: 定时（两种模式共用）。`thread` 模式下 `overlap` 恒为 `skip`、`keepLast` 恒为 5（无意义）
      required: [id, mode, name, kind, timezone, prompt, enabled, handToAssistant, runCount, failures, createdBy, createdAt, updatedAt, overlap, keepLast, openRuns, rev]
      properties:
        id: { $ref: '#/components/schemas/ScheduleId' }
        mode: { $ref: '#/components/schemas/ScheduleMode' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: '`thread` 模式的目标线程'
        projectId:
          allOf:
            - $ref: '#/components/schemas/ProjectId'
          description: '`new_thread` 模式的项目；省略 = 无项目'
        spaceId: { $ref: '#/components/schemas/SpaceId' }
        name:
          type: string
          description: '`thread` 模式可为空串'
        kind: { $ref: '#/components/schemas/ScheduleKind' }
        cron: { type: string }
        every:
          type: string
          description: 规范化的时长串（如 `30m0s`）
        at: { $ref: '#/components/schemas/TimestampMs' }
        timezone: { type: string }
        endsAt: { $ref: '#/components/schemas/TimestampMs' }
        prompt: { type: string }
        enabled: { type: boolean }
        role:
          type: string
          description: '`new_thread` 新线程开场的 omp 模型 role；省略 = 未指定'
        model: { $ref: '#/components/schemas/ModelRef' }
        thinkingLevel: { type: string }
        provider: { type: string }
        orbType: { type: string }
        overlap: { $ref: '#/components/schemas/ScheduleOverlap' }
        keepLast: { type: integer }
        handToAssistant:
          type: boolean
          description: 交给助手（只对 `new_thread` 有意义）
        gate: { $ref: '#/components/schemas/ScheduleGate' }
        pausedReason: { $ref: '#/components/schemas/SchedulePausedReason' }
        nextRunAt:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 省略 = 不会再触发（暂停或已结束）
        lastRunAt: { $ref: '#/components/schemas/TimestampMs' }
        runCount:
          type: integer
          format: int64
          description: 已触发次数（含跳过与手动触发）；也是下一次运行的序号减一
        failures:
          type: integer
          description: 连续失败次数
        createdBy: { $ref: '#/components/schemas/ScheduleCreatedBy' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
        lastRun: { $ref: '#/components/schemas/ScheduleRun' }
        openRuns:
          type: integer
          description: 未结束的运行数（`pending` / `running` / `needs_input`）
        rev:
          type: integer
          format: int64
          description: 定义版本：定义被替换、暂停 / 恢复、自动暂停或自动结束时 +1；按时触发不变。编辑后保存时作为 `ifRev` 带回
    ScheduleRunTrigger:
      type: string
      description: '`schedule` 按时；`catchup` 迟到 60 秒以上（含重启补跑，错过的合并为一次）；`manual` 手动触发'
      enum: [schedule, catchup, manual]
      x-enum-varnames: [ScheduleRunTriggerSchedule, ScheduleRunTriggerCatchup, ScheduleRunTriggerManual]
    ScheduleRunStatus:
      type: string
      enum: [pending, running, needs_input, completed, failed, skipped]
      x-enum-varnames: [ScheduleRunStatusPending, ScheduleRunStatusRunning, ScheduleRunStatusNeedsInput, ScheduleRunStatusCompleted, ScheduleRunStatusFailed, ScheduleRunStatusSkipped]
    ScheduleRun:
      type: object
      required: [id, scheduleId, trigger, scheduledFor, missed, startedAt, status]
      properties:
        id: { $ref: '#/components/schemas/ScheduleRunId' }
        scheduleId: { $ref: '#/components/schemas/ScheduleId' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: '`thread` 模式为目标线程；`new_thread` 模式为建出的线程（建出之前或创建失败时省略）'
        trigger: { $ref: '#/components/schemas/ScheduleRunTrigger' }
        scheduledFor: { $ref: '#/components/schemas/TimestampMs' }
        missed:
          type: integer
          description: 被合并掉的触发数
        startedAt: { $ref: '#/components/schemas/TimestampMs' }
        deliveredAt: { $ref: '#/components/schemas/TimestampMs' }
        finishedAt: { $ref: '#/components/schemas/TimestampMs' }
        status: { $ref: '#/components/schemas/ScheduleRunStatus' }
        error:
          type: string
          description: '如 `gate`（运行前闸门判定本次不必运行）、`overlap`、`overlap_cap`、`thread_archived`、`project_archived`、`deliver_timeout`、`interrupted`、`stale`、`aborted`（回合被中断）、`agent_exited`（agent 进程退出）、`outcome_unknown`（无法确认回合结果）、`thread_deleted`（线程被删除），或创建线程失败、回合出错的原因'
    ScheduleList:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items: { $ref: '#/components/schemas/Schedule' }
    ScheduleRunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/ScheduleRun' }
    SchedulePreview:
      type: object
      required: [next]
      properties:
        next:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/TimestampMs' }
    CoordinatorStatus:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason:
          type: string
          description: 不可用的原因（缺 omp、校验与 `core/source.json` 不符、沙箱条件不满足…）
        ompVersion: { type: string }
        sandbox:
          allOf:
            - $ref: '#/components/schemas/CoordinatorSandbox'
          description: 协调宿主至少成功启动过一次后才有
    CoordinatorSandbox:
      type: object
      required: [landlockAbi, network, pidNamespace, ipcScope, uid, seccomp]
      properties:
        landlockAbi: { type: integer }
        network:
          type: string
          description: '`namespace` 独立网络命名空间（只有回环）；`port` 共用宿主网络，由 Landlock 限制为只能连模型代理端口'
          enum: [namespace, port]
          x-enum-varnames: [SandboxNetworkNamespace, SandboxNetworkPort]
        pidNamespace: { type: boolean }
        ipcScope:
          type: boolean
          description: Landlock ABI ≥ 6 的信号与抽象 unix socket 作用域
        uid: { type: integer }
        seccomp: { type: boolean }
    AutomationAction:
      type: object
      description: 一条操作记录（协调者的宿主工具调用，或 orb 内 agent 经 `oryn` CLI 的调用；无论成败都记）
      required: [id, ts, actorKind, origin, action, summary, ok]
      properties:
        id: { $ref: '#/components/schemas/AutomationActionId' }
        ts: { $ref: '#/components/schemas/TimestampMs' }
        actorKind:
          type: string
          enum: [space, assistant, agent]
          x-enum-varnames: [ActorKindSpace, ActorKindAssistant, ActorKindAgent]
        actorThreadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 发起操作的对话 / 线程
        origin:
          type: string
          description: '`owner` 主人发起的回合；`auto` 自动化回合（定时、线程回报、agent 间消息触发）'
          enum: [owner, auto]
          x-enum-varnames: [OriginOwner, OriginAuto]
        action:
          type: string
          description: 工具名（M19 起全局助手有更多写类工具；经确认卡执行的记 `origin = owner`）。`api_call` 是全局助手经 `oryn` 工具执行的 REST 操作，`summary` 以 operationId 开头
          enum: [create_thread, send_message, archive_thread, set_schedule, delete_schedule, update_thread, abort_thread,
            set_thread_model, fork_thread, wake_thread, delete_thread, create_project, update_project, delete_project,
            create_space, update_space, delete_space, set_trigger, delete_trigger, pause_orb, wake_orb, delete_orb,
            write_thread_file, put_thread_file, write_project_config, delete_project_config, share_thread, revoke_share,
            share_portal, unshare_portal, publish_artifact, unpublish_artifact, create_box, start_box, stop_box, set_box_schedule,
            set_box_app_visibility, delete_box, api_call]
          x-enum-varnames: [ActionCreateThread, ActionSendMessage, ActionArchiveThread, ActionSetSchedule, ActionDeleteSchedule,
            ActionUpdateThread, ActionAbortThread, ActionSetThreadModel, ActionForkThread, ActionWakeThread, ActionDeleteThread,
            ActionCreateProject, ActionUpdateProject, ActionDeleteProject, ActionCreateSpace, ActionUpdateSpace, ActionDeleteSpace,
            ActionSetTrigger, ActionDeleteTrigger, ActionPauseOrb, ActionWakeOrb, ActionDeleteOrb, ActionWriteThreadFile,
            ActionPutThreadFile, ActionWriteProjectConfig, ActionDeleteProjectConfig, ActionShareThread, ActionRevokeShare,
            ActionSharePortal, ActionUnsharePortal, ActionPublishArtifact, ActionUnpublishArtifact, ActionCreateBox, ActionStartBox,
            ActionStopBox, ActionSetBoxSchedule, ActionSetBoxAppVisibility, ActionDeleteBox, ActionAPICall]
        targetThreadId: { $ref: '#/components/schemas/ThreadId' }
        scheduleId: { $ref: '#/components/schemas/ScheduleId' }
        summary:
          type: string
          maxLength: 500
          description: 消息 / 提示词的前 200 字符；定时为 `<name> · <kind> <spec> · <mode>`
        ok: { type: boolean }
        error:
          type: string
          description: 失败时的错误码
    AutomationActionList:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items: { $ref: '#/components/schemas/AutomationAction' }

    # ============================================================ 密钥与 agent 配置
    SecretMeta:
      type: object
      required: [name, mode, createdAt, updatedAt]
      properties:
        name: { type: string }
        mode: { $ref: '#/components/schemas/SecretMode' }
        hosts:
          type: array
          description: '`proxy` 模式下允许注入的主机（为空 = 按名称约定推导）'
          items: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
    SecretList:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items: { $ref: '#/components/schemas/SecretMeta' }
    SecretPut:
      type: object
      required: [value, mode]
      description: '`mode:"env"` 时名称必须匹配 `[A-Z_][A-Z0-9_]*`'
      properties:
        value: { type: string }
        mode: { $ref: '#/components/schemas/SecretMode' }
        hosts:
          type: array
          items: { type: string }
    ProjectSecret:
      type: object
      required: [name, mode, secret, createdAt, updatedAt]
      properties:
        name: { type: string }
        mode: { $ref: '#/components/schemas/SecretMode' }
        secret: { type: boolean, description: 'true = 保存后不可读（不给 `value`）；false = 普通环境变量' }
        value: { type: string, description: '只在 `secret:false` 时给出' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
    ProjectSecretList:
      type: object
      required: [secrets]
      properties:
        secrets:
          type: array
          items: { $ref: '#/components/schemas/ProjectSecret' }
    ProjectSecretPut:
      type: object
      required: [value, mode]
      properties:
        value: { type: string }
        mode: { $ref: '#/components/schemas/SecretMode' }
        secret: { type: boolean, default: true }
    AgentConfigFile:
      type: object
      required: [path, size, mode, sha256, updatedAt]
      properties:
        path: { type: string }
        size: { type: integer, format: int64 }
        mode:
          type: integer
          description: 文件权限（十进制表示的 Unix 权限位）
        sha256: { $ref: '#/components/schemas/Sha256' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
    AgentConfigFileList:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigFile' }
    AgentConfigWarning:
      type: object
      required: [path, kind, message]
      properties:
        path: { type: string }
        line: { type: integer }
        kind:
          type: string
          description: '`possible_secret`（非 models.yml 文件中形似密钥的串）、`env_fallback`（provider 走环境变量降级）等'
        message: { type: string }
    AgentConfigWriteResult:
      type: object
      required: [file, extractedSecrets, warnings]
      properties:
        file: { $ref: '#/components/schemas/AgentConfigFile' }
        extractedSecrets:
          type: array
          description: 本次从 models.yml 抽取进密钥库的密钥名
          items: { type: string }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigWarning' }
    AgentConfigImportResult:
      type: object
      required: [files, extractedSecrets, warnings]
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigFile' }
        extractedSecrets:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/AgentConfigWarning' }
    AgentConfigApplyStatus:
      type: object
      description: omp 配置在会话上的生效状态（M13）
      required: [threads, pendingReloads, push]
      properties:
        threads:
          type: array
          description: 需重启才能让配置生效的会话，按线程 id 排序
          items: { $ref: '#/components/schemas/AgentConfigRestartThread' }
        pendingReloads:
          type: integer
          description: 回合仍在进行、等会话静止才能 `reload_plugins` 的会话数
        push: { $ref: '#/components/schemas/AgentConfigPushState' }
    AgentConfigPushState:
      type: object
      description: |
        全局 omp-home 的下发进度。写入接口在应答之前就登记了待下发，所以写入成功之后读到 `pending=false`
        即表示这次写入已经下发完毕、会话级分类（`threads` / `pendingReloads`）也已落定。
      required: [pending, failed]
      properties:
        pending:
          type: boolean
          description: 有已接受但尚未下发完成的写入（防抖中或正在下发）
        appliedAt:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 最近一次下发完成的时间；从未下发过则省略
        failed:
          type: array
          description: 最近一次下发里失败的 orb（它们在下次 setup / resume 时同步）
          items: { $ref: '#/components/schemas/AgentConfigPushFailure' }
        error:
          type: string
          description: 最近一次下发整体失败的原因（没能读取配置、列出 orb 等）；成功则省略
    AgentConfigPushFailure:
      type: object
      required: [orbId, error]
      properties:
        orbId: { type: string }
        error: { type: string }
    AgentConfigRestartThread:
      type: object
      required: [threadId, kind, title, reasons, scheduled]
      properties:
        threadId: { type: string }
        kind: { $ref: '#/components/schemas/ThreadKind' }
        title: { type: string }
        reasons:
          type: array
          description: 需重启的原因：`disabledExtensions` 条目（如 `hook:pre:bash:bash.ts`）、`config.yml` 键名（点分路径）或文件路径
          items: { type: string }
        scheduled:
          type: boolean
          description: 已调用 restart-sessions，等会话静止后重启
    AgentConfigRestartResult:
      type: object
      required: [threadIds]
      properties:
        threadIds:
          type: array
          description: 已安排重启的线程（按 id 排序）
          items: { type: string }

    # ============================================================ 统计（M10）
    StatsGrain:
      type: string
      description: 时间粒度（按请求的 `tz` 取自然小时 / 日 / 周（周一为始）/ 月）
      enum: [hour, day, week, month]
    StatsFormat:
      type: string
      description: 响应格式；缺省 = `json`
      enum: [json, csv]
      x-enum-varnames: [StatsFormatJSON, StatsFormatCSV]
    UsageGroupBy:
      type: string
      description: '`total` 只给一组 `key = "total"`；`hour / day / week / month` 为时间桶；其余为维度'
      enum: [total, hour, day, week, month, model, thread, project, space, purpose]
    OrbGroupBy:
      type: string
      enum: [type, day, week, month, project, orb]
    OutputGroupBy:
      type: string
      enum: [day, week, month, project, space]
    UsageStat:
      type: object
      required: [key, requests, requestErrors, inputTokens, outputTokens, cacheReadTokens, cacheWriteTokens, costUsd, toolCalls, toolErrors, turns]
      properties:
        key:
          type: string
          description: |
            分组键：时间桶标签（`2026-11-14T13:00` / `2026-11-14` / `2026-W46` / `2026-11`）、`<provider>/<model>`、
            线程 id（已删线程为空串）、项目 id（无项目为空串）、Space id（无为空串）、用途（对话回合为空串）、
            `total`、折叠项 `__other__`
        label:
          type: string
          description: 显示名（线程标题、项目名、Space 名）
        start:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 仅时间桶：桶起点（已裁到窗口）
        requests:
          type: integer
          format: int64
          description: 请求数 = 用量事实行数（带 usage 的 assistant 消息 + model_usage 条目）
        requestErrors:
          type: integer
          format: int64
          description: '`stopReason = error` 的请求数（`aborted` 不算）'
        inputTokens: { type: integer, format: int64 }
        outputTokens: { type: integer, format: int64 }
        cacheReadTokens: { type: integer, format: int64 }
        cacheWriteTokens: { type: integer, format: int64 }
        costUsd:
          type: number
          format: double
          description: 美元（omp 按目录标价估算），含子 agent
        subagentCostUsd:
          type: number
          format: double
          description: 其中子 agent 的部分（已含在 `costUsd` 内，不要再加）
        avgTtftMs:
          type: number
          format: double
          description: 平均首 token 时间；没有样本时省略
        tokensPerSecond:
          type: number
          format: double
          description: 有时长的请求的输出 tokens / 时长；分母为 0 时省略
        toolCalls: { type: integer, format: int64 }
        toolErrors: { type: integer, format: int64 }
        turns:
          type: integer
          format: int64
          description: 回合数（主会话里的 user 消息）
    UsageSeriesPoint:
      type: object
      required: [key, start, total, groups]
      properties:
        key:
          type: string
          description: 时间桶标签
        start: { $ref: '#/components/schemas/TimestampMs' }
        total: { $ref: '#/components/schemas/UsageStat' }
        groups:
          type: array
          description: 只含非零分组；键与顶层 `groups` 一致
          items: { $ref: '#/components/schemas/UsageStat' }
    UsageStats:
      type: object
      required: [groupBy, from, to, tz, total, groups]
      properties:
        groupBy: { $ref: '#/components/schemas/UsageGroupBy' }
        from: { $ref: '#/components/schemas/TimestampMs' }
        to: { $ref: '#/components/schemas/TimestampMs' }
        tz:
          type: string
          description: 实际使用的 IANA 时区
        total:
          allOf:
            - $ref: '#/components/schemas/UsageStat'
          description: 全部分组（折叠前）之和，`key = "total"`
        groups:
          type: array
          items: { $ref: '#/components/schemas/UsageStat' }
        series:
          type: array
          description: 请求了 `series` 时给出（稠密）
          items: { $ref: '#/components/schemas/UsageSeriesPoint' }
    ToolStat:
      type: object
      required: [tool, calls, errors]
      properties:
        tool:
          type: string
          description: 工具名；`total` 为空串；折叠项为 `__other__`
        calls: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
    ToolSeriesPoint:
      type: object
      required: [key, start, calls, errors]
      properties:
        key: { type: string }
        start: { $ref: '#/components/schemas/TimestampMs' }
        calls: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
    ToolStats:
      type: object
      required: [from, to, tz, total, tools]
      properties:
        from: { $ref: '#/components/schemas/TimestampMs' }
        to: { $ref: '#/components/schemas/TimestampMs' }
        tz: { type: string }
        total: { $ref: '#/components/schemas/ToolStat' }
        tools:
          type: array
          items: { $ref: '#/components/schemas/ToolStat' }
        series:
          type: array
          items: { $ref: '#/components/schemas/ToolSeriesPoint' }
    OrbStat:
      type: object
      required: [key, orbs, runningMs, frozenMs, stoppedMs, setupMs, spawns, snapshotSpawns, freezes, stops, wakes, failures]
      properties:
        key:
          type: string
          description: 类型名 / 时间桶标签 / 项目 id（无项目为空串）/ orb id；`total` 为 `total`
        label:
          type: string
          description: 项目名；`groupBy=orb` 时为它第一个线程的标题
        start:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 仅时间桶
        type:
          type: string
          description: '`groupBy=type` / `orb` 时给出'
        cpus: { type: integer }
        memoryMB: { type: integer }
        orbs:
          type: integer
          description: 窗口内存在过的 orb 数
        runningMs:
          type: integer
          format: int64
          description: '处于 `connecting / setting_up / resuming / ready / freezing / stopping` 的时长'
        frozenMs: { type: integer, format: int64 }
        stoppedMs: { type: integer, format: int64 }
        setupMs:
          type: integer
          format: int64
          description: 处于 `setting_up` / `resuming` 的时长（已含在 `runningMs` 内）
        spawns: { type: integer }
        snapshotSpawns:
          type: integer
          description: 窗口内创建且由快照启动（`snapshot_of` 非空）的 orb 数
        freezes: { type: integer }
        stops: { type: integer }
        wakes: { type: integer }
        failures: { type: integer }
    OrbSetupStats:
      type: object
      description: '口径：`phase = setup` 且真正运行了脚本（`setup_ran = 1`）的记录；`resume*` 为 `phase = resume` 的记录'
      required: [runs, failures, slowRuns, resumeRuns, resumeFailures]
      properties:
        runs: { type: integer }
        failures: { type: integer }
        slowRuns:
          type: integer
          description: 耗时 ≥ 120000 ms 的次数
        resumeRuns: { type: integer }
        resumeFailures: { type: integer }
        p50Ms: { type: integer, format: int64 }
        p95Ms: { type: integer, format: int64 }
        maxMs: { type: integer, format: int64 }
    OrbStats:
      type: object
      required: [groupBy, from, to, tz, total, groups, setup]
      properties:
        groupBy: { $ref: '#/components/schemas/OrbGroupBy' }
        from: { $ref: '#/components/schemas/TimestampMs' }
        to: { $ref: '#/components/schemas/TimestampMs' }
        tz: { type: string }
        total: { $ref: '#/components/schemas/OrbStat' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/OrbStat' }
        setup: { $ref: '#/components/schemas/OrbSetupStats' }
    OrbTimelineSegment:
      type: object
      required: [from, to, state]
      properties:
        from: { $ref: '#/components/schemas/TimestampMs' }
        to: { $ref: '#/components/schemas/TimestampMs' }
        state: { $ref: '#/components/schemas/OrbState' }
        reason:
          type: string
          description: 仅 `failed`：事件的 `detail.reason`（没有则 `detail.error`）
    OrbTimeline:
      type: object
      required: [orbId, from, to, segments, truncated]
      properties:
        orbId: { $ref: '#/components/schemas/OrbId' }
        from: { $ref: '#/components/schemas/TimestampMs' }
        to: { $ref: '#/components/schemas/TimestampMs' }
        segments:
          type: array
          description: 相邻同状态已合并；末段截到「现在」
          items: { $ref: '#/components/schemas/OrbTimelineSegment' }
        truncated:
          type: boolean
          description: 超过 2000 段时为真（只给前 2000 段）
    OutputStat:
      type: object
      required: [key, threadsCreated, threadsShipped, threadsArchived, shippedCostUsd, commits, turns]
      properties:
        key:
          type: string
          description: 时间桶标签 / 项目 id / Space id（无为空串）；`total` 为 `total`
        label: { type: string }
        start: { $ref: '#/components/schemas/TimestampMs' }
        threadsCreated: { type: integer, format: int64 }
        threadsShipped: { type: integer, format: int64 }
        threadsArchived:
          type: integer
          format: int64
          description: 归档且未交付的线程数
        shippedCostUsd:
          type: number
          format: double
          description: 窗口内交付的线程的全生命周期成本之和
        commits:
          type: integer
          format: int64
          description: 相对基线的提交数（按 sha 去重）
        turns: { type: integer, format: int64 }
    OutputStats:
      type: object
      required: [groupBy, from, to, tz, total, groups]
      properties:
        groupBy: { $ref: '#/components/schemas/OutputGroupBy' }
        from: { $ref: '#/components/schemas/TimestampMs' }
        to: { $ref: '#/components/schemas/TimestampMs' }
        tz: { type: string }
        total: { $ref: '#/components/schemas/OutputStat' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/OutputStat' }
    StatsBackfill:
      type: object
      description: 历史回填进度（线程数）；完成后不出现
      required: [done, total]
      properties:
        done: { type: integer, format: int64 }
        total: { type: integer, format: int64 }
    StatsRetention:
      type: object
      description: 保留期（毫秒）；0 = 永久
      required: [samplesMs, eventsMs, usageMs]
      properties:
        samplesMs:
          type: integer
          format: int64
          description: orb 资源采样
        eventsMs:
          type: integer
          format: int64
          description: 已删除 orb 的事件与 setup 记录、预算告警账本
        usageMs:
          type: integer
          format: int64
          description: 用量 / 工具调用 / 回合事实行
    StatsMeta:
      type: object
      required: [now, factsVersion, retention]
      properties:
        now: { $ref: '#/components/schemas/TimestampMs' }
        factsVersion:
          type: integer
          description: 已完成的事实行版本（回填完成前为旧值或 0）
        earliestTs:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 最早的用量事实时间；没有用量时省略
        backfill: { $ref: '#/components/schemas/StatsBackfill' }
        retention: { $ref: '#/components/schemas/StatsRetention' }
    Budget:
      type: object
      required: [warnPct, timezone, enabled]
      properties:
        dailyUsd:
          type: number
          format: double
          minimum: 0.01
          description: 日上限（美元）；省略 = 不设
        monthlyUsd:
          type: number
          format: double
          minimum: 0.01
          description: 月上限（美元）；省略 = 不设
        warnPct:
          type: integer
          minimum: 0
          maximum: 99
          description: 预警百分比；0 = 不预警
        timezone:
          type: string
          description: 划分自然日 / 月的 IANA 时区
        enabled: { type: boolean }
    BudgetLevel:
      type: string
      enum: [none, warn, over]
    BudgetPeriod:
      type: object
      required: [key, from, to, spentUsd, level]
      properties:
        key:
          type: string
          description: 周期键（`2026-11-14` / `2026-11`）
        from: { $ref: '#/components/schemas/TimestampMs' }
        to: { $ref: '#/components/schemas/TimestampMs' }
        spentUsd: { type: number, format: double }
        limitUsd:
          type: number
          format: double
          description: 该周期的上限；未设时省略
        level: { $ref: '#/components/schemas/BudgetLevel' }
    BudgetStatus:
      type: object
      required: [budget, day, month]
      properties:
        budget: { $ref: '#/components/schemas/Budget' }
        day: { $ref: '#/components/schemas/BudgetPeriod' }
        month: { $ref: '#/components/schemas/BudgetPeriod' }

    # ============================================================ 客户端 WebSocket
    # ============================================================ orb 文件 / 改动 / 附件（M3）
    FsRoots:
      type: object
      required: [home, workdir]
      properties:
        home:
          type: string
          description: orb 内 `$HOME` 的绝对路径
        workdir:
          type: string
          description: orb 当前工作目录的绝对路径（有仓库时为检出目录）
    FsEntry:
      type: object
      required: [path, name, type, size, mtime, mode]
      properties:
        path:
          type: string
          description: 绝对路径
        name: { type: string }
        type:
          type: string
          description: '`Lstat` 的类型；符号链接为 `symlink`，其指向见 `target` / `targetType`'
          enum: [file, dir, symlink, other]
        size:
          type: integer
          format: int64
        mtime: { $ref: '#/components/schemas/TimestampMs' }
        mode:
          type: integer
          description: Unix 权限位（十进制，如 420 = 0644）
        target:
          type: string
          description: 符号链接的目标（`readlink` 原文）
        targetType:
          type: string
          description: 符号链接最终指向的类型；悬空或指向 `$HOME` 之外时省略
          enum: [file, dir]
        etag:
          type: string
          description: '`"<mtimeUnixNano>-<size>"`（含引号，可直接用作 `If-Match`）；仅文件'
        mime:
          type: string
          description: 仅 `stat` 返回：按扩展名推断，缺省按内容嗅探
        text:
          type: boolean
          description: 仅 `stat` 返回：前 8KiB 无 NUL 且为合法 UTF-8（允许末尾截断的码点）
    FsListing:
      type: object
      required: [path, entries, truncated]
      properties:
        path:
          type: string
          description: 目录的绝对路径
        entries:
          type: array
          maxItems: 5000
          description: 目录在前、按名不分大小写排序
          items: { $ref: '#/components/schemas/FsEntry' }
        truncated:
          type: boolean
          description: 超过 5000 条被截断
    FsPathRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: 同 `FsPathQuery` 的路径规则
    FsRenameRequest:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }
        overwrite:
          type: boolean
          default: false
          description: 目标已存在时是否替换
    GitScope:
      type: string
      description: |
        改动范围：`all` 基线 merge-base → 工作区（无基线时等同 `uncommitted`）；
        `uncommitted` HEAD → 工作区；`commit` 单个提交（`<sha>^1` → `<sha>`，须带 `commit`）。
      enum: [all, uncommitted, commit]
      default: all
    GitBase:
      type: object
      required: [name, ref, mergeBase, approximate]
      properties:
        name:
          type: string
          description: 基线分支名（如 `main`）
        ref:
          type: string
          description: 解析到的引用（`refs/remotes/origin/<name>` 或 `refs/heads/<name>`）
        mergeBase:
          type: string
          description: HEAD 与基线的 merge-base 提交 sha
        approximate:
          type: boolean
          description: merge-base 不可得（浅克隆 / 无共同祖先）时为真，`mergeBase` 取基线引用本身的 sha
    GitFileChange:
      type: object
      required: [path, status, binary, staged]
      properties:
        path:
          type: string
          description: 仓库内相对路径（重命名 / 复制后的路径）
        oldPath:
          type: string
          description: 重命名 / 复制前的路径
        status:
          type: string
          enum: [added, modified, deleted, renamed, copied, typechange, untracked, conflicted]
        additions:
          type: integer
          description: 新增行数；二进制或过大的未跟踪文件省略
        deletions:
          type: integer
          description: 删除行数；二进制或过大的未跟踪文件省略
        binary: { type: boolean }
        staged:
          type: string
          description: 暂存状态（仅 to 为工作区的范围有意义；`commit` 范围恒为 `none`）
          enum: [none, partial, full]
    GitStatus:
      type: object
      required: [repo, scope, files, truncated]
      properties:
        repo:
          type: boolean
          description: '`root` 是否位于 git 仓库内；为假时只有 `candidates`'
        root:
          type: string
          description: 仓库顶层目录的绝对路径
        candidates:
          type: array
          maxItems: 20
          description: '`repo=false` 时 `root` 下一层含 `.git` 的子目录（绝对路径）'
          items: { type: string }
        branch:
          type: string
          description: 当前分支名；分离 HEAD 时省略
        head:
          type: string
          description: HEAD 提交 sha；未出生时省略
        base: { $ref: '#/components/schemas/GitBase' }
        scope: { $ref: '#/components/schemas/GitScope' }
        files:
          type: array
          maxItems: 2000
          items: { $ref: '#/components/schemas/GitFileChange' }
        truncated:
          type: boolean
          description: 超过 2000 个文件被截断
    GitFileDiff:
      type: object
      required: [path, kind, patch, truncated]
      properties:
        path: { type: string }
        oldPath: { type: string }
        kind:
          type: string
          description: '`text` 有 patch；`binary` 二进制（patch 为空）；`large` 未跟踪且 >4MiB（patch 为空）'
          enum: [text, binary, large]
        patch:
          type: string
          description: unified diff（`-U3`），≤1MiB
        truncated:
          type: boolean
          description: patch 超过 1MiB，在最后一个换行处截断
    GitCommit:
      type: object
      required: [sha, shortSha, subject, authorName, authorEmail, ts]
      properties:
        sha: { type: string }
        shortSha: { type: string }
        subject: { type: string }
        authorName: { type: string }
        authorEmail: { type: string }
        ts:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 作者时间
    GitCommitList:
      type: object
      required: [commits, truncated]
      properties:
        commits:
          type: array
          maxItems: 200
          description: 新到旧
          items: { $ref: '#/components/schemas/GitCommit' }
        truncated:
          type: boolean
          description: 超出 `limit` 被截断
    GitPathsRequest:
      type: object
      required: [paths]
      properties:
        root:
          type: string
          description: 同 `GitRootQuery`
        paths:
          type: array
          minItems: 1
          description: 仓库内相对路径；拒绝空串、NUL、绝对路径与 `..` 段
          items: { type: string }
    Attachment:
      type: object
      required: [id, name, mime, size, sha256, createdAt]
      properties:
        id: { $ref: '#/components/schemas/AttachmentId' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 绑定的线程；尚未绑定时省略
        name:
          type: string
          description: 净化后的文件名（≤200 字节）
        mime: { type: string }
        size:
          type: integer
          format: int64
        sha256: { $ref: '#/components/schemas/Sha256' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        publicUrl:
          type: string
          description: 已发布时的公开 URL（`<public_url>/f/<slug>/<文件名>`）；未发布省略
    AttachmentList:
      type: object
      required: [attachments]
      properties:
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
    OrbAttachmentEnsureRequest:
      type: object
      description: 仅 orbd 本机 API 使用（`POST /attachments/ensure`，经 `fs` 流），不经 REST 暴露
      required: [threadId, id, name, size, sha256]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id: { $ref: '#/components/schemas/AttachmentId' }
        name: { type: string }
        size:
          type: integer
          format: int64
        sha256: { $ref: '#/components/schemas/Sha256' }
    OrbAttachmentEnsureResult:
      type: object
      description: 仅 orbd 本机 API 使用（`POST /attachments/ensure` 与 `PUT /attachments/file` 的结果）
      required: [present, path]
      properties:
        present:
          type: boolean
          description: '`path` 处已是大小相同的普通文件'
        path:
          type: string
          description: '`$HOME/.oryn/attachments/<threadId>/<id>/<safeName>` 的绝对路径'

    # ============================================================ 公开分享与文件发布（M5）
    ShareMode:
      type: string
      description: '`snapshot` 固化创建时刻扫描过的条目集合与标题（`untilSeq` + 当时的叶子）；`live` 持续跟随当前叶子'
      enum: [live, snapshot]
      # 显式常量名：避免与 JobOp 的 `snapshot` 冲突导致 oapi-codegen 给既有常量加前缀
      x-enum-varnames: [ShareModeLive, ShareModeSnapshot]
    ThreadShare:
      type: object
      required: [id, threadId, threadTitle, mode, slug, url, createdAt, findings]
      properties:
        id: { $ref: '#/components/schemas/ShareId' }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        threadTitle: { type: string }
        mode: { $ref: '#/components/schemas/ShareMode' }
        slug: { $ref: '#/components/schemas/ShareSlug' }
        url:
          type: string
          description: '`<public_url>/s/<slug>`'
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        untilSeq:
          type: integer
          format: int64
          description: 仅快照：创建时线程的 `last_seq`
        findings:
          type: integer
          description: 创建时确认过的密钥扫描命中数
    ThreadShareList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/ThreadShare' }
    CreateThreadShareRequest:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/ShareMode' }
        acknowledgeFindings:
          type: boolean
          default: false
          description: 已检查扫描命中项，仍然分享
    ShareFindingRule:
      type: string
      description: 密钥扫描规则名（规则表见 docs/protocol.md M5 节）
      enum:
        - vault_secret
        - private_key
        - api_key_sk
        - github_token
        - aws_access_key
        - google_api_key
        - slack_token
        - jwt
        - oryn_token
        - bearer_header
        - url_credentials
      x-enum-varnames:
        - ShareFindingRuleVaultSecret
        - ShareFindingRulePrivateKey
        - ShareFindingRuleApiKeySk
        - ShareFindingRuleGithubToken
        - ShareFindingRuleAwsAccessKey
        - ShareFindingRuleGoogleApiKey
        - ShareFindingRuleSlackToken
        - ShareFindingRuleJwt
        - ShareFindingRuleOrynToken
        - ShareFindingRuleBearerHeader
        - ShareFindingRuleUrlCredentials
    ShareFinding:
      type: object
      description: |
        一个 `(规则, 条目)` 的命中。标题与附件名的命中不对应条目：`entryId` 分别为 `__title__` 与 `attachment:<附件 id>`，`seq` 为 0
      required: [rule, seq, entryId, preview, count]
      properties:
        rule: { $ref: '#/components/schemas/ShareFindingRule' }
        secretName:
          type: string
          description: 仅 `vault_secret`：命中的密钥名
        seq:
          type: integer
          format: int64
        entryId: { type: string }
        role:
          type: string
          description: 所在消息的角色（`user` / `assistant` / `toolResult` …）；非消息条目省略
        tool:
          type: string
          description: 所在工具结果的工具名
        preview:
          type: string
          description: 脱敏片段：前 4 字符 + `…` + 后 2 字符；命中短于 12 字符时只留前 2 字符 + `…`
        count:
          type: integer
          description: 该条目内同一规则的命中次数
    ShareScan:
      type: object
      required: [findings, scanned, truncated]
      properties:
        findings:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ShareFinding' }
        scanned:
          type: integer
          description: 扫描过的条目数
        truncated:
          type: boolean
          description: 命中超过 200 项，只返回前 200 项
    ShareScanConflict:
      type: object
      description: '`createThreadShare` 的 409 体：扫描有命中且未确认'
      required: [code, message, scan]
      properties:
        code:
          type: string
          enum: [secrets_found]
          x-enum-varnames: [ShareScanConflictCodeSecretsFound]
        message: { type: string }
        scan: { $ref: '#/components/schemas/ShareScan' }
    PublishedFile:
      type: object
      required: [id, attachmentId, name, mime, size, url, createdAt]
      properties:
        id: { $ref: '#/components/schemas/PublishedFileId' }
        attachmentId: { $ref: '#/components/schemas/AttachmentId' }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        name: { type: string }
        mime: { type: string }
        size:
          type: integer
          format: int64
        url:
          type: string
          description: '`<public_url>/f/<slug>/<encodeURIComponent(name)>`'
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
    ShareOverview:
      type: object
      required: [shares, files]
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/ThreadShare' }
        files:
          type: array
          items: { $ref: '#/components/schemas/PublishedFile' }
    PublishOrbFileRequest:
      type: object
      required: [path, threadId]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: orb 内路径（同 `FsPathQuery` 的路径规则）
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 附件归属的线程（须在该 orb 上）
    PublicAttachment:
      type: object
      required: [id, name, size, mime]
      properties:
        id: { $ref: '#/components/schemas/AttachmentId' }
        name: { type: string }
        size:
          type: integer
          format: int64
        mime: { type: string }
        url:
          type: string
          description: 仅已发布：公开 URL
    PublicShare:
      type: object
      description: 公开分享的元数据。不含线程 id、orb、项目、标签、模型配置
      required: [mode, title, sharedAt, threadCreatedAt, lastSeq, transcriptRev, attachments]
      properties:
        mode: { $ref: '#/components/schemas/ShareMode' }
        title:
          type: string
          description: 线程标题（空则 `Untitled`）；快照为创建时的标题
        state:
          allOf:
            - $ref: '#/components/schemas/ThreadState'
          description: 仅实时：线程当前状态
        sharedAt: { $ref: '#/components/schemas/TimestampMs' }
        threadCreatedAt: { $ref: '#/components/schemas/TimestampMs' }
        lastSeq:
          type: integer
          format: int64
          description: 范围上界（快照 = `untilSeq`；实时 = 线程当前 `last_seq`）
        leafEntryId:
          type: string
          description: 范围的叶子（快照 = 创建时的叶子；实时 = 当前叶子）
        transcriptRev: { type: integer, format: int64 }
        attachments:
          type: array
          description: |
            公开的附件元数据：已发布的附件，以及被范围内公开（过滤后）条目引用的附件（按附件 id 匹配）；
            快照只考虑分享创建时已存在的附件。其余附件的名字与元数据不出控制面
          items: { $ref: '#/components/schemas/PublicAttachment' }
    PublicEntryPage:
      type: object
      required: [entries, hasMore, lastSeq]
      properties:
        entries:
          type: array
          description: |
            公开过滤后的条目。`custom` 条目只保留 Oryn 的模型选择来源记录（`customType = oryn-model-source`，M9.6），payload 为
            `{"type":"custom","customType":"oryn-model-source","data":{v, source, model, role?, alias?}}`，其中 `role` / `alias`
            是每个分享各不相同的不透明键（对应 `PublicRoleIdentity.key`）；其它 `custom` 条目的 payload 清空为 `{"type":"custom"}`。
          items: { $ref: '#/components/schemas/Entry' }
        hasMore:
          type: boolean
          description: 为假时已到达范围末尾
        lastSeq:
          type: integer
          format: int64
          description: 范围上界（同 `PublicShare.lastSeq`）
        leafEntryId: { type: string }
    PublicRoleIdentity:
      type: object
      required: [key, role]
      properties:
        key:
          type: string
          description: 公开条目里来源记录的 `role` / `alias` 字段取值（每个分享各不相同的不透明键）
        role:
          type: string
          description: role id（显示名回落用）
        name:
          type: string
          description: '`modelTags.<role>.name`；没有则省略'
        avatarIcon: { type: string, maxLength: 64 }
        avatarImage: { type: string, maxLength: 131072 }
    PublicShareIdentity:
      type: object
      required: [roles]
      description: 分享页的身份。快照分享 = 创建时固化；实时分享 = 按当前设置现算。只含这段对话里用到且设了头像的 role
      properties:
        agent:
          allOf:
            - $ref: '#/components/schemas/AgentIdentity'
          description: 默认 Agent 身份；名字与头像都未设置时省略（页面用默认品牌标）
        roles:
          type: array
          items: { $ref: '#/components/schemas/PublicRoleIdentity' }
        agents:
          type: array
          description: |
            这段对话里 `task` 工具调用用到、且设了自定义头像的子 agent（按名字明文对应：agent 名本就出现在公开的工具卡片里）。
            没设头像的 agent 不出现，页面用各自的默认字形。快照分享同样在创建时固化；升级前创建的快照省略本字段。
          items: { $ref: '#/components/schemas/PublicAgentIdentity' }
    PublicAgentIdentity:
      type: object
      required: [name]
      properties:
        name: { type: string }
        avatarIcon: { type: string, maxLength: 64 }
        avatarImage: { type: string, maxLength: 131072 }

    # ============================================================ 通知（M5）
    NotificationKind:
      type: string
      description: '`done` 回合完成、`input` 等待作答、`error` 出错、`budget` 预算告警（不属于任何线程）；也是渠道 `events` 的元素'
      enum: [done, input, error, budget]
    NotificationDeliveryTarget:
      type: string
      description: 投递目标（`apns` / `fcm` 为 M7 预留）
      enum: [telegram, webhook, ntfy, bark, webpush, apns, fcm]
    NotificationDeliveryStatus:
      type: string
      enum: [pending, sent, failed]
    NotificationDelivery:
      type: object
      required: [target, status, attempts, at]
      properties:
        target: { $ref: '#/components/schemas/NotificationDeliveryTarget' }
        channelId: { $ref: '#/components/schemas/NotificationChannelId' }
        channelName: { type: string }
        status: { $ref: '#/components/schemas/NotificationDeliveryStatus' }
        attempts: { type: integer }
        at:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: '`pending` = 下次尝试时间；`sent` / `failed` = 完成时间'
        error:
          type: string
          description: 最近一次失败原因（≤500 字符）
    Notification:
      type: object
      required: [id, kind, title, body, url, createdAt, deliveries]
      properties:
        id: { $ref: '#/components/schemas/NotificationId' }
        kind: { $ref: '#/components/schemas/NotificationKind' }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 所属线程；系统通知（`budget`，以及定时无法建出线程 / 被自动暂停的 `error`）没有线程，省略
        title: { type: string }
        body: { type: string }
        url:
          type: string
          description: 站内路径。有线程为 `/t/<threadId>`；没有线程为该通知的落点（`/stats/usage`、`/settings/automations`）
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        readAt: { $ref: '#/components/schemas/TimestampMs' }
        resolvedAt:
          allOf:
            - $ref: '#/components/schemas/TimestampMs'
          description: 仅 `input`：请求已被作答 / 取消 / 随 agent 重启消失
        deliveries:
          type: array
          items: { $ref: '#/components/schemas/NotificationDelivery' }
        quickAnswer:
          allOf:
            - $ref: '#/components/schemas/NotificationQuickAnswer'
          description: |
            仅未解决、属于线程、可一触作答的 `input`（判定同 `POST notifications/{id}/answer`）：完整问题与选项，
            客户端可就地以选项作答。不受推送正文 300 字符上限约束（站内能显示完整问题）。
            请求在别处作答后已加载的列表不会收到更新：客户端应结合线程状态判断是否仍待作答，作答得 409 `input_resolved` 时提示已在别处作答。
    NotificationQuickAnswer:
      type: object
      required: [question, options]
      properties:
        question:
          type: string
          description: 完整问题（保留多行；confirm 附上说明）
        options:
          type: array
          minItems: 2
          maxItems: 3
          items: { $ref: '#/components/schemas/NotificationQuickOption' }
    NotificationQuickOption:
      type: object
      required: [i, label]
      properties:
        i:
          type: integer
          description: 选项序号（从 0 起），作答时作为 `option` 回传
        label: { type: string }
        role:
          type: string
          enum: [yes, no]
          description: 仅 confirm：客户端按界面语言显示「是 / 否」
    NotificationList:
      type: object
      required: [notifications, unread]
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unread:
          type: integer
          description: 全部未读通知数
    NotificationsReadRequest:
      type: object
      description: '`id` 与 `threadId` 至多给一个；给出时不能为空串（都给或空串 → 400 `invalid_request`）；都省略 = 全部'
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 只标该线程的通知
        id:
          allOf:
            - $ref: '#/components/schemas/NotificationId'
          description: 只标这一条（没有线程的通知按 id 已读）；不存在或已读同样回 204
    NotificationAnswerRequest:
      type: object
      required: [option]
      properties:
        option:
          type: integer
          minimum: 0
          maximum: 2
          description: 选项序号（从 0 起），即推送载荷 `actions[].i`
    NotificationAnswerResult:
      type: object
      required: [threadId]
      properties:
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 被作答请求所在的线程
    NotificationChannelKind:
      type: string
      enum: [telegram, webhook, ntfy, bark]
    NotificationLocale:
      type: string
      description: 渠道消息的固定文案语言
      enum: [zh-CN, en]
      x-enum-varnames: [NotificationLocaleZhCN, NotificationLocaleEn]
    TelegramChannelConfig:
      type: object
      required: [botToken]
      properties:
        botToken: { type: string, minLength: 1 }
        apiBase:
          type: string
          description: Bot API 根地址，默认 `https://api.telegram.org`（自建 Bot API 服务器与测试用）
    WebhookChannelConfig:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1 }
        secret:
          type: string
          description: '给出时请求带 `X-Oryn-Signature: sha256=<hex(HMAC-SHA256(secret, body))>`'
        headers:
          type: object
          maxProperties: 16
          description: 自定义请求头（名不得是 `Host` / `Content-Length` / `Content-Type`）
          additionalProperties: { type: string }
    NtfyChannelConfig:
      type: object
      required: [topic]
      properties:
        server:
          type: string
          description: 默认 `https://ntfy.sh`
        topic: { type: string, minLength: 1 }
        token:
          type: string
          description: '给出时带 `Authorization: Bearer <token>`'
    BarkChannelConfig:
      type: object
      required: [deviceKey]
      properties:
        server:
          type: string
          description: 默认 `https://api.day.app`
        deviceKey: { type: string, minLength: 1 }
    NotificationChannelInput:
      type: object
      description: 恰好给出与 `kind` 同名的一个配置对象
      required: [kind, name]
      properties:
        kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        name: { type: string, minLength: 1, maxLength: 80 }
        enabled:
          type: boolean
          default: true
        events:
          type: array
          description: 缺省 = 全选
          items: { $ref: '#/components/schemas/NotificationKind' }
        locale: { $ref: '#/components/schemas/NotificationLocale' }
        telegram: { $ref: '#/components/schemas/TelegramChannelConfig' }
        webhook: { $ref: '#/components/schemas/WebhookChannelConfig' }
        ntfy: { $ref: '#/components/schemas/NtfyChannelConfig' }
        bark: { $ref: '#/components/schemas/BarkChannelConfig' }
    NotificationChannelPatch:
      type: object
      description: 只修改出现的字段；给出与渠道 `kind` 同名的配置对象 = 整体替换该渠道配置
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        enabled: { type: boolean }
        events:
          type: array
          items: { $ref: '#/components/schemas/NotificationKind' }
        locale: { $ref: '#/components/schemas/NotificationLocale' }
        telegram: { $ref: '#/components/schemas/TelegramChannelConfig' }
        webhook: { $ref: '#/components/schemas/WebhookChannelConfig' }
        ntfy: { $ref: '#/components/schemas/NtfyChannelConfig' }
        bark: { $ref: '#/components/schemas/BarkChannelConfig' }
    NotificationChannelTelegram:
      type: object
      required: [botUsername, linked]
      properties:
        botUsername: { type: string }
        linked:
          type: boolean
          description: 已绑定私聊
        chatTitle: { type: string }
    NotificationChannelLastDelivery:
      type: object
      required: [status, at]
      properties:
        status: { $ref: '#/components/schemas/NotificationDeliveryStatus' }
        at: { $ref: '#/components/schemas/TimestampMs' }
        error: { type: string }
    NotificationChannel:
      type: object
      description: 机密字段（token、secret、topic、deviceKey、URL 全文）只写不读
      required: [id, kind, name, enabled, events, locale, summary, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/NotificationChannelId' }
        kind: { $ref: '#/components/schemas/NotificationChannelKind' }
        name: { type: string }
        enabled: { type: boolean }
        events:
          type: array
          items: { $ref: '#/components/schemas/NotificationKind' }
        locale: { $ref: '#/components/schemas/NotificationLocale' }
        summary:
          type: string
          description: 脱敏展示串（如 `@bot_name`、`hooks.example.com/…ab12`、`ntfy.sh/…9f3c`、`api.day.app`）
        telegram: { $ref: '#/components/schemas/NotificationChannelTelegram' }
        lastError: { type: string }
        lastDelivery: { $ref: '#/components/schemas/NotificationChannelLastDelivery' }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        updatedAt: { $ref: '#/components/schemas/TimestampMs' }
    NotificationChannelList:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items: { $ref: '#/components/schemas/NotificationChannel' }
    NotificationTestResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
    TelegramLink:
      type: object
      required: [code, botUsername, expiresAt]
      properties:
        code:
          type: string
          description: 8 位绑定码，显示为 `ABCD-EFGH`
          example: ABCD-EFGH
        botUsername: { type: string }
        expiresAt: { $ref: '#/components/schemas/TimestampMs' }
    VapidKey:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
          description: base64url（无填充）的 65 字节未压缩 P-256 点
    PushSubscriptionKind:
      type: string
      description: '`fcm` 自 M7 起使用（`endpoint` 存 FCM 注册令牌）；`apns` 预留'
      enum: [webpush, apns, fcm]
    PushSubscription:
      type: object
      required: [id, kind, endpoint, userAgent, createdAt]
      properties:
        id: { $ref: '#/components/schemas/PushSubscriptionId' }
        kind: { $ref: '#/components/schemas/PushSubscriptionKind' }
        endpoint: { type: string }
        userAgent: { type: string }
        createdAt: { $ref: '#/components/schemas/TimestampMs' }
        lastSuccessAt: { $ref: '#/components/schemas/TimestampMs' }
        lastError: { type: string }
    PushSubscriptionList:
      type: object
      required: [subscriptions]
      properties:
        subscriptions:
          type: array
          items: { $ref: '#/components/schemas/PushSubscription' }
    PushSubscriptionKeys:
      type: object
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
          description: base64url，解码后 65 字节且以 0x04 开头
        auth:
          type: string
          description: base64url，解码后 16 字节
    PushSubscriptionInput:
      type: object
      description: |
        两种形态，按 `kind` 区分（缺省 `webpush`）：
        - `webpush`：浏览器 `PushSubscription.toJSON()` 的子集，须带 `endpoint` 与 `keys`（Android 的 UnifiedPush 同此形态）；
        - `fcm`：带 `token`（Android `gms` 包的 FCM 注册令牌）与 `keys`（载荷加密用，必填）。
      properties:
        kind:
          type: string
          enum: [webpush, fcm]
          default: webpush
        endpoint: { type: string, minLength: 1, maxLength: 2048 }
        keys: { $ref: '#/components/schemas/PushSubscriptionKeys' }
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: 'FCM 注册令牌（`kind: fcm` 时必填）'

    # ============================================================ oryn sync（M5）
    OrbSyncPrepareRequest:
      type: object
      properties:
        root:
          type: string
          maxLength: 4096
          description: 仓库所在目录（同 `GitRootQuery` 的路径规则）；缺省 = orb 当前工作目录
        have:
          type: array
          maxItems: 256
          description: 本地已有的提交（用于确定 bundle 的边界）
          items: { type: string, pattern: '^[0-9a-f]{40}$' }
        force:
          type: boolean
          default: false
          description: 无共同提交时仍打包完整历史（浅克隆仍会 409 `sync_shallow`）
    OrbSyncBundle:
      type: object
      required: [id, size]
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{16}$'
        size:
          type: integer
          format: int64
    OrbSyncState:
      type: object
      required: [root, head, snapshot, dirty, common]
      properties:
        root:
          type: string
          description: 仓库顶层的绝对路径
        branch:
          type: string
          description: 当前分支短名；游离 HEAD 时省略
        head:
          type: string
          description: HEAD 提交
        snapshot:
          type: string
          description: 工作区快照提交（无未提交改动时等于 `head`）
        dirty:
          type: boolean
          description: 有未提交改动（`snapshot != head`）
        common:
          type: array
          description: '`have` 中本仓库已有的提交'
          items: { type: string }
        bundle:
          allOf:
            - $ref: '#/components/schemas/OrbSyncBundle'
          description: '`snapshot ∉ have` 时打出的 bundle（含 `refs/oryn/sync/snapshot` 与 `refs/oryn/sync/head`）'

    WsTicket:
      type: object
      required: [ticket, expiresIn]
      properties:
        ticket: { type: string }
        expiresIn:
          type: integer
          description: 秒
          example: 30
    WsClientMessage:
      description: 客户端 → 服务端 WS 消息
      oneOf:
        - $ref: '#/components/schemas/WsClientFocus'
        - $ref: '#/components/schemas/WsClientSub'
        - $ref: '#/components/schemas/WsClientUnsub'
        - $ref: '#/components/schemas/WsClientCmd'
        - $ref: '#/components/schemas/WsClientUiResponse'
        - $ref: '#/components/schemas/WsClientPing'
        - $ref: '#/components/schemas/WsClientTermWatch'
        - $ref: '#/components/schemas/WsClientArtifactWatch'
        - $ref: '#/components/schemas/WsClientArtifactUnwatch'
      discriminator:
        propertyName: type
        mapping:
          focus: '#/components/schemas/WsClientFocus'
          sub: '#/components/schemas/WsClientSub'
          unsub: '#/components/schemas/WsClientUnsub'
          cmd: '#/components/schemas/WsClientCmd'
          ui.response: '#/components/schemas/WsClientUiResponse'
          ping: '#/components/schemas/WsClientPing'
          term.watch: '#/components/schemas/WsClientTermWatch'
          artifact.watch: '#/components/schemas/WsClientArtifactWatch'
          artifact.unwatch: '#/components/schemas/WsClientArtifactUnwatch'
    WsClientFocus:
      type: object
      description: 当前正在看的线程（用于未读、通知抑制、唤醒）；记为一次用户交互
      required: [type, threadId]
      properties:
        type: { type: string, enum: [focus] }
        threadId:
          type: string
          nullable: true
          description: 线程 id；null 表示不看任何线程
    WsClientSub:
      type: object
      required: [type, threadId]
      properties:
        type: { type: string, enum: [sub] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        afterSeq:
          type: integer
          format: int64
          description: 客户端已有条目的可续传游标（最近一条 `entries` 消息的 `lastSeq`）；缺省 0 = 全量
        transcriptRev:
          type: integer
          format: int64
          description: |
            客户端缓存条目所属的转录版本（来自 `thread.snapshot` / `transcript.reset`）。与服务端当前版本不同，
            或缺省但 `afterSeq > 0` 且服务端版本 > 0 时，服务端忽略 `afterSeq` 从头补发，并在快照中置 `fullReplay: true`。
        tail:
          type: integer
          minimum: 50
          maximum: 2000
          description: |
            只补发最近的 `tail` 条（M19，主线页面用）：仅在实际从 seq 0 补发时生效，快照的 `windowStart` 给出窗口起点，
            更早的条目经 `GET /threads/{id}/entries?before=` 翻页。越界值夹到 50–2000。
    WsClientUnsub:
      type: object
      required: [type, threadId]
      properties:
        type: { type: string, enum: [unsub] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsClientCmd:
      type: object
      description: omp RPC 命令；控制面注入唯一 id 后下发，应答以 `res` 回到本连接
      required: [type, threadId, id, frame]
      properties:
        type: { type: string, enum: [cmd] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id:
          type: string
          description: 客户端侧请求 id（仅在本连接内唯一）
        frame:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 不带 `id` 的 omp RPC 命令对象
    WsClientUiResponse:
      type: object
      description: |
        侧通道应答；`frame.type` 只能是 `extension_ui_response`、`host_tool_result`、`host_tool_update`、`host_uri_result`
        之一且带字符串 `id`（与 omp `dispatchRpcControlFrame` 的判定一致），否则回 `error{code:"invalid_frame"}`。
        `extension_ui_response` 先到先得：只有对应请求仍待答且应答已成功交给 agent（或在 orb 暂停时入队）才广播 `ui.resolved`。
      required: [type, threadId, frame]
      properties:
        type: { type: string, enum: [ui.response] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        frame: { $ref: '#/components/schemas/OmpFrame' }
    WsClientPing:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [ping] }
    WsClientTermWatch:
      type: object
      description: |
        开关本连接对该线程 `terminal_output` 帧的接收（须先 `sub`，否则回 `error{code:"not_subscribed"}`）。
        `terminal_output` 默认不发给未开启的连接；其它终端帧（`terminal_opened|exit|closed`）照常随 `frame` 广播。
        待发超过阈值时服务端丢弃终端输出、关闭本开关并发 `term.lagged`：客户端应经 `terminal_snapshot` 重同步后重新开启。
      required: [type, threadId, 'on']
      properties:
        type: { type: string, enum: [term.watch] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        'on': { type: boolean }
    WsClientArtifactWatch:
      type: object
      description: 开始（或更新）观看一个 artifact；之后本连接收到它的 `artifact.version` / `artifact.activity` 等消息。重复发送用来更新 `page`；连接断开等于全部 unwatch
      required: [type, id]
      properties:
        type: { type: string, enum: [artifact.watch], x-enum-varnames: [WsClientArtifactWatchTypeArtifactWatch] }
        id: { $ref: '#/components/schemas/ArtifactId' }
        page:
          type: string
          maxLength: 64
          description: 画布 artifact 当前所在的画布页 id
    WsClientArtifactUnwatch:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [artifact.unwatch], x-enum-varnames: [WsClientArtifactUnwatchTypeArtifactUnwatch] }
        id: { $ref: '#/components/schemas/ArtifactId' }

    WsServerMessage:
      description: 服务端 → 客户端 WS 消息
      oneOf:
        - $ref: '#/components/schemas/WsServerIndex'
        - $ref: '#/components/schemas/WsServerIndexPatch'
        - $ref: '#/components/schemas/WsServerThreadSnapshot'
        - $ref: '#/components/schemas/WsServerEntries'
        - $ref: '#/components/schemas/WsServerFrame'
        - $ref: '#/components/schemas/WsServerRes'
        - $ref: '#/components/schemas/WsServerUiResolved'
        - $ref: '#/components/schemas/WsServerLiveReset'
        - $ref: '#/components/schemas/WsServerTranscriptReset'
        - $ref: '#/components/schemas/WsServerPlanResolved'
        - $ref: '#/components/schemas/WsServerOrb'
        - $ref: '#/components/schemas/WsServerError'
        - $ref: '#/components/schemas/WsServerPong'
        - $ref: '#/components/schemas/WsServerTermLagged'
        - $ref: '#/components/schemas/WsServerTermResized'
        - $ref: '#/components/schemas/WsServerNotification'
        - $ref: '#/components/schemas/WsServerNotificationsRead'
        - $ref: '#/components/schemas/WsServerNotificationsResolved'
        - $ref: '#/components/schemas/WsServerSchedulesChanged'
        - $ref: '#/components/schemas/WsServerGitHubChanged'
        - $ref: '#/components/schemas/WsServerSshChanged'
        - $ref: '#/components/schemas/WsServerBoxesChanged'
        - $ref: '#/components/schemas/WsServerProjectRepoChanged'
        - $ref: '#/components/schemas/WsServerArtifactsChanged'
        - $ref: '#/components/schemas/WsServerArtifactVersion'
        - $ref: '#/components/schemas/WsServerArtifactActivity'
        - $ref: '#/components/schemas/WsServerArtifactComments'
        - $ref: '#/components/schemas/WsServerArtifactCanvas'
        - $ref: '#/components/schemas/WsServerArtifactConsent'
      discriminator:
        propertyName: type
        mapping:
          index: '#/components/schemas/WsServerIndex'
          index.patch: '#/components/schemas/WsServerIndexPatch'
          thread.snapshot: '#/components/schemas/WsServerThreadSnapshot'
          entries: '#/components/schemas/WsServerEntries'
          frame: '#/components/schemas/WsServerFrame'
          res: '#/components/schemas/WsServerRes'
          ui.resolved: '#/components/schemas/WsServerUiResolved'
          live.reset: '#/components/schemas/WsServerLiveReset'
          transcript.reset: '#/components/schemas/WsServerTranscriptReset'
          plan.resolved: '#/components/schemas/WsServerPlanResolved'
          orb: '#/components/schemas/WsServerOrb'
          error: '#/components/schemas/WsServerError'
          pong: '#/components/schemas/WsServerPong'
          term.lagged: '#/components/schemas/WsServerTermLagged'
          term.resized: '#/components/schemas/WsServerTermResized'
          notification: '#/components/schemas/WsServerNotification'
          notifications.read: '#/components/schemas/WsServerNotificationsRead'
          notifications.resolved: '#/components/schemas/WsServerNotificationsResolved'
          schedules.changed: '#/components/schemas/WsServerSchedulesChanged'
          github.changed: '#/components/schemas/WsServerGitHubChanged'
          ssh.changed: '#/components/schemas/WsServerSshChanged'
          boxes.changed: '#/components/schemas/WsServerBoxesChanged'
          project_repo.changed: '#/components/schemas/WsServerProjectRepoChanged'
          artifacts.changed: '#/components/schemas/WsServerArtifactsChanged'
          artifact.version: '#/components/schemas/WsServerArtifactVersion'
          artifact.activity: '#/components/schemas/WsServerArtifactActivity'
          artifact.comments: '#/components/schemas/WsServerArtifactComments'
          artifact.canvas: '#/components/schemas/WsServerArtifactCanvas'
          artifact.consent: '#/components/schemas/WsServerArtifactConsent'
    WsServerIndex:
      type: object
      description: 线程摘要全量（连接建立后首条）
      required: [type, threads, rev]
      properties:
        type: { type: string, enum: [index] }
        threads:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
        rev: { type: integer, format: int64 }
    WsServerIndexPatch:
      type: object
      required: [type, upsert, remove, rev]
      properties:
        type: { type: string, enum: [index.patch] }
        upsert:
          type: array
          items: { $ref: '#/components/schemas/Thread' }
        remove:
          type: array
          items: { $ref: '#/components/schemas/ThreadId' }
        rev: { type: integer, format: int64 }
    AgentLiveState:
      type: object
      description: 线程实时缓冲（只含未被条目覆盖的部分）
      required: [status, pendingUi, subagents, live]
      properties:
        status: { $ref: '#/components/schemas/AgentStatus' }
        state:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 最近一次 `get_state` 应答的 data
        queue:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 最新 `queue_update` 帧
        pendingUi:
          type: array
          description: 未应答的 `extension_ui_request` 帧
          items: { $ref: '#/components/schemas/OmpFrame' }
        displayUi:
          type: array
          description: 扩展当前的展示类 UI：`setStatus` / `setWidget` 每个 key 最新的 `extension_ui_request` 帧，按到达顺序（空内容的 key 已移除）；agent 重启或 `live.reset` 时清空
          items: { $ref: '#/components/schemas/OmpFrame' }
        planProposal:
          allOf:
            - $ref: '#/components/schemas/OmpFrame'
          description: 未决的 `plan_proposal` 帧
        composerPrediction:
          type: array
          description: 最近一次 `oryn_composer_prediction` 帧的 `choices`（下一条消息预测，按可能性从高到低）；没有预测、新回合开始（`agent_start`）、agent 重启或 `live.reset` 时省略
          items: { type: string }
        subagents:
          type: array
          description: 各子 agent 最新的 `subagent_lifecycle` / `subagent_progress` 帧
          items: { $ref: '#/components/schemas/OmpFrame' }
        live:
          type: array
          description: 在途消息（`openMessage`）与运行中工具（`openTools`）的帧，按到达顺序
          items: { $ref: '#/components/schemas/OmpFrame' }
    WsServerThreadSnapshot:
      type: object
      description: '`sub` 后的首条消息'
      required: [type, threadId, thread, agent, lastSeq, transcriptRev, fullReplay]
      properties:
        type: { type: string, enum: [thread.snapshot] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        thread: { $ref: '#/components/schemas/Thread' }
        orb:
          allOf:
            - $ref: '#/components/schemas/Orb'
          description: 线程所在 orb；无 orb 时省略
        agent: { $ref: '#/components/schemas/AgentLiveState' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 快照时刻线程的最大 seq（补发的目标；不是可续传游标，游标以各条 `entries.lastSeq` 为准）
        transcriptRev:
          type: integer
          format: int64
          description: 当前转录版本；之后的 `sub` 应带上它
        fullReplay:
          type: boolean
          description: 为真时服务端从 seq 0 补发：客户端须先丢弃该线程已缓存的全部条目
        windowStart:
          type: integer
          format: int64
          description: |
            带 `tail` 订阅时补发窗口的起点（M19）：只补发 `seq > windowStart` 的条目，更早的经 REST `before` 翻页；
            省略或 0 = 没有开窗
    WsServerEntries:
      type: object
      required: [type, threadId, entries, lastSeq]
      properties:
        type: { type: string, enum: [entries] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        entries:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Entry' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 本条消息覆盖到的最大 seq（可续传游标：≤ 它的条目都已送达）；分批时每批各自填写
    WsServerFrame:
      type: object
      description: 实时 omp 帧（`response` 以外的帧广播给该线程全部订阅者）
      required: [type, threadId, frame]
      properties:
        type: { type: string, enum: [frame] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        frame: { $ref: '#/components/schemas/OmpFrame' }
    WsServerRes:
      type: object
      description: '`cmd` 的应答，只发给发起连接；`id` 为客户端原始 id'
      required: [type, threadId, id, response]
      properties:
        type: { type: string, enum: [res] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id: { type: string }
        response: { $ref: '#/components/schemas/OmpFrame' }
    WsServerUiResolved:
      type: object
      required: [type, threadId, requestId]
      properties:
        type: { type: string, enum: [ui.resolved] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        requestId: { type: string }
    WsServerLiveReset:
      type: object
      description: 丢弃叠加层，仅按条目渲染，直到下一个 `message_start`
      required: [type, threadId]
      properties:
        type: { type: string, enum: [live.reset] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsServerTranscriptReset:
      type: object
      description: |
        线程转录版本递增（会话文件重写后删除了旧行、fork 回退移除了某文件，或 `switch_leaf` / `navigate_tree` 成功把叶子移离
        受理时的位置）：客户端丢弃该线程的全部已缓存条目，并以 `sub{afterSeq: 0, transcriptRev}` 重新订阅
      required: [type, threadId, transcriptRev]
      properties:
        type: { type: string, enum: [transcript.reset] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        transcriptRev: { type: integer, format: int64 }
    WsServerPlanResolved:
      type: object
      description: 计划提案已被成功批准 / 处理（`plan_approval` 成功应答）：所有客户端清除该线程的 `planProposal`
      required: [type, threadId]
      properties:
        type: { type: string, enum: [plan.resolved] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsServerOrb:
      type: object
      required: [type, orb]
      properties:
        type: { type: string, enum: [orb] }
        orb: { $ref: '#/components/schemas/Orb' }
    WsServerError:
      type: object
      required: [type, code, message]
      properties:
        type: { type: string, enum: [error] }
        code: { type: string }
        message: { type: string }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        id:
          type: string
          description: 若由某条 `cmd` 引起，为其客户端 id
    WsServerPong:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [pong] }
    WsServerTermLagged:
      type: object
      description: |
        该线程的 `terminal_output` 有丢失（本连接待发超过阈值，或 orbd 帧缓冲溢出后的 `terminal.gap`）：
        客户端应以 `terminal_list` + `terminal_snapshot` 重同步，并重新 `term.watch{on:true}`。
      required: [type, threadId]
      properties:
        type: { type: string, enum: [term.lagged] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    WsServerTermResized:
      type: object
      description: 某个连接发出的 `terminal_resize` 已入队（发给该线程全部订阅者，含发起方）；omp 自身不为 resize 发帧
      required: [type, threadId, terminalId, cols, rows]
      properties:
        type: { type: string, enum: [term.resized] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
        terminalId: { type: string }
        cols: { type: integer }
        rows: { type: integer }
    WsServerNotification:
      type: object
      description: 新通知（发给全部私有连接）
      required: [type, notification]
      properties:
        type: { type: string, enum: [notification] }
        notification: { $ref: '#/components/schemas/Notification' }
    WsServerNotificationsRead:
      type: object
      description: 通知已读（发给全部私有连接）：`id` = 只这一条已读；`threadId` = 该线程的通知已读；都省略 = 全部已读
      required: [type]
      properties:
        type: { type: string, enum: [notifications.read] }
        threadId:
          allOf:
            - $ref: '#/components/schemas/ThreadId'
          description: 该线程的通知已读
        id:
          allOf:
            - $ref: '#/components/schemas/NotificationId'
          description: 只这一条已读
    WsServerNotificationsResolved:
      type: object
      description: |
        `input` 通知对应的请求已作答 / 取消 / 随 agent 重启消失（发给全部私有连接）：客户端把这些通知记为已解决（`resolvedAt = at`、去掉 `quickAnswer`）。
        不弹提示；已加载的列表靠它与线程当前待答的请求对齐。
      required: [type, ids, at]
      properties:
        type: { type: string, enum: [notifications.resolved], x-enum-varnames: [WsServerNotificationsResolvedTypeNotificationsResolved] }
        ids:
          type: array
          items: { $ref: '#/components/schemas/NotificationId' }
        at: { $ref: '#/components/schemas/TimestampMs' }
    WsServerSchedulesChanged:
      type: object
      description: 某个定时的定义或运行记录变了（新建 / 替换 / 删除 / 暂停 / 恢复 / 自动暂停 / 触发 / 运行状态变化）；发给全部私有连接。客户端据此让定时相关查询失效，WS 每次重新 open 后也要自行失效一次
      required: [type, scheduleId]
      properties:
        type: { type: string, enum: [schedules.changed], x-enum-varnames: [WsServerSchedulesChangedTypeSchedulesChanged] }
        scheduleId: { $ref: '#/components/schemas/ScheduleId' }
    WsServerGitHubChanged:
      type: object
      description: GitHub 集成状态变了（App、身份、安装、项目绑定、触发规则）；发给全部私有连接。客户端据此让 GitHub 相关查询与项目列表失效
      required: [type]
      properties:
        type: { type: string, enum: [github.changed], x-enum-varnames: [WsServerGitHubChangedTypeGitHubChanged] }
    WsServerSshChanged:
      type: object
      description: M18：SSH 主机、钥匙、指纹或测试结果变了；发给全部私有连接。客户端据此让 SSH 相关查询失效
      required: [type]
      properties:
        type: { type: string, enum: [ssh.changed], x-enum-varnames: [WsServerSshChangedTypeSshChanged] }
    WsServerBoxesChanged:
      type: object
      description: M23：box、app、部署、活动或 box 上的线程变了；发给全部私有连接。客户端据此让 Boxes 相关查询失效，WS 每次重新 open 后也要自行失效一次
      required: [type]
      properties:
        type: { type: string, enum: [boxes.changed], x-enum-varnames: [WsServerBoxesChangedTypeBoxesChanged] }
    WsServerProjectRepoChanged:
      type: object
      description: M24：项目仓库镜像状态变了（开始 / 结束克隆或拉取、出错、被删除）；发给全部私有连接。客户端让该项目的仓库查询失效，WS 每次重新 open 后对全部项目失效一次
      required: [type, projectId]
      properties:
        type: { type: string, enum: [project_repo.changed], x-enum-varnames: [WsServerProjectRepoChangedTypeProjectRepoChanged] }
        projectId: { $ref: '#/components/schemas/ProjectId' }
    WsServerArtifactsChanged:
      type: object
      description: artifact 列表变了（新建、新版本、改名、删除、恢复、清理、缩略图就绪）；发给全部私有连接。客户端据此让 artifact 列表查询失效，WS 每次重新 open 后也要自行失效一次
      required: [type]
      properties:
        type: { type: string, enum: [artifacts.changed], x-enum-varnames: [WsServerArtifactsChangedTypeArtifactsChanged] }
    WsServerArtifactVersion:
      type: object
      description: 某个 artifact 产生了新版本；只发给正在观看它的连接
      required: [type, id, version]
      properties:
        type: { type: string, enum: [artifact.version], x-enum-varnames: [WsServerArtifactVersionTypeArtifactVersion] }
        id: { $ref: '#/components/schemas/ArtifactId' }
        version: { type: integer }
    WsServerArtifactCanvas:
      type: object
      description: |
        画布的实时变化；只发给正在观看它的连接。带 `ops`：一批操作（`client` + `clientSeq` 标明提交方）；
        带 `doc`：整份文档替换（别处产生了新版本，`version` 为新底稿版本）。
      required: [type, id, seq]
      properties:
        type: { type: string, enum: [artifact.canvas], x-enum-varnames: [WsServerArtifactCanvasTypeArtifactCanvas] }
        id: { $ref: '#/components/schemas/ArtifactId' }
        seq: { type: integer, format: int64 }
        ops:
          type: array
          items:
            type: object
            additionalProperties: true
        doc:
          type: object
          additionalProperties: true
        version: { type: integer }
        client: { type: string }
        clientSeq: { type: integer, format: int64 }
    WsServerArtifactConsent:
      type: object
      description: |
        页面能力的同意请求（`asked`）与结果（`settled`）；只发给正在观看该 artifact 的连接。
        `settled.reload` 为真表示页面已经不在等，查看器应重载帧。
      required: [type, kind, requestId, artifactId]
      properties:
        type: { type: string, enum: [artifact.consent], x-enum-varnames: [WsServerArtifactConsentTypeArtifactConsent] }
        kind:
          type: string
          enum: [asked, settled]
          x-enum-varnames: [ArtifactConsentAsked, ArtifactConsentSettled]
        requestId: { type: string }
        artifactId: { $ref: '#/components/schemas/ArtifactId' }
        title: { type: string }
        project:
          type: string
          description: 项目名（`files` 用）
        capability: { $ref: '#/components/schemas/ArtifactConsentCapability' }
        allowed: { type: boolean }
        reload: { type: boolean }
    WsServerArtifactComments:
      type: object
      description: 某个 artifact 的评论有变化；只发给正在观看它的连接
      required: [type, id]
      properties:
        type: { type: string, enum: [artifact.comments], x-enum-varnames: [WsServerArtifactCommentsTypeArtifactComments] }
        id: { $ref: '#/components/schemas/ArtifactId' }
    WsServerArtifactActivity:
      type: object
      description: 某个 artifact 上的在场信息（观看者、agent 正在做什么）；只发给正在观看它的连接
      required: [type, id, viewers, threads, clients, visitors]
      properties:
        type: { type: string, enum: [artifact.activity], x-enum-varnames: [WsServerArtifactActivityTypeArtifactActivity] }
        id: { $ref: '#/components/schemas/ArtifactId' }
        viewers:
          type: integer
          description: 正在观看的连接数
        threads:
          type: array
          items: { $ref: '#/components/schemas/ArtifactThreadActivity' }
        clients:
          type: array
          description: 各观看连接所在的画布页
          items:
            type: object
            required: [client]
            properties:
              client:
                type: string
                description: 连接 id（同一连接内稳定）
              page: { type: string }
        visitors:
          type: integer
          description: 正在看发布页的访客数
    ArtifactThreadActivity:
      type: object
      required: [threadId, doing]
      properties:
        threadId: { $ref: '#/components/schemas/ThreadId' }
        doing:
          type: string
          enum: [read, write, draw, move]
          x-enum-varnames: [ArtifactDoingRead, ArtifactDoingWrite, ArtifactDoingDraw, ArtifactDoingMove]
        focus:
          type: object
          required: [path]
          properties:
            path:
              type: string
              description: 正在读或改的文件
            page:
              type: string
              description: 该文件属于画布的某个画框时为画框 id

    # ============================================================ 匿名分享 WebSocket（M5）
    WsPublicServerMessage:
      description: |
        `GET /api/v1/public/shares/{slug}/ws` 上服务端 → 匿名客户端的消息（都不带 `threadId`）。
        私有通道的 `index` / `orb` / `ui.*` / 终端 / 应答 / 通知消息在结构上到不了匿名连接。客户端只许发 `WsClientPing`。
      oneOf:
        - $ref: '#/components/schemas/WsPublicSnapshot'
        - $ref: '#/components/schemas/WsPublicEntries'
        - $ref: '#/components/schemas/WsPublicFrame'
        - $ref: '#/components/schemas/WsPublicLiveReset'
        - $ref: '#/components/schemas/WsPublicTranscriptReset'
        - $ref: '#/components/schemas/WsPublicState'
        - $ref: '#/components/schemas/WsPublicRevoked'
        - $ref: '#/components/schemas/WsServerPong'
      discriminator:
        propertyName: type
        mapping:
          share.snapshot: '#/components/schemas/WsPublicSnapshot'
          entries: '#/components/schemas/WsPublicEntries'
          frame: '#/components/schemas/WsPublicFrame'
          live.reset: '#/components/schemas/WsPublicLiveReset'
          transcript.reset: '#/components/schemas/WsPublicTranscriptReset'
          share.state: '#/components/schemas/WsPublicState'
          share.revoked: '#/components/schemas/WsPublicRevoked'
          pong: '#/components/schemas/WsServerPong'
    WsPublicSnapshot:
      type: object
      description: 连接后的首条消息
      required: [type, title, state, lastSeq, transcriptRev, fullReplay, live, subagents]
      properties:
        type: { type: string, enum: [share.snapshot] }
        title: { type: string }
        state: { $ref: '#/components/schemas/ThreadState' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 快照时刻线程的最大 seq（补发的目标）
        transcriptRev: { type: integer, format: int64 }
        fullReplay:
          type: boolean
          description: 为真时从 seq 0 补发：客户端先丢弃已缓存的全部条目
        live:
          type: array
          description: 在途消息与运行中工具的帧（与 `WsPublicFrame` 同一过滤）
          items: { $ref: '#/components/schemas/OmpFrame' }
        subagents:
          type: array
          description: 恒为空：子 agent 的进度与转录不公开
          items: { $ref: '#/components/schemas/OmpFrame' }
    WsPublicEntries:
      type: object
      required: [type, entries, lastSeq]
      properties:
        type: { type: string, enum: [entries], x-enum-varnames: [WsPublicEntriesTypeEntries] }
        entries:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/Entry' }
        leafEntryId: { type: string }
        lastSeq:
          type: integer
          format: int64
          description: 本条消息覆盖到的最大 seq（可续传游标）
    WsPublicFrame:
      type: object
      description: |
        实时 omp 帧，仅限 `message_start` / `message_update` / `message_end` / `tool_execution_start` / `tool_execution_update` /
        `tool_stream_update` / `tool_execution_end` / `agent_start` / `agent_end`，且与条目共用公开过滤：
        `display:false` 的注入消息不发；`message_update` 只发 assistant 的；`agent_end` 只留 `{type, isTerminal?}`；
        子 agent 工具（`task`）的 `tool_execution_update` / `tool_stream_update` 不发。`subagent_*` 帧一律不发
      required: [type, frame]
      properties:
        type: { type: string, enum: [frame], x-enum-varnames: [WsPublicFrameTypeFrame] }
        frame: { $ref: '#/components/schemas/OmpFrame' }
    WsPublicLiveReset:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [live.reset], x-enum-varnames: [WsPublicLiveResetTypeLiveReset] }
    WsPublicTranscriptReset:
      type: object
      description: |
        转录版本递增（同 `WsServerTranscriptReset`），或所有者把叶子移到了客户端未持有的分支上：
        客户端丢弃全部已缓存条目，以 `after=0&rev=<transcriptRev>` 重连
      required: [type, transcriptRev]
      properties:
        type: { type: string, enum: [transcript.reset], x-enum-varnames: [WsPublicTranscriptResetTypeTranscriptReset] }
        transcriptRev: { type: integer, format: int64 }
    WsPublicState:
      type: object
      description: 线程状态或标题变化
      required: [type, state, title]
      properties:
        type: { type: string, enum: [share.state] }
        state: { $ref: '#/components/schemas/ThreadState' }
        title: { type: string }
    WsPublicRevoked:
      type: object
      description: 分享已撤销或线程已删除；随后服务端以 4001 关闭连接
      required: [type]
      properties:
        type: { type: string, enum: [share.revoked] }

    # ============================================================ provider 协议（C1）
    ProviderHelloRequest:
      type: object
      required: [instanceId, driver, version, capabilities, types, defaultType, allowMultiple]
      properties:
        instanceId:
          type: string
          description: 本进程实例的随机 id
        driver: { $ref: '#/components/schemas/ProviderDriver' }
        version: { type: string }
        capabilities: { $ref: '#/components/schemas/ProviderCapabilities' }
        types:
          type: array
          items: { $ref: '#/components/schemas/OrbType' }
        defaultType: { type: string }
        allowMultiple: { type: boolean }
        baseImageId:
          type: string
          description: |
            驱动当前基础镜像的身份（M11a；docker = 镜像 id，process = `process`，dispatch = `ref:<镜像引用>`）。
            空或缺省 = 未知，控制面对该 provider 不启用项目快照。
    ProviderHelloResponse:
      type: object
      required: [providerId, leaseSeconds]
      properties:
        providerId: { $ref: '#/components/schemas/ProviderId' }
        leaseSeconds:
          type: integer
          example: 45
    ProviderClaimRequest:
      type: object
      required: [instanceId, waitSeconds]
      properties:
        instanceId: { type: string }
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 60
          example: 30
    ProviderJob:
      type: object
      required: [id, op, orbId, params, attempt, claimGen]
      properties:
        id: { $ref: '#/components/schemas/JobId' }
        op: { $ref: '#/components/schemas/JobOp' }
        orbId: { $ref: '#/components/schemas/OrbId' }
        params:
          type: object
          additionalProperties: true
          description: |
            按 `op` 取：`spawn` → `JobSpawnParams`；`pause` → `JobPauseParams`；`snapshot` → `JobSnapshotParams`；
            `delete` → `JobDeleteParams`；`delete_snapshot` → `JobDeleteSnapshotParams`。
            每个操作必须幂等，5 分钟超时。
        attempt:
          type: integer
          minimum: 1
          maximum: 3
        claimGen:
          type: integer
          format: int64
          minimum: 1
          description: 本次认领的代数（每次认领 +1）；完成上报必须原样回传，控制面只接受与当前认领代数一致的结果。
    ProviderClaimResponse:
      type: object
      required: [job]
      properties:
        job: { $ref: '#/components/schemas/ProviderJob' }
    ProviderCompleteRequest:
      type: object
      required: [claimGen, ok, output, durationMs]
      properties:
        claimGen:
          type: integer
          format: int64
          description: 认领应答中的 `job.claimGen`；与任务当前认领代数不一致（该次认领已过期被重排或被巡检判失败）时回 409。
        ok: { type: boolean }
        output:
          type: string
          maxLength: 65536
          description: 输出尾部（≤64KB）
        error: { type: string }
        durationMs: { type: integer, format: int64 }
        result: { $ref: '#/components/schemas/JobResult' }
    ProviderByeRequest:
      type: object
      required: [instanceId]
      properties:
        instanceId: { type: string }
    ProviderFsClaimRequest:
      type: object
      required: [instanceId, waitSeconds]
      properties:
        instanceId: { type: string }
        waitSeconds:
          type: integer
          minimum: 0
          maximum: 60
          example: 30
    ProviderFsClaimResponse:
      type: object
      required: [request]
      properties:
        request: { $ref: '#/components/schemas/ProviderFsRequest' }
    ProviderFsRequest:
      type: object
      required: [id, orbId, op]
      description: |
        停机 orb 的只读文件请求。路径规则同 `FsPathQuery`（绝对路径或 `~/…`，跟随符号链接后须位于 `$HOME` 之下，否则 403 `outside_home`）；
        `$HOME/.oryn` 不出现在列表里，直接访问回 403 `protected_path`。orb 容器不处于停机状态 → 409 `orb_not_stopped`。
      properties:
        id: { type: string }
        orbId: { $ref: '#/components/schemas/OrbId' }
        op:
          type: string
          enum: [roots, list, stat, read]
        path:
          type: string
          description: '`list` / `stat` / `read` 的路径'
        range:
          type: string
          description: '`read` 的 `Range` 请求头原文（单区间）'
        workdirs:
          type: array
          description: '`roots` 的工作目录候选（按序取第一个存在的目录；都不存在时为 `$HOME`）'
          items: { type: string }
    JobSpawnEnv:
      type: object
      required: [ORYN_URL, ORYN_ORB_ID, ORYN_ORB_TOKEN]
      properties:
        ORYN_URL:
          type: string
          x-go-name: OrynURL
        ORYN_ORB_ID:
          type: string
          pattern: '^orb-[0-9a-z]{26}$'
          x-go-name: OrynOrbID
        ORYN_ORB_TOKEN:
          type: string
          description: '`oot_…`'
          x-go-name: OrynOrbToken
    JobSpawnParams:
      type: object
      required: [image, type, env]
      properties:
        image: { type: string }
        snapshotId: { $ref: '#/components/schemas/SnapshotId' }
        type:
          type: string
          description: orb 类型名
        env: { $ref: '#/components/schemas/JobSpawnEnv' }
        snapshotOptional:
          type: boolean
          description: 'M11a：true = `snapshotId` 对应的快照不存在时退回基础镜像（输出里写一行说明），不算失败；false / 缺省 = 快照必须存在'
        orbCaPem:
          type: string
          description: 'M11a 审查修复：orb link 的 TLS CA 证书（PEM）。非空时 provider 以环境变量 `ORYN_ORB_CA_PEM` 下发给 orb（走调用方环境，不进 argv），dispatch 脚本也拿到同名环境变量；orbd 拨 `ORYN_URL` 时只信任这张 CA'
    JobPauseParams:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/PauseMode' }
    JobSnapshotParams:
      type: object
      required: [snapshotId]
      properties:
        snapshotId: { $ref: '#/components/schemas/SnapshotId' }
    JobDeleteParams:
      type: object
      properties: {}
    JobDeleteSnapshotParams:
      type: object
      required: [snapshotId]
      properties:
        snapshotId: { $ref: '#/components/schemas/SnapshotId' }
    JobResult:
      type: object
      description: 任务的结构化结果（M11a，随完成上报）
      properties:
        snapshotBytes:
          type: integer
          format: int64
          description: '`snapshot` 任务：这份快照相对基础镜像多占的字节数（≥0）'
        snapshotUsed:
          type: boolean
          description: |
            M11a 审查修复，`spawn` 任务专用：true = 容器 / 目录实际来自 `snapshotId` 的快照，false = 退回了基础镜像。
            docker 看快照镜像是否存在；process 看快照目录是否存在；dispatch 由脚本在输出里打一行 `ORYN_SNAPSHOT_USED=1|0`，没有这一行即「未知」，不给此字段。

    # ============================================================ orb link（C2）
    LinkStreamHeader:
      description: yamux 流的第一行（JSON + `\n`）。
      oneOf:
        - $ref: '#/components/schemas/LinkStreamCtl'
        - $ref: '#/components/schemas/LinkStreamAgent'
        - $ref: '#/components/schemas/LinkStreamEgress'
        - $ref: '#/components/schemas/LinkStreamBlob'
        - $ref: '#/components/schemas/LinkStreamFs'
        - $ref: '#/components/schemas/LinkStreamPortal'
        - $ref: '#/components/schemas/LinkStreamDesk'
        - $ref: '#/components/schemas/LinkStreamLibrary'
        - $ref: '#/components/schemas/LinkStreamSsh'
      discriminator:
        propertyName: t
        mapping:
          ctl: '#/components/schemas/LinkStreamCtl'
          agent: '#/components/schemas/LinkStreamAgent'
          egress: '#/components/schemas/LinkStreamEgress'
          blob: '#/components/schemas/LinkStreamBlob'
          fs: '#/components/schemas/LinkStreamFs'
          portal: '#/components/schemas/LinkStreamPortal'
          desk: '#/components/schemas/LinkStreamDesk'
          library: '#/components/schemas/LinkStreamLibrary'
          ssh: '#/components/schemas/LinkStreamSsh'
    LinkStreamCtl:
      type: object
      description: orbd 建连后开的第一条且唯一的控制流
      required: [t]
      properties:
        t: { type: string, enum: [ctl] }
    LinkStreamAgent:
      type: object
      description: 'agent 启动时由 orbd 开；orbd→orynd 为重组后的 omp 逻辑帧，orynd→orbd 为写入 omp stdin 的命令帧（一行一个 JSON）'
      required: [t, threadId]
      properties:
        t: { type: string, enum: [agent] }
        threadId: { $ref: '#/components/schemas/ThreadId' }
    LinkStreamEgress:
      type: object
      description: 每个出站代理连接一条；之后为裸 HTTP/1.1 字节流
      required: [t]
      properties:
        t: { type: string, enum: [egress] }
    LinkStreamBlob:
      type: object
      description: 应 `blob.fetch` 请求由 orbd 开；流头之后为 `size` 字节原始内容
      required: [t, sha256, size]
      properties:
        t: { type: string, enum: [blob] }
        sha256: { $ref: '#/components/schemas/Sha256' }
        size: { type: integer, format: int64 }
    LinkStreamFs:
      type: object
      description: |
        由 orynd 打开（M3）；流头之后是 HTTP/1.1，一条流一个请求（控制面 `Connection: close`），orbd 以本机 API 的
        `http.Server` 服务（路由见 docs/protocol.md「orbd 本机 API」）。只有 hello `features` 含相应特性的 orbd 才接受。
      required: [t]
      properties:
        t: { type: string, enum: [fs] }
    LinkStreamPortal:
      type: object
      description: |
        由 orynd 打开（M4），每个代理连接一条。orbd 先回一行 `LinkPortalReply` + `\n`；`ok=true` 之后流上是与
        `127.0.0.1:<port>`（被拒绝时回退 `[::1]:<port>`）之间的原始字节。只有 hello `features` 含 `portal` 的 orbd 才接受。
      required: [t, port]
      properties:
        t: { type: string, enum: [portal] }
        port: { type: integer, minimum: 1, maximum: 65535 }
    LinkPortalReply:
      type: object
      description: orbd 对 `portal` 流的应答行
      required: [ok]
      properties:
        ok: { type: boolean }
        code:
          type: string
          description: '`ok=false` 时：`not_exposed`（端口不属于有 portal 的服务）、`forbidden_port`（egress 端口）、`connection_refused`、`timeout`、`failed`'
        message: { type: string }
    LinkStreamDesk:
      type: object
      description: |
        由 orynd 打开（M8），每个桌面观看者一条。orbd 先回一行 `LinkDeskReply` + `\n`；`ok=true` 之后流上是与
        Xvnc（unix socket `$HOME/.oryn/vnc.sock`）之间的原始 RFB 字节。只有 hello `features` 含 `desktop` 的 orbd 才接受。
      required: [t]
      properties:
        t: { type: string, enum: [desk] }
    LinkDeskReply:
      type: object
      description: orbd 对 `desk` 流的应答行
      required: [ok]
      properties:
        ok: { type: boolean }
        code:
          type: string
          description: '`ok=false` 时：`display_unavailable`（显示未就绪）、`failed`（连 Xvnc 的 socket 失败，5s）'
        message: { type: string }
    LinkStreamSsh:
      type: object
      description: orbd→orynd（M18）：orb 内到 SSH 网关的一条 TCP 连接，其后是裸 SSH 字节流；runner 与协调宿主不可用
      required: [t]
      properties:
        t: { type: string, enum: [ssh] }
    LinkStreamLibrary:
      type: object
      description: |
        M13 全局助手文件库的字节流，两种用法：
        同步（orynd 打开，发往协调宿主）：`library.sync` 回报缺失的文件后，控制面为每个缺失文件开一条，`path` 为该次清单里的沙箱路径，
        流头之后是 `size` 字节原始内容；协调宿主校验字节数与 `sha256`、原子落盘后回一行 `LinkLibraryReply` + `\n` 并关闭。
        路径不在最近一次 `library.sync` 清单里的流一律拒绝。只有 hello `features` 含 `library` 的协调宿主才接受。
        取回（orbd 打开，发往 orynd）：应 `library.fetch` 请求由 orbd 开，`id` 回带请求的 `id`，流头之后是 `size` 字节原始内容；
        控制面只接受自己向该 orb 发出、仍在等待的 `library.fetch`。
      required: [t, size]
      properties:
        t: { type: string, enum: [library] }
        id:
          type: string
          description: 取回：`library.fetch` 请求的 `id`
        path:
          type: string
          description: 同步：沙箱路径（`~/library/shared/<fileId>/<name>` 或 `~/library/threads/<threadId>/<fileId>/<name>`）
        size:
          type: integer
          format: int64
        sha256:
          allOf:
            - $ref: '#/components/schemas/Sha256'
          description: 同步：内容摘要
    LinkLibraryReply:
      type: object
      description: 协调宿主对同步用 `library` 流的应答行
      required: [ok]
      properties:
        ok: { type: boolean }
        code:
          type: string
          description: '`ok=false` 时：`invalid_path`（路径不在最近一次同步清单里）、`mismatch`（字节数或 sha256 不符）、`failed`'
        message: { type: string }

    LinkCtlMethod:
      type: string
      description: |
        `ctl` 方法（括号内为方向与形态）：
        `hello`（orbd→orynd 通知）、`entries.cursors`（orbd→orynd 请求）、`entries.append`（orbd→orynd 请求）、
        `entries.reset` / `entries.reset_done`（orbd→orynd 通知）、`agent.status`、`agent.gap`、`setup.log`、`metrics.sample`（orbd→orynd 通知）、
        `setup.run`、`resume.run`、`agent.start`、`agent.stop`、`blob.fetch`、`fs.copyTree`、`fs.move`、`shutdown`（orynd→orbd 请求）；
        `setup.result`（orbd→orynd 通知）、`project.scripts.get` / `project.scripts.set`（orbd→orynd 请求，只作用于本 orb 所属项目）；
        `terminal.gap`（orbd→orynd 通知，M3）；
        `services.state`（orbd→orynd 通知，M4，受管服务全量快照）、`portal.configure`（orynd→orbd 请求，M4）。
        `desktop.state`（orbd→orynd 通知，M8，桌面全量状态）、`profile.mode`（orynd→orbd 请求，M8，改变本地 Profile 的使用方式）。
        `thread.create`、`thread.send`、`thread.get`、`schedule.get`、`schedule.put`、`schedule.delete`、`schedule.enable`
        （orbd→orynd 请求，M9，orb 内 agent 间协作与自我定时；只有 `features` 含 `threads` 的 orbd 发起，协调宿主不接受）；
        `snapshot.prepare`（orynd→orbd 请求，M11a，无参数，结果 `LinkCtlSnapshotPrepareResult`；项目快照提交前调用：停掉 orb 内运行中的 Docker 容器）；
        `worktree.add`、`worktree.remove`（orynd→orbd 请求，M11b，只有 runner 形态的 orbd 接受；其它 orbd 回 `not_supported`）；
        `omphome.apply`（orynd→orbd 请求，M13，参数 `LinkCtlOmpHomeApplyParams`，结果 `LinkCtlOkResult`；只在 hello 含 `omphome-apply` 时发送）；
        `library.sync`（orynd→协调宿主请求，M13，参数 `LinkCtlLibrarySyncParams`，结果 `LinkCtlLibrarySyncResult`；只在 hello 含 `library` 时发送）、
        `library.fetch`（orynd→orbd 请求，M13，参数 `LinkCtlLibraryFetchParams`，结果 `LinkCtlLibraryFetchResult`，字节经 orbd 另开的 `library` 流回传）、
        `library.put`（orbd→orynd 请求，M13，由 orb 内 `oryn library put` 经 `orbd.sock` 转来，参数 `LinkCtlLibraryPutParams`，结果 `AssistantFile`）；
        `artifact.call`（orbd→orynd 请求，M14，由 orb / Runner 内 agent 的 artifact 工具转来，参数 `LinkCtlArtifactCallParams`，结果 `LinkCtlArtifactCallResult`）；
        `github.call`（orbd→orynd 请求，M15，由 orb 内 agent 的 GitHub 工具转来，参数 `LinkCtlGithubCallParams`，结果 `LinkCtlGithubCallResult`）、
        `github.prepare.report`（orbd→orynd 请求，M15，`github_prepare` 通过后上报，参数 `LinkCtlGithubPrepareReportParams`，结果 `LinkCtlOkResult`）；
        runner 的 link 拒绝这两个方法。
        `ssh.call`（orbd→orynd 请求，M18，由 orb 内 agent 的 `ssh_exec_many` 工具转来，参数 `LinkCtlSshCallParams`，结果 `LinkCtlSshCallResult`；runner 的 link 拒绝）。
        `box.call`（orbd→orynd 请求，M23，由 orb 内 `oryn boxes …` 经 `orbd.sock` 转来，参数 `LinkCtlBoxCallParams`，结果 `LinkCtlBoxCallResult`；runner 的 link 拒绝）。
        `computer.start`、`computer.call`、`computer.cancel`、`computer.stop`（orynd→orbd 请求，M19，助手的电脑里的工具执行器：参数分别为
        `LinkCtlComputerStartParams` / `LinkCtlComputerCallParams` / `LinkCtlComputerCancelParams` / 无参数，结果分别为
        `LinkCtlComputerStartResult` / `LinkCtlComputerCallResult` / `LinkCtlOkResult` / `LinkCtlOkResult`；只在 hello 含 `computer` 时发送，
        runner 与协调宿主回 `not_supported`）、`computer.update`（orbd→orynd 通知，M19，参数 `LinkCtlComputerUpdateParams`，在途工具的流式输出）。
      enum:
        - hello
        - entries.cursors
        - entries.append
        - entries.reset
        - entries.reset_done
        - agent.status
        - agent.gap
        - setup.log
        - metrics.sample
        - setup.run
        - resume.run
        - agent.start
        - agent.stop
        - blob.fetch
        - fs.copyTree
        - fs.move
        - shutdown
        - setup.result
        - project.scripts.get
