<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>Oryn</title>
		<!-- 首帧前写入明暗与主题色，避免闪色（经典脚本，CSP script-src 'self' 放行） -->
		<script src="/theme-init.js"></script>
		<!-- 全局样式直接挂在 head（不经入口模块导入）：开发服务器下首帧也带样式，启动画面不等脚本 -->
		<link rel="stylesheet" href="/src/index.css" />
	</head>
	<body>
		<div id="root"></div>
		<!-- 启动画面（src/lib/boot-splash.ts）：首帧即显示，不等脚本；品牌标路径与 BrandMark 相同 -->
		<div id="boot-splash" class="boot-splash" data-phase="shown" aria-hidden="true">
			<div class="boot-splash-dots"><div class="boot-splash-grid"><i class="boot-splash-sweep"></i><i class="boot-splash-sweep"></i></div></div>
			<div class="boot-splash-mark">
				<svg viewBox="0 0 32 32" fill="currentColor"><path d="M20.1 4.52A12 12 0 1 0 20.1 27.48Z" /><path class="boot-splash-caret" d="M24.5 4H25.9A1.1 1.1 0 0 1 27 5.1V26.9A1.1 1.1 0 0 1 25.9 28H24.5A1.1 1.1 0 0 1 23.4 26.9V5.1A1.1 1.1 0 0 1 24.5 4Z" /></svg>
			</div>
		</div>
		<!-- 系统 WebView 过旧时插入中英提示（ES5 经典脚本，先于模块脚本运行；模块脚本在旧内核上可能直接失败） -->
		<script src="/webview-check.js"></script>
		<script type="module" src="/src/launcher/main.tsx"></script>
	</body>
</html>
