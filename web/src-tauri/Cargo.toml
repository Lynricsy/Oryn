[package]
name = "oryn-desktop"
version = "0.1.0" # 发布版本的唯一来源；tauri.conf.json 不写 version
description = "Oryn desktop client"
authors = ["Lynricsy"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "oryn_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.3"
tauri-plugin-deep-link = "=2.6.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
thiserror = "2"
sys-locale = "0.3"
tokio = { version = "1", features = ["sync", "time", "fs"] } # 计时（配对轮询、看门狗、退避、更新周期）、会话锁、分享上传读文件
tokio-util = { version = "0.7", features = ["io"] } # 分享上传：文件 → 流式请求体
# 数据形状全平台共用（推送 / 分享编排在主机上单测）；插件句柄与原生实现只在 Android 上存在
tauri-plugin-oryn-mobile = { path = "plugins/oryn-mobile" }

# Android 不带通知插件（其清单会带进开机广播与 WAKE_LOCK，通知改由 oryn-mobile 插件发）；
# 桌面与 iOS 的 reqwest 用默认 TLS（rustls + 平台校验器，信任系统根证书，见计划「假设与预案」）
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tauri-plugin-notification = "=2.8.1"

# Android：平台校验器需要 JNI 初始化，未初始化即 panic；改用 ring + Mozilla 根证书（tls_certs_only）
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "http2", "charset", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1"

# iOS 令牌存 Keychain（只保证能编译，见计划附录 A）
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"

# 连接页扫码（含服务器地址的二维码）；插件权限只给连接页的移动端本地能力
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.5.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-updater = "=2.14.1"
keyring = "=4.2.0"

# Linux 通知直接用 notify-rust（与通知插件同一版本）：插件不提供 appname，
# 会以可执行文件名 oryn-desktop 出现在通知中心
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "=4.19.0"
# 自绘标题栏按 GTK 的 gtk-decoration-layout 决定按钮左右与顺序（gtk 已随 tao / wry 在依赖图里，版本与之一致）
gtk = "0.18"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
